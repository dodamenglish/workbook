<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중3 동아윤 3과 본문숙지TEST</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap');

  :root {
    --primary: #1a3a5c;
    --accent: #e84a2f;
    --accent2: #f5a623;
    --bg: #f8f6f1;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --border: #d1cfc9;
    --correct: #34a853;
    --wrong: #ea4335;
    --correct-bg: #e8f5e9;
    --wrong-bg: #fdecea;
    --unanswered-bg: #fff8e1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a3a5c 0%, #0d2137 100%);
    padding: 20px;
  }

  .login-box {
    background: white;
    border-radius: 16px;
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .login-badge {
    display: inline-block;
    background: var(--accent);
    color: white;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  .login-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 6px;
    line-height: 1.4;
  }

  .login-sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  .form-group {
    margin-bottom: 14px;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }

  .form-group input, .form-group select {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: #fafafa;
    transition: border-color 0.2s;
    outline: none;
    -webkit-appearance: none;
  }

  .form-group input:focus, .form-group select:focus {
    border-color: var(--primary);
    background: white;
  }

  .login-btn {
    width: 100%;
    padding: 13px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.2s;
  }

  .login-btn:hover { background: #0d2137; }

  .login-error {
    color: var(--wrong);
    font-size: 13px;
    text-align: center;
    margin-top: 10px;
    display: none;
  }

  /* ── WORKBOOK ── */
  #workbook-screen { display: none; }

  .wb-header {
    background: var(--primary);
    color: white;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }

  .wb-header-left .wb-lesson {
    font-size: 11px;
    letter-spacing: 2px;
    opacity: 0.7;
    text-transform: uppercase;
  }

  .wb-header-left .wb-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    font-weight: 700;
  }

  .wb-header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .wb-user-info {
    font-size: 12px;
    opacity: 0.8;
    text-align: right;
  }

  .wb-submit-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
  }

  .wb-submit-btn:hover { background: #c73a22; }

  .wb-body {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  /* Section label */
  .section-header {
    background: var(--primary);
    color: white;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 8px 16px;
    border-radius: 6px;
    margin: 28px 0 16px;
    display: inline-block;
  }

  /* Passage box */
  .passage-box {
    background: white;
    border: 1.5px solid var(--border);
    border-left: 4px solid var(--primary);
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.9;
    color: var(--text);
  }

  .passage-box p { margin-bottom: 10px; }
  .passage-box p:last-child { margin-bottom: 0; }

  .passage-box .vocab-title {
    font-weight: 700;
    font-size: 15px;
    color: var(--primary);
    margin-bottom: 8px;
    font-style: italic;
  }

  .underline { text-decoration: underline; }
  .circle-label {
    font-size: 12px;
    vertical-align: super;
    color: var(--accent);
    font-weight: 700;
  }

  /* Question card */
  .q-card {
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }

  .q-card.correct { border-color: var(--correct); background: var(--correct-bg); }
  .q-card.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .q-card.unanswered { border-color: var(--accent2); background: var(--unanswered-bg); }

  .q-num {
    display: inline-block;
    background: var(--primary);
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 8px;
  }

  .q-card.correct .q-num { background: var(--correct); }
  .q-card.wrong .q-num { background: var(--wrong); }

  .q-text {
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 10px;
    color: var(--text);
  }

  .q-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .q-input {
    flex: 1;
    min-width: 160px;
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: #fafafa;
    outline: none;
    transition: border-color 0.2s;
  }

  .q-input:focus { border-color: var(--primary); background: white; }
  .q-input:disabled { background: #f0f0f0; color: var(--muted); }

  .q-input.correct-input { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); font-weight: 700; }
  .q-input.wrong-input { border-color: var(--wrong); background: var(--wrong-bg); color: var(--wrong); }

  .q-feedback {
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }

  .q-feedback.show { display: block; }
  .q-feedback .correct-mark { color: var(--correct); font-weight: 700; }
  .q-feedback .wrong-mark { color: var(--wrong); font-weight: 700; }
  .q-feedback .answer-reveal { color: var(--primary); font-weight: 700; }

  /* dual input */
  .dual-input {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .dual-input .label {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }

  .dual-input .q-input { min-width: 100px; flex: 1; }

  /* Score panel */
  #score-panel {
    display: none;
    background: white;
    border: 2px solid var(--primary);
    border-radius: 12px;
    padding: 24px;
    margin: 24px 0;
    text-align: center;
  }

  .score-big {
    font-family: 'Noto Serif KR', serif;
    font-size: 52px;
    font-weight: 700;
    color: var(--primary);
    line-height: 1;
  }

  .score-label {
    font-size: 14px;
    color: var(--muted);
    margin-top: 6px;
    margin-bottom: 16px;
  }

  .score-stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .stat-item { text-align: center; }
  .stat-num { font-size: 22px; font-weight: 700; }
  .stat-num.green { color: var(--correct); }
  .stat-num.red { color: var(--wrong); }
  .stat-num.orange { color: var(--accent2); }
  .stat-desc { font-size: 12px; color: var(--muted); }

  .notion-status {
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
  }

  .notion-status.sending { color: var(--accent2); }
  .notion-status.done { color: var(--correct); }
  .notion-status.fail { color: var(--wrong); }

  /* progress bar */
  .progress-bar-wrap {
    background: rgba(255,255,255,0.2);
    border-radius: 4px;
    height: 4px;
    width: 80px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent2);
    border-radius: 4px;
    transition: width 0.3s;
    width: 0%;
  }

  @media (max-width: 600px) {
    .wb-header { flex-wrap: wrap; gap: 8px; }
    .wb-header-right { width: 100%; justify-content: space-between; }
    .passage-box { font-size: 13px; }
    .q-text { font-size: 13px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <span class="login-badge">Lesson 3</span>
    <div class="login-title">개정 중3 동아(윤정미)<br>본문숙지 TEST</div>
    <div class="login-sub">기본 학습II 주관식 · 62문항</div>

    <div class="form-group">
      <label>이름</label>
      <input type="text" id="login-name" placeholder="이름을 입력하세요">
    </div>
    <div class="form-group">
      <label>학교</label>
      <input type="text" id="login-school" placeholder="학교 이름을 입력하세요">
    </div>
    <div class="form-group">
      <label>학년</label>
      <input type="text" id="login-grade" placeholder="예) 3학년">
    </div>
    <button class="login-btn" onclick="doLogin()">시작하기</button>
    <div class="login-error" id="login-error">이름, 학교, 학년을 모두 입력해주세요.</div>
  </div>
</div>

<!-- WORKBOOK -->
<div id="workbook-screen">
  <div class="wb-header">
    <div class="wb-header-left">
      <div class="wb-lesson">LESSON 3 · 동아(윤정미)</div>
      <div class="wb-title">본문숙지 TEST</div>
    </div>
    <div class="wb-header-right">
      <div>
        <div class="wb-user-info" id="wb-user-info"></div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill"></div></div>
      </div>
      <button class="wb-submit-btn" onclick="submitAll()">제출하기</button>
    </div>
  </div>

  <div class="wb-body">
    <div id="score-panel">
      <div class="score-big" id="score-display">0점</div>
      <div class="score-label" id="score-sub"></div>
      <div class="score-stats">
        <div class="stat-item"><div class="stat-num green" id="stat-correct">0</div><div class="stat-desc">정답</div></div>
        <div class="stat-item"><div class="stat-num red" id="stat-wrong">0</div><div class="stat-desc">오답</div></div>
        <div class="stat-item"><div class="stat-num orange" id="stat-blank">0</div><div class="stat-desc">미입력</div></div>
      </div>
      <div class="notion-status" id="notion-status"></div>
    </div>

    <div id="questions-container"></div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────
const WORKBOOK_NAME = '중3 동아윤 3과 본문숙지TEST';
const CATEGORY = '동아(윤정미)';
const NOTION_URL = 'https://dodamenglish.netlify.app/.netlify/functions/notion';

// Questions: { num, text, answers: string[] (any accepted), dual: bool, dualLabels }
// For dual answers, answers = [[a1,a1alt,...],[b1,b1alt,...]]
const QUESTIONS = [
  // ── DIALOGUE PRACTICE 1 ──────────────────────────────
  {
    section: 'Dialogue Practice 1',
    passage: `<p><strong>1.</strong><br>
G: Look. <span class="underline"><span class="circle-label">ⓐ</span>It's raining cats and dogs.</span><br>
B: Raining cats and dogs? <span class="underline"><span class="circle-label">ⓑ</span>그게 무슨 뜻이야?</span>(that)<br>
G: It means "It's raining a lot."<br>
B: Oh. <span class="underline"><span class="circle-label">ⓒ</span>걱정 마.</span> I have an umbrella in my backpack.</p>
<p><strong>2.</strong><br>
G: This juice is <span class="circle-label">ⓓ</span>______ me, Suho.<br>
B: Excuse me? Can you <span class="circle-label">ⓔ</span>________ that again?<br>
G: I said, "This juice is <span class="circle-label">ⓓ</span>______ me." It means "I'll pay <span class="circle-label">ⓕ</span>______ the juice."<br>
B: Oh. Thanks a lot.<br>
G: <span class="underline"><span class="circle-label">ⓖ</span>천만에.</span></p>`
  },
  { num: 1, text: '위 대화의 밑줄 친 ⓐ의 의미를 우리말로 쓰시오.', answers: ['비가 많이 내려', '비가 많이 내려.', '비가 많이 온다', '비가 많이 오다', '비가 엄청 온다', '비가 엄청 내린다'] },
  { num: 2, text: '위 대화의 밑줄 친 ⓑ의 우리말을 괄호 안의 단어를 사용하여 4단어로 알맞게 영작하시오.', answers: ['what does that mean', 'What does that mean?', 'What does that mean'] },
  { num: 3, text: '위 대화의 밑줄 친 ⓒ의 우리말을 2단어로 알맞게 영작하시오.', answers: ["don't worry", "Don't worry", "Don't worry."] },
  { num: 4, text: '위 대화의 빈칸 ⓓ, ⓕ에 들어갈 알맞은 전치사를 각각 쓰시오.', dual: true, dualLabels: ['ⓓ', 'ⓕ'], answers: [['on'], ['for']] },
  { num: 5, text: '위 대화의 빈칸 ⓔ에 흐름상 들어갈 알맞은 한 단어를 쓰시오.', answers: ['say', 'Say'] },
  { num: 6, text: "위 대화의 밑줄 친 ⓖ의 우리말을 2단어로 영작할 때 빈칸에 알맞은 말을 쓰시오. (You're __________.)", answers: ['welcome', 'Welcome'] },

  // ── DIALOGUE 3 & 4 ────────────────────────────────────
  {
    passage: `<p><strong>3.</strong><br>
B: Everything looks <span class="circle-label">ⓐ</span>[deliciously / delicious].<br>
G: Yes. <span class="circle-label">ⓑ</span>(my / like / would / some / you / ? / of / spaghetti)<br>
B: No, thanks. Spaghetti is not my cup of tea.<br>
G: Not your cup of tea? What does that mean?<br>
B: <span class="circle-label">ⓒ</span>_______________ "I don't like something."<br>
G: Oh, I see. You <span class="circle-label">ⓓ</span>[like / don't like] spaghetti.</p>
<p><strong>4.</strong><br>
G: I feel <span class="circle-label">ⓔ</span>_________ the weather.<br>
B: Excuse me, but <span class="underline"><span class="circle-label">ⓕ</span>다시 한번 말해 줄 수 있니?</span> (please say, that)<br>
G: I said, "I feel <span class="circle-label">ⓔ</span>_________ the weather." <span class="circle-label">ⓒ</span>______________ "I don't feel well." (think / a / have / I / cold / I).<br>
B: Oh. Why don't you <span class="circle-label">ⓗ</span>[buy / buying] some medicine before you <span class="circle-label">ⓘ</span>_________ the plane? You can get medicine at the store over there.<br>
G: I guess I should.</p>`
  },
  { num: 7, text: '위 대화의 괄호 ⓐ에서 어법상 알맞은 것을 고르시오.', answers: ['delicious'] },
  { num: 8, text: '위 대화의 괄호 ⓑ에 주어진 표현을 알맞게 배열하시오.', answers: ['would you like some of my spaghetti', 'Would you like some of my spaghetti?', 'Would you like some of my spaghetti'] },
  { num: 9, text: '위 대화의 빈칸 ⓒ에 흐름상 공통으로 들어갈 알맞은 2단어를 쓰시오.', answers: ['it means', 'It means', 'It means.'] },
  { num: 10, text: '위 대화의 괄호 ⓓ에서 흐름상 알맞은 것을 고르시오.', answers: ["don't like", "Don't like"] },
  { num: 11, text: '위 대화의 빈칸 ⓔ에 공통으로 들어갈 알맞은 전치사를 쓰시오.', answers: ['under'] },
  { num: 12, text: '위 대화의 밑줄 친 ⓕ의 우리말을 괄호 안의 단어를 사용하여 6단어로 알맞게 영작하시오.', answers: ['can you please say that again', 'Can you please say that again?', 'Can you please say that again'] },
  { num: 13, text: '위 대화의 괄호 ⓖ에 주어진 표현을 알맞게 배열하시오.', answers: ['i think i have a cold', 'I think I have a cold.', 'I think I have a cold'] },
  { num: 14, text: '위 대화의 괄호 ⓗ에서 어법상 알맞은 것을 고르시오.', answers: ['buy'] },
  { num: 15, text: "위 대화의 빈칸 ⓘ에 '~을 타다'라는 뜻을 쓸 때 빈칸에 알맞은 말을 쓰시오. (get __________)", answers: ['on'] },

  // ── DIALOGUE PRACTICE 2 ───────────────────────────────
  {
    section: 'Dialogue Practice 2',
    passage: `<p>G: Thank you <span class="circle-label">ⓐ</span>______ everything, Jiho. I had a great time in Korea.<br>
B: <span class="underline"><span class="circle-label">ⓑ</span>천만에.</span> Please come visit me again, Lucy.<br>
G: I'd love to, but <span class="underline"><span class="circle-label">ⓒ</span>before I do,</span> I'd like <span class="circle-label">ⓓ</span>(invite) you <span class="circle-label">ⓔ</span>(visit) me in London.<br>
B: Thanks. Anyway, it's too bad <span class="circle-label">ⓕ</span>__________ you can't come to my soccer game tomorrow.<br>
G: I'm sorry <span class="circle-label">ⓖ</span>_________ I can't stay longer. <span class="circle-label">ⓗ</span>(my / I'll / crossed / keep / for / fingers / you).<br>
B: Excuse me, but can you please say that again?<br>
G: I said, "<span class="circle-label">ⓗ</span>(my / I'll / crossed / keep / for / fingers / you)." It means "I wish you <span class="circle-label">ⓘ</span>[good / bad] luck."<br>
B: Oh. Thanks. Have a nice trip.<br>
G: Thanks. <span class="underline"><span class="circle-label">ⓙ</span>연락할게.</span></p>`
  },
  { num: 16, text: '위 대화의 빈칸 ⓐ에 들어갈 알맞은 전치사를 쓰시오.', answers: ['for'] },
  { num: 17, text: "위 대화의 밑줄 친 ⓑ의 우리말을 2단어로 영작할 때 빈칸에 알맞은 말을 쓰시오. (My __________.)", answers: ['pleasure', 'Pleasure'] },
  { num: 18, text: '위 대화의 밑줄 친 ⓒ의 의미를 구체적으로 쓸 때 빈칸에 알맞은 말을 쓰시오. (before I _____ _____ _____,)', answers: ['visit you again', 'come visit you again', 'come back to visit you again'] },
  { num: 19, text: '위 대화의 빈칸 ⓓ, ⓔ에 주어진 단어의 알맞은 형태를 각각 쓰시오.', dual: true, dualLabels: ['ⓓ', 'ⓔ'], answers: [['to invite'], ['to visit']] },
  { num: 20, text: '위 대화의 빈칸 ⓕ, ⓖ에 공통으로 들어갈 알맞은 말을 쓰시오.', answers: ['that'] },

// ── STATE ─────────────────────────────────────────────
let student = {};
let submitted = false;

// ── LOGIN ─────────────────────────────────────────────
function doLogin() {
  const name = document.getElementById('login-name').value.trim();
  const school = document.getElementById('login-school').value.trim();
  const grade = document.getElementById('login-grade').value.trim();
  if (!name || !school || !grade) {
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  student = { name, school, grade };
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('workbook-screen').style.display = 'block';
  document.getElementById('wb-user-info').textContent = `${name} · ${school} ${grade}`;
  renderQuestions();
}

// ── RENDER ────────────────────────────────────────────
function renderQuestions() {
  const container = document.getElementById('questions-container');
  let html = '';
  let currentSection = '';

  QUESTIONS.forEach(q => {
    // Section header
    if (q.section && q.section !== currentSection) {
      currentSection = q.section;
      html += `<div class="section-header">${q.section}</div>`;
    }

    // Passage
    if (q.passage) {
      let passHtml = '<div class="passage-box">';
      if (q.vocabTitle) passHtml += `<div class="vocab-title">${q.vocabTitle}</div>`;
      passHtml += q.passage + '</div>';
      html += passHtml;
      return;
    }

    // Question card
    if (q.dual) {
      html += `<div class="q-card" id="qcard-${q.num}">
        <span class="q-num">${q.num}번</span>
        <div class="q-text">${q.text.replace(/\n/g,'<br>')}</div>
        <div class="dual-input">
          <span class="label">${q.dualLabels[0]}</span>
          <input class="q-input" id="inp-${q.num}-0" type="text" placeholder="답 입력">
          <span class="label">${q.dualLabels[1]}</span>
          <input class="q-input" id="inp-${q.num}-1" type="text" placeholder="답 입력">
        </div>
        <div class="q-feedback" id="fb-${q.num}"></div>
      </div>`;
    } else {
      html += `<div class="q-card" id="qcard-${q.num}">
        <span class="q-num">${q.num}번</span>
        <div class="q-text">${q.text.replace(/\n/g,'<br>')}</div>
        <div class="q-input-row">
          <input class="q-input" id="inp-${q.num}" type="text" placeholder="답을 입력하세요">
        </div>
        <div class="q-feedback" id="fb-${q.num}"></div>
      </div>`;
    }
  });

  container.innerHTML = html;

  // progress tracking
  document.querySelectorAll('.q-input').forEach(inp => {
    inp.addEventListener('input', updateProgress);
  });
}

function updateProgress() {
  const qNums = QUESTIONS.filter(q => q.num).map(q => q.num);
  let filled = 0;
  qNums.forEach(n => {
    const q = QUESTIONS.find(q => q.num === n);
    if (q.dual) {
      const v0 = (document.getElementById(`inp-${n}-0`) || {}).value || '';
      const v1 = (document.getElementById(`inp-${n}-1`) || {}).value || '';
      if (v0.trim() && v1.trim()) filled++;
    } else {
      const v = (document.getElementById(`inp-${n}`) || {}).value || '';
      if (v.trim()) filled++;
    }
  });
  const pct = Math.round(filled / qNums.length * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ── SUBMIT ────────────────────────────────────────────
function normalize(s) {
  return s.trim().toLowerCase().replace(/[?.!,]/g, '').replace(/\s+/g, ' ');
}

function checkAnswer(userVal, correctArr) {
  const u = normalize(userVal);
  return correctArr.some(c => normalize(c) === u);
}

function submitAll() {
  if (submitted) return;
  submitted = true;

  const qList = QUESTIONS.filter(q => q.num);
  let correct = 0, wrong = 0, blank = 0;
  const wrongList = [];

  qList.forEach(q => {
    const card = document.getElementById(`qcard-${q.num}`);
    const fb = document.getElementById(`fb-${q.num}`);

    if (q.dual) {
      const inp0 = document.getElementById(`inp-${q.num}-0`);
      const inp1 = document.getElementById(`inp-${q.num}-1`);
      inp0.disabled = true;
      inp1.disabled = true;
      const v0 = inp0.value.trim();
      const v1 = inp1.value.trim();
      const isBlank = !v0 && !v1;
      const ok0 = v0 ? checkAnswer(v0, q.answers[0]) : false;
      const ok1 = v1 ? checkAnswer(v1, q.answers[1]) : false;
      const allOk = ok0 && ok1;
      const anyBlank = !v0 || !v1;

      if (isBlank) {
        blank++;
        card.classList.add('unanswered');
      } else if (allOk) {
        correct++;
        card.classList.add('correct');
        inp0.classList.add('correct-input');
        inp1.classList.add('correct-input');
      } else {
        wrong++;
        card.classList.add('wrong');
        if (!ok0) { inp0.classList.add('wrong-input'); }
        else { inp0.classList.add('correct-input'); }
        if (!ok1) { inp1.classList.add('wrong-input'); }
        else { inp1.classList.add('correct-input'); }
        wrongList.push({ num: q.num, student: `${q.dualLabels[0]}:${v0 || '(미입력)'} / ${q.dualLabels[1]}:${v1 || '(미입력)'}`, answer: `${q.dualLabels[0]}:${q.answers[0][0]} / ${q.dualLabels[1]}:${q.answers[1][0]}` });
      }

      const a0str = q.answers[0][0];
      const a1str = q.answers[1][0];
      fb.innerHTML = allOk
        ? `<span class="correct-mark">✓ 정답입니다!</span>`
        : `${ok0 ? '<span class="correct-mark">✓</span>' : '<span class="wrong-mark">✗</span>'} ${q.dualLabels[0]}: <span class="answer-reveal">${a0str}</span> &nbsp; ${ok1 ? '<span class="correct-mark">✓</span>' : '<span class="wrong-mark">✗</span>'} ${q.dualLabels[1]}: <span class="answer-reveal">${a1str}</span>`;
      fb.classList.add('show');

    } else {
      const inp = document.getElementById(`inp-${q.num}`);
      inp.disabled = true;
      const v = inp.value.trim();
      if (!v) {
        blank++;
        card.classList.add('unanswered');
        fb.innerHTML = `<span class="wrong-mark">미입력</span> 정답: <span class="answer-reveal">${q.answers[0]}</span>`;
        fb.classList.add('show');
      } else if (checkAnswer(v, q.answers)) {
        correct++;
        card.classList.add('correct');
        inp.classList.add('correct-input');
        fb.innerHTML = `<span class="correct-mark">✓ 정답입니다!</span>`;
        fb.classList.add('show');
      } else {
        wrong++;
        card.classList.add('wrong');
        inp.classList.add('wrong-input');
        fb.innerHTML = `<span class="wrong-mark">✗ 오답</span> 정답: <span class="answer-reveal">${q.answers[0]}</span>`;
        fb.classList.add('show');
        wrongList.push({ num: q.num, student: v, answer: q.answers[0] });
      }
    }
  });

  const total = qList.length;
  const score = Math.round(correct / total * 100);

  // Show score panel
  const panel = document.getElementById('score-panel');
  panel.style.display = 'block';
  document.getElementById('score-display').textContent = score + '점';
  document.getElementById('score-sub').textContent = `${total}문항 중 ${correct}개 정답`;
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;
  document.getElementById('stat-blank').textContent = blank;
  panel.scrollIntoView({ behavior: 'smooth' });

  // Disable submit button
  document.querySelector('.wb-submit-btn').textContent = '제출 완료';
  document.querySelector('.wb-submit-btn').disabled = true;

  // Notion
  sendToNotion(score, wrongList, correct, wrong, blank);
}

async function sendToNotion(score, wrongList, correct, wrong, blank) {
  const status = document.getElementById('notion-status');
  status.className = 'notion-status sending';
  status.textContent = '결과를 저장하는 중...';

  let wrongText = `[점수: ${score}점]\n`;
  if (wrongList.length === 0) {
    wrongText += '오답 없음 (만점)';
  } else {
    wrongList.forEach(w => {
      wrongText += `문${w.num}: 학생답(${w.student}) → 정답(${w.answer})\n`;
    });
  }

  const payload = {
    studentName: student.name,
    school: student.school,
    grade: student.grade,
    workbook: WORKBOOK_NAME,
    category: CATEGORY,
    submitDate: new Date().toISOString().split('T')[0],
    wrongAnswers: wrongText,
    score: score
  };

  try {
    const res = await fetch(NOTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      status.className = 'notion-status done';
      status.textContent = '✓ 결과가 저장되었습니다.';
    } else {
      throw new Error('response not ok');
    }
  } catch (e) {
    status.className = 'notion-status fail';
    status.textContent = '⚠ 저장 실패. 선생님께 문의하세요.';
  }
}
</script>
