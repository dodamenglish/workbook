<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼성여자고등학교 2학년 영어 내신 대비</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a3a5c;
    --accent: #e8703a;
    --bg: #f8f6f1;
    --card: #ffffff;
    --border: #ddd8cc;
    --text: #2c2c2c;
    --sub: #6b6b6b;
    --correct: #2e7d32;
    --wrong: #c62828;
    --tag-3: #1a5c8a;
    --tag-4: #1a6862;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ===== LOGIN ===== */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a3a5c 0%, #1a6862 100%);
  }
  .login-box {
    background: white;
    border-radius: 16px;
    padding: 48px 40px;
    width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .login-box .school-name {
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    color: var(--sub);
    text-align: center;
    margin-bottom: 4px;
    letter-spacing: 0.05em;
  }
  .login-box h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    color: var(--primary);
    text-align: center;
    margin-bottom: 32px;
    line-height: 1.4;
  }
  .login-box label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--sub);
    margin-bottom: 6px;
    letter-spacing: 0.05em;
  }
  .login-box input, .login-box select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s;
    background: white;
    color: var(--text);
  }
  .login-box input:focus, .login-box select:focus {
    border-color: var(--primary);
  }
  .login-btn {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
  }
  .login-btn:hover { background: #0f2740; }

  /* ===== WORKBOOK ===== */
  #workbook-screen { display: none; min-height: 100vh; }

  .top-bar {
    background: var(--primary);
    color: white;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .top-bar .title {
    font-family: 'Noto Serif KR', serif;
    font-size: 14px;
    font-weight: 600;
  }
  .top-bar .student-info {
    font-size: 12px;
    opacity: 0.85;
  }
  .top-bar .progress-text {
    font-size: 13px;
    font-weight: 500;
  }

  /* ===== QUESTION PAGE ===== */
  .question-page {
    display: none;
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 24px 120px;
  }
  .question-page.active { display: block; }

  .q-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .q-num {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .q-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .q-tag.과3 { background: #e3f0fa; color: var(--tag-3); }
  .q-tag.과4 { background: #e0f0ef; color: var(--tag-4); }
  .q-type-label {
    font-size: 12px;
    color: var(--sub);
  }

  .passage-box {
    background: #f4f2ed;
    border-left: 4px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 18px 20px;
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.85;
    color: #333;
  }
  .passage-box .passage-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .passage-box u { text-decoration-color: var(--accent); }

  .question-body {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  .question-text {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.7;
    margin-bottom: 20px;
    color: var(--primary);
  }
  .question-text .points {
    font-size: 12px;
    font-weight: 400;
    color: var(--sub);
    margin-left: 6px;
  }

  /* 객관식 보기 */
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .choice-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: white;
    cursor: pointer;
    text-align: left;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    transition: all 0.15s;
    color: var(--text);
  }
  .choice-btn:hover { border-color: var(--primary); background: #f0f4f8; }
  .choice-btn.selected { border-color: var(--primary); background: #e8f0f8; }
  .choice-btn.correct { border-color: var(--correct); background: #e8f5e9; color: var(--correct); }
  .choice-btn.wrong { border-color: var(--wrong); background: #ffebee; color: var(--wrong); }
  .choice-label {
    font-weight: 700;
    color: var(--primary);
    min-width: 20px;
    flex-shrink: 0;
  }
  .choice-btn.correct .choice-label { color: var(--correct); }
  .choice-btn.wrong .choice-label { color: var(--wrong); }

  /* 단답형/서술형 */
  .answer-input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
    min-height: 60px;
    color: var(--text);
  }
  .answer-input:focus { border-color: var(--primary); }
  .answer-input.correct-input { border-color: var(--correct); background: #e8f5e9; }
  .answer-input.wrong-input { border-color: var(--wrong); background: #ffebee; }

  /* 어법 오류 찾기 */
  .grammar-inputs { display: flex; flex-direction: column; gap: 10px; }
  .grammar-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .grammar-row label {
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    min-width: 24px;
  }
  .grammar-row input {
    flex: 1;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
    color: var(--text);
  }
  .grammar-row input:focus { border-color: var(--primary); }
  .grammar-row .arrow { color: var(--sub); font-size: 16px; }
  .grammar-row input.correct-input { border-color: var(--correct); background: #e8f5e9; }
  .grammar-row input.wrong-input { border-color: var(--wrong); background: #ffebee; }

  /* 피드백 */
  .feedback-box {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.7;
    display: none;
  }
  .feedback-box.correct { background: #e8f5e9; border: 1px solid #a5d6a7; color: var(--correct); }
  .feedback-box.wrong { background: #ffebee; border: 1px solid #ef9a9a; color: var(--wrong); }
  .feedback-box.show { display: block; }

  /* 문장 삽입 */
  .insertion-sentence {
    background: #fff8f0;
    border: 1.5px dashed var(--accent);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 16px;
    color: #555;
  }
  .insertion-sentence strong { color: var(--accent); font-size: 11px; display: block; margin-bottom: 4px; }

  /* 낱말 쓰임 */
  .underlined { text-decoration: underline; text-decoration-color: var(--accent); font-weight: 600; }

  /* ===== DOT NAVIGATION ===== */
  .dot-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 200;
    gap: 12px;
  }
  .nav-btn {
    padding: 10px 20px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: white;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text);
    flex-shrink: 0;
  }
  .nav-btn:hover { border-color: var(--primary); color: var(--primary); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .nav-btn.primary-btn {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .nav-btn.primary-btn:hover { background: #0f2740; }

  .dots-wrap {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: center;
    flex: 1;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--border);
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .dot.answered { background: var(--accent); }
  .dot.current { background: var(--primary); transform: scale(1.3); }
  .dot.current.answered { background: var(--primary); }

  /* ===== RESULT SCREEN ===== */
  #result-screen {
    display: none;
    max-width: 700px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  .result-card {
    background: white;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
  }
  .result-score {
    font-size: 64px;
    font-weight: 700;
    color: var(--primary);
    line-height: 1;
    font-family: 'Noto Serif KR', serif;
  }
  .result-score span { font-size: 24px; color: var(--sub); }
  .result-label { font-size: 15px; color: var(--sub); margin-top: 8px; margin-bottom: 32px; }
  .result-stats {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 32px;
  }
  .stat-box {
    flex: 1;
    padding: 16px;
    border-radius: 10px;
    font-size: 13px;
  }
  .stat-box .stat-num { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
  .stat-box.correct-stat { background: #e8f5e9; color: var(--correct); }
  .stat-box.wrong-stat { background: #ffebee; color: var(--wrong); }
  .result-btn {
    padding: 14px 32px;
    border-radius: 8px;
    border: none;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    background: var(--primary);
    color: white;
  }
  .result-btn:hover { background: #0f2740; }
  .notion-status {
    margin-top: 16px;
    font-size: 13px;
    color: var(--sub);
    min-height: 20px;
  }

  /* 오답 목록 */
  .wrong-list {
    margin-top: 32px;
    text-align: left;
  }
  .wrong-list h3 {
    font-size: 15px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--border);
  }
  .wrong-item {
    padding: 12px 0;
    border-bottom: 1px solid #f0ede6;
    font-size: 13px;
    line-height: 1.6;
  }
  .wrong-item .wrong-q { font-weight: 700; color: var(--wrong); margin-bottom: 4px; }
  .wrong-item .wrong-ans { color: var(--sub); }
  .wrong-item .correct-ans { color: var(--correct); font-weight: 500; }

  @media (max-width: 600px) {
    .login-box { width: 90%; padding: 32px 24px; }
    .question-page { padding: 20px 16px 120px; }
    .result-stats { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login-screen">
  <div class="login-box">
    <div class="school-name">삼성여자고등학교 2학년</div>
    <h1>영어 내신 대비<br>전자워크북</h1>
    <label>이름</label>
    <input type="text" id="input-name" placeholder="이름을 입력하세요">
    <label>학교</label>
    <input type="text" id="input-school" value="삼성여자고등학교">
    <label>학년</label>
    <select id="input-grade">
      <option value="2학년">2학년</option>
      <option value="2학년 1반">2학년 1반</option>
      <option value="2학년 2반">2학년 2반</option>
      <option value="2학년 3반">2학년 3반</option>
      <option value="2학년 4반">2학년 4반</option>
      <option value="2학년 5반">2학년 5반</option>
    </select>
    <button class="login-btn" onclick="startWorkbook()">시작하기</button>
  </div>
</div>

<!-- ===== WORKBOOK ===== -->
<div id="workbook-screen">
  <div class="top-bar">
    <div class="title">삼성여고 2학년 영어 내신 대비</div>
    <div class="progress-text" id="progress-text">1 / 30</div>
    <div class="student-info" id="student-info-bar"></div>
  </div>

  <div id="questions-container"></div>

  <!-- DOT NAV -->
  <div class="dot-nav">
    <button class="nav-btn" id="btn-prev" onclick="movePage(-1)">◀ 이전</button>
    <div class="dots-wrap" id="dots-wrap"></div>
    <button class="nav-btn" id="btn-next" onclick="movePage(1)">다음 ▶</button>
  </div>
</div>

<!-- ===== RESULT ===== -->
<div id="result-screen">
  <div class="result-card">
    <div class="result-score" id="result-score">0<span>점</span></div>
    <div class="result-label" id="result-label"></div>
    <div class="result-stats">
      <div class="stat-box correct-stat">
        <div class="stat-num" id="stat-correct">0</div>
        <div>정답</div>
      </div>
      <div class="stat-box wrong-stat">
        <div class="stat-num" id="stat-wrong">0</div>
        <div>오답</div>
      </div>
    </div>
    <button class="result-btn" onclick="submitToNotion()">📤 Notion에 제출하기</button>
    <div class="notion-status" id="notion-status"></div>
    <div class="wrong-list" id="wrong-list"></div>
  </div>
</div>

<script>
// ============================================================
//  DATA
// ============================================================
const questions = [
  // ===== 3과: A World on the Wing =====
  {
    id: 1,
    course: '3과',
    passage: 'A World on the Wing',
    type: 'grammar', // 어법 오류 찾기 (단답형)
    passageText: `"Your new book says every spring and fall, hundreds of millions to billions of migratory birds ① <u>pass</u> over our roofs, but we seem to have no idea that it's happening. Why is that?"
"Well, most birds migrate after dark, ② <u>including</u> almost all of the birds that are normally active during the day. That's why it's hard for us to realize the migration is happening. They migrate at night because the night sky is cooler, and the air ③ <u>calmer</u>. Besides, there are fewer predators at night. If you could strip away the night sky and make everything ④ <u>visible</u>, this migration would probably ⑤ <u>be</u> the largest, greatest natural spectacle on the planet."`,
    question: '위 글의 밑줄 친 ①~⑤ 중 어법상 틀린 것을 모두 찾아 기호를 쓰고, 바르게 고치시오.',
    points: '(각 2점)',
    // type: grammar → 체크박스형 (번호 선택 + 수정어 입력)
    grammarItems: [
      { sym: '①', word: 'pass' },
      { sym: '②', word: 'including' },
      { sym: '③', word: 'calmer' },
      { sym: '④', word: 'visible' },
      { sym: '⑤', word: 'be' },
    ],
    // 정답: 없음 (모두 정상) — 실제 지문상 ①~⑤ 모두 문법적으로 옳음
    // 단, 문서에서 틀린 것 없다고 명시 안 됨 → 서술형으로 처리
    answerKey: '해당 없음(모두 어법상 맞음)',
    modelAnswer: '해당 없음 — ①~⑤ 모두 어법상 적절합니다. (정답: 없음)',
    isSubjective: true,
  },
  {
    id: 2,
    course: '3과',
    passage: 'A World on the Wing',
    type: 'multiple', // 모두 고르기
    passageText: `"Your new book says every spring and fall, hundreds of millions to billions of migratory birds pass over our roofs, but we seem to have no idea that it's happening. Why is that?"
"Well, most birds migrate after dark, including almost all of the birds that are normally active during the day. That's why it's hard for us to realize the migration is happening. They migrate at night because the night sky is cooler, and the air calmer. Besides, there are fewer predators at night. If you could strip away the night sky and make everything visible, this migration would probably be the largest, greatest natural spectacle on the planet."`,
    question: '다음 중 글의 내용과 일치하는 것을 모두 고른 것은?',
    choices: [
      { label: 'ㄱ', text: '①, ②, ③' },
      { label: 'ㄴ', text: '②, ③' },
      { label: 'ㄷ', text: '①, ④, ⑤' },
      { label: 'ㄹ', text: '②, ③, ④' },
      { label: 'ㅁ', text: '③, ④, ⑤' },
    ],
    subChoices: [
      '① 철새의 이동은 지표면에서 주로 일어난다.',
      '② The migration of birds is a spectacle that often goes unnoticed by people.',
      '③ Nocturnal migration provides birds with a safer environment from predators.',
      '④ 큰뒷부리도요(bar-tailed godwits)는 이동 중 여러 번의 휴식을 취한다.',
      '⑤ The air at night is more turbulent than it is during the day, making flight difficult.',
    ],
    answer: 'ㄴ', // ②, ③ 일치
    explanation: '②새의 이동은 사람들이 잘 인식하지 못하는 장관이다(O), ③야간 이동은 포식자가 적어 더 안전하다(O). ①지표면 X, ④휴식 여러 번 X, ⑤야간 공기가 더 잔잔함 X',
  },
  {
    id: 3,
    course: '3과',
    passage: 'A World on the Wing',
    type: 'insertion', // 문장 삽입
    insertSentence: '"That\'s why it\'s hard for us to realize the migration is happening."',
    passageText: `"Your new book says every spring and fall, hundreds of millions to billions of migratory birds pass over our roofs, but we seem to have no idea that it's happening. ( ① ) Why is that? ( ② ) Well, most birds migrate after dark, including almost all of the birds that are normally active during the day. ( ③ ) They migrate at night because the night sky is cooler, and the air calmer. ( ④ ) Besides, there are fewer predators at night. ( ⑤ )"`,
    question: '다음 문장이 들어가기에 가장 적절한 곳은?',
    choices: [
      { label: '①', text: '①' },
      { label: '②', text: '②' },
      { label: '③', text: '③' },
      { label: '④', text: '④' },
      { label: '⑤', text: '⑤' },
    ],
    answer: '③',
    explanation: '대부분의 새가 어두워진 후 이동한다는 내용 뒤인 ③에 "그래서 우리가 이동을 인식하기 어렵다"는 문장이 자연스럽게 이어집니다.',
  },
  {
    id: 4,
    course: '3과',

// ============================================================
//  STATE
// ============================================================
let currentPage = 0;
let answers = new Array(questions.length).fill(null);
let studentName = '', studentSchool = '', studentGrade = '';

// ============================================================
//  LOGIN
// ============================================================
function startWorkbook() {
  const name = document.getElementById('input-name').value.trim();
  const school = document.getElementById('input-school').value.trim();
  const grade = document.getElementById('input-grade').value;
  if (!name) { alert('이름을 입력해 주세요.'); return; }
  studentName = name;
  studentSchool = school;
  studentGrade = grade;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('workbook-screen').style.display = 'block';
  document.getElementById('student-info-bar').textContent = `${name} | ${school} ${grade}`;
  buildQuestions();
  buildDots();
  showPage(0);
}

// ============================================================
//  BUILD QUESTIONS
// ============================================================
function buildQuestions() {
  const container = document.getElementById('questions-container');
  questions.forEach((q, idx) => {
    const page = document.createElement('div');
    page.className = 'question-page';
    page.id = `page-${idx}`;

    let html = `
      <div class="q-header">
        <div class="q-num">${idx + 1}</div>
        <span class="q-tag 과${q.course === '3과' ? '3' : '4'}">${q.course}</span>
        <span class="q-tag" style="background:#f3f0ea;color:#666;">${q.passage}</span>
        <span class="q-type-label">${typeLabel(q.type)}</span>
      </div>
    `;

    // 문장 삽입 → 삽입 문장 먼저
    if (q.type === 'insertion') {
      html += `<div class="insertion-sentence"><strong>삽입할 문장</strong>${q.insertSentence}</div>`;
    }

    // 지문
    html += `<div class="passage-box"><div class="passage-title">지문</div>${q.passageText.replace(/\n/g, '<br>')}</div>`;

    // 보기(subChoices) — 모두 고르기
    if (q.type === 'multiple' && q.subChoices) {
      html += `<div class="passage-box" style="margin-top:-8px;border-left-color:#aaa;background:#f9f8f5;font-size:13px;">`;
      q.subChoices.forEach(s => { html += `<div style="margin-bottom:4px;">${s}</div>`; });
      html += `</div>`;
    }

    // 문제 본문
    html += `<div class="question-body">`;
    html += `<div class="question-text">${q.question.replace(/\n/g, '<br>')}${q.points ? `<span class="points">${q.points}</span>` : ''}</div>`;

    // 답안 영역
    if (q.type === 'multiple' || q.type === 'vocab' || q.type === 'insertion') {
      html += `<div class="choices">`;
      q.choices.forEach(c => {
        html += `<button class="choice-btn" onclick="selectChoice(${idx}, '${c.label}')" id="choice-${idx}-${c.label}">
          <span class="choice-label">${c.label}</span>
          <span>${c.text}</span>
        </button>`;
      });
      html += `</div>`;
    } else if (q.type === 'grammar') {
      html += `<div class="grammar-inputs">`;
      html += `<div style="font-size:12px;color:var(--sub);margin-bottom:8px;">틀린 번호의 칸에 바르게 고친 표현을 입력하세요. (맞으면 비워두세요)</div>`;
      q.grammarItems.forEach((item, gi) => {
        html += `<div class="grammar-row">
          <label>${item.sym}</label>
          <span style="font-size:13px;color:#888;">${item.word}</span>
          <span class="arrow">→</span>
          <input type="text" id="grammar-${idx}-${gi}" placeholder="바르게 고치기 (맞으면 빈칸)" oninput="saveGrammarInput(${idx})">
        </div>`;
      });
      html += `</div>`;
    } else if (q.type === 'essay') {
      html += `<textarea class="answer-input" id="essay-${idx}" rows="4" placeholder="${q.placeholder || '답을 서술하시오.'}" oninput="saveEssayInput(${idx})"></textarea>`;
    }

    // 피드백
    html += `<div class="feedback-box" id="feedback-${idx}"></div>`;
    html += `</div>`; // question-body
    html += `</div>`; // question-page

    page.innerHTML = html;
    container.appendChild(page);
  });
}

function typeLabel(t) {
  const map = { grammar: '어법 오류 찾기', multiple: '내용 일치/불일치', insertion: '문장 삽입', vocab: '낱말 쓰임', essay: '서술형' };
  return map[t] || t;
}

// ============================================================
//  ANSWER HANDLING
// ============================================================
function selectChoice(idx, label) {
  answers[idx] = label;
  // 시각 업데이트
  const q = questions[idx];
  (q.choices || []).forEach(c => {
    const btn = document.getElementById(`choice-${idx}-${c.label}`);
    if (btn) {
      btn.classList.remove('selected', 'correct', 'wrong');
      if (c.label === label) btn.classList.add('selected');
    }
  });
  updateDot(idx);
  updateProgress();
}

function saveGrammarInput(idx) {
  const q = questions[idx];
  const vals = q.grammarItems.map((item, gi) => {
    const el = document.getElementById(`grammar-${idx}-${gi}`);
    return el ? el.value.trim() : '';
  });
  answers[idx] = vals.join('|');
  updateDot(idx);
  updateProgress();
}

function saveEssayInput(idx) {
  const el = document.getElementById(`essay-${idx}`);
  answers[idx] = el ? el.value.trim() : '';
  updateDot(idx);
  updateProgress();
}

// ============================================================
//  NAVIGATION
// ============================================================
function buildDots() {
  const wrap = document.getElementById('dots-wrap');
  wrap.innerHTML = '';
  questions.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    d.title = `${i + 1}번`;
    d.onclick = () => showPage(i);
    wrap.appendChild(d);
  });
}

function showPage(idx) {
  document.querySelectorAll('.question-page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.dot').forEach(d => d.classList.remove('current'));
  const page = document.getElementById(`page-${idx}`);
  if (page) page.classList.add('active');
  const dot = document.getElementById(`dot-${idx}`);
  if (dot) dot.classList.add('current');
  currentPage = idx;
  document.getElementById('btn-prev').disabled = idx === 0;

  const isLast = idx === questions.length - 1;
  const nextBtn = document.getElementById('btn-next');
  if (isLast) {
    nextBtn.textContent = '제출·채점 ✓';
    nextBtn.className = 'nav-btn primary-btn';
    nextBtn.onclick = () => showResult();
  } else {
    nextBtn.textContent = '다음 ▶';
    nextBtn.className = 'nav-btn';
    nextBtn.onclick = () => movePage(1);
  }
  updateProgress();
}

function movePage(dir) {
  const next = currentPage + dir;
  if (next >= 0 && next < questions.length) showPage(next);
}

function updateDot(idx) {
  const d = document.getElementById(`dot-${idx}`);
  if (!d) return;
  const hasAnswer = answers[idx] !== null && answers[idx] !== '' && answers[idx] !== undefined;
  d.classList.toggle('answered', hasAnswer);
}

function updateProgress() {
  const answered = answers.filter(a => a !== null && a !== '' && a !== undefined).length;
  document.getElementById('progress-text').textContent = `${currentPage + 1} / ${questions.length}`;
}

// ============================================================
//  RESULT & GRADING
// ============================================================
function showResult() {
  // 채점 (객관식만 자동, 서술형/어법은 모범답안 제시)
  let correct = 0, wrong = 0;
  const wrongItems = [];

  questions.forEach((q, idx) => {
    if (q.isSubjective || q.type === 'grammar' || q.type === 'essay') {
      // 서술형: 작성 여부만 체크
      return;
    }
    const ans = answers[idx];
    if (ans === q.answer) {
      correct++;
    } else {
      wrong++;
      wrongItems.push({ idx, q, ans });
    }
  });

  const objTotal = questions.filter(q => !q.isSubjective && q.type !== 'grammar' && q.type !== 'essay').length;
  const score = objTotal > 0 ? Math.round((correct / objTotal) * 100) : 0;

  document.getElementById('workbook-screen').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';

  document.getElementById('result-score').innerHTML = `${score}<span>점</span>`;
  document.getElementById('result-label').textContent = `객관식 ${objTotal}문항 기준 | 정답 ${correct}개 / 오답 ${wrong}개`;
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;

  // 오답 목록
  const wl = document.getElementById('wrong-list');
  let wlHtml = '';
  if (wrongItems.length > 0) {
    wlHtml += `<h3>📝 오답 목록 (객관식)</h3>`;
    wrongItems.forEach(({ idx, q, ans }) => {
      wlHtml += `<div class="wrong-item">
        <div class="wrong-q">${idx + 1}번. ${q.passage} — ${typeLabel(q.type)}</div>
        <div class="wrong-ans">내 답: ${ans || '(미응답)'} &nbsp;→&nbsp; <span class="correct-ans">정답: ${q.answer}</span></div>
        <div style="font-size:12px;color:#666;margin-top:4px;">${q.explanation || ''}</div>
      </div>`;
    });
  }

  // 서술형 모범답안
  wlHtml += `<h3 style="margin-top:24px;">📖 서술형 / 어법 모범답안</h3>`;
  questions.forEach((q, idx) => {
    if (q.isSubjective || q.type === 'grammar' || q.type === 'essay') {
      const myAns = answers[idx] || '(미작성)';
      wlHtml += `<div class="wrong-item">
        <div class="wrong-q">${idx + 1}번. ${q.passage}</div>
        <div class="wrong-ans">내 답: <span style="color:#333;">${myAns}</span></div>
        <div class="correct-ans" style="margin-top:4px;">📌 모범답안: ${(q.modelAnswer || '').replace(/\n/g, '<br>')}</div>
      </div>`;
    }
  });
  wl.innerHTML = wlHtml;
}

// ============================================================
//  NOTION SUBMIT
// ============================================================
async function submitToNotion() {
  const statusEl = document.getElementById('notion-status');
  statusEl.textContent = '제출 중...';

  // 오답 정리
  const wrongLines = [];
  questions.forEach((q, idx) => {
    if (!q.isSubjective && q.type !== 'grammar' && q.type !== 'essay') {
      const ans = answers[idx];
      if (ans !== q.answer) {
        wrongLines.push(`${idx + 1}번(${q.passage}): 내답 ${ans || '미응답'} → 정답 ${q.answer}`);
      }
    }
  });

  // 점수 계산
  const objTotal = questions.filter(q => !q.isSubjective && q.type !== 'grammar' && q.type !== 'essay').length;
  const correct = questions.filter((q, idx) => !q.isSubjective && q.type !== 'grammar' && q.type !== 'essay' && answers[idx] === q.answer).length;
  const score = objTotal > 0 ? Math.round((correct / objTotal) * 100) : 0;

  const wrongAnswersText = `[점수: ${score}점]\n` + (wrongLines.length > 0 ? wrongLines.join('\n') : '오답 없음(객관식 전체 정답)');

  const payload = {
    studentName: studentName,
    school: studentSchool,
    grade: studentGrade,
    workbook: '삼성여고 2학년 영어 내신 대비 (3,4과)',
    category: '내신대비',
    submitDate: new Date().toISOString().split('T')[0],
    wrongAnswers: wrongAnswersText,
    score: score,
  };

  try {
    const res = await fetch('https://dodamenglish.netlify.app/.netlify/functions/notion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (res.ok) {
      statusEl.textContent = '✅ Notion에 성공적으로 제출되었습니다!';
      statusEl.style.color = 'var(--correct)';
    } else {
      statusEl.textContent = '⚠️ 제출 실패. 다시 시도해 주세요.';
      statusEl.style.color = 'var(--wrong)';
    }
  } catch (e) {
    statusEl.textContent = '⚠️ 네트워크 오류. 다시 시도해 주세요.';
    statusEl.style.color = 'var(--wrong)';
  }
}
