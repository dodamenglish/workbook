<script>
const NOTION_URL = 'https://dodamenglish.netlify.app/.netlify/functions/notion';

// ── Passages ──
const P3_CD = `<span class="para-label">(C)</span> The global popularity of the tree mail phenomenon reminds us that we are all connected to nature, and we are all involved in building a more sustainable world. Without <span class="underline">collective</span> action from people across the globe, we would have little hope of saving our planet for future generations. Locally, the tree mail phenomenon has <span class="underline">discouraged</span> many Melbourne residents to offer their own ideas about building an environmentally friendly urban environment. Some have even volunteered to measure trees and monitor animals for nature programs in the city.<br><br><span class="para-label">(D)</span> Meanwhile, the Urban Forest Strategy's tree planting project has remained on track, and canopy cover is <span class="underline">predicted</span> to increase from 23 percent in 2012 to 40 percent by the year 2040. Melbourne's urban forest strategy will help keep the city cool. It will also allow residents to <span class="underline">interact</span> with nature and engage in outdoor activities every day. As a result, residents will be happier and healthier as they move toward a <span class="underline">greener</span> future.`;

const P3_AB_PLAIN = `After the map was posted online, something unexpected happened. The trees started receiving thousands of emails, but many of them were not reports about damage or poor health. Instead, they were love letters, poems, greetings, and messages expressing appreciation for the trees. The tree mail phenomenon quickly spread, and people all over the world started sending messages.<br><br>A message that was sent all the way from Russia said, "When I read about this wonderful project, I was inspired to write to you, even though I live thousands of miles away. Although we are separated by a great distance, we share the same planet and the same environment. Perhaps one day we will meet. Until then, I hope you can stay healthy and strong."`;

const P4_HINE = `In the 19th century, the Industrial Revolution led to a dramatic increase in factory production in the United States. The demand for workers increased, and many new positions were filled by children. By 1900, about twenty percent of all children in the United States were employed, and some of those working in factories were only four years old. The work was difficult and dangerous, leaving many child laborers with health problems. Factory owners turned to child labor for several reasons. For example, children could be paid less than adult workers. They were also less likely to go on strike.<br><br>Lewis Hine, a teacher and photographer, wanted to reveal how cruel this system was. So he quit his teaching job and started to work for the National Child Labor Committee as an investigative photographer. He gained access to factories by <span class="underline">pretending</span> to have different jobs like insurance agent or fire inspector. Once inside, he would photograph the children working there. He would also ask their names and ages and record information about their living and working conditions. From 1908 to 1912, he secretly <span class="underline">gathered</span> information and took photographs to expose factory owners who were taking advantage of helpless children.<br><br>Hine's photographs captured young children doing all sorts of jobs. These included picking vegetables, weaving baskets, and even handling dangerous equipment. What is more, the children's faces showed the <span class="underline">tragic</span> impact of hard labor. When people saw the children's joyless expressions, they could not help but feel heartbroken.<br><br>The pictures were later shown in exhibitions, lectures, magazine articles, and so on. As a result, the public realized just how <span class="underline">trivial</span> the situation was. Soon, many states passed stronger laws to <span class="underline">ban</span> the employment of children. In 1938, the United States Congress passed an act that made it illegal for children under sixteen to work in factories during school hours.`;

const P_CULTURE_B = `Harriet Beecher Stowe's 1852 novel Uncle Tom's Cabin contributed to historical change in the United States. The novel mainly follows Uncle Tom living a hard life as an African American slave. It also features Eliza and her son, who escape from slavery. The novel <span class="underline">exposes</span> the horrors of the slavery system and treating humans as property. After it was published, people in the North became increasingly against slavery. However, because the Southern economy relied on slave labor, people in the South still wanted to keep it. This <span class="underline">conflict</span> led to the Civil War, which contributed to the end of slavery. Although Stowe's novel didn't get rid of slavery by itself, it played an important role in bringing about its end.`;

// ── Questions ──
const questions = [
  // [1~7] Lesson 3 지문 C,D
  {
    id: 1,

    passage: P3_CD,
    stem: '윗글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?<br><div class="bogie-box">ⓐ collective &nbsp;&nbsp; ⓑ discouraged &nbsp;&nbsp; ⓒ predicted &nbsp;&nbsp; ⓓ interact &nbsp;&nbsp; ⓔ greener</div>',
    choices: ['ⓐ collective', 'ⓑ discouraged', 'ⓒ predicted', 'ⓓ interact', 'ⓔ greener'],
    answer: 2,
    explain: 'discouraged(낙담시키다)가 아니라 inspired/encouraged(고무하다)가 문맥상 맞습니다. 나무 이메일 현상이 멜버른 주민들을 "낙담"시킨 것이 아니라 "고무"시켰습니다.'
  },
  {
    id: 2,
    type: 'mc',
    section: null,
    passage: P3_AB_PLAIN,
    stem: '윗글을 바탕으로 러시아에서 온 이메일 발송자에 대한 설명으로 가장 적절한 것은?',
    choices: [
      'The sender complained about the lack of similar projects in Russia.',
      'The sender felt a deep environmental connection despite the geographical distance.',
      'The sender visited Melbourne recently to meet the specific tree they emailed.',
      'The sender attached an interactive map to their email.',
      'The sender pointed out the poor health conditions of the trees in Melbourne.'
    ],
    answer: 2,
    explain: '지리적 거리에도 불구하고 같은 지구를 공유한다("we share the same planet and the same environment")는 깊은 환경적 연결감을 느꼈습니다.'
  },
  {
    id: 3,
    type: 'mc',
    section: null,
    passage: null,
    stem: `(C) 단락의 빈칸에 들어갈 말로 가장 적절한 것은?<div class="bogie-box">Without collective action from people across the globe, we would have little hope of saving our planet for future generations.<br>→ If it ________ ________ ________ collective action from people across the globe, we would have little hope of saving our planet.</div>`,
    choices: ['has not been', 'were not for', 'is not for', 'had not been', 'will not be'],
    answer: 2,
    explain: '"Without = If it were not for" (가정법 과거: 현재 사실의 반대). 가정법 과거완료(had not been)는 과거 사실의 반대로 쓰이므로 문맥상 ② were not for가 정답입니다.'
  },
  {
    id: 4,

    section: null,
    passage: null,
    stem: '윗글의 요지로 가장 적절한 것은?',
    choices: [
      'The primary function of online mapping is to track the exact age of trees.',
      'Australian droughts can only be resolved by reducing greenhouse gas emissions.',
      'An unexpected digital initiative highlighted humanity\'s global connection to nature and fostered environmental engagement.',
      'Volunteer programs in Melbourne focus mainly on monitoring urban wildlife rather than planting trees.',
      'Writing poems to nature is scientifically proven to improve the physical health of trees.'
    ],
    answer: 3,
    explain: '예상치 못한 나무 이메일 프로젝트가 자연에 대한 인류의 연결성을 일깨우고 환경 참여를 촉진했다는 요지입니다.'
  },
  {
    id: 5,
    type: 'mc',
    section: null,
    passage: null,
    stem: '윗글의 흐름으로 보아, (C) 단락과 (D) 단락 사이의 논리적 관계로 가장 알맞은 것은?',
    choices: [
      'Cause and Effect (원인과 결과)',
      'Contrast and Contradiction (대조와 모순)',
      'Broad impact and Specific local outcomes (광범위한 영향과 구체적 지역 결과)',

  {

// ===== LOGIC (identical to round 1) =====
let studentNameV = '', studentSchoolV = '', studentGradeV = '';
let answersV = {}, checkedV = {}, revealedV = {};
let currentQV = 0;

function startExam() {
  studentNameV = document.getElementById('inp-name').value.trim();
  studentSchoolV = document.getElementById('inp-school').value.trim();
  studentGradeV = document.getElementById('inp-grade').value;
  if (!studentNameV) { alert('이름을 입력해주세요.'); return; }
  document.getElementById('student-info-header').textContent = studentNameV + ' | ' + studentGradeV;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('exam-screen').style.display = 'block';
  renderAll();
  goTo(0);
}

function renderAll() {
  const container = document.getElementById('q-container');
  const nav = document.getElementById('bottom-nav');
  container.innerHTML = '';
  nav.innerHTML = '';
  let lastSection = null;
  questions.forEach((q, i) => {
    if (q.section && q.section !== lastSection) {
      const div = document.createElement('div');
      div.className = 'q-card';
      div.innerHTML = `<div class="section-divider"><span class="section-label">${q.section}</span></div>`;
      div.dataset.sectionFor = i;
      container.appendChild(div);
      lastSection = q.section;
    }
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'qcard-' + i;
    const typeLabel = q.type === 'mc' ? '선택형' : '서술형';
    let html = '';
    if (q.passage) {
      html += `<div class="passage-box"><span class="passage-label">📖 지문</span>${q.passage}</div>`;
    }
    html += `<div class="q-number-row"><span class="q-num-badge">문항 ${q.id}</span><span class="q-type-badge">${typeLabel}${q.points?' · '+q.points+'점':''}</span></div>`;
    html += `<div class="q-stem">${q.stem}</div>`;
    if (q.type === 'mc') {
      html += `<ul class="choices" id="choices-${i}">`;
      q.choices.forEach((c, ci) => {
        html += `<li class="choice-item" id="choice-${i}-${ci}" onclick="selectChoice(${i},${ci})"><span class="choice-num">${ci+1}</span><span>${c}</span></li>`;
      });
      html += '</ul>';
      html += `<div class="btn-row">
        <button class="btn btn-prev" onclick="goTo(${i-1})" ${i===0?'style="visibility:hidden"':''}>← 이전</button>
        <button class="btn btn-check" onclick="checkMC(${i})">정답 확인</button>
        ${i < questions.length-1
          ? `<button class="btn btn-next" onclick="goTo(${i+1})">다음 →</button>`
          : `<button class="btn btn-submit" onclick="submitExam()">제출하기 ✓</button>`}
      </div>`;
    } else {
      if (q.condition) {
        html += `<div class="subj-condition"><div class="cond-title">📌 조건</div>${q.condition.replace(/\n/g,'<br>')}</div>`;
      }
      if (q.subfields) {
        html += `<div class="subj-area"><div class="subj-multi" id="subj-multi-${i}">`;
        q.subfields.forEach((sf, fi) => {
          html += `<div class="subj-row"><label>${sf.label}</label><input type="text" id="subj-${i}-${fi}" placeholder="${sf.placeholder}" oninput="saveSubjMulti(${i})"></div>`;
        });
        html += '</div></div>';
      } else {
        html += `<div class="subj-area"><textarea class="subj-textarea" id="subj-${i}" placeholder="답안을 작성하세요..." oninput="saveSubj(${i})"></textarea></div>`;
      }
      html += `<div class="btn-row">
        <button class="btn btn-prev" onclick="goTo(${i-1})" ${i===0?'style="visibility:hidden"':''}>← 이전</button>
        <button class="btn btn-reveal" onclick="revealAnswer(${i})">모범답안 확인</button>
        ${i < questions.length-1
          ? `<button class="btn btn-next" onclick="goTo(${i+1})">다음 →</button>`
          : `<button class="btn btn-submit" onclick="submitExam()">제출하기 ✓</button>`}
      </div>`;
    }
    html += `<div class="answer-panel" id="ans-panel-${i}">
      <div class="ans-title">✅ 정답 / 모범답안</div>
      <div class="ans-content" id="ans-content-${i}"></div>
      ${q.explain ? `<div class="ans-explain">💡 해설: ${q.explain}</div>` : ''}
    </div>`;
    card.innerHTML = html;
    container.appendChild(card);
    const dot = document.createElement('div');
    dot.className = 'nav-dot' + (q.type === 'subj' ? ' subj' : '');
    dot.id = 'navdot-' + i;
    dot.textContent = q.id;
    dot.onclick = () => goTo(i);
    nav.appendChild(dot);
  });
}

function goTo(idx) {
  if (idx < 0 || idx >= questions.length) return;
  document.querySelectorAll('.q-card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-dot').forEach(d => d.classList.remove('current'));
  document.getElementById('qcard-' + idx).classList.add('active');
  document.getElementById('navdot-' + idx).classList.add('current');
  currentQV = idx;
  const pct = Math.round(((idx+1)/questions.length)*100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = (idx+1) + ' / ' + questions.length;
  window.scrollTo(0,0);
}

function selectChoice(qIdx, choiceIdx) {
  if (checkedV[qIdx]) return;
  answersV[qIdx] = choiceIdx + 1;
  document.querySelectorAll(`#choices-${qIdx} .choice-item`).forEach((el,ci) => {
    el.classList.toggle('selected', ci === choiceIdx);
  });
  updateNavDot(qIdx);
}

function checkMC(qIdx) {
  if (answersV[qIdx] === undefined) { alert('답을 선택해주세요.'); return; }
  checkedV[qIdx] = true;
  const q = questions[qIdx];
  const chosen = answersV[qIdx] - 1;
  const correct = q.answer - 1;
  document.querySelectorAll(`#choices-${qIdx} .choice-item`).forEach((el,ci) => {
    el.classList.remove('selected');
    if (ci === correct) el.classList.add('correct');
    else if (ci === chosen) el.classList.add('wrong');
    el.style.cursor = 'default';
  });
  const panel = document.getElementById('ans-panel-' + qIdx);
  const content = document.getElementById('ans-content-' + qIdx);
  content.innerHTML = `정답: <strong>${q.answer}번</strong>`;
  panel.classList.add('show');
  updateNavDot(qIdx);
}

function revealAnswer(qIdx) {
  const q = questions[qIdx];
  const panel = document.getElementById('ans-panel-' + qIdx);
  const content = document.getElementById('ans-content-' + qIdx);
  content.innerHTML = q.modelAnswer;
  panel.classList.add('show');
  revealedV[qIdx] = true;
  updateNavDot(qIdx);
}

function saveSubj(qIdx) {
  const el = document.getElementById('subj-' + qIdx);
  answersV[qIdx] = el ? el.value : '';
  updateNavDot(qIdx);
}

function saveSubjMulti(qIdx) {
  const q = questions[qIdx];
  const parts = [];
  q.subfields.forEach((sf, fi) => {
    const el = document.getElementById(`subj-${qIdx}-${fi}`);
    if (el && el.value.trim()) parts.push(`${sf.label}: ${el.value.trim()}`);
  });
  answersV[qIdx] = parts.join(' / ');
  updateNavDot(qIdx);
}

function updateNavDot(qIdx) {
  const dot = document.getElementById('navdot-' + qIdx);
  if (!dot) return;
  if (answersV[qIdx] !== undefined && answersV[qIdx] !== '') dot.classList.add('answered');
}

function submitExam() {
  const unanswered = questions.filter((q,i) => answersV[i] === undefined || answersV[i] === '');
  if (unanswered.length > 0) {
    if (!confirm(`아직 ${unanswered.length}문항에 답하지 않았습니다. 그래도 제출하시겠습니까?`)) return;
  }
  let mcCorrect = 0, mcWrong = 0;
  const wrongItems = [];
  questions.filter(q => q.type === 'mc').forEach(q => {
    const qIdx = questions.indexOf(q);
    if (answersV[qIdx] === q.answer) mcCorrect++;
    else { mcWrong++; wrongItems.push({ id: q.id, myAns: answersV[qIdx] || '미응답', correct: q.answer }); }
  });
  const subjCount = questions.filter((q,i) => q.type === 'subj' && answersV[i] && answersV[i] !== '').length;
  const mcScore = mcCorrect * 3;
  document.getElementById('exam-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';
  document.getElementById('res-score').textContent = mcScore;
  document.getElementById('res-correct').textContent = mcCorrect;
  document.getElementById('res-wrong').textContent = mcWrong;
  document.getElementById('res-subj').textContent = subjCount;
  const wl = document.getElementById('wrong-list');
  if (wrongItems.length > 0) {
    wl.innerHTML = '<h3>❌ 선택형 오답 문항</h3>';
    wrongItems.forEach(w => {
      wl.innerHTML += `<div class="wrong-item"><span class="w-num">${w.id}번</span><span>내 답: ${w.myAns}번 → 정답: ${w.correct}번</span></div>`;
    });
  } else {
    wl.innerHTML = '<div style="text-align:center;padding:16px;color:#2e7d32;font-weight:700;">🎉 선택형 전부 정답!</div>';
  }
  sendToNotion(mcScore, wrongItems, subjCount);
}

async function sendToNotion(mcScore, wrongItems, subjCount) {
  const statusEl = document.getElementById('send-status');
  let wrongStr = `[선택형 점수: ${mcScore}점]\n`;
  if (wrongItems.length === 0) wrongStr += '선택형 오답 없음\n';
  else wrongItems.forEach(w => { wrongStr += `${w.id}번: 내 답 ${w.myAns}번 → 정답 ${w.correct}번\n`; });
  const subjQs = questions.filter(q => q.type === 'subj');
  let subjStr = '';
  subjQs.forEach(q => {
    const qIdx = questions.indexOf(q);
    const ans = answersV[qIdx] || '(미작성)';
    subjStr += `[서논술형 ${q.id}번]\n학생 답안: ${ans}\n모범답안: ${q.modelAnswer ? q.modelAnswer.replace(/<[^>]+>/g,'') : ''}\n\n`;
  });
  const payload = {
    studentName: studentNameV,
    school: studentSchoolV,
    grade: studentGradeV,
    workbook: '부산남고 1학년 NE능률 3·4과 모의고사 2회',
    category: '내신대비',
    submitDate: new Date().toISOString().slice(0,10),
    wrongAnswers: wrongStr,
    score: mcScore,
    clinicNote: subjStr
  };
  try {
    const res = await fetch(NOTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      statusEl.innerHTML = '';
      document.getElementById('result-screen').querySelector('.result-box').insertAdjacentHTML('beforeend',
        '<div class="send-ok">✅ 노션에 결과가 전송되었습니다!</div>');
    } else { throw new Error(); }
  } catch(e) {
    statusEl.innerHTML = '';
    document.getElementById('result-screen').querySelector('.result-box').insertAdjacentHTML('beforeend',
      '<div class="send-fail">⚠️ 노션 전송 실패. 선생님께 직접 제출해 주세요.</div>');
  }
}
</script>
