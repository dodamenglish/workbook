<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고2 2024-06 변형문제_30,32,33번</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap');

  :root {
    --bg: #f8f6f1;
    --surface: #ffffff;
    --surface2: #f2efe8;
    --border: #d8d0c0;
    --accent: #1a4c8a;
    --accent2: #2a6cb8;
    --gold: #b8860b;
    --text: #1a1a1a;
    --text2: #555;
    --correct: #1a6840;
    --wrong: #9b1c1c;
    --tag30: #1a4c8a;
    --tag32: #6b3a8a;
    --tag33: #1a6840;
    --radius: 8px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #e8e4dc 0%, #f5f2eb 50%, #ddd8cc 100%);
  }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 48px 40px;
    width: 380px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    text-align: center;
  }
  .login-school {
    font-family: 'Noto Serif KR', serif;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .login-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 32px;
  }
  .login-box label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text2);
    letter-spacing: 1px;
    text-align: left;
    margin-bottom: 6px;
  }
  .login-box input, .login-box select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    color: var(--text);
    background: var(--surface);
    margin-bottom: 18px;
    outline: none;
    transition: border-color 0.2s;
  }
  .login-box input:focus, .login-box select:focus {
    border-color: var(--accent);
  }
  .login-btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background 0.2s;
  }
  .login-btn:hover { background: var(--accent2); }

  /* ── MAIN APP ── */
  #app { display: none; min-height: 100vh; flex-direction: column; }

  /* Header */
  .app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-logo {
    font-family: 'Noto Serif KR', serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
  }
  .header-title {
    font-size: 13px;
    color: var(--text2);
    font-weight: 500;
  }
  .header-user {
    font-size: 13px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-user strong { color: var(--text); }

  /* Timer */
  .timer-bar {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .timer-display {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 2px;
  }
  .timer-display.urgent { color: var(--wrong); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
  .timer-label { font-size: 12px; color: var(--text2); }
  .progress-wrap { flex: 1; margin: 0 24px; }
  .progress-bar-bg {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.3s;
  }
  .progress-text { font-size: 11px; color: var(--text2); margin-top: 4px; }

  /* Tab nav */
  .tab-nav {
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    display: flex;
    padding: 0 24px;
    gap: 0;
  }
  .tab-btn {
    padding: 14px 24px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--text2);
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: color 0.2s, border-color 0.2s;
  }
  .tab-btn:hover { color: var(--accent); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn.done { color: var(--correct); }
  .tab-btn.done::after { content: ' ✓'; }
  .tab-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Question area */
  .question-area {
    flex: 1;
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
    padding: 32px 24px;
  }

  /* Question card */
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    box-shadow: var(--shadow);
  }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .q-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    background: var(--surface2);
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }
  .q-tag {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }
  .tag-30 { background: #e8f0fb; color: var(--tag30); border: 1px solid #c0d4f0; }
  .tag-32 { background: #f0e8fb; color: var(--tag32); border: 1px solid #d4c0f0; }
  .tag-33 { background: #e8f5ee; color: var(--tag33); border: 1px solid #c0e0cc; }
  .q-type {
    font-size: 11px;
    color: var(--text2);
    background: var(--surface2);
    padding: 3px 8px;
    border-radius: 4px;
  }

  .q-stem {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .q-passage {
    font-size: 14px;
    line-height: 1.9;
    color: var(--text);
    background: var(--surface2);
    border-left: 3px solid var(--accent);
    padding: 18px 20px;
    border-radius: 0 var(--radius) var(--radius) 0;
    margin-bottom: 20px;
  }
  .q-passage u { text-decoration: underline; text-underline-offset: 3px; }
  .q-passage .num-badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    background: var(--accent);
    color: #fff;
    padding: 1px 6px;
    border-radius: 3px;
    margin: 0 1px;
    vertical-align: middle;
  }

  /* MCQ options */
  .mcq-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .mcq-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    color: var(--text);
    text-align: left;
    line-height: 1.6;
    transition: border-color 0.15s, background 0.15s;
  }
  .mcq-btn:hover { border-color: var(--accent); background: #f0f4fa; }
  .mcq-btn.selected { border-color: var(--accent); background: #e8f0fb; }
  .mcq-btn.correct { border-color: var(--correct); background: #e8f5ee; }
  .mcq-btn.wrong { border-color: var(--wrong); background: #fdeaea; }
  .mcq-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    min-width: 22px;
    padding-top: 2px;
    color: var(--accent);
  }

  /* Short answer */
  .sa-group { margin-bottom: 16px; }
  .sa-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text2);
    margin-bottom: 6px;
    display: block;
  }
  .sa-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--surface);
    outline: none;
    transition: border-color 0.2s;
  }
  .sa-input:focus { border-color: var(--accent); }
  .sa-input.correct { border-color: var(--correct); background: #e8f5ee; }
  .sa-input.wrong { border-color: var(--wrong); background: #fdeaea; }
  .sa-input:disabled { background: var(--surface2); color: var(--text2); }

  /* Condition box */
  .condition-box {
    background: #fffbf0;
    border: 1px solid #e0cc88;
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: 13px;
    line-height: 1.8;
    color: var(--text);
  }
  .condition-box .cond-title {
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 6px;
    font-size: 12px;
    letter-spacing: 1px;
  }

  /* Answer box */
  .answer-box {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    line-height: 1.7;
    display: none;
  }
  .answer-box.show { display: block; }
  .answer-box.correct-box { background: #e8f5ee; border: 1px solid #a0d4b4; color: var(--correct); }
  .answer-box.wrong-box { background: #fdeaea; border: 1px solid #f0a0a0; color: var(--wrong); }
  .answer-box .ans-label { font-weight: 700; margin-bottom: 4px; }
  .answer-box .ans-explain { color: var(--text); font-size: 12.5px; margin-top: 6px; }

  /* Navigation */
  .q-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .nav-btn {
    padding: 10px 24px;
    border-radius: var(--radius);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    transition: all 0.2s;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .submit-tab-btn {
    padding: 12px 32px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: background 0.2s;
  }
  .submit-tab-btn:hover { background: var(--accent2); }
  .submit-tab-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Summary screen */
  #summary-screen {
    display: none;
    max-width: 860px;
    margin: 40px auto;
    padding: 0 24px;
  }
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .summary-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .summary-score {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 52px;
    font-weight: 600;
    color: var(--accent);
    margin: 24px 0 8px;
  }
  .summary-detail { font-size: 14px; color: var(--text2); margin-bottom: 32px; }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }
  .summary-stat {
    background: var(--surface2);
    border-radius: var(--radius);
    padding: 16px;
    border: 1px solid var(--border);
  }
  .summary-stat .stat-val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 28px;
    font-weight: 600;
  }
  .summary-stat .stat-label { font-size: 12px; color: var(--text2); margin-top: 4px; }
  .notion-status {
    font-size: 13px;
    color: var(--text2);
    padding: 12px;
    background: var(--surface2);
    border-radius: var(--radius);
    margin-bottom: 16px;
  }

  /* Dot nav */
  .dot-nav {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 16px 0;
    flex-wrap: wrap;
  }
  .dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    transition: all 0.15s;
    font-family: 'IBM Plex Mono', monospace;
  }
  .dot.answered { background: #dce8f8; border-color: var(--accent); color: var(--accent); }
  .dot.correct { background: #d4edda; border-color: var(--correct); color: var(--correct); }
  .dot.wrong { background: #fde8e8; border-color: var(--wrong); color: var(--wrong); }
  .dot.current { border-width: 2.5px; border-color: var(--accent); }

  /* Result overlay */
  .result-feedback {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%) scale(0.8);
    font-size: 64px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 999;
  }
  .result-feedback.show { opacity: 1; transform: translate(-50%,-50%) scale(1.2); }
  .result-feedback.hide { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }

  /* Table styles for Q8 */
  .q-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
  .q-table th { background: var(--accent); color: #fff; padding: 8px 12px; text-align: center; }
  .q-table td { border: 1px solid var(--border); padding: 8px 12px; text-align: center; }
  .q-table tr:nth-child(even) td { background: var(--surface2); }

  /* Inserted sentence highlight */
  .ins-sentence {
    background: #fff8e0;
    border: 1px solid #e0cc88;
    border-radius: 4px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 14px;
    font-style: italic;
    color: var(--text);
  }

  /* Bogieo box */
  .bogieo-box {
    background: #f0f4fa;
    border: 1px solid #c0d4f0;
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--text);
    line-height: 1.8;
  }
  .bogieo-box .bog-title { font-weight: 700; color: var(--accent); margin-bottom: 4px; font-size: 12px; }

  /* Multi-select (Q89) */
  .multi-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .multi-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
  }
  .multi-option:hover { border-color: var(--accent); }
  .multi-option.selected { border-color: var(--accent); background: #e8f0fb; }
  .multi-option input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }

  @media (max-width: 600px) {
    .question-area { padding: 16px 12px; }
    .q-card { padding: 20px 16px; }
    .summary-grid { grid-template-columns: 1fr; }
    .tab-btn { padding: 12px 14px; font-size: 12px; }
  }
</style>
</head>

// ════════════════════════════════════════════════════════════════════

// passage texts
const P30 = `Because people tend to adapt, interrupting positive things with negative ones can actually increase enjoyment. Take commercials. Most people hate them, so removing them should make shows or other entertainment more enjoyable. But the opposite is true. Shows are actually more enjoyable when they're broken up by annoying commercials. Because these less enjoyable moments break up adaptation to the positive experience of the show. Think about eating chocolate chips. The first chip is delicious: sweet, melt-in-your-mouth goodness. The second chip is also pretty good. But by the fourth, fifth, or tenth chip in a row, the goodness is no longer as pleasurable. We adapt. Interspersing positive experiences with less positive ones, however, can delay adaptation. Eating a Brussels sprout between chocolate chips or viewing commercials between parts of TV shows disrupts the process. The less positive moment makes the following positive one new again and thus more enjoyable.`;

const P32 = `If we've invested in something that hasn't repaid us — be it money in a failing venture, or time in an unhappy relationship — we find it very difficult to walk away. This is the sunk cost fallacy. Our instinct is to continue investing money or time as we hope that our investment will prove to be worthwhile in the end. Giving up would mean acknowledging that we've wasted something we can't get back, and that thought is so painful that we prefer to avoid it if we can. The problem, of course, is that if something really is a bad bet, then staying with it simply increases the amount we lose. Rather than walk away from a bad five-year relationship, for example, we turn it into a bad 10-year relationship; rather than accept that we've lost a thousand dollars, we lay down another thousand and lose that too. In the end, by delaying the pain of admitting our problem, we only add to it. Sometimes we just have to cut our losses.`;

const P33 = `On our little world, light travels, for all practical purposes, instantaneously. If a lightbulb is glowing, then of course it's physically where we see it, shining away. We reach out our hand and touch it: It's there all right, and unpleasantly hot. If the filament fails, then the light goes out. We don't see it in the same place, glowing, illuminating the room years after the bulb breaks and it's removed from its socket. The very notion seems nonsensical. But if we're far enough away, an entire sun can go out and we'll continue to see it shining brightly; we won't learn of its death, it may be, for ages to come — in fact, for how long it takes light, which travels fast but not infinitely fast, to cross the intervening vastness. The immense distances to the stars and the galaxies mean that we see everything in space in the past.`;

// ════════════════════════════════════════════════════════════════════
//  APP STATE
// ════════════════════════════════════════════════════════════════════
let studentName = '';
let studentGrade = '';
let currentTab = 0;
let currentQIdx = 0; // index within current tab
let timerInterval = null;
let timeLeft = 1800; // 30 min
let tabSubmitted = [false, false, false, false];
let tabAnswers = [[],[],[],[]]; // per tab, per question: {given, correct}
let tabStarted = [false, false, false, false];

function getTabQuestions(tab) {
  return QUESTIONS.filter(q => q.tab === tab);
}

// ════════════════════════════════════════════════════════════════════
//  LOGIN
// ════════════════════════════════════════════════════════════════════
function doLogin() {
  const n = document.getElementById('inp-name').value.trim();
  const g = document.getElementById('inp-grade').value;
  if (!n) { alert('이름을 입력해주세요.'); return; }
  if (!g) { alert('학년을 선택해주세요.'); return; }
  studentName = n; studentGrade = g;
  document.getElementById('disp-name').innerHTML = `<strong>${n}</strong>`;
  document.getElementById('disp-grade').textContent = g;
  document.getElementById('login-screen').style.display = 'none';
  const app = document.getElementById('app');
  app.style.display = 'flex';
  // init tab answers
  for (let t = 0; t < 4; t++) {
    const qs = getTabQuestions(t);
    tabAnswers[t] = qs.map(() => ({ given: null, correct: null, submitted: false }));
  }
  switchTab(0);
}

// ════════════════════════════════════════════════════════════════════
//  TAB SWITCHING
// ════════════════════════════════════════════════════════════════════
function switchTab(t) {
  if (tabSubmitted[currentTab] === false && tabStarted[currentTab]) {
    // allow switching freely
  }
  currentTab = t;
  currentQIdx = 0;
  // update tab buttons
  for (let i = 0; i < 4; i++) {
    const btn = document.getElementById('tab' + i);
    btn.classList.remove('active');
    if (tabSubmitted[i]) btn.classList.add('done');
    else btn.classList.remove('done');
  }
  document.getElementById('tab' + t).classList.add('active');
  // start timer if not started
  if (!tabStarted[t]) {
    tabStarted[t] = true;
    startTimer(t);
  } else if (!tabSubmitted[t]) {
    // resume (timer already going)
  }
  renderCurrentQuestion();
  updateProgress();
}

// ════════════════════════════════════════════════════════════════════
//  TIMER
// ════════════════════════════════════════════════════════════════════
let tabTimers = [1800, 1800, 1800, 1800];
let tabTimerIntervals = [null, null, null, null];

function startTimer(t) {
  tabTimers[t] = 1800;
  if (tabTimerIntervals[t]) clearInterval(tabTimerIntervals[t]);
  tabTimerIntervals[t] = setInterval(() => {
    if (currentTab !== t) return;
    tabTimers[t]--;
    renderTimer(t);
    if (tabTimers[t] <= 0) {
      clearInterval(tabTimerIntervals[t]);
      autoSubmitTab(t);
    }
  }, 1000);
  renderTimer(t);
}

function renderTimer(t) {
  if (currentTab !== t) return;
  const s = tabTimers[t];
  const m = Math.floor(s / 60);
  const sec = s % 60;
  const disp = document.getElementById('timer-display');
  if (!disp) return;
  disp.textContent = `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  disp.classList.toggle('urgent', s <= 300);
}

// ════════════════════════════════════════════════════════════════════
//  RENDER QUESTION
// ════════════════════════════════════════════════════════════════════
function renderCurrentQuestion() {
  const qs = getTabQuestions(currentTab);
  const q = qs[currentQIdx];
  const area = document.getElementById('q-card-area');
  const submitted = tabSubmitted[currentTab];
  const ans = tabAnswers[currentTab][currentQIdx];

  // dot nav
  renderDotNav(qs);

  // progress
  updateProgress();

  let html = `<div class="q-card">`;
  html += `<div class="q-meta">
    <div class="q-num">Q${q.qn}</div>
    <div class="q-tag tag-${q.src.replace('번','').replace('종합','30')}">${q.src}</div>
    <div class="q-type">${q.type}</div>
  </div>`;
  html += `<div class="q-stem">${q.stem}</div>`;

  if (q.ins) {
    html += `<div class="ins-sentence">주어진 문장: ${q.ins}</div>`;
  }
  if (q.passage) {
    html += `<div class="q-passage">${q.passage}</div>`;
  }
  if (q.extra) {
    html += q.extra;
  }

  // MCQ
  if (q.kind === 'mcq') {
    html += `<div class="mcq-options">`;
    q.options.forEach((opt, i) => {
      let cls = 'mcq-btn';
      if (submitted) {
        const givenVal = ans.given;
        const correctVal = q.answer;
        if (opt === correctVal) cls += ' correct';
        else if (opt === givenVal && givenVal !== correctVal) cls += ' wrong';
      } else {
        if (ans.given === opt) cls += ' selected';
      }
      html += `<button class="${cls}" onclick="selectMCQ('${opt.replace(/'/g,"\\'")}', ${i})" ${submitted?'disabled':''}>${opt}</button>`;
    });
    html += `</div>`;

    if (submitted) {
      const isCorrect = ans.given === q.answer;
      html += `<div class="answer-box show ${isCorrect?'correct-box':'wrong-box'}">
        <div class="ans-label">${isCorrect ? '✓ 정답입니다!' : '✗ 오답입니다'}</div>
        <div>정답: <strong>${q.answer}</strong> ${ans.given && ans.given !== q.answer ? `/ 내 답: ${ans.given}` : ''}</div>
        <div class="ans-explain">${q.explain || ''}</div>
      </div>`;
    }
  }

  // Essay 1 (single input)
  if (q.kind === 'essay1') {
    const val = ans.given || '';
    html += `<div class="sa-group">
      <label class="sa-label">${q.label || '정답:'}</label>
      <input type="text" class="sa-input ${submitted ? (ans.correct ? 'correct' : 'wrong') : ''}"
        id="essay-inp-0" value="${val.replace(/"/g,'&quot;')}" ${submitted?'disabled':''}
        placeholder="영어로 작성하세요" oninput="saveEssay(0, this.value)">
    </div>`;
    if (submitted) {
      html += `<div class="answer-box show ${ans.correct ? 'correct-box' : 'wrong-box'}">
        <div class="ans-label">${ans.correct ? '✓ 핵심 키워드 포함 — 정답!' : '✗ 핵심 키워드 부족'}</div>
        <div>모범 답안: <strong>${q.answer}</strong></div>
      </div>`;
    }
  }

  // Essay 2 (multiple short inputs)
  if (q.kind === 'essay2') {
    const givenArr = ans.given || [];
    q.labels.forEach((lbl, i) => {
      const v = givenArr[i] || '';
      const isC = submitted ? (ans.correct ? ans.correct[i] : false) : false;
      html += `<div class="sa-group">
        <label class="sa-label">${lbl}</label>
        <input type="text" class="sa-input ${submitted ? (isC ? 'correct' : 'wrong') : ''}"
          id="essay-inp-${i}" value="${v.replace(/"/g,'&quot;')}" ${submitted?'disabled':''}
          placeholder="답을 입력하세요" oninput="saveEssayMulti(${i}, this.value)">
      </div>`;
    });
    if (submitted) {
      const correctArr = ans.correct || [];
      html += `<div class="answer-box show ${correctArr.every(c=>c) ? 'correct-box' : 'wrong-box'}">
        <div class="ans-label">모범 답안</div>
        ${q.answers.map((a,i) => `<div>${q.labels[i]}: <strong>${a}</strong></div>`).join('')}
      </div>`;
    }
  }

  // Essay 3 (어법교정: 3 inputs)
  if (q.kind === 'essay3') {
    const givenArr = ans.given || [];
    const correctArr = ans.correct || [];
    q.labels.forEach((lbl, i) => {
      const v = givenArr[i] || '';
      const isC = submitted ? (correctArr[i] !== undefined ? correctArr[i] : false) : false;
      html += `<div class="sa-group">
        <label class="sa-label">${lbl}</label>
        <input type="text" class="sa-input ${submitted ? (isC ? 'correct' : 'wrong') : ''}"
          id="essay-inp-${i}" value="${v.replace(/"/g,'&quot;')}" ${submitted?'disabled':''}
          placeholder="${i===0?'기호 입력 (예: ⓐ)': i===1?'영어로 입력':'한국어로 서술'}"
          oninput="saveEssayThree(${i}, this.value)">
      </div>`;
    });
    if (submitted) {
      const allC = correctArr.every(c => c);
      html += `<div class="answer-box show ${allC ? 'correct-box' : 'wrong-box'}">
        <div class="ans-label">모범 답안</div>
        ${q.answers.map((a,i) => `<div>${q.labels[i]}: <strong>${a}</strong></div>`).join('')}
      </div>`;
    }
  }

  // Navigation
  html += `<div class="q-nav">
    <button class="nav-btn" onclick="goQ(-1)" ${currentQIdx===0?'disabled':''}>◀ 이전</button>
    <span style="font-size:13px;color:var(--text2)">${currentQIdx+1} / ${qs.length}</span>`;

  if (currentQIdx === qs.length - 1 && !submitted) {
    html += `<button class="submit-tab-btn" onclick="confirmSubmitTab()">제출하기 ▶</button>`;
  } else if (currentQIdx === qs.length - 1 && submitted) {
    html += `<button class="nav-btn" onclick="showTabSummary()" style="color:var(--accent);border-color:var(--accent);">결과 보기</button>`;
  } else {
    html += `<button class="nav-btn" onclick="goQ(1)">다음 ▶</button>`;
  }
  html += `</div></div>`;

  area.innerHTML = html;
}

function goQ(dir) {
  const qs = getTabQuestions(currentTab);
  currentQIdx = Math.max(0, Math.min(qs.length - 1, currentQIdx + dir));
  renderCurrentQuestion();
}

function renderDotNav(qs) {
  const nav = document.getElementById('dot-nav');
  let html = '';
  qs.forEach((q, i) => {
    const ans = tabAnswers[currentTab][i];
    const submitted = tabSubmitted[currentTab];
    let cls = 'dot';
    if (i === currentQIdx) cls += ' current';
    if (submitted) {
      cls += ans.correct === true || (Array.isArray(ans.correct) && ans.correct.every(c=>c)) ? ' correct' : (ans.given ? ' wrong' : '');
    } else if (ans.given !== null && ans.given !== undefined && ans.given !== '') cls += ' answered';
    html += `<div class="${cls}" onclick="jumpQ(${i})" title="Q${q.qn}">${q.qn}</div>`;
  });
  nav.innerHTML = html;
}

function jumpQ(i) {
  currentQIdx = i;
  renderCurrentQuestion();
}

function updateProgress() {
  const qs = getTabQuestions(currentTab);
  const answered = tabAnswers[currentTab].filter(a => a.given !== null && a.given !== undefined && a.given !== '' && (Array.isArray(a.given) ? a.given.some(v=>v) : true)).length;
  document.getElementById('progress-fill').style.width = (answered / qs.length * 100) + '%';
  document.getElementById('progress-text').textContent = `${answered} / ${qs.length} 문항 답변`;
}

// ════════════════════════════════════════════════════════════════════
//  ANSWER SAVING
// ════════════════════════════════════════════════════════════════════
function selectMCQ(val, idx) {
  tabAnswers[currentTab][currentQIdx].given = val;
  updateProgress();
  renderCurrentQuestion();
}

function saveEssay(idx, val) {
  tabAnswers[currentTab][currentQIdx].given = val;
  updateProgress();
}

function saveEssayMulti(idx, val) {
  let given = tabAnswers[currentTab][currentQIdx].given;
  if (!Array.isArray(given)) given = [];
  given[idx] = val;
  tabAnswers[currentTab][currentQIdx].given = given;
  updateProgress();
}

function saveEssayThree(idx, val) {
  saveEssayMulti(idx, val);
}

// ════════════════════════════════════════════════════════════════════
//  GRADING
// ════════════════════════════════════════════════════════════════════
function gradeTab(t) {
  const qs = getTabQuestions(t);
  qs.forEach((q, i) => {
    const ans = tabAnswers[t][i];
    if (q.kind === 'mcq') {
      ans.correct = (ans.given === q.answer);
    } else if (q.kind === 'essay1') {
      const given = (ans.given || '').toLowerCase().trim();
      ans.correct = (q.keywords || []).every(kw => given.includes(kw.toLowerCase()));
    } else if (q.kind === 'essay2') {
      const givenArr = ans.given || [];
      ans.correct = q.keywords.map((kwArr, idx) => {
        const g = (givenArr[idx] || '').toLowerCase().trim();
        return kwArr.every(kw => g.includes(kw.toLowerCase()));
      });
    } else if (q.kind === 'essay3') {
      const givenArr = ans.given || [];
      ans.correct = q.keywords.map((kwArr, idx) => {
        const g = (givenArr[idx] || '').toLowerCase().trim();
        return kwArr.every(kw => g.includes(kw.toLowerCase()));
      });
    }
  });
}

function calcScore(t) {
  const qs = getTabQuestions(t);
  let correct = 0;
  qs.forEach((q, i) => {
    const ans = tabAnswers[t][i];
    if (q.kind === 'mcq') {
      if (ans.correct === true) correct++;
    } else {
      const c = ans.correct;
      if (Array.isArray(c)) { if (c.every(x=>x)) correct++; }
      else if (c === true) correct++;
    }
  });
  return { correct, total: qs.length, score: Math.round(correct / qs.length * 100) };
}

// ════════════════════════════════════════════════════════════════════
//  SUBMIT
// ════════════════════════════════════════════════════════════════════
function confirmSubmitTab() {
  const qs = getTabQuestions(currentTab);
  const answered = tabAnswers[currentTab].filter(a => {
    if (!a.given) return false;
    if (Array.isArray(a.given)) return a.given.some(v=>v);
    return true;
  }).length;
  const unanswered = qs.length - answered;
  let msg = `${currentTab+1}회차를 제출하시겠습니까?`;
  if (unanswered > 0) msg += `\n\n미답변 ${unanswered}문항은 오답 처리됩니다.`;
  if (confirm(msg)) submitTab(currentTab);
}

function autoSubmitTab(t) {
  if (tabSubmitted[t]) return;
  alert(`${t+1}회차 시간이 종료되었습니다. 자동 제출합니다.`);
  submitTab(t);
}

function submitTab(t) {
  gradeTab(t);
  tabSubmitted[t] = true;
  // clear timer
  if (tabTimerIntervals[t]) { clearInterval(tabTimerIntervals[t]); tabTimerIntervals[t] = null; }
  document.getElementById('tab' + t).classList.add('done');
  sendToNotion(t);
  renderCurrentQuestion();
  showTabSummary();
}

// ════════════════════════════════════════════════════════════════════
//  NOTION SUBMIT
// ════════════════════════════════════════════════════════════════════
function sendToNotion(t) {
  const qs = getTabQuestions(t);
  const sc = calcScore(t);
  const roundLabel = `${t+1}회차 (${t*25+1}~${t*25+25}번)`;

  let wrongLines = [`[점수: ${sc.score}점 (${sc.correct}/${sc.total})]`];
  qs.forEach((q, i) => {
    const ans = tabAnswers[t][i];
    const isCorrect = q.kind === 'mcq' ? ans.correct === true
      : Array.isArray(ans.correct) ? ans.correct.every(x=>x) : ans.correct === true;
    const givenStr = Array.isArray(ans.given) ? ans.given.join(' / ') : (ans.given || '미답변');
    const status = isCorrect ? '✓' : '✗';
    wrongLines.push(`${status} Q${q.qn}[${q.src}] ${q.type} | 학생답: ${givenStr} | 정답: ${Array.isArray(q.answers) ? q.answers.join(' / ') : q.answer}`);
  });

  const payload = {
    studentName,
    school: '명호고',
    grade: studentGrade,
    workbook: '고2 2024-06 변형문제_30,32,33번',
    category: roundLabel,
    submitDate: new Date().toISOString().split('T')[0],
    wrongAnswers: wrongLines.join('\n'),
    score: sc.score
  };

  fetch('https://dodamenglish.netlify.app/.netlify/functions/notion', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(err => console.error('Notion 전송 오류:', err));
}

// ════════════════════════════════════════════════════════════════════
//  SUMMARY
// ════════════════════════════════════════════════════════════════════
function showTabSummary() {
  const t = currentTab;
  const sc = calcScore(t);
  const qs = getTabQuestions(t);
  const wrongList = qs.filter((q, i) => {
    const ans = tabAnswers[t][i];
    if (q.kind === 'mcq') return ans.correct !== true;
    if (Array.isArray(ans.correct)) return !ans.correct.every(x=>x);
    return ans.correct !== true;
  });

  const screen = document.getElementById('summary-screen');
  let html = `<div class="summary-card">
    <div class="summary-title">${t+1}회차 결과</div>
    <div style="color:var(--text2);font-size:13px;">${studentName} · ${studentGrade}</div>
    <div class="summary-score">${sc.score}<span style="font-size:24px;">점</span></div>
    <div class="summary-detail">${sc.correct}문항 정답 / ${sc.total}문항</div>
    <div class="summary-grid">
      <div class="summary-stat"><div class="stat-val" style="color:var(--correct)">${sc.correct}</div><div class="stat-label">정답</div></div>
      <div class="summary-stat"><div class="stat-val" style="color:var(--wrong)">${sc.total - sc.correct}</div><div class="stat-label">오답</div></div>
      <div class="summary-stat"><div class="stat-val">${sc.score}</div><div class="stat-label">점수</div></div>
    </div>`;

  if (wrongList.length > 0) {
    html += `<div style="text-align:left;margin-bottom:16px;"><div style="font-weight:700;font-size:13px;margin-bottom:8px;color:var(--wrong);">오답 목록</div>`;
    wrongList.forEach(q => {
      html += `<div style="font-size:12px;padding:6px 10px;border-left:3px solid var(--wrong);margin-bottom:6px;background:#fdeaea;border-radius:0 4px 4px 0;">Q${q.qn} [${q.src}] ${q.type}</div>`;
    });
    html += `</div>`;
  }

  html += `<div class="notion-status">📤 오답 데이터가 도담T에게 전송되었습니다.</div>`;
  html += `<button class="nav-btn" style="margin-top:8px;" onclick="backToQuestions()">문제로 돌아가기</button>`;
  html += `</div>`;

  screen.innerHTML = html;
  document.getElementById('question-area').style.display = 'none';
  screen.style.display = 'block';
}

function backToQuestions() {
  document.getElementById('question-area').style.display = 'block';
  document.getElementById('summary-screen').style.display = 'none';
  currentQIdx = 0;
  renderCurrentQuestion();
}
</script>
