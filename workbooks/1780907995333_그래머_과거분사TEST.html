<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>불규칙 동사 과거분사 퀴즈 | 도담한영어교실</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Montserrat:wght@600;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a5c8a;
    --primary-light: #2b7ab5;
    --accent: #f0a500;
    --accent-light: #ffd166;
    --success: #2ecc71;
    --error: #e74c3c;
    --bg: #f4f8fc;
    --card: #ffffff;
    --text: #1a2a3a;
    --text-muted: #5a7a9a;
    --border: #d0e0ef;
    --shadow: 0 4px 20px rgba(26,92,138,0.10);
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: var(--primary);
    color: white;
    padding: 18px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(26,92,138,0.25);
  }
  .header-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 1.25rem;
    letter-spacing: -0.5px;
  }
  .header-sub { font-size: 0.78rem; opacity: 0.8; margin-top: 2px; }

  /* ── TIMER ── */
  .timer-box {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 10px;
    padding: 8px 20px;
    text-align: center;
    min-width: 110px;
  }
  .timer-label { font-size: 0.68rem; opacity: 0.8; letter-spacing: 1px; text-transform: uppercase; }
  .timer-time {
    font-family: 'Fira Code', monospace;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .timer-time.warn { color: var(--accent-light); }
  .timer-time.danger { color: #ff6b6b; animation: blink 0.8s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── SCREENS ── */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ── LOGIN ── */
  .login-wrap {
    display: flex; align-items: center; justify-content: center;
    min-height: calc(100vh - 70px);
    padding: 30px 16px;
  }
  .login-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 40px 36px;
    width: 100%; max-width: 420px;
    border-top: 5px solid var(--primary);
  }
  .login-card h2 {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.4rem;
    color: var(--primary);
    margin-bottom: 6px;
  }
  .login-card p { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 28px; }
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 7px;
    letter-spacing: 0.5px;
  }
  .form-group input, .form-group select {
    width: 100%;
    border: 2px solid var(--border);
    border-radius: 9px;
    padding: 11px 14px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.95rem;
    color: var(--text);
    background: #f8fafd;
    transition: border-color 0.2s;
    outline: none;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--primary); background: #fff; }

  .btn {
    display: inline-block;
    padding: 13px 28px;
    border: none;
    border-radius: 10px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
  }
  .btn-primary { background: var(--primary); color: white; width: 100%; margin-top: 6px; }
  .btn-primary:hover { background: var(--primary-light); transform: translateY(-1px); }
  .btn-shuffle {
    background: var(--accent);
    color: #1a2a3a;
    font-size: 0.9rem;
    padding: 10px 20px;
  }
  .btn-shuffle:hover { background: var(--accent-light); }
  .btn-submit {
    background: var(--primary);
    color: white;
    font-size: 0.95rem;
    padding: 12px 30px;
  }
  .btn-submit:hover { background: var(--primary-light); }
  .btn-retry {
    background: #e8f4fd;
    color: var(--primary);
    font-size: 0.9rem;
    padding: 11px 24px;
    border: 2px solid var(--primary);
  }
  .btn-retry:hover { background: #d0e8f8; }

  /* ── QUIZ ── */
  .quiz-wrap { max-width: 860px; margin: 0 auto; padding: 28px 16px 40px; }
  .quiz-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .quiz-meta-info { font-size: 0.88rem; color: var(--text-muted); }
  .quiz-meta-info strong { color: var(--primary); }
  .quiz-controls { display: flex; gap: 10px; align-items: center; }

  .progress-bar-wrap {
    background: var(--border);
    border-radius: 10px;
    height: 7px;
    margin-bottom: 22px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    border-radius: 10px;
    transition: width 0.4s;
  }

  /* Question grid */
  .question-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 28px;
  }
  @media (max-width: 600px) { .question-grid { grid-template-columns: 1fr; } }

  .q-card {
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(26,92,138,0.07);
    border: 2px solid var(--border);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.2s;
  }
  .q-card:focus-within { border-color: var(--primary); }
  .q-card.correct { border-color: var(--success); background: #f0faf4; }
  .q-card.wrong { border-color: var(--error); background: #fff4f4; }

  .q-num {
    font-family: 'Fira Code', monospace;
    font-size: 0.8rem;
    color: var(--text-muted);
    min-width: 24px;
    font-weight: 600;
  }
  .q-verb {
    flex: 1;
  }
  .q-base {
    font-family: 'Fira Code', monospace;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text);
    display: block;
  }
  .q-meaning {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .q-past {
    font-size: 0.78rem;
    color: #888;
    margin-top: 1px;
    font-family: 'Fira Code', monospace;
  }
  .q-input-wrap { display: flex; flex-direction: column; align-items: flex-end; min-width: 130px; }
  .q-input {
    width: 130px;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: 'Fira Code', monospace;
    font-size: 0.95rem;
    color: var(--text);
    background: #f8fafd;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
  }
  .q-input:focus { border-color: var(--primary); background: #fff; }
  .q-input.correct { border-color: var(--success); background: #f0faf4; color: #1a7a3a; }
  .q-input.wrong { border-color: var(--error); background: #fff4f4; color: var(--error); }
  .q-answer-hint {
    font-size: 0.73rem;
    color: var(--success);
    margin-top: 4px;
    font-family: 'Fira Code', monospace;
    display: none;
  }
  .q-answer-hint.show { display: block; }
  .q-answer-hint.wrong-hint { color: var(--error); }

  /* ── SUBMIT AREA ── */
  .submit-area {
    text-align: center;
    padding: 10px 0 0;
  }

  /* ── RESULT ── */
  .result-wrap {
    display: flex; align-items: center; justify-content: center;
    min-height: calc(100vh - 70px);
    padding: 30px 16px;
  }
  .result-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 40px 36px;
    width: 100%; max-width: 560px;
    border-top: 5px solid var(--primary);
    text-align: center;
  }
  .result-emoji { font-size: 3.5rem; margin-bottom: 12px; }
  .result-score {
    font-family: 'Montserrat', sans-serif;
    font-size: 3.2rem;
    font-weight: 800;
    color: var(--primary);
    margin-bottom: 4px;
  }
  .result-label { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px; }
  .result-stats {
    display: flex; gap: 12px; justify-content: center; margin-bottom: 24px;
  }
  .stat-chip {
    background: #f4f8fc;
    border-radius: 30px;
    padding: 8px 18px;
    font-size: 0.85rem;
    font-weight: 700;
    border: 2px solid var(--border);
  }
  .stat-chip.ok { border-color: var(--success); color: var(--success); background: #f0faf4; }
  .stat-chip.bad { border-color: var(--error); color: var(--error); background: #fff4f4; }

  .wrong-list {
    text-align: left;
    margin-bottom: 24px;
  }
  .wrong-list h4 {
    font-size: 0.88rem;
    color: var(--error);
    font-weight: 700;
    margin-bottom: 10px;
    border-bottom: 2px solid #ffd0d0;
    padding-bottom: 6px;
  }
  .wrong-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    background: #fff4f4;
    margin-bottom: 6px;
    font-size: 0.87rem;
    font-family: 'Fira Code', monospace;
  }
  .wrong-verb { color: var(--text); font-weight: 600; }
  .wrong-arrow { color: var(--text-muted); }
  .wrong-user { color: var(--error); text-decoration: line-through; }
  .wrong-correct { color: var(--success); font-weight: 700; }

  .notion-status {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 16px;
    min-height: 20px;
  }
  .notion-status.sending { color: var(--primary-light); }
  .notion-status.sent { color: var(--success); }
  .notion-status.err { color: var(--error); }

  .result-btns { display: flex; gap: 12px; justify-content: center; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div>
    <div class="header-title">📚 불규칙 동사 과거분사 퀴즈</div>
    <div class="header-sub">도담한영어교실 | 원형 → 과거분사</div>
  </div>
  <div class="timer-box" id="timerBox" style="display:none;">
    <div class="timer-label">남은 시간</div>
    <div class="timer-time" id="timerDisplay">25:00</div>
  </div>
</div>

<!-- ── SCREEN 1: LOGIN ── -->
<div class="screen active" id="screenLogin">
  <div class="login-wrap">
    <div class="login-card">
      <h2>🔐 학생 정보 입력</h2>
      <p>이름, 학교, 학년을 입력하고 시험을 시작하세요.</p>
      <div class="form-group">
        <label>이름</label>
        <input type="text" id="inputName" placeholder="홍길동" autocomplete="off">
      </div>
      <div class="form-group">
        <label>학교</label>
        <input type="text" id="inputSchool" placeholder="예) 도담중학교" autocomplete="off">
      </div>
      <div class="form-group">
        <label>학년</label>
        <select id="inputGrade">
          <option value="">선택하세요</option>
          <option value="중1">중학교 1학년</option>
          <option value="중2">중학교 2학년</option>
          <option value="중3">중학교 3학년</option>
          <option value="고1">고등학교 1학년</option>
          <option value="고2">고등학교 2학년</option>
          <option value="고3">고등학교 3학년</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="startQuiz()">시험 시작 →</button>
    </div>
  </div>
</div>

<!-- ── SCREEN 2: QUIZ ── -->
<div class="screen" id="screenQuiz">
  <div class="quiz-wrap">
    <div class="quiz-meta">
      <div class="quiz-meta-info">
        <strong id="metaName">-</strong> · <span id="metaSchool">-</span> · <span id="metaGrade">-</span>
        &nbsp;|&nbsp; 총 <strong>30</strong>문항 · 과거분사 입력
      </div>
      <div class="quiz-controls">
        <button class="btn btn-shuffle" onclick="shuffleQuestions()">🔀 문제 섞기</button>
      </div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
    </div>
    <div class="question-grid" id="questionGrid"></div>
    <div class="submit-area">
      <button class="btn btn-submit" onclick="submitQuiz()">✅ 채점하기</button>
    </div>
  </div>
</div>

<!-- ── SCREEN 3: RESULT ── -->
<div class="screen" id="screenResult">
  <div class="result-wrap">
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji">🎉</div>
      <div class="result-score" id="resultScore">0점</div>
      <div class="result-label" id="resultLabel">30문항 중 0개 정답</div>
      <div class="result-stats">
        <div class="stat-chip ok" id="statCorrect">✅ 정답 0</div>
        <div class="stat-chip bad" id="statWrong">❌ 오답 0</div>
      </div>
      <div class="wrong-list" id="wrongList"></div>
      <div class="notion-status" id="notionStatus"></div>
      <div class="result-btns">
        <button class="btn btn-retry" onclick="retryQuiz()">🔀 다시 풀기</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── DATA: 100 irregular verbs ──
const ALL_VERBS = [
  {base:"arise",    past:"arose",      pp:"arisen",           meaning:"일어나다"},
  {base:"be",       past:"was/were",   pp:"been",             meaning:"이다, ~있다"},
  {base:"bend",     past:"bent",       pp:"bent",             meaning:"구부리다"},
  {base:"bear",     past:"bore",       pp:"born",             meaning:"낳다, 참다"},
  {base:"become",   past:"became",     pp:"become",           meaning:"~되다"},
  {base:"begin",    past:"began",      pp:"begun",            meaning:"시작하다"},
  {base:"bind",     past:"bound",      pp:"bound",            meaning:"묶다"},
  {base:"bite",     past:"bit",        pp:"bit",              meaning:"물다"},
  {base:"blow",     past:"blew",       pp:"blown",            meaning:"불다"},
  {base:"break",    past:"broke",      pp:"broken",           meaning:"부수다, 깨뜨리다"},
  {base:"bring",    past:"brought",    pp:"brought",          meaning:"가져오다"},
  {base:"build",    past:"built",      pp:"built",            meaning:"짓다, 건설하다"},
  {base:"buy",      past:"bought",     pp:"bought",           meaning:"사다"},
  {base:"cast",     past:"cast",       pp:"cast",             meaning:"던지다"},
  {base:"catch",    past:"caught",     pp:"caught",           meaning:"잡다"},
  {base:"choose",   past:"chose",      pp:"chosen",           meaning:"선택하다"},
  {base:"come",     past:"came",       pp:"come",             meaning:"오다"},
  {base:"cost",     past:"cost",       pp:"cost",             meaning:"비용이 들다"},
  {base:"cut",      past:"cut",        pp:"cut",              meaning:"베다, 자르다"},
  {base:"dig",      past:"dug",        pp:"dug",              meaning:"파다"},
  {base:"do",       past:"did",        pp:"done",             meaning:"~을 하다"},
  {base:"draw",     past:"drew",       pp:"drawn",            meaning:"그리다"},
  {base:"drink",    past:"drank",      pp:"drunk",            meaning:"마시다"},
  {base:"drive",    past:"drove",      pp:"driven",           meaning:"운전하다"},
  {base:"eat",      past:"ate",        pp:"eaten",            meaning:"먹다"},
  {base:"fall",     past:"fell",       pp:"fallen",           meaning:"떨어지다"},
  {base:"feel",     past:"felt",       pp:"felt",             meaning:"느끼다"},
  {base:"fight",    past:"fought",     pp:"fought",           meaning:"싸우다"},
  {base:"find",     past:"found",      pp:"found",            meaning:"발견하다"},
  {base:"fly",      past:"flew",       pp:"flown",            meaning:"날다"},
  {base:"forget",   past:"forgot",     pp:"forgotten",        meaning:"잊어버리다", ppAlt:["forgot"]},
  {base:"forgive",  past:"forgave",    pp:"forgiven",         meaning:"용서하다"},
  {base:"freeze",   past:"froze",      pp:"frozen",           meaning:"얼다"},
  {base:"get",      past:"got",        pp:"got",              meaning:"얻다, 사다", ppAlt:["gotten"]},
  {base:"give",     past:"gave",       pp:"given",            meaning:"주다"},
  {base:"go",       past:"went",       pp:"gone",             meaning:"가다"},
  {base:"grow",     past:"grew",       pp:"grown",            meaning:"자라다"},
  {base:"hang",     past:"hung/hanged",pp:"hung",             meaning:"매달다, 걸다", ppAlt:["hanged"]},
  {base:"have",     past:"had",        pp:"had",              meaning:"가지다"},
  {base:"hear",     past:"heard",      pp:"heard",            meaning:"듣다"},
  {base:"hide",     past:"hid",        pp:"hidden",           meaning:"숨다", ppAlt:["hid"]},
  {base:"hit",      past:"hit",        pp:"hit",              meaning:"때리다, 치다"},
  {base:"hold",     past:"held",       pp:"held",             meaning:"붙잡다"},
  {base:"hurt",     past:"hurt",       pp:"hurt",             meaning:"다치다"},
  {base:"keep",     past:"kept",       pp:"kept",             meaning:"지키다, 간직하다"},
  {base:"know",     past:"knew",       pp:"known",            meaning:"알다"},
  {base:"lay",      past:"laid",       pp:"laid",             meaning:"(알 등을) 낳다"},
  {base:"lead",     past:"led",        pp:"led",              meaning:"이끌다, 지도하다"},
  {base:"leave",    past:"left",       pp:"left",             meaning:"떠나다, 남겨두다"},
  {base:"lend",     past:"lent",       pp:"lent",             meaning:"빌려주다"},
  {base:"let",      past:"let",        pp:"let",              meaning:"시키다"},
  {base:"lie",      past:"lay",        pp:"lain",             meaning:"눕다"},
  {base:"lose",     past:"lost",       pp:"lost",             meaning:"(경기에)지다, 잃다"},
  {base:"make",     past:"made",       pp:"made",             meaning:"만들다"},
  {base:"mean",     past:"meant",      pp:"meant",            meaning:"~을 의미하다"},
  {base:"meet",     past:"met",        pp:"met",              meaning:"만나다"},
  {base:"mistake",  past:"mistook",    pp:"mistaken",         meaning:"실수하다"},
  {base:"pay",      past:"paid",       pp:"paid",             meaning:"(돈을) 지불하다"},
  {base:"put",      past:"put",        pp:"put",              meaning:"두다, 놓다, 넣다"},
  {base:"read",     past:"read",       pp:"read",             meaning:"읽다"},
  {base:"ride",     past:"rode",       pp:"ridden",           meaning:"(말, 자전거를) 타다"},
  {base:"ring",     past:"rang",       pp:"rung",             meaning:"(벨이) 울리다"},
  {base:"rise",     past:"rose",       pp:"risen",            meaning:"오르다"},
  {base:"run",      past:"ran",        pp:"run",              meaning:"달리다"},
  {base:"say",      past:"said",       pp:"said",             meaning:"말하다"},
  {base:"see",      past:"saw",        pp:"seen",             meaning:"보다"},
  {base:"seek",     past:"sought",     pp:"sought",           meaning:"찾다, 추구하다"},
  {base:"sell",     past:"sold",       pp:"sold",             meaning:"팔다"},
  {base:"send",     past:"sent",       pp:"sent",             meaning:"보내다"},
  {base:"set",      past:"set",        pp:"set",              meaning:"놓아두다, 차리다"},
  {base:"shake",    past:"shook",      pp:"shaken",           meaning:"흔들다"},
  {base:"shine",    past:"shone",      pp:"shone",            meaning:"빛나다"},
  {base:"shoot",    past:"shot",       pp:"shot",             meaning:"쏘다"},
  {base:"show",     past:"showed",     pp:"shown",            meaning:"보여주다", ppAlt:["showed"]},
  {base:"shut",     past:"shut",       pp:"shut",             meaning:"닫다"},
  {base:"sing",     past:"sang",       pp:"sung",             meaning:"노래하다"},
  {base:"sink",     past:"sank",       pp:"sunk",             meaning:"가라앉다, 침몰하다"},
  {base:"sit",      past:"sat",        pp:"sat",              meaning:"앉다"},
  {base:"sleep",    past:"slept",      pp:"slept",            meaning:"잠자다"},
  {base:"smell",    past:"smelt",      pp:"smelt",            meaning:"냄새가 나다", ppAlt:["smelled"]},
  {base:"speak",    past:"spoke",      pp:"spoken",           meaning:"말하다"},
  {base:"spend",    past:"spent",      pp:"spent",            meaning:"(돈, 시간을) 소비하다"},
  {base:"stand",    past:"stood",      pp:"stood",            meaning:"일어서다"},
  {base:"steal",    past:"stole",      pp:"stolen",           meaning:"훔치다"},
  {base:"strike",   past:"struck",     pp:"struck",           meaning:"치다"},
  {base:"swim",     past:"swam",       pp:"swum",             meaning:"헤엄치다"},
  {base:"take",     past:"took",       pp:"taken",            meaning:"가지다"},
  {base:"teach",    past:"taught",     pp:"taught",           meaning:"가르치다"},
  {base:"tear",     past:"tore",       pp:"torn",             meaning:"찢다, 눈물 흘리다"},
  {base:"tell",     past:"told",       pp:"told",             meaning:"말하다"},
  {base:"think",    past:"thought",    pp:"thought",          meaning:"생각하다"},
  {base:"throw",    past:"threw",      pp:"thrown",           meaning:"던지다"},
  {base:"understand",past:"understood",pp:"understood",       meaning:"이해하다"},
  {base:"wear",     past:"wore",       pp:"worn",             meaning:"입다"},
  {base:"win",      past:"won",        pp:"won",              meaning:"이기다"},
  {base:"write",    past:"wrote",      pp:"written",          meaning:"쓰다"},
];

// Filter out modal verbs (no past participle)
const VERBS = ALL_VERBS.filter(v => v.pp);

// ── STATE ──
let studentName = '', studentSchool = '', studentGrade = '';
let currentQuestions = [];
let timerInterval = null;
let secondsLeft = 25 * 60;
let quizSubmitted = false;

// ── LOGIN ──
function startQuiz() {
  studentName = document.getElementById('inputName').value.trim();
  studentSchool = document.getElementById('inputSchool').value.trim();
  studentGrade = document.getElementById('inputGrade').value;
  if (!studentName || !studentSchool || !studentGrade) {
    alert('이름, 학교, 학년을 모두 입력해주세요!');
    return;
  }
  document.getElementById('metaName').textContent = studentName;
  document.getElementById('metaSchool').textContent = studentSchool;
  document.getElementById('metaGrade').textContent = studentGrade;
  showScreen('screenQuiz');
  drawQuestions(pickRandom(VERBS, 30));
  startTimer();
}

// ── PICK RANDOM ──
function pickRandom(arr, n) {
  const shuffled = [...arr].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}

// ── DRAW QUESTIONS ──
function drawQuestions(questions) {
  quizSubmitted = false;
  currentQuestions = questions;
  const grid = document.getElementById('questionGrid');
  grid.innerHTML = '';
  questions.forEach((v, i) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `qcard-${i}`;
    card.innerHTML = `
      <div class="q-num">${String(i+1).padStart(2,'0')}</div>
      <div class="q-verb">
        <span class="q-base">${v.base}</span>
        <div class="q-past">과거: ${v.past}</div>
        <div class="q-meaning">${v.meaning}</div>
      </div>
      <div class="q-input-wrap">
        <input class="q-input" id="inp-${i}" type="text" placeholder="과거분사"
          autocomplete="off" spellcheck="false"
          oninput="onInputChange(${i})"
          onkeydown="if(event.key==='Enter'){moveNext(${i})}">
        <div class="q-answer-hint" id="hint-${i}"></div>
      </div>
    `;
    grid.appendChild(card);
  });
  updateProgress();
}

function onInputChange(i) {
  updateProgress();
}

function moveNext(i) {
  const next = document.getElementById(`inp-${i+1}`);
  if (next) next.focus();
}

function updateProgress() {
  const filled = currentQuestions.filter((_, i) => {
    const inp = document.getElementById(`inp-${i}`);
    return inp && inp.value.trim() !== '';
  }).length;
  document.getElementById('progressBar').style.width = (filled / 30 * 100) + '%';
}

// ── SHUFFLE ──
function shuffleQuestions() {
  if (quizSubmitted) {
    if (!confirm('채점 후 다시 섞으면 결과가 초기화됩니다. 계속할까요?')) return;
  }
  resetCardStyles();
  drawQuestions(pickRandom(VERBS, 30));
}

function resetCardStyles() {
  currentQuestions.forEach((_, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (card) { card.classList.remove('correct','wrong'); }
    const inp = document.getElementById(`inp-${i}`);
    if (inp) { inp.classList.remove('correct','wrong'); inp.value = ''; inp.disabled = false; }
    const hint = document.getElementById(`hint-${i}`);
    if (hint) { hint.className = 'q-answer-hint'; hint.textContent = ''; }
  });
}

// ── TIMER ──
function startTimer() {
  secondsLeft = 25 * 60;
  document.getElementById('timerBox').style.display = 'block';
  updateTimerDisplay();
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    secondsLeft--;
    updateTimerDisplay();
    if (secondsLeft <= 0) {
      clearInterval(timerInterval);
      alert('⏰ 시간이 종료되었습니다! 자동으로 채점합니다.');
      submitQuiz();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(secondsLeft / 60);
  const s = secondsLeft % 60;
  const el = document.getElementById('timerDisplay');
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.className = 'timer-time';
  if (secondsLeft <= 60) el.classList.add('danger');
  else if (secondsLeft <= 300) el.classList.add('warn');
}

// ── SUBMIT & GRADE ──
function submitQuiz() {
  if (quizSubmitted) return;
  quizSubmitted = true;
  clearInterval(timerInterval);

  let correctCount = 0;
  const wrongItems = [];

  currentQuestions.forEach((v, i) => {
    const inp = document.getElementById(`inp-${i}`);
    const card = document.getElementById(`qcard-${i}`);
    const hint = document.getElementById(`hint-${i}`);
    const userAns = (inp.value || '').trim().toLowerCase();
    const correctAns = v.pp.toLowerCase();
    const alts = (v.ppAlt || []).map(a => a.toLowerCase());

    const isCorrect = userAns === correctAns || alts.includes(userAns);

    inp.disabled = true;
    if (isCorrect) {
      correctCount++;
      card.classList.add('correct');
      inp.classList.add('correct');
      hint.textContent = '✓ 정답!';
      hint.className = 'q-answer-hint show';
    } else {
      card.classList.add('wrong');
      inp.classList.add('wrong');
      hint.textContent = `정답: ${v.pp}`;
      hint.className = 'q-answer-hint show wrong-hint';
      wrongItems.push({ base: v.base, past: v.past, pp: v.pp, meaning: v.meaning, userAns });
    }
  });

  showResult(correctCount, wrongItems);
}

// ── SHOW RESULT ──
function showResult(correctCount, wrongItems) {
  const score = Math.round(correctCount / 30 * 100);
  const emojis = score >= 90 ? '🏆' : score >= 70 ? '😊' : score >= 50 ? '😅' : '💪';

  document.getElementById('resultEmoji').textContent = emojis;
  document.getElementById('resultScore').textContent = score + '점';
  document.getElementById('resultLabel').textContent = `30문항 중 ${correctCount}개 정답`;
  document.getElementById('statCorrect').textContent = `✅ 정답 ${correctCount}`;
  document.getElementById('statWrong').textContent = `❌ 오답 ${30 - correctCount}`;

  const wrongListEl = document.getElementById('wrongList');
  if (wrongItems.length === 0) {
    wrongListEl.innerHTML = '<p style="text-align:center;color:var(--success);font-weight:700;font-size:1rem;">🎉 모두 정답입니다!</p>';
  } else {
    let html = `<h4>❌ 오답 목록 (${wrongItems.length}개)</h4>`;
    wrongItems.forEach(w => {
      html += `<div class="wrong-item">
        <span class="wrong-verb">${w.base}</span>
        <span class="wrong-arrow">→</span>
        <span class="wrong-user">${w.userAns || '(미입력)'}</span>
        <span class="wrong-arrow">→</span>
        <span class="wrong-correct">${w.pp}</span>
        <span style="color:var(--text-muted);font-size:0.72rem;margin-left:auto">${w.meaning}</span>
      </div>`;
    });
    wrongListEl.innerHTML = html;
  }

  showScreen('screenResult');
  sendToNotion(score, correctCount, wrongItems);
}

// ── NOTION SUBMIT ──
async function sendToNotion(score, correctCount, wrongItems) {
  const statusEl = document.getElementById('notionStatus');
  statusEl.className = 'notion-status sending';
  statusEl.textContent = '📤 오답 데이터를 Notion에 전송 중...';

  const today = new Date().toISOString().split('T')[0];

  let wrongText = `[점수: ${score}점 (${correctCount}/30)]\n`;
  if (wrongItems.length === 0) {
    wrongText += '오답 없음 - 만점!';
  } else {
    wrongItems.forEach((w, idx) => {
      wrongText += `${idx+1}. ${w.base} (${w.meaning})\n   과거: ${w.past} / 정답 pp: ${w.pp}\n   학생답: ${w.userAns || '(미입력)'}\n`;
    });
  }

  const payload = {
    studentName: studentName,
    school: studentSchool,
    grade: studentGrade,
    workbook: "불규칙 동사 과거분사 퀴즈",
    category: "어휘 - 불규칙동사",
    submitDate: today,
    wrongAnswers: wrongText,
    score: score
  };

  try {
    const res = await fetch('https://dodamenglish.netlify.app/.netlify/functions/notion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      statusEl.className = 'notion-status sent';
      statusEl.textContent = '✅ Notion에 오답이 성공적으로 저장되었습니다.';
    } else {
      throw new Error('서버 오류: ' + res.status);
    }
  } catch(e) {
    statusEl.className = 'notion-status err';
    statusEl.textContent = '⚠️ Notion 전송 실패: ' + e.message;
  }
}

// ── RETRY ──
function retryQuiz() {
  showScreen('screenQuiz');
  resetCardStyles();
  drawQuestions(pickRandom(VERBS, 30));
  startTimer();
}

// ── SCREEN SWITCH ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>
