<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관계사 종합 워크북 | 도담한영어교실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a3a5c; --navy-soft:#2c5277; --orange:#e8703a; --orange-soft:#fdecdf;
  --bg:#f4f7fb; --card:#ffffff; --line:#e3e9f0; --text:#1f2d3d; --muted:#6b7a8d;
  --n-bg:#e6f1fb; --n-tx:#0c447c;      /* 선행사(명사) */
  --r-bg:#fdecdf; --r-tx:#b5470f;      /* 반복어/전환 */
  --rel-bg:#e1f5ee; --rel-tx:#0f6e56;  /* 관계사 결과 */
  --tip-bg:#faeeda; --tip-tx:#854f0b;  /* 찾기 팁 */
  --ok-bg:#e6f6ed; --ok-tx:#1c7a44; --no-bg:#fdebeb; --no-tx:#b3261e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
.en{font-family:'Noto Sans KR',sans-serif}

/* 로그인 */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);border-radius:20px;padding:36px 28px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(26,58,92,.12);text-align:center}
.login-card .badge{display:inline-block;background:var(--orange-soft);color:var(--orange);font-weight:700;font-size:13px;padding:6px 14px;border-radius:20px;margin-bottom:18px}
.login-card h1{color:var(--navy);font-size:24px;line-height:1.35;margin-bottom:6px}
.login-card p{color:var(--muted);font-size:14px;margin-bottom:24px}
.login-card input{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;text-align:center;margin-bottom:14px}
.login-card input:focus{outline:none;border-color:var(--orange)}
.btn-main{width:100%;background:var(--navy);color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s}
.btn-main:hover{background:var(--navy-soft)}
.btn-main:active{transform:scale(.99)}

/* 앱 */
#app{display:none}
header.top{background:var(--navy);color:#fff;padding:16px 0}
header.top .inner{max-width:760px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top .who{font-size:14px}
header.top .who b{font-weight:700}
header.top .prog{font-size:13px;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:20px;white-space:nowrap}

.tabs{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 8px;display:flex;gap:8px;overflow-x:auto}
.tabs .inner{max-width:760px;margin:0 auto;padding:0 16px;display:flex;gap:8px}
.tab{flex:1;min-width:84px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;padding:10px 8px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;text-align:center;transition:.15s}
.tab b{display:block;font-size:15px;font-weight:700;color:var(--navy)}
.tab.active{border-color:var(--orange);background:var(--orange-soft)}
.tab.active b{color:var(--orange)}

section.part{display:none}
section.part.active{display:block}

.part-head{margin:18px 0 10px}
.part-head .kicker{color:var(--orange);font-weight:700;font-size:13px}
.part-head h2{color:var(--navy);font-size:22px;margin:2px 0}
.part-head .sub{color:var(--muted);font-size:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}
.card h3{color:var(--navy);font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--orange);display:inline-block}
.card p{font-size:15px;margin:6px 0}
.card .ko{color:var(--muted);font-size:14px}

.hl-n{background:var(--n-bg);color:var(--n-tx);padding:1px 7px;border-radius:6px;font-weight:700}
.hl-r{background:var(--r-bg);color:var(--r-tx);padding:1px 7px;border-radius:6px;font-weight:700}
.hl-rel{background:var(--rel-bg);color:var(--rel-tx);padding:1px 7px;border-radius:6px;font-weight:700}

/* 표 */
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.tbl th,.tbl td{border:1px solid var(--line);padding:9px 10px;text-align:left}
.tbl th{background:#eef3f9;color:var(--navy);font-weight:700}
.tbl td b{color:var(--orange)}

/* 스테퍼(애니메이션) */
.stepper{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:14px 0}
.stepper .head{background:#eef3f9;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.stepper .head .title{color:var(--navy);font-weight:700;font-size:15px}
.stepper .dots{display:flex;gap:6px}
.stepper .dots i{width:8px;height:8px;border-radius:50%;background:#c7d3e0;display:block;transition:.2s}
.stepper .dots i.on{background:var(--orange);transform:scale(1.15)}
.stepper .stage{padding:24px 18px;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:12px;background:var(--card)}
.stepper .stage .ln{font-size:18px;transition:opacity .35s,transform .35s}
.stepper .cap{background:var(--tip-bg);color:var(--tip-tx);padding:12px 16px;font-size:14px;font-weight:500;line-height:1.6}
.stepper .ctrl{display:flex;gap:8px;padding:12px 16px;background:var(--card);border-top:1px solid var(--line)}
.stepper .ctrl button{border:1.5px solid var(--line);background:var(--card);color:var(--navy);border-radius:10px;padding:10px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.stepper .ctrl button.go{flex:1;background:var(--navy);color:#fff;border-color:var(--navy)}
.stepper .ctrl button.go:hover{background:var(--navy-soft)}
.stepper .ctrl button:disabled{opacity:.4;cursor:default}
.fade{opacity:0;transform:translateY(4px)}

/* 문제 */
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}
.q .qnum{display:inline-block;background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.q .stem{font-size:16px;font-weight:500;margin-bottom:4px}
.q .stem .blank{color:var(--orange);font-weight:700}
.q .qko{color:var(--muted);font-size:13px;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;font-family:inherit;font-size:15px;cursor:pointer;text-align:left;transition:.12s}
.opt:hover{border-color:var(--orange)}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-tx);color:var(--ok-tx);font-weight:700}
.opt.wrong{background:var(--no-bg);border-color:var(--no-tx);color:var(--no-tx);font-weight:700}
.opt:disabled{cursor:default}
.fillrow{display:flex;gap:8px}
.fillrow input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;font-size:15px;font-family:inherit}
.fillrow input:focus{outline:none;border-color:var(--orange)}
.fillrow button{background:var(--orange);color:#fff;border:none;border-radius:10px;padding:0 18px;font-weight:700;font-family:inherit;cursor:pointer}
.fillrow input.correct{background:var(--ok-bg);border-color:var(--ok-tx)}
.fillrow input.wrong{background:var(--no-bg);border-color:var(--no-tx)}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);color:var(--ok-tx)}
.fb.no{background:var(--no-bg);color:var(--no-tx)}
.fb .ans{font-weight:700}
.fb .exp{color:var(--text);margin-top:5px;font-weight:400}

/* 제출/결과 */
.submit-bar{margin:22px 0}
.btn-submit{width:100%;background:var(--orange);color:#fff;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer}
.btn-submit:hover{filter:brightness(.96)}
#result{display:none}
.score-card{background:var(--navy);color:#fff;border-radius:20px;padding:30px 24px;text-align:center;margin:16px 0}
.score-card .lbl{font-size:14px;opacity:.85}
.score-card .big{font-size:54px;font-weight:700;line-height:1.1;margin:6px 0}
.score-card .big small{font-size:22px;opacity:.8}
.score-card .det{font-size:14px;opacity:.9}
.wrong-list{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.wrong-list h3{color:var(--navy);font-size:16px;margin-bottom:10px}
.wrong-list .item{border-left:3px solid var(--orange);padding:8px 0 8px 12px;margin:10px 0;font-size:14px}
.wrong-list .item .t{font-weight:700}
.wrong-list .item .m{color:var(--no-tx)}
.wrong-list .item .c{color:var(--ok-tx)}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
#sendStatus{text-align:center;font-size:14px;margin-top:12px;font-weight:700}

footer{margin-top:30px;padding:18px 16px;font-size:11px;color:#9aa7b5;line-height:1.6;text-align:center;border-top:1px solid var(--line)}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <span class="badge">도담한영어교실</span>
    <h1>관계사 종합 워크북</h1>
    <p>관계대명사 · 관계부사 · 복합관계사<br>이름을 입력하고 시작하세요!</p>
    <input id="nameInput" type="text" placeholder="이름을 입력하세요" maxlength="20" autocomplete="off">
    <button class="btn-main" onclick="startApp()">학습 시작하기</button>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="inner">
      <div class="who">안녕하세요, <b id="hiName"></b> 님!</div>
      <div class="prog" id="progress">0 / 28 완료</div>
    </div>
  </header>

  <div class="tabs">
    <div class="inner" id="tabs"></div>
  </div>

  <div class="wrap">
    <div id="parts"></div>

    <div class="submit-bar">
      <button class="btn-submit" onclick="submitAll()">채점하고 제출하기</button>
      <div class="note">모든 문제를 풀고 제출하면 점수와 오답이 선생님께 전달됩니다.</div>
    </div>

    <div id="result"></div>

    <footer>
      이 시험문제의 저작권은 도담한영어교실에 있습니다. 저작권법에 의해 보호받는 저작물이므로 전재와 복제는 금지되며, 이를 어길 시 저작권법에 의거 처벌될 수 있습니다.
    </footer>
  </div>
</div>

<script>
/* ===== 설정 (필요 시 여기만 수정) ===== */
var CONFIG = {
  school: "도담한영어교실",
  grade: "초6",
  workbook: "관계사 종합 워크북 (관계대명사·관계부사·복합관계사)",
  category: "문법",
  notionUrl: "https://dodamenglish.netlify.app/.netlify/functions/notion"
};

/* ===== 하이라이트 도우미 ===== */
function N(t){return '<span class="hl-n">'+t+'</span>';}
function R(t){return '<span class="hl-r">'+t+'</span>';}
function L(t){return '<span class="hl-rel">'+t+'</span>';}
function X(t){return '<span style="text-decoration:line-through;color:var(--muted);opacity:.7">'+t+'</span>';}

/* ===== 스테퍼(애니메이션) 데이터 ===== */
var STEPPERS = {
  cases: {
    title: "주격·목적격·소유격 구분",
    steps: [
      {lines:['관계대명사 <b>바로 뒤</b>에 무엇이','오는지만 보면 격을 알 수 있어요!'], cap:'뒤에 동사? 주어+동사? 명사?'},
      {lines:['I know a boy '+L('who')+' '+R('plays')+' the piano.','('+L('who')+' 뒤에 바로 <b>동사</b>)'], cap:'뒤에 <b>동사</b>가 오면 → <b>주격</b> &nbsp;(who · which · that)'},
      {lines:['I met the girl '+L('who(m)')+' '+R('you love')+'.','('+L('who(m)')+' 뒤에 <b>주어+동사</b>)'], cap:'뒤에 <b>주어+동사</b>가 오면 → <b>목적격</b> &nbsp;(who(m) · which · that) · <b>생략 가능!</b>'},
      {lines:['I know a man '+L('whose')+' '+R('wife')+' is a designer.','('+L('whose')+' 뒤에 <b>명사</b>)'], cap:'뒤에 <b>명사</b>가 오면 → <b>소유격</b> &nbsp;(whose)'},
      {lines:['뒤에 동사 → '+L('주격'),'뒤에 주어+동사 → '+L('목적격'),'뒤에 명사 → '+L('소유격')], cap:'관계사 뒤만 보면 격이 한눈에 보여요!'}
    ]
  },
  drop: {
    title: "목적격 관계대명사 생략",
    steps: [
      {lines:['The girl '+L('who(m)')+' you love is kind.','('+L('who(m)')+' = 목적격, 뒤에 주어+동사)'], cap:'목적격 관계대명사는 뒤에 "주어+동사"가 와요.'},
      {lines:['The girl '+X('who(m)')+' you love is kind.','(목적격은 빼도 돼요!)'], cap:'<b>목적격</b> 관계대명사는 <b>생략</b>할 수 있어요. &nbsp;(<b>주격</b>은 생략 못 해요!)'},
      {lines:['The girl you love is kind.'], cap:'완성! 관계대명사를 빼도 뜻은 똑같아요.'}
    ]
  },
  merge: {
    title: "두 문장을 하나로 합치기",
    steps: [
      {lines:['I know '+N('a boy')+'.', R('He')+' plays the piano well.'], cap:'두 문장에 같은 사람이 있어요. &nbsp;'+N('a boy')+' = '+R('He')},
      {lines:['I know '+N('a boy')+'.', R('He')+' plays the piano well.'], cap:''+R('He')+' 는 뒤 문장의 <b>주어 = 명사 자리</b>예요. → 명사 자리니까 <b>관계대명사</b>를 씁니다!'},
      {lines:['I know '+N('a boy')+'.', R('He')+' &nbsp;→&nbsp; '+L('who')], cap:''+R('He')+' 를 '+L('who')+' 로 바꿉니다.'},
      {lines:['I know '+N('a boy')+' '+L('who')+' plays the piano well.'], cap:'완성! &nbsp;'+N('a boy')+' 를 &nbsp;'+L('who')+' plays the piano well&nbsp; 이 <b>뒤에서</b> 꾸며줍니다.'}
    ]
  },
  fork: {
    title: "관계대명사 vs 관계부사 구분하기",
    steps: [
      {lines:['겹치는 말이 절 안에서','<b>무슨 자리</b>에 있는지 보세요.'], cap:'주어·목적어 = 명사 자리 / 전치사+명사 = 부사 자리'},
      {lines:['I know '+N('a boy')+'. + '+R('He')+' plays...','('+R('He')+' = 주어 → 명사 자리)'], cap:'명사 자리예요! → <b>관계대명사</b> &nbsp;'+L('who')+' / which / that'},
      {lines:['I remember '+N('the place')+'.','+ We met '+R('in the place')+'.'], cap:''+R('in the place')+' = 부사 자리예요! → <b>관계부사</b> &nbsp;'+L('where')+' / when / why'},
      {lines:['명사 자리 → '+L('who · which · that'),'부사 자리 → '+L('where · when · why · how')], cap:'겹치는 말의 "자리" 하나로 관대·관부가 갈립니다.'}
    ]
  },
  korean: {
    title: "한글 해석으로 관계절 찾기",
    steps: [
      {lines:['한국어 해석을 보세요:','『 피아노를 잘 치는 소년 』'], cap:'명사 "소년" 앞에 꾸며주는 말이 붙어 있죠?'},
      {lines:[R('피아노를 잘 치는')+' + '+N('소년')], cap:'『 ~하는/~한 』 + 명사 덩어리가 보이면 → <b>관계절!</b>'},
      {lines:[N('소년')+' &nbsp;←&nbsp; '+R('who plays the piano well')], cap:'영어는 거꾸로! 명사를 먼저 쓰고, 꾸미는 말을 <b>뒤에</b> 붙여요.'},
      {lines:[N('a boy')+' '+L('who plays the piano well')], cap:'완성! 한글은 앞에서, 영어는 뒤에서 명사를 꾸밉니다.'}
    ]
  },
  omit: {
    title: "「주격 관계대명사 + be」 생략",
    steps: [
      {lines:['The man '+R('who is')+' wearing glasses','is my teacher.'], cap:'주격 관계대명사 뒤에 분사(wearing)가 왔어요.'},
      {lines:['The man '+R('who is')+' '+L('wearing')+' glasses','('+R('who is')+' 생략 가능!)'], cap:'『 주격 관계대명사 + be 』 는 함께 생략할 수 있어요.'},
      {lines:['The man '+L('wearing')+' glasses is my teacher.'], cap:'완성! 분사(wearing)만 남아서 명사를 꾸며줍니다.'}
    ]
  },
  however: {
    title: "however 의 어순",
    steps: [
      {lines:['"아무리 ~하더라도" = '+L('However')], cap:'However 는 양보의 부사절을 이끕니다.'},
      {lines:[L('However')+' 뒤에는','<b>형용사/부사</b>가 먼저 와요!'], cap:'However + 형용사/부사 + 주어 + 동사 순서!'},
      {lines:[L('However')+' '+R('hard')+' we try, ...'], cap:''+R('hard')+'(부사)를 However 바로 뒤에 붙입니다.'},
      {lines:[L('However')+' '+R('hard')+' we try,','we won&#39;t finish it.'], cap:'완성! "아무리 열심히 해도, 우린 못 끝낼 거야."'}
    ]
  }
};

/* ===== 개념 카드 HTML ===== */
function conceptHTML(part){
  var c = '';
  if(part===1){
    c += card('관계대명사란?', '<p>두 문장에 <b>같은 명사</b>가 있을 때, 그 명사를 관계대명사로 바꿔 한 문장으로 잇습니다. 앞에 나온 명사를 '+N('선행사')+'라고 불러요.</p>');
    c += stepperHTML('merge');
    c += card('관계대명사의 종류', tbl([
      ['선행사','격','관계대명사','예'],
      ['사람','주격/목적격','<b>who</b>(m) / that','a boy who runs'],
      ['사물·동물','주격/목적격','<b>which</b> / that','a cat which sleeps'],
      ['모두','소유격','<b>whose</b>','a man whose car is red']
    ]) + '<p class="ko">※ 목적격 관계대명사는 생략할 수 있어요. (the girl (who) I met)</p>');
    c += card('주격 · 목적격 · 소유격 구분', '<p>관계대명사가 절 안에서 하는 역할에 따라 격이 달라요. <b>관계대명사 바로 뒤에 무엇이 오는지</b> 보면 한 번에 구분할 수 있어요.</p>');

    ]));

}
function card(title, body){
  return '<div class="card"><h3><span class="dot"></span>'+title+'</h3>'+body+'</div>';
}
function tbl(rows){
  var h='<table class="tbl">';
  for(var i=0;i<rows.length;i++){
    h+='<tr>';
    for(var j=0;j<rows[i].length;j++){ h+= (i===0?'<th>':'<td>')+rows[i][j]+(i===0?'</th>':'</td>'); }
    h+='</tr>';
  }
  return h+'</table>';
}
function stepperHTML(key){
  var s = STEPPERS[key];
  var dots=''; for(var i=0;i<s.steps.length;i++){ dots+='<i'+(i===0?' class="on"':'')+'></i>'; }
  return '<div class="stepper" data-key="'+key+'">'
    + '<div class="head"><span class="title">'+s.title+'</span><span class="dots">'+dots+'</span></div>'
    + '<div class="stage"></div>'
    + '<div class="cap"></div>'
    + '<div class="ctrl"><button onclick="stepNav(this,-1)">이전</button>'
    + '<button class="go" onclick="stepNav(this,1)">다음 단계 ▶</button>'
    + '<button onclick="stepNav(this,0)">처음</button></div>'
    + '</div>';
}
function renderStep(box){
  var key = box.getAttribute('data-key');
  var idx = parseInt(box.getAttribute('data-idx')||'0',10);
  var s = STEPPERS[key]; var st = s.steps[idx];
  var stage = box.querySelector('.stage');
  var lines = st.lines.map(function(t){return '<div class="ln en">'+t+'</div>';}).join('');
  stage.classList.add('fade');
  setTimeout(function(){ stage.innerHTML = lines; stage.classList.remove('fade'); }, 120);
  box.querySelector('.cap').innerHTML = st.cap;
  var dots = box.querySelectorAll('.dots i');
  for(var i=0;i<dots.length;i++){ dots[i].className = (i===idx?'on':''); }
  var btns = box.querySelectorAll('.ctrl button');
  btns[0].disabled = (idx===0);
  btns[1].disabled = (idx===s.steps.length-1);
}
function stepNav(btn, dir){
  var box = btn.closest('.stepper');
  var key = box.getAttribute('data-key');
  var max = STEPPERS[key].steps.length-1;
  var idx = parseInt(box.getAttribute('data-idx')||'0',10);
  if(dir===0){ idx=0; } else { idx = Math.max(0, Math.min(max, idx+dir)); }
  box.setAttribute('data-idx', idx);
  renderStep(box);
}

/* ===== 상태 ===== */
var studentName = '';
var totalQ = 0;
var answers = {};
PARTS.forEach(function(p){ totalQ += p.questions.length; });

/* ===== 렌더링 ===== */
function startApp(){
  var nm = document.getElementById('nameInput').value.trim();
  if(!nm){ alert('이름을 입력해 주세요!'); return; }
  studentName = nm;
  document.getElementById('hiName').textContent = nm;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  buildTabs();
  buildParts();
  showPart(1);
  document.querySelectorAll('.stepper').forEach(function(b){ b.setAttribute('data-idx','0'); renderStep(b); });
  updateProgress();
  window.scrollTo(0,0);
}
function buildTabs(){
  var h='';
  PARTS.forEach(function(p){
    h += '<button class="tab" data-id="'+p.id+'" onclick="showPart('+p.id+')"><b>PART '+p.id+'</b>'+p.title+'</button>';
  });
  document.getElementById('tabs').innerHTML = h;
}
function buildParts(){
  var h='';
  PARTS.forEach(function(p){
    h += '<section class="part" id="part'+p.id+'">';
    h += '<div class="part-head"><div class="kicker">PART '+p.id+'</div><h2>'+p.title+'</h2><div class="sub">'+p.sub+'</div></div>';
    h += conceptHTML(p.id);
    h += '<div class="part-head" style="margin-top:24px"><div class="kicker">실전 문제</div><h2 style="font-size:18px">문제를 풀어보세요</h2></div>';
    p.questions.forEach(function(q,qi){ h += questionHTML(p.id, qi, q); });
    h += '</section>';
  });
  document.getElementById('parts').innerHTML = h;
}
function questionHTML(pid, qi, q){
  var stem = q.stem.replace('___','<span class="blank">_____</span>');
  var h = '<div class="q" id="q-'+pid+'-'+qi+'">';
  h += '<span class="qnum">'+(qi+1)+'번</span>';
  h += '<div class="stem en">'+stem+'</div>';
  if(q.ko){ h += '<div class="qko">'+q.ko+'</div>'; }
  if(q.type==='choice'){
    h += '<div class="opts">';
    q.options.forEach(function(opt,oi){
      h += '<button class="opt en" onclick="answerChoice('+pid+','+qi+','+oi+')">'+opt+'</button>';
    });
    h += '</div>';
  } else {
    h += '<div class="fillrow"><input type="text" class="en" placeholder="답을 입력하세요" onkeydown="if(event.key===&#39;Enter&#39;)answerFill('+pid+','+qi+')"><button onclick="answerFill('+pid+','+qi+')">확인</button></div>';
  }
  h += '<div class="fb"><span class="ans"></span><div class="exp"></div></div>';
  h += '</div>';
  return h;
}

function getQ(pid,qi){ return PARTS[pid-1].questions[qi]; }

function answerChoice(pid, qi, oi){
  var key = pid+'-'+qi;
  if(answers[key]) return;
  var q = getQ(pid,qi);
  var correct = (oi === q.answer);
  answers[key] = {correct:correct, user:q.options[oi]};
  var box = document.getElementById('q-'+pid+'-'+qi);
  var opts = box.querySelectorAll('.opt');
  for(var i=0;i<opts.length;i++){
    opts[i].disabled = true;
    if(i===q.answer) opts[i].classList.add('correct');
    if(i===oi && !correct) opts[i].classList.add('wrong');
  }
  showFeedback(box, correct, q.options[q.answer], q.exp);
  updateProgress();
}
function answerFill(pid, qi){
  var key = pid+'-'+qi;
  if(answers[key]) return;
  var box = document.getElementById('q-'+pid+'-'+qi);
  var input = box.querySelector('input');
  var val = (input.value||'').trim().toLowerCase().replace(/[.\s]+$/,'');
  if(!val){ return; }
  var q = getQ(pid,qi);
  var ok = q.accept.some(function(a){ return a.toLowerCase()===val; });
  answers[key] = {correct:ok, user:input.value.trim()};
  input.disabled = true;
  box.querySelector('button').disabled = true;
  input.classList.add(ok?'correct':'wrong');
  showFeedback(box, ok, q.answer, q.exp);
  updateProgress();
}
function showFeedback(box, ok, ansText, exp){
  var fb = box.querySelector('.fb');
  fb.classList.add('show', ok?'ok':'no');
  fb.querySelector('.ans').innerHTML = ok ? '정답입니다! ✅' : ('아쉬워요 ❌ &nbsp; 정답: '+ansText);
  fb.querySelector('.exp').innerHTML = '💡 '+exp;
}
function updateProgress(){
  var done = Object.keys(answers).length;
  document.getElementById('progress').textContent = done+' / '+totalQ+' 완료';
}
function showPart(id){
  document.querySelectorAll('.part').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById('part'+id).classList.add('active');
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-id')==String(id)); });
  window.scrollTo(0,0);
}

/* ===== 제출 ===== */
function submitAll(){
  var done = Object.keys(answers).length;
  if(done < totalQ){
    if(!confirm('아직 '+(totalQ-done)+'문제가 남았어요. 그래도 제출할까요?')) return;
  }
  var correctCount=0; var wrongLines=[];
  PARTS.forEach(function(p){
    p.questions.forEach(function(q,qi){
      var a = answers[p.id+'-'+qi];
      if(a && a.correct){ correctCount++; }
      else {
        var ua = a ? a.user : '(미응답)';
        var ca = (q.type==='fill') ? q.answer : q.options[q.answer];
        wrongLines.push('[PART'+p.id+' '+(qi+1)+'번] '+stripTags(q.stem)+' / 내 답: '+ua+' / 정답: '+ca);
      }
    });
  });
  var score = Math.round(correctCount/totalQ*100);
  renderResult(score, correctCount, wrongLines);
  sendToNotion(score, wrongLines);
}
function stripTags(s){ return s.replace(/<[^>]*>/g,'').replace('___','____'); }
function renderResult(score, correctCount, wrongLines){
  var h = '<div class="score-card"><div class="lbl">'+studentName+' 님의 점수</div>';
  h += '<div class="big">'+score+'<small>점</small></div>';
  h += '<div class="det">총 '+totalQ+'문제 중 '+correctCount+'개 정답</div></div>';
  if(wrongLines.length){
    h += '<div class="wrong-list"><h3>📝 다시 볼 문제 ('+wrongLines.length+'개)</h3>';
    wrongLines.forEach(function(line){
      var parts = line.split(' / ');
      h += '<div class="item"><div class="t">'+parts[0]+'</div>'
         + '<div class="m">'+(parts[1]||'')+'</div>'
         + '<div class="c">'+(parts[2]||'')+'</div></div>';
    });
    h += '</div>';
  } else {
    h += '<div class="wrong-list"><h3>🎉 모든 문제를 맞혔어요! 정말 잘했어요!</h3></div>';
  }
  h += '<div id="sendStatus">선생님께 결과를 전송하는 중...</div>';
  var r = document.getElementById('result');
  r.innerHTML = h; r.style.display='block';
  r.scrollIntoView({behavior:'smooth'});
}
function sendToNotion(score, wrongLines){
  var head = '[점수: '+score+'점]';
  var body = wrongLines.length ? wrongLines.join('\n') : '모두 정답!';
  var wrongAnswers = head + '\n' + body;
  var today = new Date();
  var submitDate = today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  var payload = {
    studentName: studentName,
    school: CONFIG.school,
    grade: CONFIG.grade,
    workbook: CONFIG.workbook,
    category: CONFIG.category,
    submitDate: submitDate,
    wrongAnswers: wrongAnswers,
    score: score
  };
  fetch(CONFIG.notionUrl, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  }).then(function(res){
    var st = document.getElementById('sendStatus');
    if(res.ok){ st.style.color='#1c7a44'; st.textContent='✅ 결과가 선생님께 전송되었어요!'; }
    else { st.style.color='#b3261e'; st.textContent='⚠️ 전송에 실패했어요. 선생님께 알려주세요.'; }
  }).catch(function(){
    var st = document.getElementById('sendStatus');
    st.style.color='#b3261e'; st.textContent='⚠️ 전송에 실패했어요. 인터넷 연결을 확인해 주세요.';
  });
}
function pad(n){ return n<10 ? '0'+n : ''+n; }

document.getElementById('nameInput').addEventListener('keydown', function(e){ if(e.key==='Enter') startApp(); });
</script>
