<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리딩포워드 베이직1 | 도담한영어교실</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a3a5c;
    --accent: #e8703a;
    --accent-light: #fff3ed;
    --green: #2d7a4f;
    --green-light: #edf7f2;
    --red: #c0392b;
    --red-light: #fdf0ef;
    --gray: #6b7280;
    --gray-light: #f3f4f6;
    --border: #e5e7eb;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: #f0f4f8; color: #1f2937; min-height: 100vh; }

  /* LOGIN */
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #1a3a5c 0%, #2d5a8e 100%); }
  .login-box { background: white; border-radius: 20px; padding: 48px 40px; width: 360px; max-width: 90vw; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .login-logo { font-size: 13px; color: var(--accent); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .login-title { font-size: 22px; font-weight: 700; color: var(--primary); margin-bottom: 6px; line-height: 1.3; }
  .login-subtitle { font-size: 13px; color: var(--gray); margin-bottom: 32px; }
  .login-box input { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 10px; font-size: 15px; font-family: 'Noto Sans KR', sans-serif; outline: none; transition: border-color 0.2s; margin-bottom: 16px; }
  .login-box input:focus { border-color: var(--primary); }
  .login-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; transition: background 0.2s; }
  .login-btn:hover { background: #254f7a; }

  /* APP */
  #app { display: none; }
  .app-header { background: var(--primary); color: white; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 100; }
  .app-header-left { display: flex; align-items: center; gap: 12px; }
  .header-logo { font-size: 11px; color: rgba(255,255,255,0.6); font-weight: 500; }
  .header-title { font-size: 15px; font-weight: 700; color: white; }
  .header-user { font-size: 13px; color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.12); padding: 4px 12px; border-radius: 20px; }

  /* UNIT TABS */
  .unit-tabs { background: white; border-bottom: 2px solid var(--border); display: flex; padding: 0 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .unit-tab { padding: 14px 18px; font-size: 14px; font-weight: 600; color: var(--gray); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s; white-space: nowrap; }
  .unit-tab:hover { color: var(--primary); }
  .unit-tab.active { color: var(--primary); border-bottom-color: var(--accent); }

  /* SECTION TABS */
  .section-tabs { display: flex; gap: 8px; padding: 20px 24px 0; max-width: 900px; margin: 0 auto; }
  .section-tab { padding: 8px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: 2px solid var(--border); background: white; color: var(--gray); transition: all 0.2s; }
  .section-tab.active { background: var(--primary); color: white; border-color: var(--primary); }

  /* CONTENT */
  .content-area { max-width: 900px; margin: 0 auto; padding: 20px 24px 60px; }
  .unit-panel { display: none; }
  .unit-panel.active { display: block; }
  .section-panel { display: none; }
  .section-panel.active { display: block; }

  /* PASSAGE CARD */
  .passage-card { background: white; border-radius: 14px; padding: 24px 28px; margin-bottom: 20px; border: 1px solid var(--border); }
  .passage-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
  .passage-title { font-size: 20px; font-weight: 700; color: var(--primary); }

  /* SENTENCE ROWS */
  .sentence-row { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; background: white; transition: border-color 0.2s; }
  .sentence-row:hover { border-color: #c7d2fe; }
  .sentence-num { font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .sentence-en { font-size: 14px; color: var(--primary); font-weight: 500; line-height: 1.6; margin-bottom: 10px; }
  .sentence-input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; outline: none; transition: border-color 0.2s; background: var(--gray-light); color: #1f2937; }
  .sentence-input:focus { border-color: var(--primary); background: white; }
  .sentence-input::placeholder { color: #adb5bd; }

  /* TRANSLATION RESULT */
  .trans-result { display: none; margin-top: 8px; }
  .trans-result.show { display: block; }
  .my-ans-label, .model-ans-label { font-size: 11px; font-weight: 700; margin-bottom: 3px; }
  .my-ans-label { color: var(--primary); }
  .model-ans-label { color: var(--green); }
  .ans-box { padding: 8px 12px; border-radius: 6px; font-size: 13px; line-height: 1.5; margin-bottom: 6px; }
  .my-ans-box { background: #eef2ff; color: var(--primary); }
  .model-ans-box { background: var(--green-light); color: var(--green); }

  /* BUTTONS */
  .action-bar { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .btn { padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; border: none; transition: all 0.2s; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: #254f7a; }
  .btn-accent { background: var(--accent); color: white; }
  .btn-accent:hover { background: #d45f28; }
  .btn-outline { background: white; color: var(--primary); border: 2px solid var(--primary); }
  .btn-outline:hover { background: var(--gray-light); }

  /* VOCAB */
  .vocab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  @media (max-width: 600px) { .vocab-grid { grid-template-columns: 1fr; } .section-tabs, .content-area { padding-left: 16px; padding-right: 16px; } }
  .vocab-item { border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; background: white; display: flex; align-items: center; gap: 12px; transition: border-color 0.2s; }
  .vocab-item.correct { border-color: var(--green); background: var(--green-light); }
  .vocab-item.wrong { border-color: var(--red); background: var(--red-light); }
  .vocab-kor { font-size: 14px; font-weight: 700; color: var(--primary); min-width: 90px; }
  .vocab-input { flex: 1; border: none; outline: none; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; background: transparent; color: #1f2937; }
  .vocab-feedback { font-size: 13px; font-weight: 700; display: none; }
  .vocab-item.correct .vocab-feedback { display: block; color: var(--green); }
  .vocab-item.wrong .vocab-feedback { display: block; color: var(--red); }
  .vocab-correct-ans { font-size: 12px; color: var(--red); margin-top: 4px; display: none; }
  .vocab-item.wrong .vocab-correct-ans { display: block; }

  /* SCORE BADGE */
  .score-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--primary); color: white; padding: 8px 18px; border-radius: 20px; font-size: 15px; font-weight: 700; margin-bottom: 16px; }

  /* RULES CARD */
  .rules-card { background: var(--accent-light); border: 1.5px solid #fbc99a; border-radius: 12px; padding: 14px 18px; margin-bottom: 20px; font-size: 13px; color: #7c3d12; line-height: 1.7; }
  .rules-card strong { color: var(--accent); }

  /* SECTION HEADER */
  .section-header { font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .section-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: white; font-size: 13px; display: flex; align-items: center; justify-content: center; }

  /* NOTION STATUS */
  .notion-status { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; display: none; }
  .notion-status.sending { background: #fef9c3; color: #854d0e; display: block; }
  .notion-status.done { background: var(--green-light); color: var(--green); display: block; }
  .notion-status.error { background: var(--red-light); color: var(--red); display: block; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">도담한영어교실</div>
    <div class="login-title">리딩포워드 베이직 1</div>
    <div class="login-subtitle">Reading Forward Basic 1 · 해석 &amp; 어휘 워크북</div>

  u4: {
    unit: 'Unit 04', topic: 'PSYCHOLOGY', title: 'The Reactance Theory',
    sentences: [
      { en: "Imagine that your teacher tells you to turn off your smartphone during class.", kr: "선생님이 수업 중에 너에게 스마트폰을 끄라고 말한다고 상상해 보라." },
      { en: "What do you want to do? You want to use it more!", kr: "너는 무엇을 하고 싶어지는가? 너는 그것을 더 사용하고 싶어진다!" },
      { en: "Why is that? The reactance theory explains the reason.", kr: "왜 그럴까? 반발 이론(reactance theory)이 그 이유를 설명해 준다." },
      { en: "It says that people have the freedom to decide what to do.", kr: "그것은 사람들이 무엇을 할지 결정할 자유를 가지고 있다고 말한다." },
      { en: "When someone tells you to do something, you feel you're losing your freedom.", kr: "누군가 너에게 무언가를 하라고 말하면, 너는 자신의 자유를 잃고 있다고 느낀다." },
      { en: "So, you feel like doing the opposite to recover your lost freedom.", kr: "그래서 너는 잃어버린 자유를 되찾기 위해 정반대로 하고 싶어진다." },
      { en: "Moreover, your feeling becomes greater when your freedom is more strongly restricted.", kr: "게다가, 자유가 더 강하게 제한될수록 그 감정은 더 커진다." },
      { en: "Think about how deeply Romeo and Juliet loved each other when they weren't allowed to!", kr: "허락받지 못했을 때 Romeo와 Juliet이 서로를 얼마나 깊이 사랑했는지 생각해 보라!" },
      { en: "Many companies use this theory to make people want their products more.", kr: "많은 기업들은 사람들이 자신들의 제품을 더 원하게 만들기 위해 이 이론을 이용한다." },
      { en: "For example, they often use expressions like 'limited edition' or 'one-day-only sale.'", kr: "예를 들어, 그들은 '한정판'이나 '하루 한정 세일' 같은 표현을 자주 사용한다." },
      { en: "They limit customers' freedom to buy their products any time they want.", kr: "그들은 고객들이 원할 때 언제든 제품을 살 수 있는 자유를 제한한다." },

      { en: "So, if you need your brother to keep silent for a while, don't yell 'Be quiet!'", kr: "그러니, 잠시 남동생을 조용히 시켜야 한다면, '조용히 해!'라고 소리치지 마라." }

      { en: "Q: What do storm chasers do?", kr: "Q: 폭풍 추적자들은 무슨 일을 하나요?" },
      { en: "A: Basically, we follow storms. And then we watch, record, and take pictures of them.", kr: "A: 기본적으로, 우리는 폭풍을 따라갑니다. 그러고 나서 그것들을 관찰하고, 기록하고, 사진을 찍습니다." },
      { en: "Why do we do this? Some chase storms simply out of interest.", kr: "왜 우리가 이것을 할까요? 어떤 사람들은 단순히 흥미 때문에 폭풍을 쫓습니다." },
      { en: "Many others, like me, do it to study and provide information about storms, such as when and how they form.", kr: "저처럼 다른 많은 이들은 폭풍이 언제 어떻게 형성되는지 같은 정보를 연구하고 제공하기 위해 그것을 합니다." },
      { en: "Q: Can you explain how storms form?", kr: "Q: 폭풍이 어떻게 형성되는지 설명해 주시겠어요?" },
      { en: "A: When warm, wet air meets cold air, these two different air masses push against each other.", kr: "A: 따뜻하고 습한 공기가 차가운 공기를 만나면, 이 두 다른 공기 덩어리가 서로 밀어냅니다." },
      { en: "This creates a violent movement of air with heavy rain, lightning, and thunder. This is how storms happen.", kr: "이것은 폭우, 번개, 천둥을 동반한 격렬한 공기의 움직임을 만들어 냅니다. 이것이 폭풍이 발생하는 방식입니다." },
      { en: "Q: What kind of equipment do storm chasers use?", kr: "Q: 폭풍 추적자들은 어떤 종류의 장비를 사용하나요?" },
      { en: "A: We use high-tech equipment to stay safe from extreme weather.", kr: "A: 우리는 극한 날씨로부터 안전하게 있기 위해 첨단 장비를 사용합니다." },
      { en: "For example, satellite maps show us where a storm is developing, and GPS systems help us follow the storm.", kr: "예를 들어, 위성 지도는 폭풍이 어디에서 발달하고 있는지 보여 주고, GPS 시스템은 우리가 폭풍을 따라가도록 도와줍니다." },
      { en: "When we are close to the storm, a specially designed vehicle protects us from any dangers outside.", kr: "우리가 폭풍에 가까이 있을 때, 특수 설계된 차량이 바깥의 모든 위험으로부터 우리를 보호해 줍니다." },
      { en: "Q: What attracts you to storm chasing?", kr: "Q: 폭풍 추적의 어떤 점이 당신을 끌어당기나요?" },
      { en: "A: Storm chasing may sound risky. But moments of capturing nature's rare beauty are unforgettable.", kr: "A: 폭풍 추적은 위험하게 들릴 수 있습니다. 하지만 자연의 희귀한 아름다움을 포착하는 순간들은 잊을 수 없습니다." },
      { en: "If you happen to see these wonderful sights, you might want to chase storms, too!", kr: "만약 당신이 우연히 이 멋진 광경을 보게 된다면, 당신도 폭풍을 쫓고 싶어질지 모릅니다!" }
    ],
    vocab: [

      { kr: "따라가다, 따르다", en: "follow" }, { kr: "기록하다", en: "record" }, { kr: "형성되다, 형성하다", en: "form" },

      { en: "Have you heard about the Enchanted Islands? They are not an imaginary place in a fairy tale.", kr: "너는 '마법에 걸린 섬'에 대해 들어 본 적이 있니? 그것들은 동화 속의 상상 속 장소가 아니다." },

      { en: "As the islands are 1,000 km away from South America, they have barely been touched by humans.", kr: "그 섬들은 남아메리카에서 1,000km 떨어져 있어서, 인간의 손이 거의 닿지 않았다." },
      { en: "Because of this, they are home to some unique wildlife.", kr: "이 때문에, 그곳은 몇몇 독특한 야생 동물들의 보금자리이다." },

      { en: "You will come face to face with dancing blue-footed boobies and small Galapagos penguins.", kr: "당신은 춤추는 푸른발부비새와 작은 갈라파고스 펭귄들과 마주하게 될 것이다." },
      { en: "What's more, the animals on these islands are famous for being fearless toward humans.", kr: "게다가, 이 섬들의 동물들은 인간에 대해 두려움이 없는 것으로 유명하다." },
      { en: "Even shy animals like lava lizards won't run away from you. So you can see them up close.", kr: "용암 도마뱀 같은 수줍은 동물들조차 당신에게서 도망치지 않을 것이다. 그래서 당신은 그것들을 가까이에서 볼 수 있다." },

  u17: {
    unit: 'Unit 17', topic: 'TEENS', title: "Brian's Problem",
    sentences: [
      { en: "Dear Dr. Phil,", kr: "Phil 박사님께," },
      { en: "My girlfriend wants to know the passwords for my email and cellphone.", kr: "제 여자 친구는 제 이메일과 휴대폰의 비밀번호를 알고 싶어 해요." },
      { en: "But I don't want to tell her because they are private. What should I do? — Brian", kr: "하지만 그것들은 사적인 것이라서 저는 그녀에게 말하고 싶지 않아요. 어떻게 해야 할까요? — Brian" },
      { en: "Dear Brian,", kr: "Brian에게," },
      { en: "Your girlfriend may think that a couple should share everything.", kr: "너의 여자 친구는 연인이 모든 것을 공유해야 한다고 생각할지도 몰라." },
      { en: "You don't have to tell her your passwords if you don't want to.", kr: "네가 원하지 않는다면 그녀에게 비밀번호를 말할 필요는 없어." },
      { en: "But you should give her your reasons for wanting privacy.", kr: "하지만 사생활을 원하는 이유는 그녀에게 말해 주어야 해." },
      { en: "Otherwise, she may think you're hiding something from her.", kr: "그렇지 않으면, 그녀는 네가 무언가를 숨기고 있다고 생각할 수도 있어." },
      { en: "Trust is very important in a relationship.", kr: "신뢰는 관계에서 매우 중요해." },
      { en: "However, reading private messages can often cause misunderstandings.", kr: "하지만, 사적인 메시지를 읽는 것은 종종 오해를 일으킬 수 있어." },
      { en: "And this can make you lose trust towards each other.", kr: "그리고 이것은 너희가 서로에 대한 신뢰를 잃게 만들 수 있어." },
      { en: "Moreover, it doesn't affect just the two of you. You might invade the privacy of other people, too.", kr: "게다가, 그것은 너희 두 사람에게만 영향을 미치는 게 아니야. 너는 다른 사람들의 사생활도 침해하게 될 수 있어." },
      { en: "For example, your friends may be upset to know that your girlfriend reads their messages to you.", kr: "예를 들어, 네 친구들은 네 여자 친구가 그들이 너에게 보낸 메시지를 읽는다는 것을 알면 화가 날 수도 있어." },

// ══════════════════════════════════════
//  STATE
// ══════════════════════════════════════
let studentName = '';
const UIDS = Object.keys(DATA);
const NOTION_URL = 'https://dodamenglish.netlify.app/.netlify/functions/notion';
const WORKBOOK_NAME = '리딩포워드 베이직1';
const SCHOOL_NAME = '도담한영어교실';
const GRADE = '초등';

// ══════════════════════════════════════
//  RENDER
// ══════════════════════════════════════
function buildAll() {
  const tabs = document.getElementById('unit-tabs');
  const content = document.getElementById('unit-content');

  tabs.innerHTML = UIDS.map((uid, idx) =>
    `<div class="unit-tab${idx === 0 ? ' active' : ''}" onclick="switchUnit('${uid}', this)">${DATA[uid].unit.replace('Unit ', 'Unit ')}</div>`
  ).join('');

  content.innerHTML = UIDS.map((uid, idx) => {
    const d = DATA[uid];
    return `
    <div id="unit-${uid}" class="unit-panel${idx === 0 ? ' active' : ''}">
      <div class="section-tabs">
        <div class="section-tab active" onclick="switchSection('${uid}','trans',this)">📖 문장 해석</div>
        <div class="section-tab" onclick="switchSection('${uid}','vocab',this)">📝 어휘 테스트</div>
      </div>
      <div class="content-area">

        <div id="${uid}-trans" class="section-panel active">
          <div class="rules-card">
            <strong>📌 해석 숙제 안내</strong><br>
            각 문장을 읽고 빈칸에 한국어 해석을 입력하세요. 제출 후 모범답안과 비교할 수 있어요. 완벽하게 같지 않아도 괜찮아요! 의미가 맞으면 OK 🙆
          </div>
          <div class="passage-card">
            <div class="passage-label">${d.unit} · ${d.topic}</div>
            <div class="passage-title">${d.title}</div>
          </div>
          <div id="${uid}-sentences"></div>
          <div class="action-bar">
            <button class="btn btn-primary" onclick="showTranslations('${uid}')">모범답안 비교하기</button>
            <button class="btn btn-outline" onclick="resetTrans('${uid}')">다시 입력</button>
            <button class="btn btn-accent" onclick="submitUnit('${uid}')">노션에 제출하기</button>
          </div>
          <div id="${uid}-notion-status" class="notion-status"></div>
        </div>

        <div id="${uid}-vocab" class="section-panel">
          <div class="rules-card">
            <strong>📌 어휘 테스트 안내</strong><br>
            한국어 뜻을 보고 알맞은 영어 단어를 입력하세요. Enter를 누르면 다음 칸으로 이동합니다.
          </div>
          <div class="section-header">
            <div class="section-icon">V</div>
            ${d.unit} 어휘 테스트
          </div>
          <div id="${uid}-vocab-grid" class="vocab-grid"></div>
          <div class="action-bar">
            <button class="btn btn-primary" onclick="gradeVocab('${uid}')">채점하기</button>
            <button class="btn btn-outline" onclick="resetVocab('${uid}')">다시 풀기</button>
            <button class="btn btn-accent" onclick="submitVocab('${uid}')">노션에 제출하기</button>
          </div>
          <div id="${uid}-vocab-status" class="notion-status"></div>
        </div>
      </div>
    </div>`;
  }).join('');

  UIDS.forEach(uid => { buildSentences(uid); buildVocab(uid); });
}

function esc(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function buildSentences(uid) {
  const data = DATA[uid];
  const container = document.getElementById(uid + '-sentences');
  container.innerHTML = data.sentences.map((s, i) => `
    <div class="sentence-row" id="${uid}-row-${i}">
      <div class="sentence-num">문장 ${i + 1}</div>
      <div class="sentence-en">${esc(s.en)}</div>
      <input class="sentence-input" type="text" placeholder="한국어 해석을 입력하세요..."
        id="${uid}-input-${i}"
        onkeydown="if(event.key==='Enter'){document.getElementById('${uid}-input-${i + 1}')?.focus()}">
      <div class="trans-result" id="${uid}-result-${i}">
        <div class="my-ans-label">내 해석</div>
        <div class="ans-box my-ans-box" id="${uid}-my-${i}"></div>
        <div class="model-ans-label">모범 해석</div>
        <div class="ans-box model-ans-box">${esc(s.kr)}</div>
      </div>
    </div>
  `).join('');
}

function buildVocab(uid) {
  const data = DATA[uid];
  const grid = document.getElementById(uid + '-vocab-grid');
  grid.innerHTML = data.vocab.map((v, i) => `
    <div class="vocab-item" id="${uid}-vitem-${i}">
      <div class="vocab-kor">${esc(v.kr)}</div>
      <div style="flex:1">
        <input class="vocab-input" type="text" placeholder="영어로 입력..."
          id="${uid}-vinput-${i}"
          onkeydown="if(event.key==='Enter'){document.getElementById('${uid}-vinput-${i + 1}')?.focus()}">
        <div class="vocab-correct-ans" id="${uid}-vcorrect-${i}">정답: ${esc(v.en)}</div>
      </div>
      <div class="vocab-feedback" id="${uid}-vfb-${i}"></div>
    </div>
  `).join('');
}

// ══════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════
function doLogin() {
  const name = document.getElementById('student-name').value.trim();
  if (!name) { alert('이름을 입력해 주세요!'); return; }
  studentName = name;
  document.getElementById('header-name').textContent = name + ' 학생';
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  buildAll();
}
document.getElementById('student-name').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ══════════════════════════════════════
//  TABS
// ══════════════════════════════════════
function switchUnit(uid, el) {
  document.querySelectorAll('.unit-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.unit-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('unit-' + uid).classList.add('active');
  el.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function switchSection(uid, section, el) {
  const panel = document.getElementById('unit-' + uid);
  panel.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
  panel.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(uid + '-' + section).classList.add('active');
  el.classList.add('active');
}

// ══════════════════════════════════════
//  TRANSLATION
// ══════════════════════════════════════
function showTranslations(uid) {
  DATA[uid].sentences.forEach((s, i) => {
    const myInput = document.getElementById(uid + '-input-' + i);
    const myAns = document.getElementById(uid + '-my-' + i);
    const result = document.getElementById(uid + '-result-' + i);
    myAns.textContent = myInput.value.trim() || '(입력 없음)';
    result.classList.add('show');
    myInput.style.display = 'none';
  });
}

function resetTrans(uid) {
  DATA[uid].sentences.forEach((s, i) => {
    const myInput = document.getElementById(uid + '-input-' + i);
    const result = document.getElementById(uid + '-result-' + i);
    myInput.value = '';
    myInput.style.display = '';
    result.classList.remove('show');
  });
}

// ══════════════════════════════════════
//  VOCAB GRADING
// ══════════════════════════════════════
function gradeVocab(uid) {
  const data = DATA[uid];
  let correct = 0;
  data.vocab.forEach((v, i) => {
    const input = document.getElementById(uid + '-vinput-' + i);
    const item = document.getElementById(uid + '-vitem-' + i);
    const fb = document.getElementById(uid + '-vfb-' + i);
    const userAns = input.value.trim().toLowerCase();
    const correctAnswers = v.en.toLowerCase().split('|').map(a => a.trim());
    const isCorrect = correctAnswers.includes(userAns);
    item.classList.remove('correct', 'wrong');
    if (isCorrect) { item.classList.add('correct'); fb.textContent = '✓'; correct++; }
    else { item.classList.add('wrong'); fb.textContent = '✗'; }
    input.disabled = true;
  });
  const scoreEl = document.getElementById(uid + '-vocab-grid');
  let badge = document.getElementById(uid + '-score-badge');
  if (!badge) {
    badge = document.createElement('div');
    badge.id = uid + '-score-badge';
    badge.className = 'score-badge';
    scoreEl.parentNode.insertBefore(badge, scoreEl);
  }
  badge.textContent = `✔ 점수: ${correct} / ${data.vocab.length}`;
}

function resetVocab(uid) {
  DATA[uid].vocab.forEach((v, i) => {
    const input = document.getElementById(uid + '-vinput-' + i);
    const item = document.getElementById(uid + '-vitem-' + i);
    const fb = document.getElementById(uid + '-vfb-' + i);
    input.value = '';
    input.disabled = false;
    item.classList.remove('correct', 'wrong');
    fb.textContent = '';
  });
  const badge = document.getElementById(uid + '-score-badge');
  if (badge) badge.remove();
}

// ══════════════════════════════════════
//  NOTION SUBMIT
// ══════════════════════════════════════
async function postToNotion(payload, statusEl, doneMsg) {
  statusEl.className = 'notion-status sending';
  statusEl.textContent = '📤 제출 중...';
  try {
    const res = await fetch(NOTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.ok) { statusEl.className = 'notion-status done'; statusEl.textContent = doneMsg; }
    else { throw new Error('서버 오류'); }
  } catch (e) {
    statusEl.className = 'notion-status error';
    statusEl.textContent = '❌ 제출 실패. 다시 시도해 주세요.';
  }
}

async function submitUnit(uid) {
  const data = DATA[uid];
  const statusEl = document.getElementById(uid + '-notion-status');
  let parts = [];
  data.sentences.forEach((s, i) => {
    const myAns = document.getElementById(uid + '-input-' + i)?.value.trim()
      || document.getElementById(uid + '-my-' + i)?.textContent.trim()
      || '';
    if (myAns && myAns !== '(입력 없음)') {
      parts.push(`[문장${i + 1}] 내 해석: ${myAns} / 모범: ${s.kr}`);
    }
  });
  const today = new Date().toISOString().split('T')[0];
  const payload = {
    studentName: studentName,
    school: SCHOOL_NAME,
    grade: GRADE,
    workbook: `${WORKBOOK_NAME} ${data.unit}`,
    category: '해석',
    submitDate: today,
    wrongAnswers: parts.join('\n') || '(제출 없음)',
    score: ''
  };
  await postToNotion(payload, statusEl, '✅ 제출 완료! 선생님께 전달되었어요.');
}

async function submitVocab(uid) {
  const data = DATA[uid];
  const statusEl = document.getElementById(uid + '-vocab-status');
  let wrongParts = [];
  let score = 0;
  const total = data.vocab.length;
  data.vocab.forEach((v, i) => {
    const input = document.getElementById(uid + '-vinput-' + i);
    const userAns = input?.value.trim().toLowerCase() || '';
    const correctAnswers = v.en.toLowerCase().split('|').map(a => a.trim());
    if (correctAnswers.includes(userAns)) { score++; }
    else { wrongParts.push(`${v.kr} → 내 답: ${userAns || '(미입력)'} / 정답: ${v.en}`); }
  });
  const today = new Date().toISOString().split('T')[0];
  const payload = {
    studentName: studentName,
    school: SCHOOL_NAME,
    grade: GRADE,
    workbook: `${WORKBOOK_NAME} ${data.unit}`,
    category: '어휘테스트',
    submitDate: today,
    wrongAnswers: `[점수: ${score}/${total}점]\n` + (wrongParts.length ? wrongParts.join('\n') : '오답 없음'),
    score: ''
  };
  await postToNotion(payload, statusEl, `✅ 제출 완료! ${score}/${total} 결과가 전달되었어요.`);
}
