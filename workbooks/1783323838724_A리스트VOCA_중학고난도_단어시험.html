<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A*List VOCA 중학 고난도 단어시험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a3a5c; --navy-dark:#12283f; --accent:#e8703a; --accent-dark:#d05f2c;
  --bg:#f4f6f9; --card:#ffffff; --line:#e4e9f0; --text:#23303f; --muted:#7c8a9a;
  --ok:#1f9d63; --ok-bg:#e8f7ef; --no:#d8473e; --no-bg:#fdeceb;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);
  line-height:1.6;-webkit-font-smoothing:antialiased;padding:0;}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px;}
.hidden{display:none!important;}

/* header */
.brandbar{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 18px;}
.brandbar .logo{background:var(--navy);color:#fff;font-weight:900;font-size:13px;
  padding:5px 11px;border-radius:8px;letter-spacing:.3px;}
.brandbar .logo span{color:var(--accent);}
.brandbar .sub{color:var(--muted);font-size:13px;font-weight:500;}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:26px 22px;box-shadow:0 6px 24px rgba(26,58,92,.06);}

/* login */
.hero h1{font-size:23px;font-weight:900;color:var(--navy);line-height:1.35;}
.hero .tag{display:inline-block;background:#eef3f9;color:var(--navy);font-size:12px;
  font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:14px;}
.hero p.desc{color:var(--muted);font-size:14px;margin-top:8px;}
label.fld{display:block;font-size:13px;font-weight:700;color:var(--navy);margin:20px 0 7px;}
input[type=text]{width:100%;font-family:inherit;font-size:16px;padding:13px 15px;
  border:1.5px solid var(--line);border-radius:11px;outline:none;background:#fbfcfe;
  transition:border-color .15s,box-shadow .15s;}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,112,58,.13);}

.btn{display:block;width:100%;font-family:inherit;font-weight:800;font-size:16px;
  color:#fff;background:var(--accent);border:none;border-radius:12px;padding:14px;
  cursor:pointer;margin-top:22px;transition:background .15s,transform .05s;}
.btn:hover{background:var(--accent-dark);}
.btn:active{transform:translateY(1px);}
.btn.navy{background:var(--navy);}
.btn.navy:hover{background:var(--navy-dark);}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
.btn.ghost:hover{background:#f4f6f9;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* setup */
.sec-title{font-size:16px;font-weight:900;color:var(--navy);margin:4px 0 4px;}
.sec-note{font-size:12.5px;color:var(--muted);margin-bottom:14px;}
.dir-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;}
.dir-opt{border:1.5px solid var(--line);border-radius:13px;padding:16px 12px;text-align:center;
  cursor:pointer;background:#fbfcfe;transition:.15s;}
.dir-opt .t{font-weight:800;font-size:16px;color:var(--navy);}
.dir-opt .s{font-size:12px;color:var(--muted);margin-top:3px;}
.dir-opt.on{border-color:var(--accent);background:#fff6f1;box-shadow:0 0 0 3px rgba(232,112,58,.12);}
.dir-opt.on .t{color:var(--accent-dark);}

.daygrid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:6px 0 4px;}
@media(max-width:560px){.daygrid{grid-template-columns:repeat(4,1fr);}}
.day{border:1.5px solid var(--line);border-radius:10px;padding:9px 0;text-align:center;
  cursor:pointer;background:#fbfcfe;font-weight:700;font-size:13px;color:var(--navy);
  user-select:none;transition:.12s;}
.day .num{display:block;font-size:15px;font-weight:800;}
.day .cnt{display:block;font-size:10px;color:var(--muted);font-weight:500;}
.day.on{border-color:var(--accent);background:var(--accent);color:#fff;}
.day.on .cnt{color:#ffe6d8;}
.day.dim{opacity:.4;cursor:not-allowed;}
.selinfo{font-size:13px;font-weight:700;color:var(--navy);margin:14px 0 0;text-align:center;}
.selinfo b{color:var(--accent-dark);}

/* quiz */
.qbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;margin:-6px 0 8px;}
.qbar .inner{background:var(--navy);color:#fff;border-radius:12px;padding:11px 16px;
  display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;}
.qbar .inner .dir{background:rgba(255,255,255,.16);padding:3px 10px;border-radius:20px;font-weight:700;}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:11px;}
.q .head{display:flex;gap:10px;align-items:baseline;margin-bottom:9px;}
.q .qn{background:#eef3f9;color:var(--navy);font-weight:800;font-size:12px;border-radius:7px;
  padding:2px 9px;flex:none;}
.q .prompt{font-size:18px;font-weight:700;color:var(--text);word-break:keep-all;}
.q .prompt.eng{font-size:20px;font-weight:800;color:var(--navy);letter-spacing:.2px;}
.q input[type=text]{font-size:15.5px;padding:11px 13px;}

/* result */
.score-card{text-align:center;padding:30px 22px 26px;}
.score-card .label{font-size:13px;color:var(--muted);font-weight:600;}
.score-ring{font-size:54px;font-weight:900;color:var(--accent);line-height:1;margin:6px 0 2px;}
.score-ring small{font-size:22px;color:var(--muted);font-weight:700;}
.score-card .frac{font-size:15px;font-weight:700;color:var(--navy);}
.notion-flag{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  padding:7px 14px;border-radius:20px;margin-top:16px;}
.notion-flag.ok{background:var(--ok-bg);color:var(--ok);}
.notion-flag.wait{background:#fff7e8;color:#b07d18;}
.notion-flag.err{background:var(--no-bg);color:var(--no);}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;}

.review-title{font-size:15px;font-weight:900;color:var(--navy);margin:24px 0 4px;}
.review-sub{font-size:12.5px;color:var(--muted);margin-bottom:12px;}
.rev{border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:9px;background:#fff;}
.rev.ok{border-left:4px solid var(--ok);}
.rev.no{border-left:4px solid var(--no);}
.rev .top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.rev .mark{font-size:12px;font-weight:800;padding:1px 8px;border-radius:6px;flex:none;}
.rev .mark.ok{background:var(--ok-bg);color:var(--ok);}
.rev .mark.no{background:var(--no-bg);color:var(--no);}
.rev .qword{font-weight:800;font-size:15.5px;color:var(--navy);word-break:keep-all;}
.rev .line{font-size:13.5px;margin-top:3px;}
.rev .line .k{display:inline-block;width:62px;color:var(--muted);font-weight:600;font-size:12px;}
.rev .mine.wrong{color:var(--no);font-weight:600;}
.rev .ansv{color:var(--ok);font-weight:700;}
.rev .blank{color:#b9c2cd;font-style:italic;}
.toggle-all{text-align:center;margin:6px 0 2px;}
.toggle-all button{background:none;border:none;color:var(--accent-dark);font-family:inherit;
  font-size:13px;font-weight:700;cursor:pointer;text-decoration:underline;}
.footer-note{text-align:center;color:#b3bcc7;font-size:11px;margin-top:26px;}
.err-msg{color:var(--no);font-size:13px;font-weight:600;text-align:center;margin-top:10px;min-height:18px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="brandbar">
    <span class="logo">A<span>*</span>List</span>
    <span class="sub">도담한영어교실 · 단어시험</span>
  </div>

  <!-- 1. LOGIN -->
  <section id="login" class="card hero">
    <span class="tag">중학 고난도 VOCA · DAY 01~32</span>
    <h1>A*List VOCA<br>영-한 / 한-영 단어시험</h1>
    <p class="desc">이름을 입력하고 시험을 시작하세요. 결과는 자동으로 선생님께 전송됩니다.</p>
    <label class="fld" for="name">이름</label>
    <input type="text" id="name" placeholder="이름을 입력하세요" autocomplete="off">
    <button class="btn" id="toSetup">시작하기</button>
    <div class="err-msg" id="loginErr"></div>
  </section>

  <!-- 2. SETUP -->
  <section id="setup" class="card hidden">
    <div class="sec-title">시험 방향</div>
    <div class="sec-note">출제 방식을 선택하세요.</div>
    <div class="dir-row">
      <div class="dir-opt" data-dir="k2e">
        <div class="t">한 → 영</div><div class="s">뜻 보고 영어 쓰기</div>
      </div>
      <div class="dir-opt" data-dir="e2k">
        <div class="t">영 → 한</div><div class="s">단어 보고 뜻 쓰기</div>
      </div>
    </div>

    <div class="sec-title" style="margin-top:24px;">DAY 선택 <span style="font-weight:700;color:var(--accent-dark);font-size:13px;">(최대 2개)</span></div>
    <div class="sec-note">시험 볼 DAY를 선택하세요. DAY당 20단어입니다.</div>
    <div class="daygrid" id="daygrid"></div>
    <div class="selinfo" id="selInfo">선택된 DAY: <b>없음</b> · 0문항</div>

    <button class="btn" id="startQuiz">시험 시작</button>
    <button class="btn ghost" id="backLogin" style="margin-top:10px;">← 처음으로</button>
    <div class="err-msg" id="setupErr"></div>
  </section>

  <!-- 3. QUIZ -->
  <section id="quiz" class="hidden">
    <div class="qbar"><div class="inner">
      <span id="qbarName"></span>
      <span class="dir" id="qbarDir"></span>
    </div></div>
    <div id="qlist"></div>
    <button class="btn navy" id="gradeBtn">채점하기</button>
    <button class="btn ghost" id="quitQuiz" style="margin-top:10px;">시험 취소</button>
    <div class="err-msg" id="quizErr"></div>
  </section>

  <!-- 4. RESULT -->
  <section id="result" class="hidden">
    <div class="card score-card">
      <div class="label" id="resName"></div>
      <div class="score-ring"><span id="resPct">0</span><small>%</small></div>
      <div class="frac" id="resFrac"></div>
      <div id="notionFlag" class="notion-flag wait"><span class="dot"></span><span id="notionMsg">결과 전송 중...</span></div>
    </div>

    <div class="review-title">결과 리뷰</div>
    <div class="review-sub" id="revSub"></div>
    <div class="toggle-all"><button id="toggleAll">전체 문항 보기</button></div>
    <div id="revlist"></div>

    <button class="btn" id="again" style="margin-top:20px;">다른 DAY 시험 보기</button>
    <button class="btn ghost" id="retry" style="margin-top:10px;">같은 시험 다시 풀기</button>
    <div class="footer-note">A*List VOCA 중학 고난도 · 도담한영어교실</div>
  </section>

</div>

/* ---------- 정규화 & 채점 ---------- */
function normEng(s){
  return (s||"").toLowerCase()
    .replace(/['\u2019"]/g,"")
    .replace(/\[[^\]]*\]/g," ")
    .replace(/\([^)]*\)/g," ")
    .replace(/[^a-z\s]/g," ")
    .replace(/\b(someone|somebody|something|oneself)\b/g," ")
    .replace(/\b[abn]\b/g," ")
    .replace(/\bving\b/g," ")
    .replace(/\b(sb|sth)\b/g," ")
    .replace(/\s+/g," ").trim();
}
function acceptedEng(word){
  const set=new Set();
  word.split("/").forEach(f=>{ const v=normEng(f); if(v) set.add(v); });
  const whole=normEng(word); if(whole) set.add(whole);
  return [...set];
}
function gradeE2 (studentEng, word){
  const s=normEng(studentEng); if(!s) return false;
  return acceptedEng(word).includes(s);
}

function normKor(s){
  return (s||"").replace(/~/g,"").replace(/[\s.,;·…\[\]()\/“”"']/g,"").trim();
}
function expandBrackets(str){
  if(str.indexOf("[")===-1) return [str];
  const a=str.replace(/\[[^\]]*\]/g,"");
  const b=str.replace(/(\S+)?\[([^\]]*)\]/g,"$2");
  return [a,b];
}
function korFragments(m){
  const out=new Set();
  expandBrackets(m).forEach(v=>{
    v=v.replace(/\(\(([^)]*)\)\)/g," ").replace(/\([^)]*\)/g," ").replace(/\d+\./g," ");
    v.split(/[,;·\/…]/).forEach(p=>{
      const f=normKor(p);
      if(f.length>=1) out.add(f);
    });
  });
  return [...out];
}
function gradeK2(studentKor, meaning){
  const s=normKor(studentKor); if(!s) return false;
  const frags=korFragments(meaning);
  for(const a of frags){
    if(s===a) return true;
    if(a.length>=2 && s.length>=2 && (a.includes(s)||s.includes(a))) return true;
  }
  return false;
}

/* ---------- 화면 전환 ---------- */
function show(id){
  ["login","setup","quiz","result"].forEach(s=>document.getElementById(s).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  window.scrollTo(0,0);
}

/* ---------- DAY 그리드 ---------- */
function buildDayGrid(){
  const g=document.getElementById("daygrid"); g.innerHTML="";
  for(let d=1;d<=32;d++){
    const el=document.createElement("div");
    el.className="day"; el.dataset.d=d;
    el.innerHTML=`<span class="num">${d}</span><span class="cnt">DAY</span>`;
    el.addEventListener("click",()=>toggleDay(d,el));
    g.appendChild(el);
  }
}
function toggleDay(d,el){
  if(el.classList.contains("dim")) return;
  const i=state.days.indexOf(d);
  if(i>=0){ state.days.splice(i,1); el.classList.remove("on"); }
  else{
    if(state.days.length>=2) return;
    state.days.push(d); el.classList.add("on");
  }
  refreshDayGrid();
}
function refreshDayGrid(){
  const full=state.days.length>=2;
  document.querySelectorAll(".day").forEach(el=>{
    const d=+el.dataset.d;
    if(full && state.days.indexOf(d)<0) el.classList.add("dim");
    else el.classList.remove("dim");
  });
  const cnt=state.days.length*20;
  const label = state.days.length ? state.days.slice().sort((a,b)=>a-b).map(d=>"DAY "+d).join(", ") : "없음";
  document.getElementById("selInfo").innerHTML=`선택된 DAY: <b>${label}</b> · ${cnt}문항`;
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
document.getElementById("startQuiz").addEventListener("click",()=>{
  const err=document.getElementById("setupErr");
  if(!state.dir){ err.textContent="시험 방향을 선택해 주세요."; return; }
  if(!state.days.length){ err.textContent="DAY를 1개 이상 선택해 주세요."; return; }
  err.textContent="";
  let pool=WORDS.filter(w=>state.days.indexOf(w.d)>=0);
  state.quiz=shuffle(pool.slice()).map(w=>({...w,ans:""}));
  state.graded=false;
  renderQuiz();
  show("quiz");
});

function renderQuiz(){
  const dirTxt = state.dir==="k2e" ? "한 → 영" : "영 → 한";
  document.getElementById("qbarName").textContent = state.name + " 님";
  document.getElementById("qbarDir").textContent = dirTxt;
  const list=document.getElementById("qlist"); list.innerHTML="";
  state.quiz.forEach((q,idx)=>{
    const div=document.createElement("div"); div.className="q";
    const prompt = state.dir==="k2e" ? q.m : q.w;
    const pCls = state.dir==="k2e" ? "prompt" : "prompt eng";
    const ph = state.dir==="k2e" ? "영어 단어 입력" : "한글 뜻 입력";
    div.innerHTML =
      `<div class="head"><span class="qn">${idx+1}</span><span class="${pCls}">${escapeHtml(prompt)}</span></div>`+
      `<input type="text" data-idx="${idx}" placeholder="${ph}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
    list.appendChild(div);
  });
  list.querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("input",e=>{ state.quiz[+e.target.dataset.idx].ans=e.target.value; });
    inp.addEventListener("keydown",e=>{
      if(e.key==="Enter"){
        e.preventDefault();
        const ins=list.querySelectorAll("input"); const i=+e.target.dataset.idx;
        if(ins[i+1]) ins[i+1].focus(); else document.getElementById("gradeBtn").focus();
      }
    });
  });
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

document.getElementById("quitQuiz").addEventListener("click",()=>{ show("setup"); });

/* ---------- 채점 ---------- */
document.getElementById("gradeBtn").addEventListener("click",()=>{
  const blanks=state.quiz.filter(q=>!q.ans.trim()).length;
  if(blanks>0 && !confirm(`아직 ${blanks}문항이 비어 있습니다. 채점할까요?`)) return;

  let correct=0; const results=[];
  state.quiz.forEach(q=>{
    const ok = state.dir==="k2e" ? gradeE2(q.ans,q.w) : gradeK2(q.ans,q.m);
    if(ok) correct++;
    results.push({ n:q.n, d:q.d, w:q.w, m:q.m, ans:q.ans.trim(), ok });
  });
  const total=state.quiz.length;
  const pct=Math.round(correct/total*100);
  state.lastResult={correct,total,pct,results};
  state.graded=true;
  renderResult();
  show("result");
  submitNotion();
});

function renderResult(){
  const r=state.lastResult;
  document.getElementById("resName").textContent=state.name+" 님 · "+(state.dir==="k2e"?"한→영":"영→한")+" · "+state.days.slice().sort((a,b)=>a-b).map(d=>"DAY "+d).join(", ");
  document.getElementById("resPct").textContent=r.pct;
  document.getElementById("resFrac").textContent=`${r.correct} / ${r.total} 정답`;
  const wrong=r.results.filter(x=>!x.ok).length;
  document.getElementById("revSub").textContent = wrong? `오답 ${wrong}문항 — 정답을 확인하세요.` : "모든 문항을 맞혔습니다! 🎉";
  document.getElementById("toggleAll").textContent = state.showAll ? "오답만 보기" : "전체 문항 보기";
  renderReview();
}
function renderReview(){
  const r=state.lastResult; const box=document.getElementById("revlist"); box.innerHTML="";
  const items = state.showAll ? r.results : r.results.filter(x=>!x.ok);
  if(!items.length){ box.innerHTML=`<div class="rev ok"><div class="line" style="color:var(--ok);font-weight:700;">표시할 문항이 없습니다.</div></div>`; return; }
  items.forEach(x=>{
    const div=document.createElement("div");
    div.className="rev "+(x.ok?"ok":"no");
    const mark = x.ok?'<span class="mark ok">정답</span>':'<span class="mark no">오답</span>';
    const mine = x.ans ? `<span class="mine ${x.ok?'':'wrong'}">${escapeHtml(x.ans)}</span>` : `<span class="blank">미작성</span>`;
    const correctVal = state.dir==="k2e" ? x.w : x.m;
    div.innerHTML =
      `<div class="top">${mark}<span class="qword">${escapeHtml(state.dir==="k2e"?x.m:x.w)}</span></div>`+
      `<div class="line"><span class="k">내 답</span>${mine}</div>`+
      `<div class="line"><span class="k">정답</span><span class="ansv">${escapeHtml(correctVal)}</span></div>`;
    box.appendChild(div);
  });
}
document.getElementById("toggleAll").addEventListener("click",()=>{ state.showAll=!state.showAll; renderResult(); });

/* ---------- Notion 전송 ---------- */
function setFlag(cls,msg){
  const f=document.getElementById("notionFlag"); f.className="notion-flag "+cls;
  document.getElementById("notionMsg").textContent=msg;
}
function buildWrongText(){
  const r=state.lastResult;
  const dirTxt = state.dir==="k2e" ? "한→영" : "영→한";
  const dayTxt = state.days.slice().sort((a,b)=>a-b).map(d=>"DAY "+d).join(", ");
  const wrongs=r.results.filter(x=>!x.ok);
  let lines=[`[점수: ${r.pct}점 (${r.correct}/${r.total})]`, `[범위: ${dayTxt} · ${dirTxt}]`];
  if(!wrongs.length){ lines.push("오답 없음 — 전부 정답"); }
  else{
    wrongs.forEach((x,i)=>{
      const q = state.dir==="k2e" ? x.m : x.w;
      const a = state.dir==="k2e" ? x.w : x.m;
      const mine = x.ans || "(미작성)";
      lines.push(`${i+1}. ${x.w} | 문제: ${q} | 내답: ${mine} | 정답: ${a}`);
    });
  }
  return lines.join("\n");
}
function submitNotion(){
  setFlag("wait","결과 전송 중...");
  const payload={
    studentName: state.name,
    school: "",
    grade: "",
    workbook: WB_NAME,
    category: "어휘",
    submitDate: new Date().toISOString().split("T")[0],
    wrongAnswers: buildWrongText()
  };
  fetch(NOTION_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  }).then(res=>{
    if(res.ok) setFlag("ok","결과가 선생님께 전송되었습니다");
    else setFlag("err","전송 실패 (선생님께 문의하세요)");
  }).catch(()=>{ setFlag("err","전송 실패 — 네트워크 확인 후 다시 시도"); });
}

/* ---------- 다시하기 ---------- */
document.getElementById("again").addEventListener("click",()=>{
  state.showAll=false; show("setup");
});
document.getElementById("retry").addEventListener("click",()=>{
  state.showAll=false;
  state.quiz=shuffle(state.quiz.map(q=>({...q,ans:""})));
  state.graded=false;
  renderQuiz(); show("quiz");
});

/* init */
buildDayGrid();
</script>
