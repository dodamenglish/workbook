<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리딩마스터 중등 Lv1 — 온라인 워크북</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a3a5c;
    --accent: #e8703a;
    --accent-light: #fff0e8;
    --bg: #f4f6f9;
    --surface: #ffffff;
    --card: #f9fafb;
    --border: #dde3ec;
    --text: #1e2d3d;
    --muted: #6b7f96;
    --correct: #1a8a4a;
    --correct-bg: #edfaf2;
    --wrong: #c0392b;
    --wrong-bg: #fdf0ef;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: var(--primary);
    padding: 24px 20px 20px;
    text-align: center;
    border-bottom: 4px solid var(--accent);
  }
  .header-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .header h1 {
    font-size: clamp(18px, 4vw, 26px);
    font-weight: 900;
    color: #fff;
    letter-spacing: -0.5px;
  }
  .header h1 span { color: var(--accent); }
  .header-sub {
    margin-top: 6px;
    font-size: 12px;
    color: rgba(255,255,255,0.5);
  }

  /* ── LOGIN ── */
  #loginSection {
    max-width: 400px;
    margin: 48px auto;
    padding: 0 16px;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px;
    box-shadow: 0 4px 20px rgba(26,58,92,0.08);
  }
  .login-card h2 {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 24px;
    color: var(--primary);
    text-align: center;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .form-group input, .form-group select {
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 13px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    transition: border-color .2s;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--accent);
  }
  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity .2s, transform .1s;
  }
  .btn-primary:hover { opacity: .88; }
  .btn-primary:active { transform: scale(.98); }

  /* ── MAIN ── */
  #mainContent { display: none; max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }

  /* ── STUDENT BADGE ── */
  .student-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 40px;
    padding: 7px 16px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(26,58,92,0.07);
  }
  .student-badge strong { color: var(--primary); }

  /* ── UNIT NAV ── */
  .unit-nav-wrap { margin-bottom: 14px; }
  .unit-nav-title {
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 8px;
  }
  .unit-nav {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
    scrollbar-width: thin;
  }
  .unit-chip {
    flex: 0 0 auto;
    min-width: 92px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    text-align: left;
    transition: border-color .2s, background .2s;
    position: relative;
  }
  .unit-chip:hover { border-color: var(--accent); }
  .unit-chip.active { border-color: var(--accent); background: var(--accent-light); }
  .unit-chip .uc-num { font-size: 13px; font-weight: 900; color: var(--primary); }
  .unit-chip.active .uc-num { color: var(--accent); }
  .unit-chip .uc-type { font-size: 10px; color: var(--muted); margin-top: 1px; white-space: nowrap; }
  .unit-chip .uc-progress {
    position: absolute; top: 6px; right: 8px;
    font-size: 9px; font-weight: 700; color: var(--correct);
  }

  /* ── TABS ── */
  .tab-nav {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(26,58,92,0.06);
  }
  .tab-btn {
    flex: 1;
    padding: 14px 12px;
    border: none;
    background: transparent;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: background .2s, color .2s;
    border-bottom: 3px solid transparent;
    position: relative;
  }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: var(--accent-light);
  }
  .tab-btn .tab-label { display: block; font-size: 11px; font-weight: 400; color: inherit; opacity: .7; margin-top: 2px; }
  .tab-done-badge {
    display: inline-block;
    background: var(--correct);
    color: #fff;
    font-size: 10px;
    border-radius: 10px;
    padding: 1px 6px;
    margin-left: 5px;
    vertical-align: middle;
    font-weight: 700;
  }
  .reading-panel { display: none; }
  .reading-panel.active { display: block; }

  /* ── SECTION CARD ── */
  .section-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 20px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(26,58,92,0.06);
  }
  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  .section-num {
    width: 30px; height: 30px;
    background: var(--primary);
    color: #fff;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 900;
    flex-shrink: 0;
  }
  .section-title { font-size: 15px; font-weight: 700; }
  .section-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .section-body { padding: 18px; }

  /* ── VOCAB ── */
  .vocab-grid { display: grid; gap: 8px; }
  .vocab-item {
    display: grid;
    grid-template-columns: 28px 1fr 1fr 24px;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    transition: border-color .2s;
  }
  .vocab-item.correct-item { border-color: var(--correct); background: var(--correct-bg); }
  .vocab-item.wrong-item   { border-color: var(--wrong); background: var(--wrong-bg); }
  .vocab-num { font-size: 11px; color: var(--muted); text-align: center; font-weight: 700; }
  .vocab-word { font-size: 14px; font-weight: 700; color: var(--primary); }
  .vocab-input {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    color: var(--text);
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    transition: border-color .2s;
    width: 100%;
  }
  .vocab-input:focus { border-color: var(--accent); }
  .vocab-input:disabled { background: transparent; border-color: transparent; }
  .vocab-feedback { font-size: 16px; text-align: center; }

  /* ── SENTENCES ── */
  .sentence-item {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    transition: border-color .2s;
  }
  .sentence-item.correct-item { border-color: var(--correct); background: var(--correct-bg); }
  .sentence-item.wrong-item   { border-color: var(--wrong); background: var(--wrong-bg); }
  .sentence-en {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--primary);
    margin-bottom: 9px;
    line-height: 1.65;
  }
  .sentence-en .line-num { font-size: 11px; color: var(--muted); margin-right: 5px; }
  .sentence-input {
    width: 100%;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    transition: border-color .2s;
    resize: none;
  }
  .sentence-input:focus { border-color: var(--accent); }
  .sentence-input:disabled { background: transparent; border-color: transparent; }
  .sentence-feedback { margin-top: 7px; font-size: 12px; display: none; }
  .sentence-feedback.show { display: block; }
  .feedback-correct { color: var(--correct); font-weight: 700; }
  .feedback-wrong   { color: var(--wrong); font-weight: 700; }
  .feedback-answer  { color: var(--muted); margin-top: 4px; line-height: 1.6; }

  /* ── ACTION / SCORE ── */
  .action-area { text-align: center; margin-top: 14px; }
  .btn-grade {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px 32px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: opacity .2s;
  }
  .btn-grade:hover { opacity: .85; }
  .btn-grade:disabled { opacity: .4; cursor: not-allowed; }
  .score-box {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-top: 14px;
    text-align: center;
  }
  .score-box.show { display: block; }
  .score-num { font-size: 36px; font-weight: 900; line-height: 1; }
  .score-num.high { color: var(--correct); }
  .score-num.mid  { color: #d4a017; }
  .score-num.low  { color: var(--wrong); }
  .score-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* ── SUBMIT AREA ── */
  .submit-area {
    margin-top: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(26,58,92,0.06);
  }
  .submit-title {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .btn-submit-notion {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px 44px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
    box-shadow: 0 4px 14px rgba(232,112,58,0.3);
  }
  .btn-submit-notion:hover { opacity: .88; transform: translateY(-1px); }
  .btn-submit-notion:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
  .submit-status {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
  }
  .submit-status.ok  { color: var(--correct); font-weight: 700; }
  .submit-status.err { color: var(--wrong); }

  @media (max-width: 480px) {
    .vocab-item { grid-template-columns: 24px 1fr 22px; }
    .vocab-word { grid-column: 1 / -1; padding-left: 24px; margin-top: -4px; font-size: 13px; }
    .vocab-input { grid-column: 1 / -1; }
    .vocab-num { grid-row: 1; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-label">도담한영어교실 · 리딩마스터 수능내신 중등</div>
  <h1>리딩 <span>마스터</span> Lv1 온라인 워크북</h1>
  <div class="header-sub">수업에서 나간 Unit · Reading을 골라 어휘·해석 과제를 풀고 제출하세요</div>
</div>

<!-- LOGIN -->
<div id="loginSection">
  <div class="login-card">
    <h2>📖 학생 로그인</h2>
    <div class="form-group">
      <label>이름</label>
      <input type="text" id="inputName" placeholder="이름을 입력하세요">
    </div>
    <div class="form-group">
      <label>학교</label>
      <input type="text" id="inputSchool" placeholder="학교 이름">
    </div>
    <div class="form-group">
      <label>학년</label>
      <select id="inputGrade">
        <option value="">선택</option>
        <option value="중1">중1</option>
        <option value="중2">중2</option>
        <option value="중3">중3</option>
      </select>
    </div>
    <button class="btn-primary" onclick="doLogin()">시작하기</button>
  </div>
</div>

<!-- MAIN -->
<div id="mainContent">
  <div class="student-badge" id="studentBadge"></div>

  <!-- UNIT NAV -->
  <div class="unit-nav-wrap">
    <div class="unit-nav-title">📚 Unit 선택 — 수업한 곳을 고르세요</div>
    <div class="unit-nav" id="unitNav"></div>
  </div>

  <!-- READING TABS -->
  <div class="tab-nav" id="readingTabs"></div>

  <!-- READING PANELS -->
  <div id="readingPanels"></div>

</div><!-- /mainContent -->

<script>
// ══════════════════════════════════════════
// DATA  (리딩 1개 = 객체 1개, 순서 = Reading 번호 순)
// ══════════════════════════════════════════

const DATA = [
  // ══════════ Unit 01 · 주제 파악하기 ══════════

  // ── Reading 01: Polar Bears ──
  {
    unit: 'Unit 01', unitTitle: '주제 파악하기',
    readingNo: 'Reading 01', title: 'Polar Bears',
    workbook: 'Polar Bears', category: '주제 파악하기',
    vocab: [
      { word: 'warm-blooded',   answers: ['온혈의','온혈','따뜻한 피의'] },
      { word: 'freezing',       answers: ['너무 추운','영하의','영하','꽁꽁 얼게 추운'] },
      { word: 'Arctic',         answers: ['북극','북극 지방'] },
      { word: 'temperature',    answers: ['온도','기온'] },
      { word: 'thanks to',      answers: ['~ 덕분에','덕분에','덕분'] },
      { word: 'clear',          answers: ['투명한','투명','맑은'] },
      { word: 'colorless',      answers: ['무색의','무색','색이 없는'] },
      { word: 'empty',          answers: ['비어 있는','빈','비어있는'] },
      { word: 'be filled with', answers: ['~로 가득 차다','가득 차다','가득 차','가득 찬'] },
      { word: 'trap',           answers: ['가두다','가두','붙잡다','가둔다'] },
      { word: 'come off',       answers: ['떨어지다','떨어져','벗겨지다'] },
      { word: 'stop A from B',  answers: ['A가 B하는 것을 막다','막다','막','~하는 것을 막다'] },
      { word: 'underneath',     answers: ['~의 밑에','밑에','아래에','밑','아래'] },
      { word: 'soak up',        answers: ['빨아들이다','흡수하다','흡수','빨아들여'] },
      { word: 'thick',          answers: ['두꺼운','두꺼','울창한'] },
      { word: 'layer',          answers: ['층','겹'] },
      { word: 'body fat',       answers: ['체지방','지방'] },
    ],
    sentences: [
      { en: "Polar bears are warm-blooded animals, but they don't feel cold in the freezing Arctic temperatures.",
        answer: '북극곰은 온혈 동물이지만, 영하의 북극 기온에서도 추위를 느끼지 않는다.',
        keywords: [['북극곰','polar bear'],['온혈','따뜻한 피','warm'],['춥','추위','추워','cold','느끼지 않'],['북극','Arctic','영하','freezing']] },
      { en: 'They keep warm in the Arctic thanks to their special hair and black skin.',
        answer: '그들은 특별한 털과 검은 피부 덕분에 북극에서 따뜻하게 지낸다.',
        keywords: [['따뜻','warm'],['털','hair'],['검','black'],['피부','skin'],['덕분','thanks']] },
      { en: 'First, their hair is mostly clear and colorless, like an empty tube.',
        answer: '첫째, 그들의 털은 대부분 투명하고 무색이며, 빈 관과 같다.',
        keywords: [['첫','first'],['털','hair'],['투명','맑','clear'],['무색','색이 없','colorless'],['빈','empty','관','튜브','tube']] },
      { en: "The hair is filled with air, and it traps the sun's heat.",
        answer: '그 털은 공기로 가득 차 있고, 태양의 열을 가둔다.',
        keywords: [['털','hair'],['공기','air','가득','filled'],['가둔','가두','trap'],['태양','열','sun','heat','햇']] },
      { en: "Polar bears' hair is also oily.",
        answer: '북극곰의 털은 또한 기름기가 있다.',
        keywords: [['털','hair'],['기름','oily']] },
      { en: 'When they shake their body after swimming, the water comes off their body right away.',
        answer: '수영 후에 몸을 흔들면, 물이 몸에서 바로 떨어진다.',
        keywords: [['수영','헤엄','swim'],['흔들','shake'],['물','water'],['떨어','벗겨','come off','바로','right away']] },
      { en: 'This stops them from getting wet.',
        answer: '이것은 그들이 젖는 것을 막아준다.',
        keywords: [['젖','wet'],['막','방지','stop']] },
      { en: 'Second, polar bears have black skin underneath their fur.',
        answer: '둘째, 북극곰은 털 아래에 검은 피부를 가지고 있다.',
        keywords: [['둘째','second'],['검','black'],['피부','skin'],['아래','밑','underneath','털','fur']] },
      { en: "It soaks up the sunlight, so they don't easily get cold.",
        answer: '그것은 햇빛을 흡수해서, 그들은 쉽게 추워지지 않는다.',
        keywords: [['햇빛','흡수','빨아들','soak','sunlight','햇'],['쉽','easily'],['춥','추워','cold']] },
      { en: 'Moreover, underneath the black skin is a thick layer of body fat.',
        answer: '게다가, 검은 피부 아래에는 두꺼운 체지방 층이 있다.',
        keywords: [['게다가','더','moreover'],['검','피부','black','skin'],['두꺼','thick'],['체지방','지방','fat'],['층','겹','layer']] },
      { en: 'It keeps them warm while swimming.',
        answer: '그것은 수영하는 동안 그들을 따뜻하게 유지해준다.',
        keywords: [['따뜻','warm'],['수영','헤엄','swim'],['동안','while','유지','keep']] },
    ]
  },

  // ── Reading 02: Iguazú National Park ──
  {
    unit: 'Unit 01', unitTitle: '주제 파악하기',
    readingNo: 'Reading 02', title: 'Iguazú National Park',
    workbook: 'Iguazú National Park', category: '주제 파악하기',
    vocab: [
      { word: 'national park',  answers: ['국립공원'] },
      { word: 'activity',       answers: ['활동', '활동들'] },
      { word: 'waterfall',      answers: ['폭포', '폭포들'] },
      { word: 'experience',     answers: ['경험하다', '경험'] },
      { word: 'highest',        answers: ['가장 높은', '최고의'] },
      { word: 'helicopter',     answers: ['헬리콥터'] },
      { word: 'trail',          answers: ['산책로', '오솔길', '트레일', '길'] },

// ══════════════════════════════════════════
// DERIVE UNITS (그룹핑)
// ══════════════════════════════════════════
const UNITS = [];
DATA.forEach((d, gi) => {
  d._gi = gi;
  let u = UNITS.find(x => x.unit === d.unit);
  if (!u) { u = { unit: d.unit, unitTitle: d.unitTitle, readings: [] }; UNITS.push(u); }
  u.readings.push(d);
});

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let student = { name:'', school:'', grade:'' };
let activeUnitIdx = 0;
let activeGi = 0;

const state = DATA.map(() => ({
  vocabGraded: false, sentenceGraded: false,
  vocabWrong: [], sentenceWrong: [],
  vocabScore: 0, sentenceScore: 0, submitted: false
}));

// ══════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════
function doLogin() {
  const n = document.getElementById('inputName').value.trim();
  const s = document.getElementById('inputSchool').value.trim();
  const g = document.getElementById('inputGrade').value;
  if (!n || !s || !g) { alert('이름, 학교, 학년을 모두 입력해 주세요.'); return; }
  student = { name: n, school: s, grade: g };
  document.getElementById('loginSection').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
  document.getElementById('studentBadge').innerHTML = `👤 <strong>${n}</strong> · ${s} · ${g}`;
  buildUnitNav();
  buildAllPanels();
  selectUnit(0);
}

// ══════════════════════════════════════════
// UNIT NAV
// ══════════════════════════════════════════
function buildUnitNav() {
  const nav = document.getElementById('unitNav');
  nav.innerHTML = '';
  UNITS.forEach((u, ui) => {
    const num = u.unit.replace('Unit ', '');
    nav.innerHTML += `
      <button class="unit-chip" id="unitChip${ui}" onclick="selectUnit(${ui})">
        <span class="uc-num">Unit ${num}</span>
        <span class="uc-type">${u.unitTitle}</span>
        <span class="uc-progress" id="unitProg${ui}"></span>
      </button>`;
  });
}

function selectUnit(ui) {
  activeUnitIdx = ui;
  UNITS.forEach((_, i) =>
    document.getElementById(`unitChip${i}`).classList.toggle('active', i === ui));
  buildReadingTabs();
  selectReading(UNITS[ui].readings[0]._gi);
}

// ══════════════════════════════════════════
// READING TABS
// ══════════════════════════════════════════
function buildReadingTabs() {
  const wrap = document.getElementById('readingTabs');
  wrap.innerHTML = '';
  UNITS[activeUnitIdx].readings.forEach(d => {
    const gi = d._gi;
    const done = state[gi].submitted ? '<span class="tab-done-badge">완료</span>' : '';
    wrap.innerHTML += `
      <button class="tab-btn" id="tabBtn${gi}" onclick="selectReading(${gi})">
        ${d.readingNo}${done}
        <span class="tab-label">${d.title}</span>
      </button>`;
  });
}

function selectReading(gi) {
  activeGi = gi;
  DATA.forEach((_, i) => {
    const p = document.getElementById(`panel${i}`);
    if (p) p.classList.toggle('active', i === gi);
    const t = document.getElementById(`tabBtn${i}`);
    if (t) t.classList.toggle('active', i === gi);
  });
}

// ══════════════════════════════════════════
// BUILD PANELS
// ══════════════════════════════════════════
function buildAllPanels() {
  const root = document.getElementById('readingPanels');
  root.innerHTML = '';
  DATA.forEach((d, gi) => {
    root.innerHTML += `
      <div class="reading-panel" id="panel${gi}">
        <div class="section-card">
          <div class="section-header">
            <div class="section-num">01</div>
            <div>
              <div class="section-title">어휘 TEST</div>
              <div class="section-desc">영어 단어의 우리말 뜻을 써보세요</div>
            </div>
          </div>
          <div class="section-body">
            <div class="vocab-grid" id="vocabGrid${gi}"></div>
            <div class="action-area">
              <button class="btn-grade" id="btnVocab${gi}" onclick="gradeVocab(${gi})">채점하기</button>
              <div class="score-box" id="vocabScore${gi}">
                <div class="score-num" id="vocabScoreNum${gi}">—</div>
                <div class="score-label" id="vocabScoreLabel${gi}"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="section-card">
          <div class="section-header">
            <div class="section-num">02</div>
            <div>
              <div class="section-title">문장 해석 TEST</div>
              <div class="section-desc">각 문장을 우리말로 해석하세요 (핵심 키워드 포함 시 정답)</div>
            </div>
          </div>
          <div class="section-body">
            <div id="sentenceList${gi}"></div>
            <div class="action-area">
              <button class="btn-grade" id="btnSentence${gi}" onclick="gradeSentences(${gi})">채점하기</button>
              <div class="score-box" id="sentenceScore${gi}">
                <div class="score-num" id="sentenceScoreNum${gi}">—</div>
                <div class="score-label" id="sentenceScoreLabel${gi}"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="submit-area">
          <div class="submit-title">어휘 + 해석 TEST를 모두 채점하면 제출할 수 있습니다.</div>
          <button class="btn-submit-notion" id="btnNotion${gi}" onclick="submitToNotion(${gi})" disabled>📤 오답 제출하기 (${d.readingNo})</button>
          <div class="submit-status" id="notionStatus${gi}">채점 후 제출할 수 있습니다</div>
        </div>
      </div>`;
  });
  DATA.forEach((_, gi) => { buildVocab(gi); buildSentences(gi); });
}

function buildVocab(gi) {
  const grid = document.getElementById(`vocabGrid${gi}`);
  grid.innerHTML = '';
  DATA[gi].vocab.forEach((v, i) => {
    grid.innerHTML += `
      <div class="vocab-item" id="vi${gi}_${i}">
        <div class="vocab-num">${String(i+1).padStart(2,'0')}</div>
        <div class="vocab-word">${v.word}</div>
        <input class="vocab-input" id="vInput${gi}_${i}" type="text" placeholder="뜻 입력"
          onkeydown="if(event.key==='Enter'){document.getElementById('vInput${gi}_${i+1}')?.focus()}">
        <div class="vocab-feedback" id="vFb${gi}_${i}"></div>
      </div>`;
  });
}

function buildSentences(gi) {
  const list = document.getElementById(`sentenceList${gi}`);
  list.innerHTML = '';
  DATA[gi].sentences.forEach((s, i) => {
    list.innerHTML += `
      <div class="sentence-item" id="si${gi}_${i}">
        <div class="sentence-en"><span class="line-num">${i+1}.</span>${s.en}</div>
        <textarea class="sentence-input" id="sInput${gi}_${i}" rows="2" placeholder="우리말 해석을 써보세요"></textarea>
        <div class="sentence-feedback" id="sFb${gi}_${i}"></div>
      </div>`;
  });
}

// ══════════════════════════════════════════
// GRADE
// ══════════════════════════════════════════
function normalize(str) {
  return str.replace(/\s+/g,'').replace(/[·,\-\(\)]/g,'').toLowerCase();
}

function gradeVocab(gi) {
  const st = state[gi];
  st.vocabWrong = [];
  let correct = 0;
  DATA[gi].vocab.forEach((v, i) => {
    const inp  = document.getElementById(`vInput${gi}_${i}`);
    const item = document.getElementById(`vi${gi}_${i}`);
    const fb   = document.getElementById(`vFb${gi}_${i}`);
    const val  = inp.value.trim();
    const norm = normalize(val);
    const isOk = val !== '' && v.answers.some(a => {
      const na = normalize(a);
      return na === norm || na.includes(norm) || norm.includes(na.substring(0, Math.max(2, na.length - 1)));
    });
    if (isOk) {
      correct++;
      item.classList.add('correct-item');
      fb.textContent = '✓'; fb.style.color = 'var(--correct)';
    } else {
      item.classList.add('wrong-item');
      fb.textContent = '✗'; fb.style.color = 'var(--wrong)';
      st.vocabWrong.push({ word: v.word, student: val || '(미입력)', answer: v.answers[0] });
    }
    inp.disabled = true;
  });
  st.vocabScore = Math.round(correct / DATA[gi].vocab.length * 100);
  const num = document.getElementById(`vocabScoreNum${gi}`);
  num.textContent = `${correct} / ${DATA[gi].vocab.length}`;
  num.className = 'score-num ' + (correct >= DATA[gi].vocab.length * .8 ? 'high' : correct >= DATA[gi].vocab.length * .5 ? 'mid' : 'low');
  document.getElementById(`vocabScoreLabel${gi}`).textContent = `점수: ${st.vocabScore}점`;
  document.getElementById(`vocabScore${gi}`).classList.add('show');
  document.getElementById(`btnVocab${gi}`).disabled = true;
  st.vocabGraded = true;
  checkReady(gi);
}

function gradeSentences(gi) {
  const st = state[gi];
  st.sentenceWrong = [];
  let correct = 0;
  DATA[gi].sentences.forEach((s, i) => {
    const inp  = document.getElementById(`sInput${gi}_${i}`);
    const item = document.getElementById(`si${gi}_${i}`);
    const fb   = document.getElementById(`sFb${gi}_${i}`);
    const val  = inp.value.trim();
    const hit  = s.keywords.filter(group => group.some(kw => val.includes(kw))).length;
    const threshold = Math.max(1, s.keywords.length - 1);
    const isOk = val !== '' && hit >= threshold;
    item.classList.add(isOk ? 'correct-item' : 'wrong-item');
    fb.classList.add('show');
    if (isOk) {
      correct++;
      fb.innerHTML = `<span class="feedback-correct">✓ 정답</span>`;
    } else {
      fb.innerHTML = `<span class="feedback-wrong">✗ 오답</span><div class="feedback-answer">📌 모범 해석: ${s.answer}</div>`;
      st.sentenceWrong.push({ en: s.en, student: val || '(미입력)', answer: s.answer });
    }
    inp.disabled = true;
  });
  st.sentenceScore = Math.round(correct / DATA[gi].sentences.length * 100);
  const num = document.getElementById(`sentenceScoreNum${gi}`);
  num.textContent = `${correct} / ${DATA[gi].sentences.length}`;
  num.className = 'score-num ' + (correct >= DATA[gi].sentences.length * .8 ? 'high' : correct >= DATA[gi].sentences.length * .5 ? 'mid' : 'low');
  document.getElementById(`sentenceScoreLabel${gi}`).textContent = `점수: ${st.sentenceScore}점`;
  document.getElementById(`sentenceScore${gi}`).classList.add('show');
  document.getElementById(`btnSentence${gi}`).disabled = true;
  st.sentenceGraded = true;
  checkReady(gi);
}

function checkReady(gi) {
  const st = state[gi];
  if (st.vocabGraded && st.sentenceGraded) {
    document.getElementById(`btnNotion${gi}`).disabled = false;
    document.getElementById(`notionStatus${gi}`).textContent = '채점 완료! 오답 내용을 선생님께 제출합니다.';
  }
}

// ══════════════════════════════════════════
// NOTION SUBMIT
// ══════════════════════════════════════════
async function submitToNotion(gi) {
  const btn    = document.getElementById(`btnNotion${gi}`);
  const status = document.getElementById(`notionStatus${gi}`);
  btn.disabled = true;
  status.textContent = '제출 중...';
  status.className = 'submit-status';

  const st = state[gi];
  const totalScore = Math.round((st.vocabScore + st.sentenceScore) / 2);
  const today = new Date().toISOString().split('T')[0];

  let wrongText = `[점수: ${totalScore}점]\n`;
  if (st.vocabWrong.length > 0) {
    wrongText += `\n【어휘 오답】\n`;
    st.vocabWrong.forEach(w => {
      wrongText += `• ${w.word} → 학생: "${w.student}" / 정답: "${w.answer}"\n`;
    });
  }
  if (st.sentenceWrong.length > 0) {
    wrongText += `\n【해석 오답】\n`;
    st.sentenceWrong.forEach(w => {
      wrongText += `• [EN] ${w.en}\n  학생: "${w.student}"\n  정답: "${w.answer}"\n`;
    });
  }
  if (st.vocabWrong.length === 0 && st.sentenceWrong.length === 0) {
    wrongText += '\n오답 없음 (만점)';
  }

  const payload = {
    studentName: student.name,
    school: student.school,
    grade: student.grade,
    workbook: `${DATA[gi].unit} ${DATA[gi].readingNo} · ${DATA[gi].workbook}`,
    category: DATA[gi].category,
    submitDate: today,
    wrongAnswers: wrongText,
    score: totalScore,
  };

  try {
    const res = await fetch('https://dodamenglish.netlify.app/.netlify/functions/notion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (res.ok) {
      status.textContent = '✅ 제출 완료! 선생님께 오답이 전달되었습니다.';
      status.className = 'submit-status ok';
      st.submitted = true;
      markDone(gi);
    } else {
      throw new Error('서버 오류 ' + res.status);
    }
  } catch (e) {
    status.textContent = '❌ 제출 실패: ' + e.message;
    status.className = 'submit-status err';
    btn.disabled = false;
  }
}

function markDone(gi) {
  // reading tab 완료 배지
  const tabBtn = document.getElementById(`tabBtn${gi}`);
  if (tabBtn && !tabBtn.querySelector('.tab-done-badge')) {
    const badge = document.createElement('span');
    badge.className = 'tab-done-badge';
    badge.textContent = '완료';
    tabBtn.insertBefore(badge, tabBtn.querySelector('.tab-label'));
  }
  // unit chip 진행률
  const u = UNITS[activeUnitIdx];
  const doneCount = u.readings.filter(d => state[d._gi].submitted).length;
  const prog = document.getElementById(`unitProg${activeUnitIdx}`);
  if (prog) prog.textContent = doneCount === u.readings.length ? '✓' : `${doneCount}/${u.readings.length}`;
}
