<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중2 YBM(박준언) 3과 PRE-STEP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap');

  :root {
    --primary: #2563eb;
    --primary-light: #dbeafe;
    --primary-dark: #1d4ed8;
    --success: #16a34a;
    --success-light: #dcfce7;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --warn: #d97706;
    --warn-light: #fef3c7;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-300: #d1d5db;
    --gray-500: #6b7280;
    --gray-700: #374151;
    --gray-900: #111827;
    --section-vocab: #7c3aed;
    --section-grammar: #0891b2;
    --section-dialog: #059669;
    --section-reading: #dc2626;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #f0f4f8;
    color: var(--gray-900);
    min-height: 100vh;
  }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%);
    padding: 20px;
  }
  .login-card {
    background: white;
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 32px rgba(37,99,235,0.12);
    text-align: center;
  }
  .login-card .badge {
    display: inline-block;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }
  .login-card h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--gray-900);
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .login-card p {
    font-size: 13px;
    color: var(--gray-500);
    margin-bottom: 28px;
  }
  .form-group {
    margin-bottom: 14px;
    text-align: left;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--gray-700);
    margin-bottom: 6px;
  }
  .form-group input, .form-group select {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--gray-200);
    border-radius: 10px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--gray-900);
    background: var(--gray-50);
    transition: border-color 0.2s;
    outline: none;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--primary);
    background: white;
  }
  .btn-login {
    width: 100%;
    padding: 12px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s, transform 0.1s;
  }
  .btn-login:hover { background: var(--primary-dark); }
  .btn-login:active { transform: scale(0.98); }
  #login-error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 10px;
    display: none;
  }

  /* ── WORKBOOK LAYOUT ── */
  #workbook-screen { display: none; }

  .wb-header {
    background: white;
    border-bottom: 2px solid var(--gray-100);
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .wb-header-inner {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .wb-title-area h2 {
    font-size: 15px;
    font-weight: 700;
    color: var(--gray-900);
  }
  .wb-title-area p {
    font-size: 12px;
    color: var(--gray-500);
    margin-top: 2px;
  }
  .wb-progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 160px;
    max-width: 280px;
  }
  .wb-progress-bar {
    flex: 1;
    height: 8px;
    background: var(--gray-200);
    border-radius: 4px;
    overflow: hidden;
  }
  .wb-progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .wb-progress-text {
    font-size: 12px;
    font-weight: 600;
    color: var(--gray-700);
    white-space: nowrap;
  }
  .btn-submit-all {
    padding: 8px 18px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .btn-submit-all:hover { background: var(--primary-dark); }

  .wb-body {
    max-width: 860px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 32px 0 16px;
  }
  .section-header:first-child { margin-top: 0; }
  .section-badge {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    color: white;
  }
  .sec-vocab { background: var(--section-vocab); }
  .sec-grammar { background: var(--section-grammar); }
  .sec-dialog { background: var(--section-dialog); }
  .sec-reading { background: var(--section-reading); }
  .section-line {
    flex: 1;
    height: 1.5px;
    border-radius: 2px;
    opacity: 0.3;
  }
  .line-vocab { background: var(--section-vocab); }
  .line-grammar { background: var(--section-grammar); }
  .line-dialog { background: var(--section-dialog); }
  .line-reading { background: var(--section-reading); }

  /* ── QUESTION CARD ── */
  .q-card {
    background: white;
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border: 1.5px solid var(--gray-100);
    transition: border-color 0.3s;
  }
  .q-card.answered { border-color: var(--gray-200); }
  .q-card.correct { border-color: var(--success); background: #f0fdf4; }
  .q-card.incorrect { border-color: var(--danger); background: #fff5f5; }

  .q-num-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .q-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .q-type-tag {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--gray-100);
    color: var(--gray-500);
  }
  .q-stem {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.7;
    color: var(--gray-900);
    margin-bottom: 12px;
  }
  .q-stem u { text-decoration: underline; text-underline-offset: 3px; }
  .q-stem .blank { 
    display: inline-block;
    border-bottom: 2px solid var(--primary);
    min-width: 80px;
    text-align: center;
    color: var(--primary);
    font-weight: 600;
  }
  .q-passage {
    background: var(--gray-50);
    border-left: 3px solid var(--primary-light);
    border-radius: 0 8px 8px 0;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.8;
    color: var(--gray-700);
    margin-bottom: 12px;
    white-space: pre-line;
  }
  .q-bogibox {
    background: #f0f9ff;
    border: 1px solid #bae6fd;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: #0369a1;
    margin-bottom: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ── MCQ OPTIONS ── */
  .mcq-options {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .mcq-opt {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    border: 1.5px solid var(--gray-200);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 14px;
    color: var(--gray-700);
    background: white;
    user-select: none;
  }
  .mcq-opt:hover { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
  .mcq-opt.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: 600; }
  .mcq-opt.correct-ans { border-color: var(--success); background: var(--success-light); color: var(--success); font-weight: 600; }
  .mcq-opt.wrong-ans { border-color: var(--danger); background: var(--danger-light); color: var(--danger); font-weight: 600; }
  .mcq-opt.disabled { pointer-events: none; }
  .opt-label {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ── MULTI-SELECT (복수정답) ── */
  .multi-note {
    font-size: 12px;
    color: var(--warn);
    font-weight: 600;
    margin-bottom: 8px;
  }

  /* ── SHORT ANSWER ── */
  .sa-area { display: flex; flex-direction: column; gap: 8px; }
  .sa-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sa-label { font-size: 13px; color: var(--gray-500); min-width: 32px; }
  .sa-input {
    flex: 1;
    min-width: 160px;
    max-width: 400px;
    padding: 8px 12px;
    border: 1.5px solid var(--gray-200);
    border-radius: 8px;
    font-size: 14px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--gray-900);
    background: var(--gray-50);
    outline: none;
    transition: border-color 0.2s;
  }
  .sa-input:focus { border-color: var(--primary); background: white; }
  .sa-input.correct { border-color: var(--success); background: var(--success-light); color: var(--success); }
  .sa-input.incorrect { border-color: var(--danger); background: var(--danger-light); color: var(--danger); }
  .sa-input:disabled { opacity: 0.9; }

  /* ── FEEDBACK ── */
  .feedback {
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .feedback.show { display: flex; align-items: flex-start; gap: 8px; }
  .feedback.correct { background: var(--success-light); color: var(--success); }
  .feedback.incorrect { background: var(--danger-light); color: var(--danger); }
  .feedback-icon { font-size: 16px; flex-shrink: 0; }
  .feedback-answer { font-weight: 600; }

  /* ── RESULT SCREEN ── */
  #result-screen {
    display: none;
    min-height: 100vh;
    background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%);
    padding: 40px 16px;
  }
  .result-card {
    background: white;
    border-radius: 20px;
    padding: 36px 32px;
    max-width: 520px;
    margin: 0 auto;
    box-shadow: 0 8px 32px rgba(37,99,235,0.12);
    text-align: center;
  }
  .result-score-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), #6366f1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    color: white;
  }
  .result-score-circle .score-num {
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
    font-family: 'IBM Plex Mono', monospace;
  }
  .result-score-circle .score-label { font-size: 13px; opacity: 0.85; }
  .result-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .result-card .student-info { font-size: 13px; color: var(--gray-500); margin-bottom: 24px; }
  .result-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-box {
    background: var(--gray-50);
    border-radius: 12px;
    padding: 14px 10px;
  }
  .stat-box .stat-val {
    font-size: 22px;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--primary);
  }
  .stat-box .stat-key { font-size: 12px; color: var(--gray-500); margin-top: 4px; }
  .result-wrong-list {
    text-align: left;
    background: var(--danger-light);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
    font-size: 13px;
  }
  .result-wrong-list h3 { color: var(--danger); font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .wrong-item { padding: 6px 0; border-bottom: 1px solid rgba(220,38,38,0.1); line-height: 1.6; color: var(--gray-700); }
  .wrong-item:last-child { border-bottom: none; }
  .btn-notion {
    width: 100%;
    padding: 13px;
    background: #111827;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    margin-bottom: 10px;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-notion:hover { background: #374151; }
  .btn-retry {
    width: 100%;
    padding: 12px;
    background: white;
    color: var(--primary);
    border: 2px solid var(--primary);
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-retry:hover { background: var(--primary-light); }
  #notion-status { font-size: 13px; margin-top: 10px; padding: 8px; border-radius: 8px; display: none; }
  #notion-status.ok { background: var(--success-light); color: var(--success); display: block; }
  #notion-status.err { background: var(--danger-light); color: var(--danger); display: block; }

  @media (max-width: 600px) {
    .wb-header-inner { gap: 8px; }
    .wb-progress-wrap { min-width: 100px; }
    .q-card { padding: 16px; }
    .result-stats { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .result-card { padding: 28px 20px; }
  }
</style>
</head>
<body>

<!-- ══════════════ LOGIN ══════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="badge">도담한영어교실</div>
    <h1>중2 YBM(박준언)<br>3과 PRE-STEP</h1>
    <p>이름과 학교, 학년을 입력하고 시작하세요.</p>
    <div class="form-group">
      <label>이름</label>
      <input type="text" id="inp-name" placeholder="홍길동">
    </div>
    <div class="form-group">
      <label>학교</label>
      <input type="text" id="inp-school" placeholder="예) 도담중학교">
    </div>
    <div class="form-group">
      <label>학년</label>
      <select id="inp-grade">
        <option value="">선택하세요</option>
        <option value="중1">중1</option>
        <option value="중2">중2</option>
        <option value="중3">중3</option>
        <option value="고1">고1</option>
        <option value="고2">고2</option>
        <option value="고3">고3</option>
      </select>
    </div>
    <button class="btn-login" onclick="startWorkbook()">시작하기 →</button>
    <div id="login-error">이름, 학교, 학년을 모두 입력해주세요.</div>
  </div>
</div>

<!-- ══════════════ WORKBOOK ══════════════ -->
<div id="workbook-screen">
  <div class="wb-header">
    <div class="wb-header-inner">
      <div class="wb-title-area">
        <h2>중2 YBM 3과 PRE-STEP</h2>
        <p id="header-student">-</p>
      </div>
      <div class="wb-progress-wrap">
        <div class="wb-progress-bar"><div class="wb-progress-fill" id="prog-fill" style="width:0%"></div></div>
        <span class="wb-progress-text" id="prog-text">0 / 0</span>
      </div>
      <button class="btn-submit-all" onclick="submitAll()">제출하기</button>
    </div>
  </div>
  <div class="wb-body" id="wb-body"></div>
</div>

<!-- ══════════════ RESULT ══════════════ -->
<div id="result-screen">
  <div class="result-card">
    <div class="result-score-circle">
      <span class="score-num" id="res-score">0</span>
      <span class="score-label">점</span>
    </div>
    <h2 id="res-title">수고했어요! 🎉</h2>
    <p class="student-info" id="res-student">-</p>
    <div class="result-stats">
      <div class="stat-box"><div class="stat-val" id="res-total">0</div><div class="stat-key">전체 문항</div></div>
      <div class="stat-box"><div class="stat-val" id="res-correct" style="color:var(--success)">0</div><div class="stat-key">정답</div></div>
      <div class="stat-box"><div class="stat-val" id="res-wrong" style="color:var(--danger)">0</div><div class="stat-key">오답</div></div>
    </div>
    <div class="result-wrong-list" id="res-wrong-list" style="display:none">
      <h3>✗ 오답 목록</h3>
      <div id="res-wrong-items"></div>
    </div>
    <button class="btn-notion" onclick="sendToNotion()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
      Notion에 결과 저장
    </button>
    <div id="notion-status"></div>
    <button class="btn-retry" onclick="location.reload()">다시 풀기</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════
//  QUESTION DATA
// ══════════════════════════════════════════
const QUESTIONS = [
  // ─── 어휘 객관식 ───────────────────────
  {
    id: 1, section:'vocab', type:'mcq',
    stem: '다음 밑줄 친 단어와 바꾸어 쓸 수 있는 것은?',
    passage: 'She is <u>famous</u> for her beautiful voice.',
    options:['popular','unique','favorite','special','well-known'],
    answer: 5
  },
  {
    id: 2, section:'vocab', type:'mcq',
    stem: '다음 단어를 모두 포함하는 단어로 알맞은 것은?',
    passage: 'parrot, hamster, dog, cat',
    options:['law','pet','location','culture','flavor'],
    answer: 2
  },
  {
    id: 3, section:'vocab', type:'mcq',
    stem: '다음 빈칸에 공통으로 들어갈 말로 알맞은 것은?',
    passage: '• She looks __________, but she feels tired.\n• People must pay a __________ for parking here.',
    options:['good','clean','surprising','fine','lonely'],
    answer: 4
  },
  {
    id: 4, section:'vocab', type:'mcq',
    stem: '다음 영영풀이에 해당하는 단어로 알맞은 것은?',
    passage: 'to bite food into small pieces in your mouth with your teeth',
    options:['eat','chew','spend','drink','taste'],
    answer: 2
  },
  {
    id: 5, section:'vocab', type:'mcq',
    stem: '다음 중 밑줄 친 부분의 우리말 뜻이 어색한 것은?',
    passage: '① Sometimes I want to be <u>alone</u>. (혼자인)\n② I don\'t like <u>certain</u> types of food. (확실한)\n③ When he saw the fire, he <u>acted</u> quickly. (행동했다)\n④ His desk looks <u>messy</u>, but he can find everything. (지저분한)\n⑤ We need at <u>least</u> five chairs for this room. (최소한)',
    options:['①','②','③','④','⑤'],
    answer: 2
  },
  // ─── 어휘 서술형 ───────────────────────
  {
    id: 6, section:'vocab', type:'short',
    stem: '다음 짝지어진 단어의 관계를 고려하여 빈칸에 들어갈 알맞은 단어를 쓰시오.',
    passage: 'dirty : clean = __________ : inside',
    inputs:[{label:'답', answer:'outside'}]
  },
  {
    id: 7, section:'vocab', type:'short',

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let studentName = '', studentSchool = '', studentGrade = '';
const userAnswers = {}; // {qid: value or [values]}
const submitted = {};

// ══════════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════════
function startWorkbook() {
  studentName   = document.getElementById('inp-name').value.trim();
  studentSchool = document.getElementById('inp-school').value.trim();
  studentGrade  = document.getElementById('inp-grade').value;
  const err = document.getElementById('login-error');
  if (!studentName || !studentSchool || !studentGrade) { err.style.display='block'; return; }
  err.style.display='none';
  document.getElementById('login-screen').style.display='none';
  document.getElementById('workbook-screen').style.display='block';
  document.getElementById('header-student').textContent = `${studentName} / ${studentSchool} ${studentGrade}`;
  renderWorkbook();
}

// ══════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════
const SECTION_META = {
  vocab:   {label:'어휘 (Vocabulary)', badgeCls:'sec-vocab',   lineCls:'line-vocab'},
  grammar: {label:'문법 (Grammar)',     badgeCls:'sec-grammar', lineCls:'line-grammar'},
  dialog:  {label:'대화 (Dialog)',      badgeCls:'sec-dialog',  lineCls:'line-dialog'},
  reading: {label:'독해 (Reading)',     badgeCls:'sec-reading', lineCls:'line-reading'},
};

function renderWorkbook() {
  const body = document.getElementById('wb-body');
  let html = '';
  let lastSection = null;
  QUESTIONS.forEach((q, idx) => {
    if (q.section !== lastSection) {
      const m = SECTION_META[q.section];
      html += `<div class="section-header">
        <span class="section-badge ${m.badgeCls}">${m.label}</span>
        <div class="section-line ${m.lineCls}"></div>
      </div>`;
      lastSection = q.section;
    }
    html += buildCard(q, idx+1);
  });
  body.innerHTML = html;
  updateProgress();
}

function buildCard(q, num) {
  const typeTag = q.type==='mcq'?'객관식':q.type==='multi'?'복수정답':'서술형';
  let inner = `<div class="q-num-row">
    <span class="q-num">${num}</span>
    <span class="q-type-tag">${typeTag}</span>
  </div>
  <div class="q-stem">${escHtml(q.stem).replace(/\n/g,'<br>')}</div>`;

  if (q.bogi) inner += `<div class="q-bogibox">${escHtml(q.bogi)}</div>`;
  if (q.bogiText) inner += `<div class="q-bogibox">${escHtml(q.bogiText)}</div>`;
  if (q.passage) inner += `<div class="q-passage">${escHtml(q.passage)}</div>`;

  if (q.type==='mcq') {
    inner += `<div class="mcq-options" id="opts-${q.id}">`;
    const nums = ['①','②','③','④','⑤'];
    q.options.forEach((opt,i) => {
      inner += `<div class="mcq-opt" id="opt-${q.id}-${i+1}" onclick="selectMCQ(${q.id},${i+1})">
        <span class="opt-label">${nums[i]}</span>${escHtml(opt)}
      </div>`;
    });
    inner += `</div>`;
  } else if (q.type==='multi') {
    inner += `<div class="multi-note">※ 모두 선택하세요 (복수 정답)</div>`;
    inner += `<div class="mcq-options" id="opts-${q.id}">`;
    const nums = ['①','②','③','④','⑤'];
    q.options.forEach((opt,i) => {
      inner += `<div class="mcq-opt" id="opt-${q.id}-${i+1}" onclick="selectMulti(${q.id},${i+1})">
        <span class="opt-label">${nums[i]}</span>${escHtml(opt)}
      </div>`;
    });
    inner += `</div>`;
  } else {
    inner += `<div class="sa-area" id="sa-${q.id}">`;
    q.inputs.forEach((inp, i) => {
      inner += `<div class="sa-row">
        <span class="sa-label">${escHtml(inp.label)}</span>
        <input class="sa-input" id="sa-inp-${q.id}-${i}" type="text"
          placeholder="답 입력..."
          oninput="onShortInput(${q.id})"
          autocomplete="off" autocorrect="off" spellcheck="false">
      </div>`;
    });
    inner += `</div>`;
  }

  inner += `<div class="feedback" id="fb-${q.id}">
    <span class="feedback-icon" id="fb-icon-${q.id}"></span>
    <span id="fb-msg-${q.id}"></span>
  </div>`;

  return `<div class="q-card" id="card-${q.id}">${inner}</div>`;
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════
//  INTERACTION
// ══════════════════════════════════════════
function selectMCQ(qid, val) {
  if (submitted[qid]) return;
  userAnswers[qid] = val;
  const q = QUESTIONS.find(x=>x.id===qid);
  q.options.forEach((_,i) => {
    const el = document.getElementById(`opt-${qid}-${i+1}`);
    el.classList.toggle('selected', i+1===val);
  });
  updateProgress();
}

function selectMulti(qid, val) {
  if (submitted[qid]) return;
  if (!userAnswers[qid]) userAnswers[qid]=[];
  const arr = userAnswers[qid];
  const idx = arr.indexOf(val);
  if (idx>=0) arr.splice(idx,1); else arr.push(val);
  const q = QUESTIONS.find(x=>x.id===qid);
  q.options.forEach((_,i) => {
    document.getElementById(`opt-${qid}-${i+1}`).classList.toggle('selected', arr.includes(i+1));
  });
  updateProgress();
}

function onShortInput(qid) {
  if (submitted[qid]) return;
  const q = QUESTIONS.find(x=>x.id===qid);
  const vals = q.inputs.map((_,i)=>document.getElementById(`sa-inp-${qid}-${i}`).value.trim());
  userAnswers[qid] = vals;
  updateProgress();
}

// ══════════════════════════════════════════
//  PROGRESS
// ══════════════════════════════════════════
function countAnswered() {
  return QUESTIONS.filter(q => {
    const a = userAnswers[q.id];
    if (!a) return false;
    if (Array.isArray(a)) return a.length > 0 && a.some(x=>x!=='');
    return true;
  }).length;
}

function updateProgress() {
  const done = countAnswered();
  const total = QUESTIONS.length;
  const pct = Math.round(done/total*100);
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-text').textContent = `${done} / ${total}`;
}

// ══════════════════════════════════════════
//  SUBMIT ALL
// ══════════════════════════════════════════
function normalizeAnswer(s) {
  return String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
}

function checkShortAnswer(userVal, correctVal) {
  // correctVal may have | as multiple accepted answers
  const accepted = correctVal.split('|').map(s=>normalizeAnswer(s));
  const user = normalizeAnswer(userVal);
  return accepted.some(a => user === a);
}

function submitAll() {
  let correctCount = 0;
  const wrongAnswersArr = [];

  QUESTIONS.forEach((q, idx) => {
    const num = idx + 1;
    const card = document.getElementById(`card-${q.id}`);
    const fb = document.getElementById(`fb-${q.id}`);
    const fbIcon = document.getElementById(`fb-icon-${q.id}`);
    const fbMsg = document.getElementById(`fb-msg-${q.id}`);

    let isCorrect = false;

    if (q.type === 'mcq') {
      const userAns = userAnswers[q.id];
      const correct = q.answer;
      isCorrect = userAns === correct;

      q.options.forEach((_,i) => {
        const el = document.getElementById(`opt-${q.id}-${i+1}`);
        el.classList.add('disabled');
        if (i+1 === correct) el.classList.add('correct-ans');
        else if (i+1 === userAns && !isCorrect) el.classList.add('wrong-ans');
        el.classList.remove('selected');
      });
      const nums=['①','②','③','④','⑤'];
      fbMsg.innerHTML = isCorrect
        ? `<span class="feedback-answer">정답!</span> 정답: ${nums[correct-1]}`
        : `<span class="feedback-answer">오답.</span> 정답: ${nums[correct-1]}`;

    } else if (q.type === 'multi') {
      const userAns = (userAnswers[q.id]||[]).slice().sort((a,b)=>a-b);
      const correct = q.answer.slice().sort((a,b)=>a-b);
      isCorrect = JSON.stringify(userAns) === JSON.stringify(correct);

      q.options.forEach((_,i) => {
        const el = document.getElementById(`opt-${q.id}-${i+1}`);
        el.classList.add('disabled');
        if (correct.includes(i+1)) el.classList.add('correct-ans');
        else if (userAns.includes(i+1)) el.classList.add('wrong-ans');
        el.classList.remove('selected');
      });
      const nums=['①','②','③','④','⑤'];
      const correctLabels = correct.map(n=>nums[n-1]).join(', ');
      fbMsg.innerHTML = isCorrect
        ? `<span class="feedback-answer">정답!</span> 정답: ${correctLabels}`
        : `<span class="feedback-answer">오답.</span> 정답: ${correctLabels}`;

    } else {
      // short
      const userVals = userAnswers[q.id] || q.inputs.map(()=>'');
      let allCorrect = true;
      const correctDisplay = [];
      q.inputs.forEach((inp, i) => {
        const uv = (Array.isArray(userVals)?userVals[i]:userVals)||'';
        const ok = checkShortAnswer(uv, inp.answer);
        if (!ok) allCorrect = false;
        const inpEl = document.getElementById(`sa-inp-${q.id}-${i}`);
        if (inpEl) {
          inpEl.classList.toggle('correct', ok);
          inpEl.classList.toggle('incorrect', !ok);
          inpEl.disabled = true;
        }
        correctDisplay.push(`${inp.label}: ${inp.answer.split('|')[0]}`);
      });
      isCorrect = allCorrect;
      fbMsg.innerHTML = isCorrect
        ? `<span class="feedback-answer">정답!</span>`
        : `<span class="feedback-answer">오답.</span> 정답: ${correctDisplay.join(' / ')}`;
    }

    fb.classList.add('show');
    fb.classList.toggle('correct', isCorrect);
    fb.classList.toggle('incorrect', !isCorrect);
    fbIcon.textContent = isCorrect ? '✓' : '✗';

    card.classList.remove('correct','incorrect','answered');
    card.classList.add(isCorrect ? 'correct' : 'incorrect');

    submitted[q.id] = true;

    if (isCorrect) {
      correctCount++;
    } else {
      // 오답 기록
      let userDisplay = '';
      if (q.type==='mcq') {
        const nums=['①','②','③','④','⑤'];
        userDisplay = userAnswers[q.id] ? nums[userAnswers[q.id]-1] : '(미응답)';
      } else if (q.type==='multi') {
        const nums=['①','②','③','④','⑤'];
        userDisplay = (userAnswers[q.id]||[]).map(n=>nums[n-1]).join(',')||'(미응답)';
      } else {
        const vals = userAnswers[q.id]||[];
        userDisplay = Array.isArray(vals) ? vals.join(' / ')||'(미응답)' : vals||'(미응답)';
      }
      wrongAnswersArr.push({ num, stem: q.stem.substring(0,30), userDisplay });
    }
  });

  // scroll to top
  window.scrollTo({top:0,behavior:'smooth'});

  // show result
  setTimeout(()=>showResult(correctCount, wrongAnswersArr), 600);
}

// ══════════════════════════════════════════
//  RESULT SCREEN
// ══════════════════════════════════════════
function showResult(correctCount, wrongAnswersArr) {
  const total = QUESTIONS.length;
  const score = Math.round(correctCount / total * 100);

  document.getElementById('workbook-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  document.getElementById('res-score').textContent = score;
  document.getElementById('res-student').textContent = `${studentName} · ${studentSchool} ${studentGrade}`;
  document.getElementById('res-total').textContent = total;
  document.getElementById('res-correct').textContent = correctCount;
  document.getElementById('res-wrong').textContent = total - correctCount;

  const title = score>=90?'훌륭해요! 🎉':score>=70?'잘 했어요! 👍':score>=50?'조금 더 노력해봐요 💪':'다시 한번 도전해봐요 📚';
  document.getElementById('res-title').textContent = title;

  if (wrongAnswersArr.length > 0) {
    const wl = document.getElementById('res-wrong-list');
    wl.style.display='block';
    document.getElementById('res-wrong-items').innerHTML =
      wrongAnswersArr.map(w=>`<div class="wrong-item"><b>${w.num}번</b> — ${w.stem}... (내 답: ${w.userDisplay})</div>`).join('');
  }

  // store for Notion
  window._resultData = { score, correctCount, total, wrongAnswersArr };
}

// ══════════════════════════════════════════
//  NOTION
// ══════════════════════════════════════════
async function sendToNotion() {
  const btn = document.querySelector('.btn-notion');
  const status = document.getElementById('notion-status');
  btn.textContent = '전송 중...';
  btn.disabled = true;
  status.className = '';
  status.style.display = 'none';

  const { score, correctCount, total, wrongAnswersArr } = window._resultData;
  const today = new Date().toISOString().slice(0,10);

  const wrongText = wrongAnswersArr.length > 0
    ? `[점수: ${score}점]\n` + wrongAnswersArr.map(w=>`${w.num}번: ${w.stem}... (내 답: ${w.userDisplay})`).join('\n')
    : `[점수: ${score}점]\n오답 없음`;

  const payload = {
    studentName,
    school: studentSchool,
    grade: studentGrade,
    workbook: '중2 YBM(박준언) 3과 PRE-STEP',
    category: '중2 YBM(박준언) 3과 PRE-STEP',
    submitDate: today,
    wrongAnswers: wrongText,
    score
  };

  try {
    const res = await fetch('https://dodamenglish.netlify.app/.netlify/functions/notion', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      status.className = 'ok';
      status.textContent = '✓ Notion에 성공적으로 저장되었습니다!';
    } else {
      const txt = await res.text();
      throw new Error(txt);
    }
  } catch(e) {
    status.className = 'err';
    status.textContent = '⚠ 저장 실패: ' + e.message;
  }
  status.style.display = 'block';
  btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg> Notion에 결과 저장`;
  btn.disabled = false;
}
