<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도담한영어교실 · Day 13 과제 워크북</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1a3a5c; --orange:#e8703a; --ok:#1a7a4a; --no:#c0392b;
    --cream:#f6f9fc; --line:#d8e0e8; --ink:#1c232b;
  }
  *{box-sizing:border-box;}
  body{
    font-family:"Noto Sans KR",sans-serif; color:var(--ink); margin:0;
    background:#eef2f6; line-height:1.6;
  }
  .wrap{max-width:760px; margin:0 auto; padding:0 14px 120px;}

  /* ---- 로그인 ---- */
  #login{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    background:#fff; border-radius:16px; padding:30px 26px; width:100%; max-width:420px;
    box-shadow:0 10px 30px rgba(26,58,92,.12); text-align:center; border-top:6px solid var(--orange);
  }
  .brand{color:var(--orange); font-weight:900; letter-spacing:.5px; font-size:13px;}
  .login-card h1{color:var(--navy); font-size:22px; margin:6px 0 2px; font-weight:900;}
  .login-card .sub{color:#5a6b7a; font-size:13px; margin-bottom:20px;}
  .login-card input{
    width:100%; padding:13px 14px; font-size:16px; border:1.5px solid var(--line);
    border-radius:10px; font-family:inherit; outline:none;
  }
  .login-card input:focus{border-color:var(--orange);}
  .btn{
    display:inline-block; border:none; cursor:pointer; font-family:inherit; font-weight:700;
    border-radius:10px; padding:13px 18px; font-size:16px;
  }
  .btn-main{background:var(--orange); color:#fff; width:100%; margin-top:14px;}
  .btn-main:hover{filter:brightness(1.05);}
  .btn-main:disabled{background:#c7ccd2; cursor:not-allowed;}

  /* ---- 헤더 ---- */
  header.top{
    background:var(--navy); color:#fff; padding:16px 16px; position:sticky; top:0; z-index:20;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header.top .inner{max-width:760px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  header.top .ti{font-weight:900; font-size:15px;}
  header.top .ti small{display:block; color:#bcd0e4; font-weight:500; font-size:11px;}
  header.top .who{background:rgba(255,255,255,.15); padding:5px 11px; border-radius:20px; font-size:12px; white-space:nowrap;}

  /* ---- 탭 ---- */
  .tabs{display:flex; gap:6px; margin:16px 0 4px; position:sticky; top:64px; z-index:15; background:#eef2f6; padding:8px 0;}
  .tab{
    flex:1; text-align:center; padding:10px 6px; border-radius:10px; cursor:pointer;
    background:#fff; border:1.5px solid var(--line); color:var(--navy); font-weight:700; font-size:13px;
  }
  .tab.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .tab .cnt{display:block; font-size:10px; font-weight:500; color:#8a97a6;}
  .tab.active .cnt{color:#bcd0e4;}

  /* ---- 개념카드 ---- */
  .concept{
    background:#fff; border-left:6px solid var(--orange); border-radius:10px;
    padding:13px 15px; margin:10px 0 4px; box-shadow:0 2px 8px rgba(26,58,92,.06);
  }
  .concept .lab{color:var(--orange); font-weight:900; font-size:12px; letter-spacing:.5px;}
  .concept p{margin:5px 0 0; font-size:13.5px; color:#33424f;}

  /* ---- 문항 ---- */
  .qcard{
    background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:15px 15px 13px;
    margin:12px 0; box-shadow:0 2px 8px rgba(26,58,92,.05);
  }
  .qhead{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .qno{background:var(--navy); color:#fff; font-weight:900; font-size:12px; border-radius:8px; padding:3px 9px;}
  .qtype{font-size:11px; font-weight:700; color:#fff; background:#7c8a99; border-radius:20px; padding:2px 9px;}
  .qtype.fill{background:var(--orange);}
  .qtype.made{background:var(--navy);}
  .qtext{font-size:15px; font-weight:500; margin:2px 0 10px;}
  .passage{background:var(--cream); border:1px solid var(--line); border-radius:10px; padding:12px 13px; font-size:13.5px; margin:8px 0; line-height:1.55;}
  .passage .en{font-family:"Noto Sans KR",sans-serif;}
  .noticebox{background:#fff; border:1.5px solid var(--navy); border-radius:10px; padding:12px 13px; font-size:13.5px; margin:8px 0;}
  .noticebox .nt{font-weight:900; color:var(--navy); text-align:center; margin-bottom:6px;}
  .chartwrap{text-align:center; margin:6px 0;}
  .chartttl{font-weight:700; color:var(--navy); font-size:13px; margin-bottom:4px;}

  .opts{display:flex; flex-direction:column; gap:7px; margin:4px 0 2px;}
  .opt{
    border:1.5px solid var(--line); border-radius:10px; padding:11px 13px; cursor:pointer;
    font-size:14px; background:#fff; transition:.12s; user-select:none;
  }
  .opt:hover{border-color:var(--navy);}
  .opt.sel{border-color:var(--orange); background:#fdf3ee; font-weight:700;}
  .opt.correct{border-color:var(--ok); background:#e9f7ef; font-weight:700;}
  .opt.wrong{border-color:var(--no); background:#fdecea;}
  .opt.locked{cursor:default; pointer-events:none;}

  .fillrow input{
    width:100%; padding:11px 13px; font-size:15px; border:1.5px solid var(--line);
    border-radius:10px; font-family:inherit; outline:none;
  }
  .fillrow input:focus{border-color:var(--orange);}
  .fillrow input.correct{border-color:var(--ok); background:#e9f7ef;}
  .fillrow input.wrong{border-color:var(--no); background:#fdecea;}

  .reason{margin-top:11px;}
  .reason label{display:block; font-size:12px; font-weight:700; color:var(--orange); margin-bottom:4px;}
  .reason textarea{
    width:100%; min-height:46px; padding:9px 11px; font-size:13.5px; border:1.5px dashed #a9b7c4;
    border-radius:9px; font-family:inherit; outline:none; resize:vertical; background:#fbfcfe;
  }
  .reason textarea:focus{border-color:var(--orange);}
  .reason textarea:disabled{background:#f0f3f6; color:#556;}

  .checkbtn{background:var(--navy); color:#fff; width:100%; margin-top:11px;}
  .checkbtn:disabled{background:#c7ccd2; cursor:not-allowed;}
  .hint{font-size:11.5px; color:#8a97a6; margin-top:6px; text-align:center;}

  .fb{display:none; margin-top:11px; border-radius:10px; padding:11px 13px; font-size:13.5px;}
  .fb.show{display:block;}
  .fb.ok{background:#e9f7ef; border:1px solid #b6e0c6;}
  .fb.no{background:#fdecea; border:1px solid #f2c2bb;}
  .fb .res{font-weight:900; font-size:14px;}
  .fb .res.ok{color:var(--ok);} .fb .res.no{color:var(--no);}
  .fb .exp{margin-top:5px; color:#33424f;}
  .fb .ansline{margin-top:3px;}
  .fb .ansline b{color:var(--navy);}

  /* ---- 제출바 ---- */
  .submitbar{
    position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1.5px solid var(--line);
    padding:12px 14px; z-index:25; box-shadow:0 -3px 12px rgba(0,0,0,.06);
  }
  .submitbar .inner{max-width:760px; margin:0 auto; display:flex; align-items:center; gap:12px;}
  .prog{flex:1; font-size:13px; color:#556;}
  .prog b{color:var(--navy);}
  .btn-submit{background:var(--orange); color:#fff; white-space:nowrap;}
  .btn-submit:disabled{background:#c7ccd2; cursor:not-allowed;}

  /* ---- 점수카드 ---- */
  #scorecard{display:none; background:#fff; border-radius:14px; padding:20px 18px; margin:16px 0; box-shadow:0 6px 20px rgba(26,58,92,.12); border-top:6px solid var(--navy);}
  #scorecard h2{color:var(--navy); margin:0 0 4px; font-size:20px;}
  .bigscore{font-size:40px; font-weight:900; color:var(--orange); margin:8px 0;}
  .bigscore small{font-size:16px; color:#556; font-weight:500;}
  .review-list{margin-top:12px;}
  .review-list .rl-t{font-weight:900; color:var(--navy); margin-bottom:6px;}
  .review-item{background:var(--cream); border:1px solid var(--line); border-left:5px solid var(--no); border-radius:9px; padding:9px 12px; margin:7px 0; font-size:13px;}
  .review-item b{color:var(--navy);}
  #sendmsg{margin-top:12px; font-size:13.5px;}

  footer.copy{text-align:center; color:#8a97a6; font-size:11px; padding:18px 0 6px;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<!-- ================= 로그인 ================= -->
<div id="login">
  <div class="login-card">
    <div class="brand">도담한영어교실 · 점프업 특강</div>
    <h1>Day 13 과제 워크북</h1>
    <div class="sub">누적 복습② · Day 9~12 (빈칸·순서·삽입) &nbsp;|&nbsp; 총 18문항 자동채점</div>
    <input id="nameInput" type="text" placeholder="이름을 입력하세요" autocomplete="off">
    <button class="btn btn-main" id="startBtn" onclick="doLogin()">시작하기</button>
    <div class="hint" style="margin-top:12px">답을 정하기 전에 <b>근거를 먼저</b> 써야 확인이 열려. 알고 푸는 습관!</div>
  </div>
</div>

<!-- ================= 앱 ================= -->
<div id="app" class="hidden">
  <header class="top">
    <div class="inner">
      <div class="ti">Day 13 과제 워크북<small>누적 복습② · Day 9~12 (빈칸·순서·삽입)</small></div>
      <div class="who" id="whoBadge">학생</div>
    </div>
  </header>

  <div class="wrap">
    <div class="tabs" id="tabbar"></div>
    <div id="parts"></div>

    <div id="scorecard">
      <h2>채점 결과</h2>
      <div class="bigscore" id="scoreNum">0<small>점</small></div>
      <div id="scoreDetail" style="color:#556; font-size:14px;"></div>
      <div class="review-list" id="reviewList"></div>
      <div id="sendmsg"></div>
    </div>

    <footer class="copy">© 도담한영어교실 · 무단 복제 및 배포 금지</footer>
  </div>

  <div class="submitbar">
    <div class="inner">
      <div class="prog" id="prog">확인한 문제 <b>0</b> / 18</div>
      <button class="btn btn-submit" id="submitBtn" onclick="doSubmit()" disabled>채점하고 제출하기</button>
    </div>
  </div>
</div>

<script>
/* ===== 배포 파라미터 (QR URL의 쿼리로 덮어쓰기 가능, 없으면 기본값) ===== */
const params = new URLSearchParams(location.search);
const NOTION_URL = params.get('notifyUrl') || "https://dodamenglish.netlify.app/.netlify/functions/notion";
const WB = {
  workbook: params.get('title') || params.get('workbook') || "Day 13 과제 워크북 (누적 복습②·2주차)",
  category: params.get('category') || "Day 13"
};
const preName  = params.get('name')  || "";
const preGrade = params.get('grade') || "예비고1";
const preSchool= params.get('school')|| "";

/* ===== 문항 데이터 ===== */
const PARTS = [
 {
  "id": "p1",
  "short": "P1",
  "name": "PART 1",
  "title": "누적 어휘 드릴 (Day9~12)",
  "concept": "2주차 다의어·어원 총정리야. 수업 누적 테스트에서 <b>겹별표(★★)</b> 친 단어가 여기 또 나온다. 이번이 세 번째다 — 이젠 맞히자.",
  "questions": [
   {
    "type": "choice",
    "label": "tell A from B",
    "q": "밑줄 친 tell의 의미로 알맞은 것은?<br><span class=\"en\">\"A crow can <u>tell</u> two seeds from three.\"</span>",
    "options": [
     "말하다",
     "구별하다",
     "세다",
     "알려주다"
    ],
    "answer": 1,
    "exp": "tell A from B = A와 B를 구별하다. (Day9)"
   },
   {
    "type": "choice",
    "label": "objective 뜻",
    "q": "밑줄 친 objective의 의미로 알맞은 것은?<br><span class=\"en\">\"We put an <u>objective</u> value on a subjective feeling.\"</span>",
    "options": [
     "목표",
     "객관적인",
     "반대의",
     "목적격"
    ],
    "answer": 1,
    "exp": "objective(객관적인) ↔ subjective(주관적인). (Day10)"
   },
   {
    "type": "choice",
    "label": "the case 뜻",
    "q": "밑줄 친 the case의 의미로 알맞은 것은?<br><span class=\"en\">\"But is this always <u>the case</u>?\"</span>",
    "options": [
     "그 상자",
     "사실·그러한 경우",
     "그 사건",
     "그 소송"
    ],
    "answer": 1,
    "exp": "the case = 사실·그러한 경우. (Day11)"
   },
   {
    "type": "choice",
    "label": "still 뜻",
    "q": "밑줄 친 still의 의미로 알맞은 것은?<br><span class=\"en\">\"We <u>still</u> act in harmony with others.\"</span>",
    "options": [
     "가만히",
     "여전히·그럼에도",
     "증류하다",
     "고요한"
    ],
    "answer": 1,
    "exp": "still = 여전히·그럼에도. 양보의 연결 신호. (Day12)"
   },
   {
    "type": "fill",
    "label": "cognition 철자",
    "q": "'인지·인식'을 뜻하는 명사를 쓰시오. (cogn 알다) (Day10)",
    "answers": [
     "cognition"
    ],
    "exp": "cognition = 인지·인식."
   },
   {
    "type": "fill",
    "label": "accelerate 철자",
    "q": "'가속하다·촉진하다'를 뜻하는 동사를 쓰시오. (ac+celer 빠른) (Day12)",
    "answers": [
     "accelerate"
    ],
    "exp": "accelerate = 가속하다·촉진하다."
   }
  ]
 },
 {
  "id": "p2",
  "short": "P2",
  "name": "PART 2",
  "title": "구문 누적 진단 (Day9~12)",
  "concept": "빈칸·순서·삽입을 풀 때 실제로 쓴 문법 4종을 한 문항씩. <b>틀린 문항의 Day가 복습 1순위</b>. 전부 도담T제작문제.",
  "questions": [
   {
    "type": "choice",
    "label": "D9 what 명사절",
    "made": true,
    "q": "괄호에서 알맞은 것은? <b>(Day9)</b><br><span class=\"en\">\"( What / That ) it does not provide is precision.\"</span>",
    "options": [
     "What",
     "That"
    ],
    "answer": 0,
    "exp": "provide 뒤 목적어가 빠진 불완전 + 선행사 없음 → what."
   },
   {
    "type": "choice",
    "label": "D9 가정법 도치",
    "made": true,
    "q": "괄호에서 알맞은 것은? <b>(Day9)</b><br><span class=\"en\">\"( Were / Was ) he to be tested, he would fail.\"</span>",
    "options": [
     "Were",
     "Was"
    ],
    "answer": 0,
    "exp": "If 생략 도치 → Were he to be tested. 가정법에 Was 안 씀."
   },
   {
    "type": "choice",
    "label": "D10 without+분사",
    "made": true,
    "q": "괄호에서 알맞은 것은? <b>(Day10)</b><br><span class=\"en\">\"It happens without your mind ( have / having ) much say.\"</span>",
    "options": [
     "have",
     "having"
    ],
    "answer": 1,
    "exp": "without + 목적어 + 분사(능동 having)."
   },
   {
    "type": "choice",
    "label": "D10 There is no ~ing",
    "made": true,
    "q": "괄호에서 알맞은 것은? <b>(Day10)</b><br><span class=\"en\">\"There is simply no ( to pull / pulling ) them apart.\"</span>",
    "options": [
     "to pull",
     "pulling"
    ],
    "answer": 1,
    "exp": "There is no ~ing = ~할 수 없다."
   },
   {
    "type": "choice",
    "label": "D11 계속적 which",
    "made": true,
    "q": "괄호에서 알맞은 것은? <b>(Day11)</b><br><span class=\"en\">\"Rome, ( which / that ) went under in 476, was once vast.\"</span>",
    "options": [
     "which",
     "that"
    ],
    "answer": 0,
    "exp": "콤마 계속적 용법 → that 불가, which."
   },
   {
    "type": "choice",
    "label": "D12 variety of 수일치",
    "made": true,
    "q": "괄호에서 알맞은 것은? <b>(Day12)</b><br><span class=\"en\">\"A wide variety of relatives ( live / lives ) together.\"</span>",
    "options": [
     "live",
     "lives"
    ],
    "answer": 0,
    "exp": "a variety of + 복수 → 복수 취급 → live."
   },
   {
    "type": "choice",
    "label": "D12 가정법 과거",
    "made": true,
    "q": "괄호에서 알맞은 것은? <b>(Day12)</b><br><span class=\"en\">\"If a gorilla found itself underwater, it ( would / will ) panic.\"</span>",
    "options": [
     "would",
     "will"
    ],
    "answer": 0,
    "exp": "If + 과거(found) → 주절 would + 동사원형."
   }
  ]
 },
 {
  "id": "p3",
  "short": "P3",
  "name": "PART 3",
  "title": "유형 누적 (빈칸·순서·삽입)",
  "concept": "2주차 세 유형을 한 번씩 더. <b>빈칸=재진술/공통점, 순서·삽입=고리와 단절.</b> 지시어가 갈 곳이 있는지 늘 확인해. 전부 <b>도담T제작 신지문</b>.",
  "questions": [
   {
    "type": "choice",
    "label": "빈칸(끝) 요약",
    "made": true,
    "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?",
    "passage": "<div class=\"passage en\">A dog wags its tail, bares its teeth, or flattens its ears. A bee dances to point to flowers. A bird sings to warn of a hawk. None of these animals speaks a word, yet each sends a clear message. In short, animals communicate <b>______</b>.</div>",
    "options": [
     "only with sound",
     "without human language",
     "exactly as humans do",
     "to hide their feelings",
     "by copying one another"
    ],
    "answer": 1,
    "exp": "끝 빈칸은 앞 예시(꼬리·춤·노래, 말 한마디 없이)를 요약 → '인간의 언어 없이도' 소통한다. ③은 정반대, ①④⑤는 예시와 안 맞음."
   },
   {
    "type": "choice",
    "label": "빈칸(앞) 공통점",
    "made": true,
    "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?",
    "passage": "<div class=\"passage en\">Elephants raise a very different kind of family, one built on <b>______</b>. They carry a calf for almost two years, then nurse it for several more. A mother has only a handful of babies in her long life, but she guards each one for decades. Quantity is traded for care.</div>",
    "options": [
     "speed and numbers",
     "patience and heavy investment",
     "luck and chance",
     "strength alone",
     "competition among siblings"
    ],
    "answer": 1,
    "exp": "앞 빈칸은 뒤 예시(2년 임신, 수년 젖먹임, 적은 새끼를 수십 년 보살핌)의 공통점 → 인내와 큰 투자. 마지막 문장 'Quantity is traded for care'가 근거. ①은 정반대."
   },
   {
    "type": "choice",
    "label": "순서①",
    "made": true,
    "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?",

/* ===== 전역 상태 ===== */
let studentName = "";
const total = PARTS.reduce((s,p)=>s+p.questions.length,0);
const state = {}; // key q_pi_qi -> {confirmed, correct, my, reason, gno}
let gcounter = 0;

/* ===== 로그인 ===== */
function doLogin(){
  const v=document.getElementById('nameInput').value.trim();
  if(!v){ document.getElementById('nameInput').focus(); return; }
  studentName=v;
  document.getElementById('whoBadge').textContent=studentName + " · " + preGrade;
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  buildTabs(); buildParts(); showPart(0);
  window.scrollTo(0,0);
}
if(preName){ window.addEventListener('DOMContentLoaded',()=>{ document.getElementById('nameInput').value=preName; }); }

/* ===== 탭 ===== */
function buildTabs(){
  const bar=document.getElementById('tabbar');
  bar.innerHTML='';
  PARTS.forEach((p,i)=>{
    const t=document.createElement('div');
    t.className='tab'+(i===0?' active':'');
    t.id='tab_'+i;
    t.innerHTML=`${p.name}<span class="cnt">${p.title} · ${p.questions.length}문항</span>`;
    t.onclick=()=>showPart(i);
    bar.appendChild(t);
  });
}
function showPart(i){
  PARTS.forEach((p,j)=>{
    document.getElementById('sect_'+j).style.display = (i===j)?'block':'none';
    document.getElementById('tab_'+j).classList.toggle('active', i===j);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ===== 문항 렌더 ===== */
function esc(s){return s;}
function buildParts(){
  const root=document.getElementById('parts'); root.innerHTML=''; gcounter=0;
  PARTS.forEach((part,pi)=>{
    const sect=document.createElement('div'); sect.id='sect_'+pi; sect.style.display='none';
    const cc=document.createElement('div'); cc.className='concept';
    cc.innerHTML=`<div class="lab">개념카드 · ${part.name} ${part.title}</div><p>${part.concept}</p>`;
    sect.appendChild(cc);

    part.questions.forEach((qq,qi)=>{
      gcounter++; const gno=gcounter; const key='q_'+pi+'_'+qi;
      state[key]={confirmed:false,correct:false,my:null,reason:'',gno:gno,label:qq.label};
      const card=document.createElement('div'); card.className='qcard'; card.id='card_'+key;

      const typeLabel = qq.type==='fill' ? 'fill 빈칸' : '객관식';
      const typeCls   = qq.type==='fill' ? 'fill' : '';
      const madeChip  = qq.made ? '<span class="qtype made">도담T제작</span>' : '';

      let media='';
      if(qq.chart)   media+=qq.chart;
      if(qq.passage) media+=qq.passage;

      let answerArea='';
      if(qq.type==='choice'){
        answerArea='<div class="opts" id="opts_'+key+'">'+
          qq.options.map((o,oi)=>`<div class="opt" data-oi="${oi}" onclick="pickOpt('${key}',${oi})"><b>${['①','②','③','④','⑤'][oi]||(oi+1)}</b> ${o}</div>`).join('')+
        '</div>';
      } else {
        answerArea='<div class="fillrow"><input id="fill_'+key+'" type="text" placeholder="영어로 입력" autocomplete="off" oninput="onFillInput(\''+key+'\')"></div>';
      }

      card.innerHTML=
        `<div class="qhead"><span class="qno">${gno}</span><span class="qtype ${typeCls}">${typeLabel}</span>${madeChip}</div>`+
        `<div class="qtext">${qq.q}</div>`+
        media+
        answerArea+
        `<div class="reason"><label>근거 서술란 · 왜 이 답을 골랐는지 먼저 쓰기</label>`+
        `<textarea id="rs_${key}" oninput="onReason('${key}')" placeholder="예: twice가 있어서 계산했더니 2배가 아니라서 / 완전도치라 동사 뒤 명사가 주어라서 …"></textarea></div>`+
        `<button class="btn checkbtn" id="chk_${key}" disabled onclick="checkAns('${key}',${pi},${qi})">확인</button>`+
        `<div class="hint" id="hint_${key}">답 선택 + 근거를 쓰면 [확인]이 열려요.</div>`+
        `<div class="fb" id="fb_${key}"></div>`;
      sect.appendChild(card);
    });
    root.appendChild(sect);
  });
}

/* ===== 입력 핸들러 ===== */
function pickOpt(key,oi){
  const st=state[key]; if(st.confirmed) return;
  st.my=oi;
  const opts=document.getElementById('opts_'+key).children;
  for(let k=0;k<opts.length;k++) opts[k].classList.toggle('sel', k===oi);
  refreshCheck(key);
}
function onFillInput(key){
  const st=state[key]; if(st.confirmed) return;
  st.my=document.getElementById('fill_'+key).value;
  refreshCheck(key);
}
function onReason(key){
  const st=state[key]; if(st.confirmed) return;
  st.reason=document.getElementById('rs_'+key).value;
  refreshCheck(key);
}
function hasAnswer(st){
  if(st.my===null || st.my===undefined) return false;
  if(typeof st.my==='string') return st.my.trim()!=='';
  return true;
}
function refreshCheck(key){
  const st=state[key];
  const ready = hasAnswer(st) && st.reason.trim()!=='';
  document.getElementById('chk_'+key).disabled = !ready;
  document.getElementById('hint_'+key).style.display = ready?'none':'block';
}

/* ===== 채점(문항) ===== */
function norm(s){return (s||'').toString().toLowerCase().replace(/\s+/g,'').trim();}
function checkAns(key,pi,qi){
  const st=state[key]; if(st.confirmed) return;
  const qq=PARTS[pi].questions[qi];
  let correct=false, correctText='';
  if(qq.type==='choice'){
    correct = (st.my===qq.answer);
    correctText = ['①','②','③','④','⑤'][qq.answer]+' '+qq.options[qq.answer];
    const opts=document.getElementById('opts_'+key).children;
    for(let k=0;k<opts.length;k++){
      opts[k].classList.add('locked');
      if(k===qq.answer) opts[k].classList.add('correct');
      if(k===st.my && !correct) opts[k].classList.add('wrong');
    }
  } else {
    const answers=qq.answers.map(norm);
    correct = answers.includes(norm(st.my));
    correctText = qq.answers[0];
    const inp=document.getElementById('fill_'+key);
    inp.disabled=true; inp.classList.add(correct?'correct':'wrong');
  }
  st.confirmed=true; st.correct=correct;

  const ta=document.getElementById('rs_'+key); if(ta) ta.disabled=true;
  document.getElementById('chk_'+key).style.display='none';
  document.getElementById('hint_'+key).style.display='none';

  const fb=document.getElementById('fb_'+key);
  fb.className='fb show '+(correct?'ok':'no');
  fb.innerHTML =
    `<span class="res ${correct?'ok':'no'}">${correct?'정답! 👍':'오답'}</span>`+
    (correct?'':`<div class="ansline">정답: <b>${correctText}</b></div>`)+
    `<div class="exp">${qq.exp}</div>`;

  updateProgress();
}
function updateProgress(){
  let c=0; Object.values(state).forEach(s=>{if(s.confirmed)c++;});
  document.getElementById('prog').innerHTML=`확인한 문제 <b>${c}</b> / ${total}`;
  document.getElementById('submitBtn').disabled = (c<total);
}

/* ===== 제출 ===== */
function doSubmit(){
  let confirmed=0; Object.values(state).forEach(s=>{if(s.confirmed)confirmed++;});
  if(confirmed<total){ alert('아직 확인하지 않은 문제가 '+(total-confirmed)+'개 있어. 다 풀고 제출하자!'); return; }

  let score=0; const wrongs=[]; const reasons=[];
  PARTS.forEach((part,pi)=>part.questions.forEach((qq,qi)=>{
    const key='q_'+pi+'_'+qi; const st=state[key];
    if(st.correct) score++;
    // my answer text
    let myText;
    if(qq.type==='choice'){ myText = (st.my!=null)? (['①','②','③','④','⑤'][st.my]+' '+qq.options[st.my]) : '무응답'; }
    else { myText = (st.my||'').toString().trim() || '무응답'; }
    let corrText = (qq.type==='choice') ? (['①','②','③','④','⑤'][qq.answer]+' '+qq.options[qq.answer]) : qq.answers[0];
    if(!st.correct){
      wrongs.push(`${st.gno}. [${part.short} ${st.label}] 내 답: ${myText} / 정답: ${corrText}`);
    }
    reasons.push(`${st.gno}. ${st.reason.trim()||'(근거 미작성)'}`);
  }));
  const pct=Math.round(score/total*100);

  // 점수카드
  document.getElementById('scoreNum').innerHTML=pct+'<small>점</small>';
  document.getElementById('scoreDetail').textContent=`맞은 문제 ${score} / ${total}`;
  const rl=document.getElementById('reviewList');
  if(wrongs.length){
    rl.innerHTML='<div class="rl-t">다시 볼 문제 (교재에 손으로 다시 써서 오답노트 하기 ✍️)</div>'+
      wrongs.map(w=>`<div class="review-item">${w.replace(/내 답:/,'<b>내 답:</b>').replace(/정답:/,'<b>정답:</b>')}</div>`).join('');
  } else {
    rl.innerHTML='<div class="rl-t" style="color:var(--ok)">전부 정답! 완벽해 🎉 그래도 근거는 한 번 더 확인하자.</div>';
  }
  document.getElementById('scorecard').style.display='block';
  document.getElementById('scorecard').scrollIntoView({behavior:'smooth'});

  // wrongAnswers folding
  const waText =
    `점수: ${pct}점 (${score}/${total})\n`+
    `[틀린 문제]\n`+(wrongs.length? wrongs.join('\n'):'없음')+`\n`+
    `[근거 점검]\n`+reasons.join('\n');

  const payload={
    studentName: studentName,
    school: preSchool,
    grade: preGrade,
    workbook: WB.workbook,
    category: WB.category,
    submitDate: new Date().toISOString().slice(0,10),
    wrongAnswers: waText,
    score: pct
  };
  sendToNotion(payload);
}

function sendToNotion(payload){
  const el=document.getElementById('sendmsg');
  el.textContent='제출 중…';
  fetch(NOTION_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(()=>{ el.innerHTML='<b style="color:var(--ok)">제출 완료!</b> 선생님께 전송됐어요. 틀린 문제는 교재에 손으로 다시 써서 오답노트 하기 ✍️'; })
    .catch(e=>{ el.innerHTML='<b style="color:var(--no)">전송 실패</b> — 인터넷 확인 후 다시 [채점하고 제출하기]를 눌러줘. (점수는 위에 표시됨)'; });
}

document.addEventListener('DOMContentLoaded',()=>{
  const ni=document.getElementById('nameInput');
  if(ni) ni.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
});
</script>
