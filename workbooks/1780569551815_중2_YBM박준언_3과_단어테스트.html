<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중2 YBM(박준언) 3과 단어 테스트</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --accent: #4f8ef7;
    --accent2: #7c3aed;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e8eaf0;
    --text-muted: #8892a4;
    --border: #2d3348;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  /* ── HEADER ── */
  .top-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .top-bar .logo {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 1px;
  }
  .top-bar .subtitle { font-size: 12px; color: var(--text-muted); }

  /* ── LOGIN SCREEN ── */
  #loginScreen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 57px);
    padding: 30px 20px;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 440px;
  }
  .login-card h2 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text);
  }
  .login-card p {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 28px;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-group input, .form-group select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 15px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .form-group input:focus, .form-group select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .form-group select option { background: var(--surface); }

  /* ── SELECT SCREEN ── */
  #selectScreen {
    padding: 30px 20px;
    max-width: 600px;
    margin: 0 auto;
  }
  .select-header { margin-bottom: 28px; }
  .select-header h2 { font-size: 20px; font-weight: 700; }
  .select-header .user-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 8px;
  }
  .test-cards { display: flex; flex-direction: column; gap: 12px; }
  .test-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .test-card:hover {
    border-color: var(--accent);
    background: var(--surface2);
    transform: translateX(4px);
  }
  .test-card .tc-left { display: flex; align-items: center; gap: 14px; }
  .tc-badge {
    width: 44px; height: 44px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
  }
  .tc-badge.t1 { background: rgba(79,142,247,0.15); color: var(--accent); }
  .tc-badge.t2 { background: rgba(124,58,237,0.15); color: #a78bfa; }
  .tc-badge.t3 { background: rgba(34,197,94,0.15); color: var(--green); }
  .tc-info h3 { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
  .tc-info p { font-size: 12px; color: var(--text-muted); }
  .tc-arrow { color: var(--text-muted); font-size: 18px; }

  /* ── TEST SCREEN ── */
  #testScreen { padding: 0 0 60px; }

  .test-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .test-header .th-left { display: flex; align-items: center; gap: 10px; }
  .back-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.15s;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }

  .test-title { font-size: 15px; font-weight: 600; }
  .test-count { font-size: 12px; color: var(--text-muted); }

  .shuffle-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.15s;
    display: flex; align-items: center; gap: 5px;
  }
  .shuffle-btn:hover { border-color: var(--yellow); color: var(--yellow); }

  /* progress bar */
  .progress-bar-wrap {
    height: 3px;
    background: var(--surface2);
    position: relative;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.3s ease;
  }

  /* questions */
  .questions-wrap { padding: 20px; max-width: 700px; margin: 0 auto; }

  .q-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }
  .q-item.answered { border-color: var(--surface2); }
  .q-item.correct { border-color: var(--green) !important; background: rgba(34,197,94,0.05); }
  .q-item.wrong { border-color: var(--red) !important; background: rgba(239,68,68,0.05); }

  .q-number {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .q-word {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
    color: var(--text);
  }
  .q-hint {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  /* text input */
  .q-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 15px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    transition: border-color 0.2s;
  }
  .q-input:focus { outline: none; border-color: var(--accent); }
  .q-input:disabled { opacity: 0.6; cursor: default; }
  .q-input.correct-input { border-color: var(--green); }
  .q-input.wrong-input { border-color: var(--red); }

  /* radio options (Test3 객관식) */
  .q-options { display: flex; flex-direction: column; gap: 8px; }
  .q-option {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
    display: flex; align-items: center; gap: 10px;
  }
  .q-option:hover:not(.disabled) { border-color: var(--accent); }
  .q-option.selected { border-color: var(--accent); background: rgba(79,142,247,0.08); }
  .q-option.correct-opt { border-color: var(--green) !important; background: rgba(34,197,94,0.1) !important; }
  .q-option.wrong-opt { border-color: var(--red) !important; background: rgba(239,68,68,0.1) !important; }
  .q-option.disabled { pointer-events: none; }
  .opt-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
  }
  .q-option.selected .opt-dot { border-color: var(--accent); background: var(--accent); }
  .q-option.correct-opt .opt-dot { border-color: var(--green); background: var(--green); color: white; }
  .q-option.wrong-opt .opt-dot { border-color: var(--red); background: var(--red); color: white; }

  /* answer feedback */
  .q-feedback {
    margin-top: 8px;
    font-size: 13px;
    display: none;
    padding: 6px 10px;
    border-radius: 6px;
  }
  .q-feedback.show { display: block; }
  .q-feedback.correct { color: var(--green); background: rgba(34,197,94,0.08); }
  .q-feedback.wrong { color: var(--red); background: rgba(239,68,68,0.08); }
  .q-feedback .correct-ans { font-weight: 600; }

  /* anagram tiles */
  .anagram-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .anagram-tile {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .anagram-tile:hover { border-color: var(--accent); }
  .anagram-tile.used { opacity: 0.3; pointer-events: none; }
  .anagram-answer {
    min-height: 40px;
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    display: flex; flex-wrap: wrap; gap: 6px;
    align-items: center;
    cursor: pointer;
    margin-bottom: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    color: var(--text);
  }
  .anagram-answer .placed-tile {
    background: rgba(79,142,247,0.15);
    border: 1px solid var(--accent);
    border-radius: 5px;
    padding: 3px 8px;
    cursor: pointer;
    font-size: 13px;
  }

  /* submit section */
  .submit-wrap {
    padding: 20px;
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ── BUTTONS ── */
  .btn {
    border: none;
    border-radius: 10px;
    padding: 14px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.2s;
    width: 100%;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
  }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  /* ── RESULT SCREEN ── */
  #resultScreen { padding: 30px 20px; max-width: 600px; margin: 0 auto; }
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    text-align: center;
    margin-bottom: 24px;
  }
  .result-score {
    font-family: 'Space Mono', monospace;
    font-size: 64px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 8px;
  }
  .result-score.excellent { color: var(--green); }
  .result-score.good { color: var(--accent); }
  .result-score.fair { color: var(--yellow); }
  .result-score.poor { color: var(--red); }
  .result-label { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
  .result-stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 16px;
  }
  .stat { text-align: center; }
  .stat-num { font-size: 24px; font-weight: 700; font-family: 'Space Mono', monospace; }
  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .wrong-list-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .wrong-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--red);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
  }
  .wrong-q { color: var(--text-muted); flex: 1; }
  .wrong-your { color: var(--red); font-size: 12px; }
  .wrong-correct { color: var(--green); font-weight: 600; }

  .notion-status {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 16px;
  }
  .notion-status.sending { color: var(--yellow); }
  .notion-status.done { color: var(--green); border-color: rgba(34,197,94,0.3); }
  .notion-status.fail { color: var(--red); border-color: rgba(239,68,68,0.3); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* toast */
  .toast {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 14px;
    z-index: 999;
    transition: transform 0.3s ease;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* mobile */
  @media (max-width: 480px) {
    .login-card { padding: 28px 20px; }
    .q-word { font-size: 17px; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <span class="logo">도담한영어교실</span>
  <span class="subtitle">중2 YBM(박준언) Lesson 3</span>
</div>

<!-- ════════════════ LOGIN ════════════════ -->
<div id="loginScreen" class="screen active">
  <div class="login-card">
    <h2>단어 테스트</h2>
    <p>이름과 학교, 학년을 입력하고 시험을 선택하세요.</p>

    <div class="form-group">
      <label>이름</label>
      <input type="text" id="inputName" placeholder="홍길동" />
    </div>
    <div class="form-group">
      <label>학교</label>
      <input type="text" id="inputSchool" placeholder="예) 도담중학교" />
    </div>
    <div class="form-group">
      <label>학년</label>
      <select id="inputGrade">
        <option value="">학년 선택</option>
        <option value="중1">중1</option>
        <option value="중2">중2</option>
        <option value="중3">중3</option>
        <option value="고1">고1</option>
        <option value="고2">고2</option>
        <option value="고3">고3</option>
      </select>
    </div>

    <button class="btn btn-primary" onclick="goToSelect()">다음 →</button>
  </div>
</div>

<!-- ════════════════ SELECT ════════════════ -->
<div id="selectScreen" class="screen">
  <div class="select-header">
    <h2>시험 선택</h2>
    <div class="user-badge">
      <span>👤</span>
      <span id="badgeInfo"></span>
    </div>
  </div>
  <div class="test-cards">
    <div class="test-card" onclick="startTest('t1')">
      <div class="tc-left">
        <div class="tc-badge t1">T1</div>
        <div class="tc-info">
          <h3>Test 1 — 영→한</h3>
          <p>영어 단어를 보고 한국어 뜻 쓰기 · 75문항 전체</p>
        </div>
      </div>
      <span class="tc-arrow">›</span>
    </div>
    <div class="test-card" onclick="startTest('t2')">
      <div class="tc-left">
        <div class="tc-badge t2">T2</div>
        <div class="tc-info">
          <h3>Test 2 — 한→영</h3>
          <p>한국어 뜻을 보고 영어 단어 쓰기 · 75문항 전체</p>
        </div>
      </div>
      <span class="tc-arrow">›</span>
    </div>
    <div class="test-card" onclick="startTest('t3')">
      <div class="tc-left">
        <div class="tc-badge t3">T3</div>
        <div class="tc-info">
          <h3>Test 3 — 혼합</h3>
          <p>객관식·빈칸·영영풀이·다의어 혼합 · 30문항 랜덤</p>
        </div>
      </div>
      <span class="tc-arrow">›</span>
    </div>
  </div>
</div>

<!-- ════════════════ TEST ════════════════ -->
<div id="testScreen" class="screen">
  <div class="test-header">
    <div class="th-left">
      <button class="back-btn" onclick="goBack()">← 뒤로</button>
      <div>
        <div class="test-title" id="testTitle"></div>
        <div class="test-count" id="testCount"></div>
      </div>
    </div>
    <button class="shuffle-btn" id="shuffleBtn" onclick="shuffleQuestions()">🔀 섞기</button>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
  </div>
  <div class="questions-wrap" id="questionsWrap"></div>
  <div class="submit-wrap">
    <button class="btn btn-primary" id="submitBtn" onclick="submitTest()">제출하기</button>
  </div>
</div>

<!-- ════════════════ RESULT ════════════════ -->
<div id="resultScreen" class="screen">
  <div class="result-card">
    <div class="result-score" id="resultScore"></div>
    <div class="result-label" id="resultLabel"></div>
    <div class="result-stats">
      <div class="stat">
        <div class="stat-num green" id="correctCount"></div>
        <div class="stat-label">정답</div>
      </div>
      <div class="stat">
        <div class="stat-num red" id="wrongCount"></div>
        <div class="stat-label">오답</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="totalCount"></div>
        <div class="stat-label">전체</div>
      </div>
    </div>
  </div>
  <div class="notion-status" id="notionStatus">Notion에 결과를 전송하는 중...</div>
  <div id="wrongListWrap"></div>
  <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px;">
    <button class="btn btn-secondary" onclick="retryTest()">다시 풀기</button>
    <button class="btn btn-secondary" onclick="goToSelect()">다른 시험 선택</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════
// WORD DATA
// ════════════════════════════════════════
const WORDS = [
  // CONVERSATION
  {en:"plan",ko:"~을 계획하다",pos:"v.",hint:"계획"},
  {en:"must-see",ko:"꼭 봐야 할 것, 꼭 가봐야 할 장소",pos:"n.",hint:"관광"},
  {en:"like",ko:"~와 같은",pos:"prep.",hint:"비교"},
  {en:"night view",ko:"야경",pos:"n.",hint:"경치"},
  {en:"fantastic",ko:"환상적인",pos:"a.",hint:"감탄"},
  {en:"recommend",ko:"~을 추천하다",pos:"v.",hint:"추천"},
  {en:"koala",ko:"코알라",pos:"n.",hint:"동물"},
  {en:"kangaroo",ko:"캥거루",pos:"n.",hint:"동물"},
  {en:"forget",ko:"~을 잊다",pos:"v.",hint:"기억"},
  {en:"feed",ko:"~에게 먹이를 주다",pos:"v.",hint:"동물"},
  {en:"beach",ko:"해변",pos:"n.",hint:"바다"},
  {en:"relax",ko:"휴식을 취하다",pos:"v.",hint:"휴가"},
  {en:"Vietnamese",ko:"베트남의",pos:"a.",hint:"나라"},
  {en:"tradition",ko:"전통",pos:"n.",hint:"문화"},

// BUILD QUESTIONS
// ════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startTest(type) {
  currentTest = type;
  submitted = false;
  answers = {};
  buildQuestions(type);
  renderQuestions();
  const titles = { t1:'Test 1 — 영→한', t2:'Test 2 — 한→영', t3:'Test 3 — 혼합' };
  document.getElementById('testTitle').textContent = titles[type];
  document.getElementById('testCount').textContent = `${questions.length}문항`;
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('submitBtn').textContent = '제출하기';
  updateProgress();
  showScreen('testScreen');
  window.scrollTo(0,0);
}

function buildQuestions(type) {
  if (type === 't1') {
    questions = shuffle(WORDS).map(w => ({ type:'t1', ...w }));
  } else if (type === 't2') {
    questions = shuffle(WORDS).map(w => ({ type:'t2', ...w }));
  } else {
    // Test 3 — mix 30 from 4 pools
    const pool = [];

    // 영영풀이 (7문항)
    const defWords = shuffle(Object.keys(DEFINITIONS)).slice(0,7);
    defWords.forEach(w => {
      const word = WORDS.find(x => x.en === w);
      pool.push({ type:'def', en:w, ko:word ? word.ko : '', def: DEFINITIONS[w] });
    });

    // 빈칸 채우기 (8문항)
    shuffle(FILL_SENTENCES).slice(0,8).forEach(f => {
      pool.push({ type:'fill', ...f });
    });

    // 객관식 (7문항: MC + 다의어)
    const mc = shuffle(MC_POOL).slice(0,4);
    mc.forEach(m => {
      const opts = shuffle([m.correct, ...m.distractors]);
      pool.push({ type:'mc', q:m.q, opts, correct:m.correct, isNot:!!m.isNot });
    });
    const poly = shuffle(POLY_Q).slice(0,3);
    poly.forEach(p => {
      pool.push({ type:'poly', ...p });
    });

    // 유의어/반의어 (8문항)
    shuffle(SYN_ANT).slice(0,8).forEach(s => {
      pool.push({ type:'synant', ...s });
    });

    questions = shuffle(pool).slice(0, 30);
  }
}

function shuffleQuestions() {
  if (submitted) { showToast('제출 후에는 섞을 수 없어요.'); return; }
  answers = {};
  buildQuestions(currentTest);
  renderQuestions();
  updateProgress();
  showToast('🔀 문제 순서가 섞였습니다!');
  window.scrollTo(0,0);
}

// ════════════════════════════════════════
// RENDER
// ════════════════════════════════════════
function renderQuestions() {
  const wrap = document.getElementById('questionsWrap');
  wrap.innerHTML = '';
  questions.forEach((q, i) => {
    const div = document.createElement('div');
    div.className = 'q-item';
    div.id = `q-item-${i}`;
    div.innerHTML = buildQHTML(q, i);
    wrap.appendChild(div);
  });
  // bind events
  questions.forEach((q, i) => {
    if (q.type === 't1' || q.type === 't2' || q.type === 'def' || q.type === 'synant') {
      const inp = document.getElementById(`inp-${i}`);
      if (inp) inp.addEventListener('input', () => onInputChange(i));
    }
    if (q.type === 'fill') {
      const inp = document.getElementById(`inp-${i}`);
      if (inp) inp.addEventListener('input', () => onInputChange(i));
    }
    if (q.type === 'mc' || q.type === 'poly') {
      document.querySelectorAll(`.opt-${i}`).forEach(el => {
        el.addEventListener('click', () => pickOption(i, el.dataset.val));
      });
    }
  });
}

function buildQHTML(q, i) {
  const num = `<div class="q-number">Q${i+1}</div>`;
  const fb = `<div class="q-feedback" id="fb-${i}"></div>`;

  if (q.type === 't1') {
    return `${num}
      <div class="q-word">${q.en}</div>
      <div class="q-hint">${q.pos}</div>
      <input class="q-input" id="inp-${i}" type="text" placeholder="한국어 뜻을 입력하세요" autocomplete="off" />
      ${fb}`;
  }
  if (q.type === 't2') {
    return `${num}
      <div class="q-word">${q.ko}</div>
      <div class="q-hint">${q.pos} · ${q.hint}</div>
      <input class="q-input" id="inp-${i}" type="text" placeholder="영어 단어를 입력하세요" autocomplete="off" />
      ${fb}`;
  }
  if (q.type === 'def') {
    return `${num}
      <div class="q-hint" style="margin-bottom:6px">🔍 영영풀이를 보고 단어를 쓰세요</div>
      <div class="q-word" style="font-size:15px;font-weight:500;line-height:1.5;margin-bottom:12px">"${q.def}"</div>
      <input class="q-input" id="inp-${i}" type="text" placeholder="영어 단어를 입력하세요" autocomplete="off" />
      ${fb}`;
  }
  if (q.type === 'fill') {
    const parts = q.sentence.split('___');
    const sentenceHTML = parts.length === 2
      ? `${escHtml(parts[0])}<span style="display:inline-block;min-width:80px;border-bottom:2px solid var(--accent);margin:0 4px;vertical-align:bottom;">&nbsp;</span>${escHtml(parts[1])}`
      : escHtml(q.sentence);
    return `${num}
      <div class="q-hint">📝 빈칸에 알맞은 말을 쓰세요 (힌트: ${q.hint})</div>
      <div class="q-word" style="font-size:16px;font-weight:400;line-height:1.6;margin-bottom:12px">${sentenceHTML}</div>
      <input class="q-input" id="inp-${i}" type="text" placeholder="답을 입력하세요" autocomplete="off" />
      ${fb}`;
  }
  if (q.type === 'mc') {
    const optsHTML = q.opts.map(o => `
      <div class="q-option opt-${i}" data-val="${escAttr(o)}">
        <div class="opt-dot"></div>
        <span>${escHtml(o)}</span>
      </div>`).join('');
    return `${num}
      <div class="q-word" style="font-size:15px;font-weight:500;margin-bottom:12px">${escHtml(q.q)}</div>
      <div class="q-options">${optsHTML}</div>
      ${fb}`;
  }
  if (q.type === 'poly') {
    const optsHTML = q.options.map(o => `
      <div class="q-option opt-${i}" data-val="${escAttr(o)}">
        <div class="opt-dot"></div>
        <span>${escHtml(o)}</span>
      </div>`).join('');
    return `${num}
      <div class="q-hint">다음 밑줄 친 <strong style="color:var(--accent)">${q.word}</strong>의 뜻은?</div>
      <div class="q-word" style="font-size:15px;font-weight:400;line-height:1.6;margin-bottom:12px">"${escHtml(q.sentence)}"</div>
      <div class="q-options">${optsHTML}</div>
      ${fb}`;
  }
  if (q.type === 'synant') {
    return `${num}
      <div class="q-hint">📚 <strong style="color:var(--accent)">${q.word}</strong>의 ${q.relation}은?</div>
      <div class="q-word" style="font-size:16px;margin-bottom:12px">${q.word} → ?</div>
      <input class="q-input" id="inp-${i}" type="text" placeholder="${q.relation}를 영어로 입력하세요" autocomplete="off" />
      ${fb}`;
  }
  return '';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) { return String(s).replace(/"/g,'&quot;'); }

function onInputChange(i) {
  const val = document.getElementById(`inp-${i}`).value.trim();
  answers[i] = val;
  updateProgress();
}

function pickOption(i, val) {
  if (submitted) return;
  answers[i] = val;
  document.querySelectorAll(`.opt-${i}`).forEach(el => {
    el.classList.toggle('selected', el.dataset.val === val);
  });
  updateProgress();
}

function updateProgress() {
  const done = Object.keys(answers).filter(k => answers[k] !== '').length;
  const pct = questions.length ? (done / questions.length) * 100 : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('testCount').textContent = `${done}/${questions.length} 문항`;
}

// ════════════════════════════════════════
// GRADING
// ════════════════════════════════════════
function normalize(s) {
  return String(s).trim().toLowerCase()
    .replace(/\s+/g,' ')
    .replace(/[~·,]/g,'')
    .replace(/\(.*?\)/g,'')
    .trim();
}

function checkAnswer(q, userAns) {
  const u = normalize(userAns);
  if (!u) return false;

  if (q.type === 't1') {
    // allow partial: split by comma, check if user matches any segment
    const parts = q.ko.split(',').map(p => normalize(p));
    return parts.some(p => p === u || p.includes(u) || u.includes(p.split(' ')[0]));
  }
  if (q.type === 't2') {
    const correct = normalize(q.en);
    return u === correct || correct.replace(/[~-]/g,'').trim() === u.replace(/[~-]/g,'').trim();
  }
  if (q.type === 'def') {
    return normalize(q.en) === u || normalize(q.en).replace(/[~\s]/g,'') === u.replace(/[~\s]/g,'');
  }
  if (q.type === 'fill') {
    const ans = normalize(q.answer);
    return ans === u || ans.replace(/[^a-z가-힣]/g,'') === u.replace(/[^a-z가-힣]/g,'');
  }
  if (q.type === 'mc' || q.type === 'poly') {
    return normalize(q.correct) === u;
  }
  if (q.type === 'synant') {
    const pairs = q.pair.split('/').map(p => normalize(p));
    return pairs.some(p => p === u || p.replace(/[~\s]/g,'') === u.replace(/[~\s]/g,''));
  }
  return false;
}

function getCorrectStr(q) {
  if (q.type === 't1') return q.ko;
  if (q.type === 't2') return q.en;
  if (q.type === 'def') return q.en;
  if (q.type === 'fill') return q.answer;
  if (q.type === 'mc' || q.type === 'poly') return q.correct;
  if (q.type === 'synant') return q.pair;
  return '';
}

function getQuestionStr(q) {
  if (q.type === 't1') return q.en;
  if (q.type === 't2') return q.ko;
  if (q.type === 'def') return `영영풀이: "${q.def.slice(0,40)}..."`;
  if (q.type === 'fill') return q.sentence;
  if (q.type === 'mc') return q.q;
  if (q.type === 'poly') return `[${q.word}] "${q.sentence.slice(0,30)}..."`;
  if (q.type === 'synant') return `${q.word}의 ${q.relation}`;
  return '';
}

// ════════════════════════════════════════
// SUBMIT
// ════════════════════════════════════════
function submitTest() {
  submitted = true;
  document.getElementById('submitBtn').disabled = true;

  let correct = 0;
  const wrongItems = [];

  questions.forEach((q, i) => {
    const userAns = answers[i] !== undefined ? String(answers[i]) : '';
    const isCorrect = checkAnswer(q, userAns);
    const item = document.getElementById(`q-item-${i}`);
    const fb = document.getElementById(`fb-${i}`);
    const inp = document.getElementById(`inp-${i}`);

    if (isCorrect) {
      correct++;
      item.classList.add('correct');
      if (inp) { inp.classList.add('correct-input'); inp.disabled = true; }
      if (q.type === 'mc' || q.type === 'poly') {
        document.querySelectorAll(`.opt-${i}`).forEach(el => {
          el.classList.add('disabled');
          if (el.dataset.val === q.correct) el.classList.add('correct-opt');
        });
      }
      fb.className = 'q-feedback correct show';
      fb.innerHTML = '✓ 정답!';
    } else {
      item.classList.add('wrong');
      if (inp) { inp.classList.add('wrong-input'); inp.disabled = true; }
      if (q.type === 'mc' || q.type === 'poly') {
        document.querySelectorAll(`.opt-${i}`).forEach(el => {
          el.classList.add('disabled');
          if (el.dataset.val === q.correct) el.classList.add('correct-opt');
          else if (el.classList.contains('selected')) el.classList.add('wrong-opt');
        });
      }
      fb.className = 'q-feedback wrong show';
      const yourStr = userAns || '(미입력)';
      fb.innerHTML = `✗ 오답 — 정답: <span class="correct-ans">${escHtml(getCorrectStr(q))}</span>`;

      wrongItems.push({
        question: getQuestionStr(q),
        yourAnswer: yourStr,
        correct: getCorrectStr(q),
        type: q.type,
      });
    }
  });

  showResult(correct, wrongItems);
}

// ════════════════════════════════════════
// RESULT
// ════════════════════════════════════════
function showResult(correct, wrongItems) {
  const total = questions.length;
  const score = Math.round((correct / total) * 100);

  const scoreEl = document.getElementById('resultScore');
  scoreEl.textContent = score + '점';
  scoreEl.className = 'result-score ' + (score>=90?'excellent':score>=70?'good':score>=50?'fair':'poor');

  const labels = { excellent:'훌륭해요! 🎉', good:'잘했어요! 👍', fair:'조금 더 노력해요 💪', poor:'다시 한번 도전해봐요 📚' };
  const cls = score>=90?'excellent':score>=70?'good':score>=50?'fair':'poor';
  document.getElementById('resultLabel').textContent = labels[cls];
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = total - correct;
  document.getElementById('totalCount').textContent = total;

  // wrong list
  const wWrap = document.getElementById('wrongListWrap');
  if (wrongItems.length) {
    let html = `<div class="wrong-list-title">오답 목록 (${wrongItems.length}개)</div>`;
    wrongItems.forEach(w => {
      html += `<div class="wrong-item">
        <div>
          <div class="wrong-q">${escHtml(w.question)}</div>
          <div class="wrong-your">내 답: ${escHtml(w.yourAnswer)}</div>
        </div>
        <div class="wrong-correct">${escHtml(w.correct)}</div>
      </div>`;
    });
    wWrap.innerHTML = html;
  } else {
    wWrap.innerHTML = '<div style="text-align:center;color:var(--green);padding:16px;font-size:15px;">오답이 없어요! 완벽해요 🎉</div>';
  }

  showScreen('resultScreen');
  window.scrollTo(0,0);
  sendToNotion(score, correct, total, wrongItems);
}

// ════════════════════════════════════════
// NOTION
// ════════════════════════════════════════
async function sendToNotion(score, correct, total, wrongItems) {
  const status = document.getElementById('notionStatus');
  status.className = 'notion-status sending';
  status.textContent = '📤 Notion에 결과를 전송하는 중...';

  const testNames = { t1:'Test 1 (영→한)', t2:'Test 2 (한→영)', t3:'Test 3 (혼합)' };
  const wrongText = wrongItems.length
    ? wrongItems.map(w => `[Q: ${w.question}] 내답: ${w.yourAnswer} → 정답: ${w.correct}`).join('\n')
    : '오답 없음';

  const submitDate = new Date().toISOString().split('T')[0];
  const workbookName = `중2 YBM(박준언) 3과 단어 ${testNames[currentTest]}`;

  const wrongAnswersContent = `[점수: ${score}점]\n${wrongText}`;

  const payload = {
    studentName,
    school: studentSchool,
    grade: studentGrade,
    workbook: workbookName,
    category: '단어',
    submitDate,
    wrongAnswers: wrongAnswersContent,
    score,
  };

  try {
    const res = await fetch('https://dodamenglish.netlify.app/.netlify/functions/notion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (res.ok) {
      status.className = 'notion-status done';
      status.textContent = '✅ Notion에 결과가 저장되었습니다!';
    } else {
      throw new Error('서버 오류');
    }
  } catch (e) {
    status.className = 'notion-status fail';
    status.textContent = '❌ 전송 실패 — 인터넷 연결을 확인해주세요.';
  }
}

// ════════════════════════════════════════
// RETRY
// ════════════════════════════════════════
function retryTest() {
  startTest(currentTest);
}

// ════════════════════════════════════════
// TOAST
// ════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
