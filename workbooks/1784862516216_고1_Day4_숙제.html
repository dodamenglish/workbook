<style>
  :root{ --navy:#1a3a5c; --persimmon:#e8703a; --cream:#fdf7ec; --ink:#22303f; --line:#e2e7ec; --gray:#8a94a0; --ok:#1f9d6b; --no:#d94a4a; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:#eef1f4; color:var(--ink); font-family:"Noto Sans KR",system-ui,sans-serif; }
  .wrap{ max-width:660px; margin:0 auto; background:#fff; min-height:100vh; } .serif,.en{ font-family:"Noto Serif KR",serif; }
  header{ background:var(--navy); color:#fff; padding:18px 18px 16px; position:sticky; top:0; z-index:5; }
  header .brand{ font-size:12px; color:#b9cbe0; letter-spacing:.3px; } header h1{ font-size:19px; margin:3px 0 0; font-weight:800; } header .meta{ font-size:12px; color:#c9d6e5; margin-top:4px; }
  .who{ font-size:12px; color:#c9d6e5; margin-top:6px; display:none; } .who.show{ display:block; }
  .score-pill{ margin-top:12px; background:rgba(255,255,255,.12); border-radius:10px; padding:9px 12px; font-size:14px; display:none; align-items:center; gap:8px; } .score-pill.show{ display:flex; } .score-pill b{ font-size:17px; color:#ffd9a8; }
  .screen{ display:none; } .screen.active{ display:block; }
  .login{ padding:26px 20px 40px; } .login h2{ font-size:18px; color:var(--navy); margin:6px 0 4px; } .login p.desc{ color:var(--gray); font-size:13px; margin:0 0 22px; }
  .fg{ margin-bottom:15px; } .fg label{ display:block; font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:6px; }
  .fg input, .fg select{ width:100%; border:2px solid var(--line); border-radius:10px; padding:12px 13px; font-family:inherit; font-size:15px; color:var(--ink); background:#f8fafd; outline:none; } .fg input:focus, .fg select:focus{ border-color:var(--navy); background:#fff; }
  main{ padding:14px 16px 20px; }
  .p-tag{ display:inline-block; background:var(--persimmon); color:#fff; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; margin:12px 0 8px; }
  .passage{ background:var(--cream); border:1px solid #ecdcbf; border-radius:12px; padding:15px 15px 13px; margin-bottom:16px; }
  .passage p{ font-family:"Noto Serif KR",serif; font-size:16px; line-height:1.9; margin:0; text-align:justify; } .passage u{ text-decoration:none; border-bottom:2px solid var(--navy); padding-bottom:1px; }
  .passage .blank{ display:inline-block; border-bottom:2px solid var(--ink); min-width:58px; text-align:center; font-weight:700; }
  .sec-title{ font-size:13px; font-weight:800; color:var(--navy); margin:18px 0 8px; padding-left:9px; border-left:4px solid var(--persimmon); }
  .q{ border:1px solid var(--line); border-radius:12px; padding:14px 14px 11px; margin-bottom:13px; } .q .qlabel{ font-size:11px; color:var(--persimmon); font-weight:800; letter-spacing:.3px; } .q .qid{ float:right; font-size:10px; color:var(--gray); font-weight:600; }
  .q .stem{ font-weight:700; margin:5px 0 10px; line-height:1.5; font-size:14.5px; }
  .gbox{ font-family:"Noto Serif KR",serif; font-size:15px; line-height:1.95; background:#fafbfc; border:1px solid var(--line); border-radius:8px; padding:11px 12px; margin:0 0 10px; } .gbox u{ text-decoration:none; border-bottom:1.4px solid var(--ink); } .gbox .box{ border:1.4px solid var(--navy); border-radius:5px; padding:0 5px; font-weight:600; }
  .opt{ display:flex; align-items:flex-start; gap:10px; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:7px; cursor:pointer; background:#fff; } .opt input{ display:none; }
  .opt .cir{ flex:0 0 auto; width:22px; height:22px; border-radius:50%; border:2px solid #c3ccd5; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:var(--gray); margin-top:1px; }
  .opt .txt{ font-size:14px; line-height:1.45; } .opt .txt .en{ font-size:15px; } .opt .txt .ko{ color:var(--gray); font-size:12.5px; }
  .opt.sel{ border-color:var(--navy); background:#f4f8fc; } .opt.sel .cir{ border-color:var(--navy); background:var(--navy); color:#fff; }
  .graded .opt{ cursor:default; } .graded .opt.correct{ border-color:var(--ok); background:#eafaf3; } .graded .opt.correct .cir{ border-color:var(--ok); background:var(--ok); color:#fff; }
  .graded .opt.wrong{ border-color:var(--no); background:#fdeeee; } .graded .opt.wrong .cir{ border-color:var(--no); background:var(--no); color:#fff; }
  .mark{ margin-left:auto; font-weight:800; font-size:16px; align-self:center; display:none; } .graded .opt.correct .mark, .graded .opt.wrong .mark{ display:inline; } .graded .opt.correct .mark{ color:var(--ok); } .graded .opt.wrong .mark{ color:var(--no); }
  .expl{ display:none; margin-top:9px; background:#f7f9fb; border-left:4px solid var(--persimmon); border-radius:0 8px 8px 0; padding:10px 12px; font-size:13px; line-height:1.6; color:#33424f; } .expl.show{ display:block; } .expl b{ color:var(--navy); }
  .notion-status{ margin:0 16px; font-size:12.5px; text-align:center; color:var(--gray); min-height:18px; } .notion-status.sending{ color:var(--navy); } .notion-status.sent{ color:var(--ok); } .notion-status.err{ color:var(--no); }
  .actions{ position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); display:flex; gap:10px; }
  button{ font-family:inherit; font-weight:800; font-size:15px; border:0; border-radius:11px; padding:14px; cursor:pointer; flex:1; } .btn-main{ background:var(--persimmon); color:#fff; } .btn-main:disabled{ background:#e6bda9; cursor:default; } .btn-sub{ background:#eef1f4; color:var(--navy); display:none; }
  footer{ text-align:center; color:var(--gray); font-size:11px; padding:14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">도담한영어교실 고1 2026년 여름방학특강</div>
    <h1>Day4 리딩 숙제</h1>
    <div class="meta">지문 3개 · 어법 강화 · 자동채점 · Notion 제출</div>
    <div class="who" id="who"></div>

  <section class="screen" id="screenQuiz">
    <main id="app"></main>
    <div class="notion-status" id="notionStatus"></div>
    <div class="actions"><button class="btn-main" id="grade">채점하고 제출하기</button><button class="btn-sub" id="retry">다시 풀기</button></div>
    <footer>도담한영어교실 고1 2026년 여름방학특강 · Day4 리딩 숙제</footer>
  </section>
</div>
<script>
  const CACHE_VERSION = "day4-reading-v1";
  const NOTION_ENDPOINT = "https://dodamenglish.netlify.app/.netlify/functions/notion";
  const WORKBOOK = "방학특강 Day4 리딩 숙제";
  const CATEGORY = "리딩 - 방학특강";
  const CIRCLE = ["①","②","③","④","⑤"];
  const PANELS = [
    { tag:"PASSAGE 1 · Travel", tabId:"w04p1",
      html:'For decades, night trains seemed like a thing of the past. Fast planes and cheap flights had pushed them aside. Lately, though, the sleeper train is quietly making a comeback across Europe. Why would anyone choose a slow train over a quick flight? For many, the answer is the journey itself. You board in one city in the evening, sleep as the countryside rolls by, and wake up in another country — no airports, no long security lines. Night trains also produce far <span class="blank">(A)</span> pollution than planes. Sometimes the slower path turns out to be the richer one. In a world that prizes speed, the return of the night train is a gentle reminder that <u>getting there can be part of the joy</u>.',
      questions:[
        { idx:1, label:"함의추론", stem:'밑줄 친 <span class="en">getting there can be part of the joy</span>가 의미하는 바로 가장 적절한 것은?',
          options:[{en:"Trains are always faster than planes."},{en:"The journey itself can be a pleasure, not just arriving."},{en:"Airports are the best part of travel."},{en:"Speed is the only thing that matters."},{en:"Night trains are far more expensive."}], answer:2,
          expl:'목적지 도착만이 아니라 가는 여정 자체가 즐거움일 수 있다. → ②.' },
        { idx:2, label:"빈칸추론", stem:'윗글의 빈칸 (A)에 들어갈 말로 가장 적절한 것은?',
          options:[{en:"more",ko:"더 많은"},{en:"less",ko:"더 적은"},{en:"louder",ko:"더 시끄러운"},{en:"faster",ko:"더 빠른"},{en:"sweeter",ko:"더 단"}], answer:2,
          expl:'야간열차는 비행기보다 오염이 <b>더 적다</b>(친환경 장점). → ② less.' },
        { idx:3, label:"어법 · 밑줄형(29)", stem:'다음 밑줄 친 부분 중, 어법상 <u>틀린</u> 것은?',
          gbox:'Night trains <u>are①</u> making a comeback. Travelers <u>who②</u> choose them enjoy the journey. A sleeper train <u>produce③</u> less pollution. You <u>board④</u> in the evening. The slower path <u>is⑤</u> often richer.',
          options:[{en:"①"},{en:"②"},{en:"③"},{en:"④"},{en:"⑤"}], answer:3,
          expl:'③ <b>produce → produces</b> : 주어 "A sleeper train"은 단수. (①복수 are ②주격 who ④주어 You board ⑤단수 is)' },
        { idx:4, label:"어휘", stem:'지문의 <span class="en">board</span>(탑승하다)와 의미가 가장 가까운 것은?',
          options:[{en:"get on",ko:"올라타다"},{en:"sell",ko:"팔다"},{en:"break",ko:"부수다"},{en:"cook",ko:"요리하다"},{en:"hide",ko:"숨다"}], answer:1,
          expl:'board = (탈것에) 타다 → ① get on.' }
      ]},
    { tag:"PASSAGE 2 · Society", tabId:"w04p2",
      html:'Every year, surveys try to rank the best countries to live in. The results often surprise people. The top spots rarely go to the richest or biggest nations. Instead, they go to places where people feel safe, healthy, and free to build the lives they want. Money matters, of course, but only up to a point. Beyond meeting basic needs, what people value most is <span class="blank">(A)</span> — trust in their neighbors, their doctors, and their government. A good country is not simply a wealthy one; it is one where life feels fair and secure. So when we ask what makes a nation great, the answer may have less to do with its size or riches, and more to do with <u>how its people are treated</u>.',
      questions:[
        { idx:1, label:"함의추론", stem:'밑줄 친 <span class="en">how its people are treated</span>이 의미하는 바로 가장 적절한 것은?',
          options:[{en:"The richest countries are always the best."},{en:"A country's greatness depends on how fairly it treats its people."},{en:"Bigger countries are always safer."},{en:"Money is the only measure of a nation."},{en:"People should move to richer nations."}], answer:2,
          expl:'좋은 나라는 부가 아니라 사람을 얼마나 공정히 대하느냐로 결정된다. → ②.' },
        { idx:2, label:"빈칸추론", stem:'윗글의 빈칸 (A)에 들어갈 말로 가장 적절한 것은?',
          options:[{en:"speed",ko:"속도"},{en:"trust",ko:"신뢰"},{en:"fame",ko:"명성"},{en:"size",ko:"크기"},{en:"noise",ko:"소음"}], answer:2,
          expl:'이웃·의사·정부에 대한 신뢰가 이어지므로 → ② trust.' },
        { idx:3, label:"어법 · 밑줄형(29)", stem:'다음 밑줄 친 부분 중, 어법상 <u>틀린</u> 것은?',
          gbox:'Surveys <u>try①</u> to rank countries. The top spots <u>goes②</u> to safe places. People <u>who③</u> feel safe are happier. Trust <u>matters④</u> most. A good country is one <u>where⑤</u> life feels fair.',
          options:[{en:"①"},{en:"②"},{en:"③"},{en:"④"},{en:"⑤"}], answer:2,
          expl:'② <b>goes → go</b> : 주어 "The top spots"는 복수. (①복수 try ③주격 who ④단수 matters ⑤관계부사 where)' },
        { idx:4, label:"어휘", stem:'지문의 <span class="en">rank</span>(순위 매기다)와 의미가 가장 가까운 것은?',
          options:[{en:"order",ko:"순서를 매기다"},{en:"forget",ko:"잊다"},{en:"buy",ko:"사다"},{en:"cool",ko:"식히다"},{en:"hide",ko:"숨다"}], answer:1,
          expl:'rank = 순위를 매기다 → ① order.' }
      ]},
    { tag:"PASSAGE 3 · Technology", tabId:"w04p3",
      html:'In a stadium in Beijing, the players were not human — they were robots, and the crowd loved it. Small robots chased a ball, fell down, stood back up, and even scored goals. It looked like fun, but it was also science. Teaching a robot to play soccer is far harder than it seems. A robot must see the ball, balance on two legs, plan a move, and react in a fraction of a second — all at once. By learning to play a simple game, robots learn skills that matter far beyond the field. The same <span class="blank">(A)</span> could one day help robots walk through disaster sites or care for the sick. So while robot soccer may look like a game, it is really a way for machines to <u>learn how to move in our world</u>.',
      questions:[
        { idx:1, label:"함의추론", stem:'밑줄 친 <span class="en">learn how to move in our world</span>이 의미하는 바로 가장 적절한 것은?',
          options:[{en:"Robots will replace human soccer players."},{en:"Playing a game teaches robots skills useful in real life."},{en:"Soccer is simply too hard for robots."},{en:"Robots dislike falling down."},{en:"Stadiums should ban all robots."}], answer:2,
          expl:'간단한 게임을 익히며 실제 세상에 쓸 능력을 배운다. → ②.' },
        { idx:2, label:"빈칸추론", stem:'윗글의 빈칸 (A)에 들어갈 말로 가장 적절한 것은?',
          options:[{en:"skills",ko:"능력"},{en:"colors",ko:"색"},{en:"prices",ko:"가격"},{en:"names",ko:"이름"},{en:"sounds",ko:"소리"}], answer:1,
          expl:'축구로 익힌 능력이 재난 현장에도 도움 → 같은 "능력". → ① skills.' },
        { idx:3, label:"어법 · 밑줄형(29)", stem:'다음 밑줄 친 부분 중, 어법상 <u>틀린</u> 것은?',
          gbox:'The players <u>were①</u> robots. A robot <u>must②</u> see the ball. Robots <u>that③</u> play soccer learn real skills. Teaching a robot <u>is④</u> hard. These skills <u>helps⑤</u> robots elsewhere.',
          options:[{en:"①"},{en:"②"},{en:"③"},{en:"④"},{en:"⑤"}], answer:5,
          expl:'⑤ <b>helps → help</b> : 주어 "These skills"는 복수. (①were ②조동사 must ③사물 주격 that ④동명사 주어 단수 is)' },
        { idx:4, label:"어휘", stem:'지문의 <span class="en">react</span>와 의미가 가장 가까운 것은?',
          options:[{en:"respond",ko:"반응하다"},{en:"begin",ko:"시작하다"},{en:"buy",ko:"사다"},{en:"cool",ko:"식히다"},{en:"hide",ko:"숨다"}], answer:1,
          expl:'react = 반응하다 → ① respond.' }
      ]},
    { grammar:true, title:"GRAMMAR BOOSTER · 어법 집중 (네모형·형태·정오)", tabId:"w04g",
      questions:[
        { idx:1, label:"어법 · 네모형(30)", stem:'(A), (B), (C)의 네모 안에서 어법상 옳은 것끼리 짝지은 것은?',
          gbox:'A robot must balance (A)<span class="box">quick / quickly</span>. Skills (B)<span class="box">that / what</span> robots learn are useful. The game is a way (C)<span class="box">to move / moving</span> in our world.',
          options:[{en:"(A) quickly  (B) that  (C) to move"},{en:"(A) quick  (B) what  (C) moving"},{en:"(A) quickly  (B) what  (C) to move"},{en:"(A) quick  (B) that  (C) moving"},{en:"(A) quickly  (B) that  (C) moving"}], answer:1,
          expl:'(A) 동사 balance 수식 부사 <b>quickly</b> / (B) 선행사 Skills 있음 → <b>that</b> / (C) a way <b>to move</b>(~하는 방법). → ①.' },
        { idx:2, label:"어법 · 형태 고르기", stem:'빈칸에 들어갈 <span class="en">little</span>의 올바른 형태는?',
          gbox:'Night trains produce far ______ pollution than planes.  <span style="color:var(--gray);font-size:13px;">( little )</span>',
          options:[{en:"little"},{en:"less"},{en:"fewer"},{en:"least"},{en:"lesser"}], answer:2,
          expl:'불가산명사 pollution의 비교급이 필요 → little의 비교급 <b>less</b>. (fewer는 가산명사용) → ②.' },
        { idx:3, label:"어법 · 밑줄 정오", stem:'다음 밑줄 친 부분 중, 어법상 <u>틀린</u> 것은?',
          gbox:'A country <u>where①</u> people feel safe <u>rank②</u> high, and trust <u>matters③</u> more than money, <u>which④</u> people <u>value⑤</u> most.',
          options:[{en:"①"},{en:"②"},{en:"③"},{en:"④"},{en:"⑤"}], answer:2,
          expl:'② <b>rank → ranks</b> : 주어 "A country"는 단수. (①관계부사 where ③단수 matters ④목적격 which ⑤복수 value)' }
      ]}
  ];
  let student = { name:"", school:"", grade:"" }; let graded = false; let TOTAL = 0;
  document.getElementById("startBtn").addEventListener("click", ()=>{
    const name=document.getElementById("inName").value.trim(), school=document.getElementById("inSchool").value.trim(), grade=document.getElementById("inGrade").value;
    if(!name||!school||!grade){ alert("이름·학교·학년을 모두 입력해주세요!"); return; }
    student={name,school,grade}; document.getElementById("who").textContent=`${name} · ${school} · ${grade}`; document.getElementById("who").classList.add("show");
    document.getElementById("screenLogin").classList.remove("active"); document.getElementById("screenQuiz").classList.add("active"); build(); window.scrollTo({top:0});
  });
  const app = document.getElementById("app");
  function build(){
    PANELS.forEach(panel=>{
      if(panel.grammar){ const t=document.createElement("div"); t.className="sec-title"; t.textContent=panel.title; app.appendChild(t); }
      else { const tag=document.createElement("div"); tag.className="p-tag"; tag.innerHTML=panel.tag; app.appendChild(tag); const box=document.createElement("div"); box.className="passage"; box.innerHTML='<p>'+panel.html+'</p>'; app.appendChild(box); }
      panel.questions.forEach(q=>{
        const qid=panel.tabId+"t"+q.idx; const el=document.createElement("section"); el.className="q"; el.dataset.qid=qid; el.dataset.answer=q.answer; el.dataset.label=q.label;
        let h='<span class="qid">'+qid+'</span><div class="qlabel">['+q.label+']</div><div class="stem">'+q.idx+'. '+q.stem+'</div>';
        if(q.gbox) h+='<div class="gbox">'+q.gbox+'</div>';
        q.options.forEach((o,i)=>{ const ko=o.ko?' <span class="ko">('+o.ko+')</span>':''; h+='<label class="opt" data-n="'+(i+1)+'"><span class="cir">'+CIRCLE[i]+'</span><span class="txt"><span class="en">'+o.en+'</span>'+ko+'</span><span class="mark"></span><input type="radio" name="'+qid+'" value="'+(i+1)+'"></label>'; });
        h+='<div class="expl"><b>해설</b> · '+q.expl+'</div>'; el.innerHTML=h; app.appendChild(el); TOTAL++;
      });
    });
    document.getElementById("scoreTot").textContent=TOTAL;
  }
  app.addEventListener("click", e=>{ if(graded) return; const opt=e.target.closest(".opt"); if(!opt) return; const q=opt.closest(".q"); q.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel")); opt.classList.add("sel"); opt.querySelector("input").checked=true; });
  document.getElementById("grade").addEventListener("click", async ()=>{
    if(graded) return; let correct=0; const wrongs=[];
    app.querySelectorAll(".q").forEach(q=>{
      const ans=Number(q.dataset.answer); const sel=q.querySelector("input:checked"); const chosen=sel?Number(sel.value):0; q.classList.add("graded");
      q.querySelectorAll(".opt").forEach(o=>{ const n=Number(o.dataset.n); if(n===ans){o.classList.add("correct");o.querySelector(".mark").textContent="○";} if(n===chosen&&chosen!==ans){o.classList.add("wrong");o.querySelector(".mark").textContent="✕";} });
      q.querySelector(".expl").classList.add("show"); if(chosen===ans) correct++; else wrongs.push({qid:q.dataset.qid,label:q.dataset.label,chosen:chosen?CIRCLE[chosen-1]:"(미선택)",answer:CIRCLE[ans-1]});
    });
    graded=true; const pct=Math.round(correct/TOTAL*100);
    document.getElementById("scoreNum").textContent=correct; document.getElementById("scorePct").textContent=pct; document.getElementById("scorePill").classList.add("show");
    document.getElementById("grade").disabled=true; document.getElementById("retry").style.display="block"; window.scrollTo({top:0,behavior:"smooth"});
    let wt=`[점수: ${correct}/${TOTAL} (${pct}점)]\n`; if(wrongs.length===0) wt+="오답 없음 - 만점!"; else wrongs.forEach((w,i)=>{ wt+=`${i+1}. [${w.label}] ${w.qid} · 답 ${w.chosen}/정답 ${w.answer}\n`; });
    await sendToNotion(pct, wt);
  });
  async function sendToNotion(score, wrongText){
    const el=document.getElementById("notionStatus"); el.className="notion-status sending"; el.textContent="📤 결과를 Notion에 제출 중...";
    const payload={ studentName:student.name, school:student.school, grade:student.grade, workbook:WORKBOOK, category:CATEGORY, submitDate:new Date().toISOString().split("T")[0], wrongAnswers:wrongText.slice(0,2000), score:score };
    try{ const res=await fetch(NOTION_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}); if(res.ok){ el.className="notion-status sent"; el.textContent="✅ Notion에 제출되었습니다."; } else { throw new Error("서버 오류 "+res.status); } }
    catch(e){ el.className="notion-status err"; el.textContent="⚠️ 제출 실패: "+e.message+" (선생님께 알려주세요)"; }
  }
  document.getElementById("retry").addEventListener("click", ()=>{
    graded=false; app.querySelectorAll(".q").forEach(q=>{ q.classList.remove("graded"); q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("sel","correct","wrong");o.querySelector(".mark").textContent="";}); q.querySelectorAll("input").forEach(i=>i.checked=false); q.querySelector(".expl").classList.remove("show"); });
    document.getElementById("scorePill").classList.remove("show"); document.getElementById("notionStatus").textContent=""; document.getElementById("grade").disabled=false; document.getElementById("retry").style.display="none"; window.scrollTo({top:0,behavior:"smooth"});
  });
</script>
</body>
</html>
