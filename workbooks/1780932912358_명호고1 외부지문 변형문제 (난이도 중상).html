.user-info { font-size:13px; color:rgba(255,255,255,0.8); }

.feedback { display:none; margin-top:10px; padding:10px 14px; border-radius:8px; font-size:13px; }
.feedback.show { display:block; }
.feedback.correct { background:#f0fdf4; color:var(--correct); }
.feedback.wrong { background:#fff5f5; color:var(--wrong); }

.btn-accent { padding:12px 24px; background:var(--accent); color:white; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }

.result-box { display:none; background:var(--primary); color:white; border-radius:14px; padding:24px; margin-top:20px; text-align:center; }

// ===================== 배분 로직 =====================
const SOURCES = [...new Set(ALL_QUESTIONS.map(q=>q.src))];
const ROUNDS = 6;
const ROUND_OFFSET = 6; // 7회~12회
const PER_ROUND = 35;

function shuffleArray(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function buildRounds() {
  const bySource={};
  SOURCES.forEach(s=>{bySource[s]=shuffleArray(ALL_QUESTIONS.filter(q=>q.src===s));});
  const idx={};
  SOURCES.forEach(s=>{idx[s]=0;});
  const rounds=[];
  for(let r=0;r<ROUNDS;r++){
    const pool=[];
    let safety=0;
    while(pool.length<PER_ROUND&&safety<1000){
      safety++;
      for(const s of SOURCES){
        if(pool.length>=PER_ROUND)break;
        const arr=bySource[s];
        if(idx[s]<arr.length){pool.push({...arr[idx[s]],_src:s});idx[s]++;}
      }
    }
    rounds.push(shuffleArray(pool));
  }
  return rounds;
}

let userName='',userSchool='',userGrade='';
let rounds=[];
let answers=[];
let scores=[];

function doLogin(){
  const n=document.getElementById('inputName').value.trim();
  const s=document.getElementById('inputSchool').value.trim();
  const g=document.getElementById('inputGrade').value;
  if(!n){alert('이름을 입력해주세요.');return;}
  userName=n;userSchool=s;userGrade=g;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('mainApp').style.display='block';
  document.getElementById('topUserInfo').textContent=`${n} | ${s} | ${g}`;
  rounds=buildRounds();
  answers=rounds.map(r=>r.map(()=>({selected:-1,submitted:false,shortAnswer:''})));
  scores=rounds.map(()=>({obj:0,total:0,submitted:false}));
  buildTabs();
}

function buildTabs(){
  const tabBar=document.getElementById('tabBar');
  const tabContents=document.getElementById('tabContents');
  tabBar.innerHTML='';tabContents.innerHTML='';
  for(let r=0;r<ROUNDS;r++){
    const btn=document.createElement('button');
    btn.className='tab-btn'+(r===0?' active':'');
    btn.textContent=`${r+ROUND_OFFSET+1}회차`;
    btn.onclick=()=>switchTab(r);
    tabBar.appendChild(btn);
    const div=document.createElement('div');
    div.className='tab-content'+(r===0?' active':'');
    div.id=`tab${r}`;
    div.innerHTML=buildRoundHTML(r);
    tabContents.appendChild(div);
  }
}

function switchTab(r){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===r));
  document.querySelectorAll('.tab-content').forEach((c,i)=>c.classList.toggle('active',i===r));
}

function buildRoundHTML(r){
  const qs=rounds[r];
  let html=`
    <div class="round-header">
      <div>
        <h3>${r+ROUND_OFFSET+1}회차 모의고사</h3>
        <span>총 ${qs.length}문항 | 14개 지문 혼합</span>
        <div class="progress-bar-wrap" style="margin-top:8px;width:200px;">
          <div class="progress-bar" id="prog${r}" style="width:0%"></div>
        </div>
      </div>
      <div id="scoreDisp${r}" style="font-size:16px;color:rgba(255,255,255,0.7)">미제출</div>
    </div>
  `;
  qs.forEach((q,i)=>{html+=buildQuestionHTML(r,i,q);});
  html+=`
    <div class="btn-row">
      <button class="btn-accent" onclick="submitRound(${r})">✅ 제출하기</button>
      <button class="btn-outline" onclick="resetRound(${r})">🔄 초기화</button>
    </div>
    <div class="result-box" id="result${r}">
      <div class="result-score" id="resultScore${r}">-</div>
      <div style="font-size:14px;color:rgba(255,255,255,0.7)">객관식 점수</div>
      <div class="result-detail" id="resultDetail${r}"></div>
    </div>
    <div class="submit-notice" id="notice${r}"></div>
  `;
  return html;
}

function buildQuestionHTML(r,i,q){
  const qid=`q${r}_${i}`;
  const tagCls=q.type==='short'?'q-type-tag':'q-tag';
  let html=`
    <div class="q-card" id="card${r}_${i}">
      <div class="q-meta">
        <div class="q-num">${i+1}</div>
        <span class="q-tag">${q.src}</span>
        <span class="${tagCls}">${q.tag}</span>
      </div>
      <div class="q-stem">${q.stem}</div>
  `;
  if(q.type==='obj'){
    html+=`<div class="choices">`;
    q.choices.forEach((c,ci)=>{
      html+=`<button class="choice-btn" id="${qid}_c${ci}" onclick="selectChoice(${r},${i},${ci})">
        <span class="choice-num">${ci+1}</span><span>${c}</span>
      </button>`;
    });
    html+=`</div><div class="feedback" id="fb${r}_${i}"></div>`;
  } else {
    html+=`<textarea class="short-input" id="${qid}_sa" placeholder="답을 입력하세요..." rows="3" oninput="saveShortAnswer(${r},${i},this.value)"></textarea>
      <div class="model-answer" id="ma${r}_${i}">
        <strong>📌 모범 답안</strong>
        <p>${q.modelAnswer}</p>
      </div>`;
  }
  html+=`</div>`;
  return html;
}

function selectChoice(r,i,ci){
  if(answers[r][i].submitted)return;
  answers[r][i].selected=ci;
  const q=rounds[r][i];
  for(let c=0;c<q.choices.length;c++){
    document.getElementById(`q${r}_${i}_c${c}`).classList.toggle('selected',c===ci);
  }
  updateProgress(r);
}

function saveShortAnswer(r,i,val){answers[r][i].shortAnswer=val;}

function updateProgress(r){
  const qs=rounds[r];
  const answered=answers[r].filter((a,i)=>qs[i].type==='obj'?a.selected>=0:a.shortAnswer.trim().length>0).length;
  const pct=Math.round(answered/qs.length*100);
  const prog=document.getElementById(`prog${r}`);
  if(prog)prog.style.width=pct+'%';
}

function submitRound(r){
  const qs=rounds[r];
  let objCorrect=0,objTotal=0;
  qs.forEach((q,i)=>{
    answers[r][i].submitted=true;
    if(q.type==='obj'){
      objTotal++;
      const sel=answers[r][i].selected;
      const correct=sel===q.answer;
      if(correct)objCorrect++;
      const card=document.getElementById(`card${r}_${i}`);
      card.classList.toggle('answered-correct',correct&&sel>=0);
      card.classList.toggle('answered-wrong',!correct&&sel>=0);
      for(let c=0;c<q.choices.length;c++){
        const btn=document.getElementById(`q${r}_${i}_c${c}`);
        btn.disabled=true;
        if(c===q.answer)btn.classList.add('correct-ans');
        else if(c===sel&&sel!==q.answer)btn.classList.add('wrong-ans');
      }
      const fb=document.getElementById(`fb${r}_${i}`);
      if(sel>=0){
        fb.className='feedback show '+(correct?'correct':'wrong');
        fb.textContent=correct?'✅ 정답입니다!':`❌ 오답입니다. 정답: ${q.answer+1}번`;
      }
    } else {
      const ma=document.getElementById(`ma${r}_${i}`);
      if(ma)ma.classList.add('show');
      const ta=document.getElementById(`q${r}_${i}_sa`);
      if(ta)ta.disabled=true;
    }
  });
  scores[r]={obj:objCorrect,total:objTotal,submitted:true};
  const pct=objTotal>0?Math.round(objCorrect/objTotal*100):0;
  document.getElementById(`result${r}`).classList.add('show');
  document.getElementById(`resultScore${r}`).textContent=`${objCorrect}/${objTotal}점`;
  document.getElementById(`resultDetail${r}`).textContent=`객관식 정답률 ${pct}% | 서답형 ${qs.length-objTotal}문항은 모범답을 확인하세요.`;
  document.getElementById(`scoreDisp${r}`).textContent=`${objCorrect}/${objTotal}`;
  submitToNotion(r,objCorrect,objTotal,qs);
}

function resetRound(r){
  if(!confirm(`${r+ROUND_OFFSET+1}회차를 초기화하시겠습니까?`))return;
  answers[r]=rounds[r].map(()=>({selected:-1,submitted:false,shortAnswer:''}));
  document.getElementById(`tab${r}`).innerHTML=buildRoundHTML(r);
}

async function submitToNotion(r,correct,total,qs){
  try{
    const wrongList=[];
    qs.forEach((q,i)=>{
      if(q.type==='obj'&&answers[r][i].selected!==q.answer){
        wrongList.push(`[${i+1}번/${q.src}] 선택:${answers[r][i].selected+1}번 정답:${q.answer+1}번`);
      }
    });
    const payload={
      studentName:userName,school:userSchool,grade:userGrade,
      workbook:`명호고 기말대비 ${r+ROUND_OFFSET+1}회차`,
      category:'기말고사 대비',
      submitDate:new Date().toISOString().split('T')[0],
      wrongAnswers:`[점수: ${correct}/${total}점]\n`+(wrongList.length?wrongList.join('\n'):'모두 정답'),
      score:correct
    };
    await fetch('https://dodamenglish.netlify.app/.netlify/functions/notion',{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)
    });
    const notice=document.getElementById(`notice${r}`);
    if(notice){notice.className='submit-notice show';notice.textContent='✅ 결과가 도담T께 제출되었습니다.';}
  }catch(e){console.error('Notion 오류:',e);}
}
</script>
