      { type:"어법", qnum:3, text:"다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\n(밑줄: ① recognized  ② who  ③ a outcome  ④ where  ⑤ that's why)", options:["① recognized","② who","③ a outcome","④ where","⑤ that's why"], answer:2, explanation:"③ a outcome → an outcome. outcome은 모음으로 시작하므로 부정관사 an이 와야 합니다." },
      { type:"빈칸", qnum:4, text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?\n'Sound choices are an outcome of _____.'", options:["suppressing intuitive feelings to remain entirely objective","the emotional part of the brain working together with the deliberative part","avoiding neuroscience instruments in modeling socioeconomic behaviors","specific brain damages that block the entry of external sensory inputs","relying solely on the detached, stoic fashion traditional economics suggests"], answer:1, explanation:"좋은 선택은 '감정적인 뇌 부분이 심의적인 부분과 함께 작동하는 결과'라는 핵심 내용이 들어가야 합니다." },
      { type:"순서배열", qnum:5, text:"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n[주어진 글] The investigation of emotions and decision making is currently of significant consequence. This entails the implementation of diverse instruments provided by neuroscience.\n(A) An instance of this research is the investigation by Antonio Damasio... Sound choices are an outcome of the emotional component operating in combination with the contemplative part.\n(B) This disputes the premises of traditional economics... But the data implies that emotions actually play an essential and beneficial role in decision making.\n(C) One vital branch of the academic literature inspects individuals with brain impairment and how harm to specific components... influences decision making.", options:["(A)-(C)-(B)","(B)-(A)-(C)","(C)-(A)-(B)","(C)-(B)-(A)","(A)-(B)-(C)"], answer:2, explanation:"(C) 뇌 손상 문헌의 중요한 흐름 → (A) 그 구체적 예시인 다마지오 연구와 결론 → (B) 이 결론이 전통 경제학과 상반됨을 설명하는 순서입니다." },
      { type:"문장삽입", qnum:6, text:"주어진 문장이 들어가기에 가장 적절한 곳은?\n[삽입] This disputes the premises of traditional economics, where feelings play a detrimental role in the decision-making process.\n\n① ...how harm to specific components of the brain... influences decision making. ② ...when the affective segment of the brain is impaired, this virtually diminishes the efficiency of decision making. ③ Sound choices are an outcome of the emotional component of the brain operating in combination with the contemplative part. ④ Here it is presumed that decision making can be simulated as being produced in a detached, unemotional manner... ⑤ But the data implies that emotions actually play an essential and beneficial role in decision making.", options:["① 번","② 번","③ 번","④ 번","⑤ 번"], answer:2, explanation:"감정과 이성이 결합할 때 좋은 선택이 나온다는 과학적 결론(③번) 뒤에, '이것이 전통 경제학의 전제와 상반된다'는 주어진 문장이 오고, 이어서 전통 경제학의 내용(Here it is presumed~)이 설명되는 흐름이 가장 자연스럽습니다." },
      { type:"무관한문장", qnum:7, text:"전체 흐름과 관계 없는 문장은?\n① An instance of this research is the investigation by Antonio Damasio, who discovers that when the affective segment of the brain is impaired, this virtually diminishes the efficiency of decision making.\n② Sound choices are an outcome of the emotional component of the brain operating in combination with the contemplative part.\n③ Traditional economic theory successfully incorporates psychological trauma to predict erratic market crashes.\n④ This disputes the premises of traditional economics, where feelings play a detrimental role in the decision-making process.\n⑤ But the data implies that emotions actually play an essential and, frequently, a beneficial role in decision making.", options:["①","②","③","④","⑤"], answer:2, explanation:"③ 전통 경제학이 심리적 트라우마를 통합해 시장 폭락을 예측했다는 내용은, 감정이 의사결정에 긍정적 역할을 한다는 지문의 맥락과 어긋나는 무관한 문장입니다." }

  {
    num: 4142, title: "41-42번 - 선택의 폭정과 불행",
    text: `Consumers confronted with the option of thirty diverse types of premium chocolates are more prone to depart without purchasing any, contrasted with when they are provided with merely a half dozen options. If workers are granted a complimentary journey to Paris, they are joyful. If you grant them a complimentary journey to Hawaii, they are joyful. However if you provide them the option between the two locations, they are less joyful, regardless of what they pick. Why might options be so disturbing? The justification is that options compel us to conduct comparisons and recognize comparative drawbacks. Individuals who pick Paris grumble that it lacks the ocean and those who pick Hawaii lament that it lacks the galleries. Psychologist Barry Schwartz terms this the autocracy of choice because rather than granting liberty, it genuinely restricts our decision-making. He asserts that broader options escalate dissatisfaction because we stress that we are going to make the incorrect decision and thus we become tense about attempting to handle all the comparisons in a struggle to get it accurate. This simultaneously escalates our apprehension of making the incorrect option and heightens anticipations that we ought to be capable of getting the optimal option. Having made the choice, we subsequently commence to lament, questioning whether it was the accurate one.`,
    questions: [
      { type:"제목추론", qnum:1, text:"다음 글의 제목으로 가장 적절한 것은?", options:["The Hidden Benefits of Giving Employees Free Trips","Why Having Too Many Choices Makes Us Miserable","Strategies to Avoid Purchasing Premium Chocolates","The Importance of Comparing Disadvantages in Decision-Making","How the Autocracy of Choice Promotes True Liberty"], answer:1, explanation:"선택지가 많아질수록 사람들은 최선의 선택을 해야 한다는 압박감, 비교에서 오는 단점 인식, 그리고 잘못된 결정을 내릴까 봐 후회하고 불행해진다는 내용('선택의 폭정')을 다루고 있습니다." },
      { type:"어휘", qnum:2, text:"다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?\n(밑줄: ① drawbacks  ② restricts  ③ escalate  ④ lowers  ⑤ lament)", options:["① drawbacks","② restricts","③ escalate","④ lowers","⑤ lament"], answer:3, explanation:"④ lowers(낮추다) → raises/heightens(높이다). 선택지가 많을수록 최선의 선택을 얻을 수 있어야 한다는 기대감은 '높아집니다'. lowers는 틀린 어휘입니다." },

      { type:"빈칸", qnum:4, text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?\n'Having made the choice, we subsequently _____.'", options:["feel absolutely satisfied with our optimal option","stop comparing our choice with the alternatives","demand the galleries in Hawaii and the ocean in Paris","commence to lament, questioning whether it was the accurate one","provide workers with a complimentary journey without any options"], answer:3, explanation:"넓은 선택지 속에서 선택을 마친 후에도 우리는 만족하지 못하고 '그것이 정확한 선택이었는지 의심하며 후회하기 시작한다'는 내용이 이어져야 합니다." },
      { type:"순서배열", qnum:5, text:"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n[주어진 글] Consumers confronted with the option of thirty diverse types of premium chocolates are more prone to depart without purchasing any...\n(A) Why might options be so disturbing? The justification is that options compel us to conduct comparisons... Individuals who pick Paris grumble that it lacks the ocean...\n(B) If workers are granted a complimentary journey to Paris, they are joyful... However if you provide them the option between the two locations, they are less joyful...\n(C) Psychologist Barry Schwartz terms this the autocracy of choice... He asserts that broader options escalate dissatisfaction...", options:["(A)-(C)-(B)","(B)-(A)-(C)","(B)-(C)-(A)","(C)-(A)-(B)","(C)-(B)-(A)"], answer:1, explanation:"(B) 파리와 하와이 여행의 비교 예시 → (A) 왜 선택지가 방해가 되는가? 비교에 따른 단점 불평 → (C) 배리 슈워츠의 '선택의 폭정' 개념 도입 및 결론입니다." },

  {
    num: 4345, title: "43-45번 - 기차 안에서의 도움",
    text: `As the locomotive rolled into a tranquil rural depot, the soft conversation of travelers permeated the atmosphere. Linda was thrilled to eventually see her grandparents after two years. She observed individuals boarding the locomotive and hastily locating their chairs. A little later, an elderly lady wrestled with massive luggage, attempting to take a seat adjacent to her. The luggage appeared almost excessively massive for her tiny frame. Linda paused, uncertain if the elderly lady would desire her assistance. However shortly, she decided to aid the lady. "Allow me to assist you with your luggage," she articulated. Prior to her reaching the luggage, the elderly lady abruptly lost her equilibrium and tumbled down. She rested on her back, and her visage was ashen. Linda froze for a second, sensing the critical nature of the scenario. She rapidly dropped to her knees adjacent to the collapsed lady, as several individuals hurried over. Linda cautiously patted the elderly lady's shoulder to verify if she was fine. The lady moaned quietly, attempting to muster her power. Linda shifted nearer, gliding a hand beneath the lady's back. As the lady's eyes gradually unclosed, she comforted her quietly, "It is fine, simply rest for a second." Linda aided the lady to sit up gradually, then directed her back to her chair. As the scenario resolved, individuals around returned to their chairs. As the elderly lady eventually relaxed, she gazed at Linda with a grin. "I am extremely apologetic," she articulated. "I possess low blood pressure, and the abrupt motion of the locomotive must have caused me to feel lightheaded. I appreciate you significantly for aiding me." Linda inclined her head softly in reply, then shifted her look back to the serene rural landscape. She pondered that regardless of how uncertain she might feel, even the tiniest gesture of assistance is significantly superior for someone requiring help than executing nothing.`,
    questions: [
      { type:"주제추론", qnum:1, text:"다음 글에 나타난 Linda의 깨달음으로 가장 적절한 것은?", options:["기차 여행 시 무거운 짐은 승무원에게 위탁해야 한다.","불확실한 상황일지라도 작은 도움의 손길을 내미는 것이 아무것도 안 하는 것보다 낫다.","응급 환자 발생 시 함부로 만지지 말고 주변 전문가의 도움을 기다려야 한다.","대중교통 이용 시 노약자에게 자리를 양보하는 것은 필수적인 예절이다.","조부모님을 방문하는 길은 언제나 뜻밖의 사고와 배움으로 가득 차 있다."], answer:1, explanation:"기차에서 쓰러진 노부인을 도운 후, 확신이 서지 않는 상황이더라도 아무것도 하지 않는 것보다는 아주 작은 도움의 행동이라도 실천하는 것이 훨씬 낫다는 Linda의 깨달음입니다." },
      { type:"어휘", qnum:2, text:"다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?\n(밑줄: ① ashen  ② critical  ③ muster  ④ threatened  ⑤ resolved)", options:["① ashen","② critical","③ muster","④ threatened","⑤ resolved"], answer:3, explanation:"④ threatened(위협했다) → comforted/reassured(위로했다/안심시켰다). 노부인이 눈을 뜨자 Linda가 '안심시켰다'는 맥락이므로 threatened는 정반대의 행동입니다." },
      { type:"어법", qnum:3, text:"다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\n(밑줄: ① to sit up  ② cause  ③ shifted  ④ that regardless of  ⑤ how uncertain)", options:["① to sit up","② cause","③ shifted","④ that","⑤ how"], answer:1, explanation:"② cause → have caused. 노부인이 어지러움을 느낀 것은 과거의 일이므로, 과거의 강한 추측을 나타내는 'must have caused(~했음에 틀림없다)'를 사용해야 합니다." },
      { type:"빈칸", qnum:4, text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?\n'She pondered that regardless of how uncertain she might feel, _____.'", options:["low blood pressure is a dangerous condition on trains","avoiding interactions with strangers ensures a peaceful journey","observing people finding their chairs is quite entertaining","even the tiniest gesture of assistance is significantly superior than executing nothing","carrying massive luggage requires physical strength and equilibrium"], answer:3, explanation:"사건이 훈훈하게 마무리된 후 Linda가 얻은 교훈이므로, '아무리 작은 도움의 몸짓일지라도 아무것도 하지 않는 것보다 훨씬 낫다'는 내용이 들어가야 합니다." },
      { type:"순서배열", qnum:5, text:"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n[주어진 글] ...Linda paused, uncertain if the elderly lady would desire her assistance. However shortly, she decided to aid the lady. 'Allow me to assist you with your luggage,' she articulated.\n(A) As the lady's eyes gradually unclosed, she comforted her quietly... Linda aided the lady to sit up gradually, then directed her back to her chair.\n(B) 'I am extremely apologetic,'... 'I possess low blood pressure...' Linda inclined her head softly in reply...\n(C) Prior to her reaching the luggage, the elderly lady abruptly lost her equilibrium and tumbled down... Linda rapidly dropped to her knees...", options:["(A)-(C)-(B)","(B)-(A)-(C)","(C)-(A)-(B)","(C)-(B)-(A)","(A)-(B)-(C)"], answer:2, explanation:"(C) 린다의 도움 손길이 닿기 전 노부인이 쓰러져 린다가 다급히 다가감 → (A) 린다가 할머니를 안심시키고 자리에 앉게 도와줌 → (B) 할머니가 안정을 찾고 린다에게 감사를 표하며 린다가 깨달음을 얻는 결말입니다." },
      { type:"문장삽입", qnum:6, text:"주어진 문장이 들어가기에 가장 적절한 곳은?\n[삽입] She rested on her back, and her visage was ashen.\n\n① ...an elderly lady wrestled with massive luggage... ② The luggage appeared almost excessively massive for her tiny frame. ③ Linda paused, uncertain if the elderly lady would desire her assistance. ④ However shortly, she decided to aid the lady. 'Allow me to assist you with your luggage,' she articulated. ⑤ Prior to her reaching the luggage, the elderly lady abruptly lost her equilibrium and tumbled down.", options:["① 번","② 번","③ 번","④ 번","⑤ 번"], answer:4, explanation:"노부인이 '균형을 잃고 쓰러졌다(tumbled down)'는 사건 발생(⑤번 뒤) 직후에, '그녀는 등을 대고 누워있었고 얼굴은 창백했다'라는 쓰러진 모습 묘사가 이어지는 것이 자연스럽습니다." },
      { type:"무관한문장", qnum:7, text:"전체 흐름과 관계 없는 문장은?\n① The lady moaned quietly, attempting to muster her power.\n② Linda shifted nearer, gliding a hand beneath the lady's back.\n③ Many rural train stations are currently facing budget deficits and considering permanent closure.\n④ As the lady's eyes gradually unclosed, she comforted her quietly, 'It is fine, simply rest for a second.'\n⑤ Linda aided the lady to sit up gradually, then directed her back to her chair.", options:["①","②","③","④","⑤"], answer:2, explanation:"③ 기차 안에서 우연히 발생한 응급 상황과 이타적인 도움에 대한 감동적인 이야기인데, 많은 시골 기차역이 폐쇄를 고려하고 있다는 내용은 전혀 관계가 없습니다." }
    ]
  }
];

// ═══════════════════════════════════════════
//  앱 상태
// ═══════════════════════════════════════════
let currentUser = { name: '', school: '', grade: '' };
let activePassages = [];
let quizQueue = [];
let currentIdx = 0;
let selectedAnswer = null;
let wrongAnswers = [];

// ═══════════════════════════════════════════
//  화면 전환
// ═══════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ═══════════════════════════════════════════
//  로그인
// ═══════════════════════════════════════════
async function doLogin() {
  const name = document.getElementById('inputName').value.trim();
  const school = document.getElementById('inputSchool').value.trim();
  const grade = document.getElementById('inputGrade').value;
  const errEl = document.getElementById('loginError');

  if (!name || !school || !grade) {
    errEl.textContent = '이름, 학교, 학년을 모두 입력해주세요.';
    errEl.style.display = 'block';
    return;
  }

  // meta.json 인증
  try {
    const ts = Date.now();
    const res = await fetch(`https://raw.githubusercontent.com/dodamenglish/workbook/main/workbooks/meta.json?t=${ts}`);
    const meta = await res.json();
    const students = meta.students || [];
    const found = students.find(s =>
      s.name === name &&
      s.school === school &&
      (s.grade === grade || s.grade === '' || !s.grade)
    );
    if (!found) {
      errEl.textContent = '등록된 학생 정보와 일치하지 않습니다. 선생님께 문의하세요.';
      errEl.style.display = 'block';
      return;
    }
  } catch(e) {
    // 네트워크 오류 시 통과 (오프라인 대비)
    console.warn('meta.json 확인 실패, 로그인 허용');
  }

  errEl.style.display = 'none';
  currentUser = { name, school, grade };
  document.getElementById('rangeUserLabel').textContent = `${name} 학생, 환영합니다!`;
  buildPassageGrid();
  showScreen('rangeScreen');
}

// ═══════════════════════════════════════════
//  범위 선택
// ═══════════════════════════════════════════
function buildPassageGrid() {
  const grid = document.getElementById('passageGrid');
  grid.innerHTML = '';
  PASSAGES.forEach(p => {
    const numStr = p.num === 4142 ? '41-42번' : p.num === 4345 ? '43-45번' : `${p.num}번`;
    const topicShort = p.title.split(' - ')[1] || p.title;
    grid.innerHTML += `
      <div>
        <input type="checkbox" class="passage-cb" id="cb_${p.num}" value="${p.num}" onchange="updateSelectCount()">
        <label class="passage-label" for="cb_${p.num}">
          <span class="p-num">${numStr}</span>
          <span class="p-topic">${topicShort}</span>
        </label>
      </div>`;
  });
}

function switchTab(tab) {
  document.getElementById('tabAll').style.display = tab === 'all' ? 'block' : 'none';
  document.getElementById('tabSelect').style.display = tab === 'select' ? 'block' : 'none';
  document.getElementById('tab-all').classList.toggle('active', tab === 'all');
  document.getElementById('tab-select').classList.toggle('active', tab === 'select');
}

function updateSelectCount() {
  const checked = document.querySelectorAll('.passage-cb:checked').length;
  document.getElementById('selectCount').textContent = checked;
  document.getElementById('btnStartSelect').disabled = checked === 0;
}

function startQuiz(mode) {
  if (mode === 'all') {
    activePassages = [...PASSAGES];
  } else {
    const checked = Array.from(document.querySelectorAll('.passage-cb:checked')).map(c => parseInt(c.value));
    activePassages = PASSAGES.filter(p => checked.includes(p.num));
  }
  if (activePassages.length === 0) return;

  quizQueue = [];
  activePassages.forEach(p => {
    p.questions.forEach((q, qi) => {
      quizQueue.push({ passage: p, question: q, qi });
    });
  });

  currentIdx = 0;
  wrongAnswers = [];
  showScreen('quizScreen');
  renderQuestion();
}

// ═══════════════════════════════════════════
//  퀴즈 렌더링
// ═══════════════════════════════════════════
function renderQuestion() {
  const item = quizQueue[currentIdx];
  const { passage, question } = item;
  selectedAnswer = null;

  // 진행 바
  const pct = Math.round((currentIdx / quizQueue.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  const numStr = passage.num === 4142 ? '41-42번' : passage.num === 4345 ? '43-45번' : `${passage.num}번`;
  document.getElementById('quizPassageLabel').textContent = `지문 ${numStr} | ${question.type}`;
  document.getElementById('quizCounter').textContent = `${currentIdx + 1} / ${quizQueue.length}`;

  // 지문
  document.getElementById('passageTitleDisplay').textContent = passage.title;
  document.getElementById('passageTextDisplay').textContent = passage.text;

  // 문항
  const nums = ['①','②','③','④','⑤'];
  let optionsHtml = question.options.map((opt, i) =>
    `<li class="option-item">
      <button class="option-btn" id="opt_${i}" onclick="selectOption(${i})">
        <span class="option-num">${nums[i]}</span>
        <span>${opt}</span>
      </button>
    </li>`
  ).join('');

  document.getElementById('questionArea').innerHTML = `
    <div class="question-card">
      <span class="question-type-badge">${question.type}</span>
      <div class="question-text">Q${question.qnum}. ${question.text}</div>
      <ul class="options-list">${optionsHtml}</ul>
    </div>`;

  // 버튼
  const btnSubmit = document.getElementById('btnSubmit');
  const btnNext = document.getElementById('btnNext');
  btnSubmit.style.display = 'block';
  btnSubmit.disabled = true;
  btnNext.style.display = 'none';

  // 결과바 초기화
  const rb = document.getElementById('resultBar');
  rb.className = 'result-bar';
  rb.style.display = 'none';
}

function selectOption(idx) {
  if (document.getElementById('btnSubmit').disabled === false && selectedAnswer !== null) return;
  selectedAnswer = idx;
  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === idx);
  });
  document.getElementById('btnSubmit').disabled = false;
}

function submitAnswer() {
  if (selectedAnswer === null) return;
  const item = quizQueue[currentIdx];
  const { passage, question } = item;
  const isCorrect = (selectedAnswer === question.answer);
  const nums = ['①','②','③','④','⑤'];

  // 버튼 색상
  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.disabled = true;
    if (i === question.answer) btn.classList.add('show-correct');
    else if (i === selectedAnswer && !isCorrect) btn.classList.add('wrong');
  });

  // 결과바
  const rb = document.getElementById('resultBar');
  const rbIcon = document.getElementById('rbIcon');
  const rbText = document.getElementById('rbText');
  if (isCorrect) {
    rb.className = 'result-bar correct-bar';
    rbIcon.textContent = '✓';
    rbText.textContent = '정답입니다!';
  } else {
    rb.className = 'result-bar wrong-bar';
    rbIcon.textContent = '✕';
    rbText.innerHTML = `오답 — 정답: <strong>${nums[question.answer]} ${question.options[question.answer]}</strong><br><small>${question.explanation}</small>`;
    wrongAnswers.push({ passage, question, myAnswer: selectedAnswer });
  }
  rb.style.display = 'flex';

  // 버튼 전환
  document.getElementById('btnSubmit').style.display = 'none';
  const btnNext = document.getElementById('btnNext');
  btnNext.style.display = 'block';
  btnNext.textContent = currentIdx + 1 < quizQueue.length ? '다음 →' : '결과 보기';
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx < quizQueue.length) {
    renderQuestion();
    window.scrollTo(0, 0);
  } else {
    showResult();
  }
}

// ═══════════════════════════════════════════
//  결과 & Notion 전송
// ═══════════════════════════════════════════
function showResult() {
  showScreen('resultScreen');
  const total = quizQueue.length;
  const wrong = wrongAnswers.length;
  const correct = total - wrong;
  const score = Math.round((correct / total) * 100);

  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreTotal').textContent = `/ 100`;
  document.getElementById('scoreLabel').textContent = `${correct}문제 정답`;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statTotal').textContent = total;

  // 오답 목록
  const wrap = document.getElementById('wrongListWrap');
  if (wrong === 0) {
    wrap.innerHTML = '<div class="all-correct-msg">🎉 전부 정답! 완벽합니다!</div>';
  } else {
    const nums = ['①','②','③','④','⑤'];
    let html = `<div class="wrong-list-title">📋 오답 목록 (${wrong}개)</div>`;
    wrongAnswers.forEach(w => {
      const numStr = w.passage.num === 4142 ? '41-42번' : w.passage.num === 4345 ? '43-45번' : `${w.passage.num}번`;
      html += `
        <div class="wrong-card">
          <div class="wrong-card-header">
            <span class="wrong-passage-badge">${numStr}</span>
            <span class="wrong-type-badge">${w.question.type}</span>
          </div>
          <div class="wrong-q-text">Q${w.question.qnum}. ${w.question.text.split('\n')[0]}</div>
          <div class="wrong-answer-row">
            <span class="wa-my">내 답: ${nums[w.myAnswer]} ${w.question.options[w.myAnswer]}</span>
            <span class="wa-correct">정답: ${nums[w.question.answer]} ${w.question.options[w.question.answer]}</span>
          </div>
        </div>`;
    });
    wrap.innerHTML = html;
  }

  // Notion 전송
  sendToNotion(score, correct, total);
}

async function sendToNotion(score, correct, total) {
  const statusEl = document.getElementById('notionStatus');
  statusEl.textContent = 'Notion에 결과 전송 중...';
  statusEl.className = 'notion-status';

  const nums = ['①','②','③','④','⑤'];
  const wrongText = wrongAnswers.length === 0
    ? '오답 없음'
    : wrongAnswers.map(w => {
        const numStr = w.passage.num === 4142 ? '41-42번' : w.passage.num === 4345 ? '43-45번' : `${w.passage.num}번`;
        return `[${numStr} / ${w.question.type}] Q${w.question.qnum}. ${w.question.text.split('\n')[0]}\n  ✕ 내 답: ${nums[w.myAnswer]} ${w.question.options[w.myAnswer]}\n  ✓ 정 답: ${nums[w.question.answer]} ${w.question.options[w.question.answer]}\n  💡 해설: ${w.question.explanation}`;
      }).join('\n─────────────────\n');

  const rangeInfo = activePassages.map(p => p.num === 4142 ? '41-42번' : p.num === 4345 ? '43-45번' : `${p.num}번`).join(', ');

  const payload = {
    name: currentUser.name,
    school: currentUser.school,
    grade: currentUser.grade,
    workbook: '2025-06월 지문변형 문제',
    category: `선택범위: ${rangeInfo}`,
    submitDate: new Date().toISOString().split('T')[0],
    wrongAnswers: `[점수: ${score}점 | ${correct}/${total}문제 정답]\n═════════════════\n${wrongText}`,
    score: score
  };

  try {
    const res = await fetch('https://dodamenglish.netlify.app/.netlify/functions/notion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      statusEl.textContent = '✓ 결과가 선생님께 전송되었습니다.';
      statusEl.className = 'notion-status ok';
    } else {
      throw new Error('전송 실패');
    }
  } catch(e) {
    statusEl.textContent = '⚠ 전송 오류 — 선생님께 알려주세요.';
    statusEl.className = 'notion-status err';
  }
}

function retryWrong() {
  if (wrongAnswers.length === 0) return;
  quizQueue = wrongAnswers.map(w => ({ passage: w.passage, question: w.question }));
  currentIdx = 0;
  wrongAnswers = [];
  showScreen('quizScreen');
  renderQuestion();
}

function goRestart() {
  showScreen('loginScreen');
}
</script>

</html>
