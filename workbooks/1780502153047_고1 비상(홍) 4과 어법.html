<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고1 비상(홍) 4과 어법 워크북 | 도담한영어교실</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Fira+Code:wght@500&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #5b7fff;
    --accent2: #a78bfa;
    --correct: #22c55e;
    --wrong: #ef4444;
    --text: #e8eaf6;
    --text2: #9096b8;
    --text3: #5a6080;
    --tag-grammar: #3b5bdb;
    --tag-rel: #7c3aed;
    --tag-verb: #0ea5e9;
    --tag-par: #d97706;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #1a1d27 0%, #12162a 100%);
    border-bottom: 1px solid var(--border);
    padding: 18px 20px 14px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-inner { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .header-title { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
  .header-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .progress-pill {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--text2);
    font-family: 'Fira Code', monospace;
  }
  .progress-pill span { color: var(--accent); font-weight: 700; }

  /* ── Login Screen ── */
  #loginScreen {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 28px;
    width: 100%; max-width: 380px;
    text-align: center;
  }
  .login-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 10px; font-weight: 700; letter-spacing: .08em;
    padding: 4px 12px; border-radius: 20px;
    margin-bottom: 16px;
  }
  .login-title { font-size: 20px; font-weight: 900; margin-bottom: 6px; line-height: 1.3; }
  .login-sub { font-size: 12px; color: var(--text3); margin-bottom: 28px; }
  .login-field { margin-bottom: 14px; text-align: left; }
  .login-field label { font-size: 11px; color: var(--text2); font-weight: 700; letter-spacing: .06em; display: block; margin-bottom: 6px; }
  .login-field input, .login-field select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    padding: 10px 14px;
    outline: none;
    transition: border-color .2s;
  }
  .login-field input:focus, .login-field select:focus { border-color: var(--accent); }
  .login-field select option { background: var(--surface2); }
  .btn-start {
    width: 100%; margin-top: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 12px;
    color: #fff; font-size: 15px; font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    padding: 13px; cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  .btn-start:hover { opacity: .9; }
  .btn-start:active { transform: scale(.98); }

  /* ── Quiz Screen ── */
  #quizScreen { display: none; max-width: 680px; margin: 0 auto; padding: 20px 16px; }

  /* 학생 info bar */
  .student-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 16px;
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 20px; font-size: 12px; color: var(--text2);
  }
  .student-bar strong { color: var(--accent); }

  /* Set header */
  .set-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .set-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 11px; color: var(--text2);
    font-family: 'Fira Code', monospace;
  }
  .set-badge b { color: var(--text); }
  .btn-submit-set {
    background: var(--accent);
    border: none; border-radius: 8px;
    color: #fff; font-size: 12px; font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    padding: 7px 16px; cursor: pointer;
    transition: opacity .2s;
  }
  .btn-submit-set:hover { opacity: .85; }

  /* Question Card */
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 14px;
    transition: border-color .25s;
  }
  .q-card.answered { border-color: var(--border); }

  .q-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .q-num {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 6px;
    font-family: 'Fira Code', monospace;
  }
  .q-tag {
    font-size: 10px; font-weight: 700; letter-spacing: .05em;
    padding: 3px 8px; border-radius: 6px;
  }
  .tag-grammar { background: rgba(59,91,219,.25); color: #7b9fff; }
  .tag-rel     { background: rgba(124,58,237,.25); color: #c4b5fd; }
  .tag-verb    { background: rgba(14,165,233,.25); color: #7dd3fc; }
  .tag-par     { background: rgba(217,119,6,.25);  color: #fcd34d; }
  .tag-conj    { background: rgba(236,72,153,.25); color: #f9a8d4; }
  .tag-misc    { background: rgba(20,184,166,.25); color: #5eead4; }

  /* Passage */
  .passage {
    background: var(--surface2);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 12px 14px;
    font-size: 13px; line-height: 1.75;
    color: var(--text2);
    margin-bottom: 14px;
    word-break: break-word;
  }
  .passage .ul { text-decoration: underline; text-underline-offset: 3px; }
  .passage .ul.num { color: var(--text); }
  .passage .bl {
    background: linear-gradient(135deg,rgba(91,127,255,.35),rgba(167,139,250,.35));
    color: var(--text);
    border-radius: 4px; padding: 1px 4px;
    font-weight: 700;
  }

  .q-stem { font-size: 13px; color: var(--text2); margin-bottom: 14px; line-height: 1.6; }

  /* Options */
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 13px; font-family: 'Noto Sans KR', sans-serif;
    padding: 10px 14px; text-align: left; cursor: pointer;
    transition: border-color .15s, background .15s;
    line-height: 1.5;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: rgba(91,127,255,.08); }
  .opt.selected { border-color: var(--accent); background: rgba(91,127,255,.15); }
  .opt.correct  { border-color: var(--correct); background: rgba(34,197,94,.12); color: #86efac; }
  .opt.wrong    { border-color: var(--wrong);   background: rgba(239,68,68,.12);  color: #fca5a5; }
  .opt:disabled { cursor: default; }

  /* Feedback */
  .feedback {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 12px; line-height: 1.6;
    display: none;
  }
  .feedback.correct { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3); color: #86efac; }
  .feedback.wrong   { background: rgba(239,68,68,.1);  border: 1px solid rgba(239,68,68,.3);  color: #fca5a5; }
  .feedback .fb-answer { font-weight: 700; color: var(--correct); }

  /* Result Screen */
  #resultScreen { display: none; max-width: 680px; margin: 0 auto; padding: 20px 16px; }
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px 24px;
    text-align: center;
    margin-bottom: 20px;
  }
  .score-circle {
    width: 100px; height: 100px; border-radius: 50%;
    background: conic-gradient(var(--accent) 0%, var(--surface2) 0%);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    position: relative;
  }
  .score-circle::before {
    content: '';
    width: 76px; height: 76px; border-radius: 50%;
    background: var(--surface);
    position: absolute;
  }
  .score-num { position: relative; z-index: 1; font-size: 22px; font-weight: 900; font-family: 'Fira Code', monospace; }
  .result-title { font-size: 18px; font-weight: 900; margin-bottom: 6px; }
  .result-sub { font-size: 12px; color: var(--text3); }
  .result-stats { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
  .stat-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 20px; text-align: center;
    flex: 1;
  }
  .stat-box .stat-num { font-size: 22px; font-weight: 900; font-family: 'Fira Code', monospace; }
  .stat-box .stat-label { font-size: 10px; color: var(--text3); margin-top: 2px; }
  .stat-box.s-correct .stat-num { color: var(--correct); }
  .stat-box.s-wrong .stat-num { color: var(--wrong); }

  .btn-group { display: flex; gap: 10px; margin-top: 16px; }
  .btn-retry, .btn-next-set {
    flex: 1; border: none; border-radius: 12px;
    font-size: 13px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif;
    padding: 12px; cursor: pointer; transition: opacity .2s;
  }
  .btn-retry    { background: var(--surface2); border: 1.5px solid var(--border); color: var(--text); }
  .btn-next-set { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .btn-retry:hover, .btn-next-set:hover { opacity: .85; }

  /* Wrong list */
  .wrong-list { margin-top: 4px; }
  .wrong-item {
    background: var(--surface);
    border: 1px solid rgba(239,68,68,.25);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .wrong-item .wi-q { font-size: 12px; color: var(--text2); margin-bottom: 6px; line-height: 1.6; }
  .wi-row { display: flex; gap: 8px; font-size: 11px; margin-top: 6px; flex-wrap: wrap; }
  .wi-label { color: var(--text3); }
  .wi-val-wrong { color: var(--wrong); font-weight: 700; }
  .wi-val-correct { color: var(--correct); font-weight: 700; }

  .section-title {
    font-size: 12px; font-weight: 700; letter-spacing: .08em;
    color: var(--text3); text-transform: uppercase;
    margin-bottom: 12px; margin-top: 4px;
  }

  /* Notion sending */
  .notion-status {
    font-size: 11px; color: var(--text3); text-align: center;
    padding: 6px; margin-top: 8px;
  }
  .notion-status.ok { color: var(--correct); }
  .notion-status.err { color: var(--wrong); }

  /* cycle indicator */
  .cycle-bar {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 14px; font-size: 11px; color: var(--text3);
  }
  .cycle-dots { display: flex; gap: 3px; }
  .cycle-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--surface2); border: 1px solid var(--border);
    transition: background .3s;
  }
  .cycle-dot.done { background: var(--accent); border-color: var(--accent); }
  .cycle-dot.current { background: var(--accent2); border-color: var(--accent2); }
</style>
</head>
<body>

<!-- ════ LOGIN ════ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-badge">도담한영어교실</div>
    <div class="login-title">고1 비상(홍민표)<br>4과 어법 워크북</div>
    <div class="login-sub">풀기 전에 정보를 입력해 주세요</div>

    <div class="login-field">
      <label>이름</label>
      <input type="text" id="inpName" placeholder="홍길동">
    </div>
    <div class="login-field">
      <label>학교</label>
      <input type="text" id="inpSchool" placeholder="예: 명호고등학교">
    </div>
    <div class="login-field">
      <label>학년</label>
      <select id="inpGrade">
        <option value="">선택</option>
        <option value="고1">고1</option>
        <option value="고2">고2</option>
        <option value="고3">고3</option>
      </select>
    </div>
    <button class="btn-start" onclick="startQuiz()">시작하기 →</button>
  </div>
</div>

<!-- ════ QUIZ ════ -->
<div class="header" id="quizHeader" style="display:none">
  <div class="header-inner">
    <div>
      <div class="header-title">4과 어법 워크북</div>
      <div class="header-sub">고1 비상(홍민표) · 도담한영어교실</div>
    </div>
    <div class="progress-pill" id="headerProgress"><span>0</span> / 0</div>
  </div>
</div>

<div id="quizScreen">
  <div class="student-bar">
    👤 <strong id="dispName"></strong>&nbsp;|&nbsp;<span id="dispSchool"></span>&nbsp;·&nbsp;<span id="dispGrade"></span>
  </div>

  <div class="cycle-bar">
    <span>라운드</span>
    <div class="cycle-dots" id="cycleDots"></div>
  </div>

  <div class="set-header">
    <div class="set-badge">문제 <b id="setRange"></b></div>
    <button class="btn-submit-set" onclick="submitSet()">채점하기 ✓</button>
  </div>

  <div id="qList"></div>

  <div style="text-align:center;margin-top:10px;">
    <button class="btn-submit-set" onclick="submitSet()" style="padding:10px 32px;font-size:13px;">채점하기 ✓</button>
  </div>
</div>

<!-- ════ RESULT ════ -->
<div id="resultScreen">
  <div class="result-card">
    <div class="score-circle" id="scoreCircle">
      <div class="score-num" id="scoreNum">0%</div>
    </div>
    <div class="result-title" id="resultTitle">수고했어요!</div>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-stats">
      <div class="stat-box s-correct"><div class="stat-num" id="statCorrect">0</div><div class="stat-label">정답</div></div>
      <div class="stat-box"><div class="stat-num" id="statTotal">0</div><div class="stat-label">총 문제</div></div>
      <div class="stat-box s-wrong"><div class="stat-num" id="statWrong">0</div><div class="stat-label">오답</div></div>
    </div>
    <div class="btn-group">
      <button class="btn-retry" onclick="retryWrong()">오답 다시 풀기</button>
      <button class="btn-next-set" onclick="nextSet()">다음 세트 →</button>
    </div>
    <div class="notion-status" id="notionStatus"></div>
  </div>

  <div id="wrongSection" style="display:none">
    <div class="section-title">오답 목록</div>
    <div class="wrong-list" id="wrongList"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════
//  QUESTION BANK

const ALL_Q = [
// ── [4-1] San Francisco 도착 ──────────────────────────────────

},
{
  id:'qx_8',
  passage:`When we finally ①landed in San Francisco, the Golden Gate City, Dan shouted, "Let's get rolling!" I was disappointed to find out that the historic cable cars ②do not accommodate wheelchair users. The city tour bus, ③on which we rode, gave us a wonderful view of the city. As we moved through the streets, I noticed how ④smoothly the bus navigated the steep hills. This was my first time ⑤to experience San Francisco's famous geography firsthand.`,

  opts:['①landed','②do not','③on which','④smoothly','⑤to experience'],

// ════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════
let student = { name:'', school:'', grade:'' };
let pool = [];          // 남은 문제 (미풀이)
let doneIds = new Set();// 이미 출제된 문제 ID
let currentSet = [];    // 현재 10문제
let setAnswers = {};    // {qId: selectedIdx}
let totalCorrect = 0;
let totalAttempted = 0;
let cycleCount = 0;
let wrongQs = [];       // 이번 세트 오답 문제 객체
let retryMode = false;
let retryPool = [];

// ════════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// ════════════════════════════════════════════
//  LOGIN
// ════════════════════════════════════════════
function startQuiz() {
  const name = document.getElementById('inpName').value.trim();
  const school = document.getElementById('inpSchool').value.trim();
  const grade = document.getElementById('inpGrade').value;
  if (!name || !school || !grade) { alert('이름, 학교, 학년을 모두 입력해 주세요.'); return; }
  student = { name, school, grade };

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('quizHeader').style.display = 'block';
  document.getElementById('quizScreen').style.display = 'block';

  document.getElementById('dispName').textContent = name;
  document.getElementById('dispSchool').textContent = school;
  document.getElementById('dispGrade').textContent = grade;

  pool = shuffle([...ALL_Q]);
  doneIds.clear();
  cycleCount = 0;
  totalCorrect = 0;
  totalAttempted = 0;

  loadNextSet();
}

// ════════════════════════════════════════════
//  SET MANAGEMENT
// ════════════════════════════════════════════
function loadNextSet(forRetry=false) {
  retryMode = forRetry;
  setAnswers = {};
  wrongQs = [];

  if (forRetry) {
    currentSet = shuffle([...retryPool]);
    retryPool = [];
  } else {
    // 안 푼 문제에서 먼저
    if (pool.length === 0) {
      // 전체 소진 → 전체 셔플 재시작
      pool = shuffle([...ALL_Q]);
      doneIds.clear();
      cycleCount++;
    }
    currentSet = pool.splice(0, 10);
    currentSet.forEach(q => doneIds.add(q.id));
  }

  updateCycleDots();
  renderSet();
  window.scrollTo(0,0);
}

function updateCycleDots() {
  const total = Math.ceil(ALL_Q.length / 10);
  const container = document.getElementById('cycleDots');
  const usedSets = Math.floor((ALL_Q.length - pool.length) / 10);
  container.innerHTML = '';
  for (let i=0;i<total;i++){
    const d = document.createElement('div');
    d.className = 'cycle-dot' + (i < usedSets ? ' done' : (i === usedSets ? ' current' : ''));
    container.appendChild(d);
  }
}

function renderSet() {
  const qList = document.getElementById('qList');
  qList.innerHTML = '';

  const start = totalAttempted + 1;
  const end = totalAttempted + currentSet.length;
  document.getElementById('setRange').textContent = `${start} ~ ${end}번`;

  const progress = document.getElementById('headerProgress');
  progress.innerHTML = `<span>${totalAttempted}</span> / ${ALL_Q.length}`;

  currentSet.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `card_${q.id}`;

    card.innerHTML = `
      <div class="q-top">
        <div class="q-num">Q${totalAttempted + idx + 1}</div>
        <span class="q-tag ${q.tag}">${q.tagLabel}</span>
      </div>
      <div class="passage">${q.passage}</div>
      <div class="q-stem">${q.stem}</div>
      <div class="opts" id="opts_${q.id}">
        ${q.opts.map((o,i)=>`
          <button class="opt" onclick="selectOpt('${q.id}',${i})" id="opt_${q.id}_${i}">
            ${'①②③④⑤'[i]} ${o}
          </button>`).join('')}
      </div>
      <div class="feedback" id="fb_${q.id}"></div>
    `;
    qList.appendChild(card);
  });
}

// ════════════════════════════════════════════
//  INTERACTION
// ════════════════════════════════════════════
function selectOpt(qId, idx) {
  // 이미 채점됐으면 무시
  if (document.getElementById(`opt_${qId}_0`).disabled) return;

  setAnswers[qId] = idx;
  const opts = document.querySelectorAll(`#opts_${qId} .opt`);
  opts.forEach((o,i) => o.classList.toggle('selected', i===idx));
}

function submitSet() {
  let anyUnanswered = currentSet.some(q => setAnswers[q.id] === undefined);
  if (anyUnanswered) {
    if (!confirm('아직 풀지 않은 문제가 있어요. 그래도 채점할까요?')) return;
  }

  let setCorrect = 0;
  currentSet.forEach(q => {
    const chosen = setAnswers[q.id];
    const opts = document.querySelectorAll(`#opts_${q.id} .opt`);
    opts.forEach(o => o.disabled = true);

    if (chosen === undefined) {
      // 미응답
      opts[q.ans].classList.add('correct');
    } else if (chosen === q.ans) {
      opts[chosen].classList.add('correct');
      setCorrect++;
    } else {
      opts[chosen].classList.add('wrong');
      opts[q.ans].classList.add('correct');
      wrongQs.push({ q, chosen });
    }

    // 피드백
    const fb = document.getElementById(`fb_${q.id}`);
    if (chosen === q.ans) {
      fb.className = 'feedback correct';
      fb.innerHTML = `✅ 정답입니다! <br>${q.exp}`;
    } else {
      fb.className = 'feedback wrong';
      const chosenLabel = chosen !== undefined ? `'${'①②③④⑤'[chosen]} ${q.opts[chosen]}'` : '미응답';
      fb.innerHTML = `❌ 오답 (선택: ${chosenLabel})<br><span class="fb-answer">정답: ${'①②③④⑤'[q.ans]} ${q.opts[q.ans]}</span><br>${q.exp}`;
    }
    fb.style.display = 'block';
  });

  totalCorrect += setCorrect;
  totalAttempted += currentSet.length;

  retryPool = wrongQs.map(w => w.q);

  // 오답 Notion 전송
  if (wrongQs.length > 0) sendToNotion(wrongQs);

  showResult(setCorrect, currentSet.length);
}

// ════════════════════════════════════════════
//  RESULT
// ════════════════════════════════════════════
function showResult(correct, total) {
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';

  const pct = Math.round(correct/total*100);
  const circle = document.getElementById('scoreCircle');
  circle.style.background = `conic-gradient(var(--accent) ${pct*3.6}deg, var(--surface2) 0deg)`;
  document.getElementById('scoreNum').textContent = pct + '%';

  const msgs = pct===100 ? '완벽해요! 🎉' : pct>=80 ? '잘했어요! 👍' : pct>=60 ? '조금 더 해봐요 💪' : '다시 도전해요 🔥';
  document.getElementById('resultTitle').textContent = msgs;
  document.getElementById('resultSub').textContent = `이번 세트 ${correct}/${total} 정답`;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statWrong').textContent = total - correct;

  const wrongSection = document.getElementById('wrongSection');
  const wrongList = document.getElementById('wrongList');
  if (wrongQs.length > 0) {
    wrongSection.style.display = 'block';
    wrongList.innerHTML = wrongQs.map(({q, chosen}) => `
      <div class="wrong-item">
        <div class="wi-q">${q.passage.replace(/<[^>]+>/g,' ').substring(0,80)}...</div>
        <div class="wi-row">
          <span class="wi-label">선택:</span>
          <span class="wi-val-wrong">${chosen!==undefined?'①②③④⑤'[chosen]+' '+q.opts[chosen]:'미응답'}</span>
          <span class="wi-label">정답:</span>
          <span class="wi-val-correct">${'①②③④⑤'[q.ans]} ${q.opts[q.ans]}</span>
        </div>
      </div>`).join('');
  } else {
    wrongSection.style.display = 'none';
  }

  window.scrollTo(0,0);
}

function retryWrong() {
  if (retryPool.length === 0) { alert('오답이 없어요! 다음 세트로 이동하세요.'); return; }
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  loadNextSet(true);
}

function nextSet() {
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  document.getElementById('notionStatus').textContent = '';
  loadNextSet(false);
}

// ════════════════════════════════════════════
//  NOTION
// ════════════════════════════════════════════
async function sendToNotion(wrongs) {
  const status = document.getElementById('notionStatus');
  status.textContent = '📡 오답을 저장하는 중...';
  status.className = 'notion-status';

  const wrongText = wrongs.map(({q, chosen}) =>
    `[${q.tagLabel}] 정답:${'①②③④⑤'[q.ans]}${q.opts[q.ans]} / 선택:${chosen!==undefined?'①②③④⑤'[chosen]+q.opts[chosen]:'미응답'}`
  ).join('\n');

  const payload = {
    studentName: student.name,
    school: student.school,
    grade: student.grade,
    workbook: '고1 비상(홍) 4과 어법',
    category: '내신대비',
    submitDate: new Date().toISOString().slice(0,10),
    wrongAnswers: wrongText,
    score: `${currentSet.length - wrongs.length}/${currentSet.length}`
  };

  try {
    const res = await fetch('/.netlify/functions/notion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      status.textContent = '✅ 오답이 Notion에 저장됐어요.';
      status.className = 'notion-status ok';
    } else {
      throw new Error(res.status);
    }
  } catch(e) {
    status.textContent = '⚠️ 저장 실패 (네트워크 확인)';
    status.className = 'notion-status err';
  }
}
</script>
