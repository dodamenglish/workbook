<html lang="ko">
<head>
    <meta charset="UTF-8">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        :root {
            --primary-color: #3b82f6;
            --primary-dark: #1d4ed8;
            --secondary-color: #10b981;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --correct-color: #d1fae5;
            --correct-text: #065f46;
            --wrong-color: #fee2e2;
            --wrong-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .dashboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.1);
            border: 1px solid var(--border-color);
        }

        .stat-box {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-success {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-success:hover {
            background-color: #059669;
        }

        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .quiz-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .quiz-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }

        .q-num {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .q-source {
            font-weight: 400;
            font-size: 11px;
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .q-word {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 12px;
        }

        .q-input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .q-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .quiz-card.correct {
            background-color: var(--correct-color);
            border-color: #a7f3d0;
        }

        .quiz-card.wrong {
            background-color: var(--wrong-color);
            border-color: #fca5a5;
        }

        .feedback-text {
            margin-top: 8px;
            font-size: 12px;
            font-weight: 500;
            display: none;
        }

        .correct .feedback-text {
            display: block;
            color: var(--correct-text);
        }

        .wrong .feedback-text {
            display: block;
            color: var(--wrong-text);
        }

        .score-summary {
            display: none;
            text-align: center;
            background: white;
            border: 2px solid var(--primary-color);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
        }

        .score-summary h2 {
            font-size: 28px;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .score-summary p {
            font-size: 16px;
            color: var(--text-color);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 4px;
        }

        @media (max-width: 640px) {
            .dashboard {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .quiz-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

document.getElementById('totalCount').innerText = fullVocabDb.length + "개";
let currentQuizSet = [];

function generateQuiz() {
    document.getElementById('summaryBox').style.display = 'none';
    document.getElementById('liveScore').innerText = "0 / 100";
    
    // 전체 단어 무작위 셔플
    let shuffled = [...fullVocabDb].sort(() => 0.5 - Math.random());
    
    // 100문항 선택
    currentQuizSet = shuffled.slice(0, 100);
    
    const container = document.getElementById('quizContainer');
    container.innerHTML = '';
    
    currentQuizSet.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'quiz-card';
        card.id = `card-${index}`;
        
        card.innerHTML = `
            <div class="q-num">
                <span>문제 ${index + 1}</span>
                <span class="q-source">${item.source}</span>
            </div>
            <div class="q-word">${item.word}</div>
            <input type="text" class="q-input" id="input-${index}" placeholder="뜻을 기입하세요..." autocomplete="off">
            <div class="feedback-text" id="feedback-${index}"></div>
        `;
        container.appendChild(card);
    });
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function checkAnswers() {
    let finalScore = 0;
    
    currentQuizSet.forEach((item, index) => {
        const inputEl = document.getElementById(`input-${index}`);
        const cardEl = document.getElementById(`card-${index}`);
        const feedbackEl = document.getElementById(`feedback-${index}`);
        
        const userAns = inputEl.value.trim().toLowerCase();
        const correctMeanings = item.meaning.split(/,|\./).map(m => m.trim().toLowerCase()).filter(m => m.length > 0);
        
        let isCorrect = false;
        
        if (userAns.length > 0) {
            // 원문 그대로 포함하거나 사용자가 입력한 핵심어가 매칭될 때
            if (item.meaning.toLowerCase().includes(userAns) || userAns.includes(item.meaning.toLowerCase())) {
                isCorrect = true;
            }
            correctMeanings.forEach(meaning => {
                if (userAns.includes(meaning) || meaning.includes(userAns)) {
                    isCorrect = true;
                }
            });
        }
        
        if (isCorrect) {
            finalScore += 1;
            cardEl.className = 'quiz-card correct';
            feedbackEl.innerHTML = `⭕ 정답! (원문 뜻: ${item.meaning})`;
        } else {
            cardEl.className = 'quiz-card wrong';
            feedbackEl.innerHTML = `❌ 오답 (정답: ${item.meaning})`;
        }
    });
    
    document.getElementById('liveScore').innerText = `${finalScore} / 100`;
    document.getElementById('scoreText').innerText = `총 100점 만점에 ${finalScore}점 입니다. 오답 노트를 확인하며 복습해보세요!`;
    document.getElementById('summaryBox').style.display = 'block';
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 최초 실행시 자동 문제 로드
window.onload = generateQuiz;
</script>
