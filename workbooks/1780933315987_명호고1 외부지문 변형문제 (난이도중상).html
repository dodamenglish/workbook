<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>명호고 1학년 영어 기말고사 대비 워크북 (1~12회)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #1a3a5c;
  --accent: #e8703a;
  --bg: #f8f9fb;
  --card: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --muted: #64748b;
  --correct: #16a34a;
  --wrong: #dc2626;
  --tag-bg: #eef2ff;
  --tag-text: #4338ca;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* LOGIN */
#loginScreen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1a3a5c 0%, #2d5986 100%);
}
.login-box {
  background: white; border-radius: 20px; padding: 48px 40px; width: 100%; max-width: 420px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.login-box h1 { font-size: 22px; font-weight: 700; color: var(--primary); margin-bottom: 6px; text-align: center; }
.login-box p { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 32px; }
.login-box label { display: block; font-size: 13px; font-weight: 500; color: var(--primary); margin-bottom: 6px; }
.login-box input, .login-box select {
  width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 10px;
  font-size: 14px; font-family: 'Noto Sans KR', sans-serif; margin-bottom: 18px;
  transition: border-color 0.2s; outline: none;
}
.login-box input:focus, .login-box select:focus { border-color: var(--primary); }
.login-btn {
  width: 100%; padding: 14px; background: var(--primary); color: white; border: none;
  border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif; transition: background 0.2s;
}
.login-btn:hover { background: #2d5986; }
.workbook-badge {
  display: inline-block; background: var(--accent); color: white; font-size: 11px;
  font-weight: 700; padding: 4px 10px; border-radius: 20px; margin-bottom: 16px;
}

/* MAIN */
#mainApp { display: none; }
.top-bar {
  background: var(--primary); color: white; padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.top-bar h2 { font-size: 15px; font-weight: 700; }
.user-info { font-size: 13px; color: rgba(255,255,255,0.8); }

/* TABS */
.tab-bar {
  background: white; border-bottom: 2px solid var(--border); padding: 0 24px;
  display: flex; gap: 0; overflow-x: auto; position: sticky; top: 53px; z-index: 99;
}
.tab-btn {
  padding: 14px 20px; font-size: 13px; font-weight: 500; border: none; background: none;
  cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px;
  white-space: nowrap; font-family: 'Noto Sans KR', sans-serif; transition: all 0.2s;
}
.tab-btn.active { color: var(--primary); border-bottom-color: var(--accent); font-weight: 700; }
.tab-btn:hover { color: var(--primary); }

/* CONTENT */
.tab-content { display: none; padding: 24px; max-width: 900px; margin: 0 auto; }
.tab-content.active { display: block; }

.round-header {
  background: var(--primary); color: white; border-radius: 14px; padding: 20px 24px;
  margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between;
}
.round-header h3 { font-size: 18px; font-weight: 700; }
.round-header span { font-size: 13px; color: rgba(255,255,255,0.7); }
.score-display { font-size: 22px; font-weight: 700; color: var(--accent); }

/* QUESTION CARD */
.q-card {
  background: var(--card); border-radius: 14px; padding: 24px; margin-bottom: 16px;
  border: 2px solid var(--border); transition: border-color 0.2s;
}
.q-card.answered-correct { border-color: var(--correct); }
.q-card.answered-wrong { border-color: var(--wrong); }

.q-meta {
  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
}
.q-num {
  background: var(--primary); color: white; border-radius: 50%; width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0;
}
.q-tag {
  background: var(--tag-bg); color: var(--tag-text); font-size: 11px; font-weight: 600;
  padding: 3px 10px; border-radius: 20px;
}
.q-type-tag {
  background: #fef3c7; color: #92400e; font-size: 11px; font-weight: 600;
  padding: 3px 10px; border-radius: 20px;
}

.passage-box {
  background: #f8f9fb; border-left: 4px solid var(--accent); border-radius: 0 10px 10px 0;
  padding: 16px 18px; margin-bottom: 16px; font-size: 13.5px; line-height: 1.9;
}
.passage-box em { font-style: italic; color: var(--primary); font-weight: 500; }

.q-stem { font-size: 14px; line-height: 1.8; margin-bottom: 16px; font-weight: 500; }

/* CHOICES */
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice-btn {
  padding: 12px 16px; border: 2px solid var(--border); border-radius: 10px; background: white;
  text-align: left; cursor: pointer; font-size: 13.5px; font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.15s; line-height: 1.6; color: var(--text);
  display: flex; align-items: flex-start; gap: 10px;
}
.choice-btn:hover:not(:disabled) { border-color: var(--primary); background: #eef2ff; }
.choice-btn.selected { border-color: var(--primary); background: #eef2ff; }
.choice-btn.correct-ans { border-color: var(--correct); background: #f0fdf4; color: var(--correct); font-weight: 600; }
.choice-btn.wrong-ans { border-color: var(--wrong); background: #fff5f5; color: var(--wrong); }
.choice-num { font-weight: 700; flex-shrink: 0; }

/* SHORT ANSWER */
.short-input {
  width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 10px;
  font-size: 14px; font-family: 'Noto Sans KR', sans-serif; resize: vertical; min-height: 60px;
  outline: none; transition: border-color 0.2s;
}
.short-input:focus { border-color: var(--primary); }
.short-input:disabled { background: #f1f5f9; }

.model-answer {
  display: none; margin-top: 12px; padding: 14px 16px; background: #f0fdf4;
  border: 2px solid var(--correct); border-radius: 10px;
}
.model-answer.show { display: block; }
.model-answer strong { color: var(--correct); font-size: 13px; display: block; margin-bottom: 4px; }
.model-answer p { font-size: 13.5px; line-height: 1.7; color: #166534; }

/* FEEDBACK */
.feedback {
  display: none; margin-top: 10px; padding: 10px 14px; border-radius: 8px; font-size: 13px;
}
.feedback.show { display: block; }
.feedback.correct { background: #f0fdf4; color: var(--correct); }
.feedback.wrong { background: #fff5f5; color: var(--wrong); }

/* BUTTONS */
.btn-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.btn-primary {
  padding: 12px 24px; background: var(--primary); color: white; border: none; border-radius: 10px;
  font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
  transition: background 0.2s;
}
.btn-primary:hover { background: #2d5986; }
.btn-accent {
  padding: 12px 24px; background: var(--accent); color: white; border: none; border-radius: 10px;
  font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
  transition: background 0.2s;
}
.btn-accent:hover { background: #d4612e; }
.btn-outline {
  padding: 12px 24px; background: white; color: var(--primary); border: 2px solid var(--primary);
  border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif; transition: all 0.2s;
}
.btn-outline:hover { background: var(--primary); color: white; }

/* RESULT */
.result-box {
  display: none; background: var(--primary); color: white; border-radius: 14px; padding: 24px;
  margin-top: 20px; text-align: center;
}
.result-box.show { display: block; }
.result-score { font-size: 48px; font-weight: 700; color: var(--accent); }
.result-label { font-size: 14px; color: rgba(255,255,255,0.7); margin-top: 4px; }
.result-detail { font-size: 13px; color: rgba(255,255,255,0.8); margin-top: 12px; }

.submit-notice {
  background: #fef3c7; border: 2px solid #f59e0b; border-radius: 10px; padding: 12px 16px;
  font-size: 13px; color: #92400e; margin-top: 12px; display: none;
}
.submit-notice.show { display: block; }

/* PROGRESS */
.progress-bar-wrap { background: rgba(255,255,255,0.2); border-radius: 10px; height: 6px; margin-top: 8px; }
.progress-bar { background: var(--accent); height: 6px; border-radius: 10px; transition: width 0.3s; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">

    <div style="text-align:center; margin-bottom:8px;">
      <span class="workbook-badge">명호고 1학년 영어</span>

// ===================== 배분 로직 =====================
const SOURCES = [...new Set(ALL_QUESTIONS.map(q=>q.src))];
const ROUNDS = 12;
const ROUND_OFFSET = 0;
const PER_ROUND = 35;

function shuffleArray(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function buildRounds() {
  const bySource={};
  SOURCES.forEach(s=>{bySource[s]=shuffleArray(ALL_QUESTIONS.filter(q=>q.src===s));});
  const idx={};
  SOURCES.forEach(s=>{idx[s]=0;});
  const rounds=[];
  for(let r=0;r<ROUNDS;r++){
    const pool=[];
    let safety=0;
    // 각 지문에서 골고루 뽑되, 부족하면 전체에서 랜덤으로 채움
    while(pool.length<PER_ROUND && safety<2000){
      safety++;
      for(const s of SOURCES){
        if(pool.length>=PER_ROUND)break;
        // 인덱스가 끝나면 처음부터 다시 (중복 허용)
        if(idx[s]>=bySource[s].length){
          bySource[s]=shuffleArray(ALL_QUESTIONS.filter(q=>q.src===s));
          idx[s]=0;
        }
        pool.push({...bySource[s][idx[s]]});
        idx[s]++;
      }
    }
    rounds.push(shuffleArray(pool.slice(0,PER_ROUND)));
  }
  return rounds;
}

// ===================== 상태 =====================
let userName='', userSchool='', userGrade='';
let rounds = [];
let answers = []; // answers[round][qIdx] = {selected, submitted}
let scores = [];

// ===================== 로그인 =====================
function doLogin() {
  const n = document.getElementById('inputName').value.trim();
  const s = document.getElementById('inputSchool').value.trim();
  const g = document.getElementById('inputGrade').value;
  if(!n){alert('이름을 입력해주세요.');return;}
  userName=n; userSchool=s; userGrade=g;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('mainApp').style.display='block';
  document.getElementById('topUserInfo').textContent = `${n} | ${s} | ${g}`;
  rounds = buildRounds();
  answers = rounds.map(r=>r.map(()=>({selected:-1,submitted:false,shortAnswer:''})));
  scores = rounds.map(()=>({obj:0,total:0,submitted:false}));
  buildTabs();
}

// ===================== 탭 생성 =====================
function buildTabs() {
  const tabBar = document.getElementById('tabBar');
  const tabContents = document.getElementById('tabContents');
  tabBar.innerHTML=''; tabContents.innerHTML='';
  
  for(let r=0;r<ROUNDS;r++) {
    const btn = document.createElement('button');
    btn.className='tab-btn'+(r===0?' active':'');
    btn.textContent=`${r+1}회차`;
    btn.onclick=()=>switchTab(r);
    tabBar.appendChild(btn);
    
    const div = document.createElement('div');
    div.className='tab-content'+(r===0?' active':'');
    div.id=`tab${r}`;
    div.innerHTML = buildRoundHTML(r);
    tabContents.appendChild(div);
  }
}

function switchTab(r) {
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===r));
  document.querySelectorAll('.tab-content').forEach((c,i)=>c.classList.toggle('active',i===r));
}

// ===================== HTML 생성 =====================
function buildRoundHTML(r) {
  const qs = rounds[r];
  let html = `
    <div class="round-header">
      <div>
        <h3>${r+1}회차 모의고사</h3>
        <span>총 ${qs.length}문항 | 14개 지문 혼합</span>
        <div class="progress-bar-wrap" style="margin-top:8px; width:200px;">
          <div class="progress-bar" id="prog${r}" style="width:0%"></div>
        </div>
      </div>
      <div id="scoreDisp${r}" class="score-display" style="font-size:16px; color:rgba(255,255,255,0.7)">미제출</div>
    </div>
  `;
  
  qs.forEach((q,i) => {
    html += buildQuestionHTML(r, i, q);
  });
  
  html += `
    <div class="btn-row">
      <button class="btn-accent" onclick="submitRound(${r})">✅ 제출하기</button>
      <button class="btn-outline" onclick="resetRound(${r})">🔄 초기화</button>
    </div>
    <div class="result-box" id="result${r}">
      <div class="result-score" id="resultScore${r}">-</div>
      <div class="result-label">객관식 점수 (서답형 제외)</div>
      <div class="result-detail" id="resultDetail${r}"></div>
    </div>
    <div class="submit-notice" id="notice${r}"></div>
  `;
  return html;
}

function buildQuestionHTML(r, i, q) {
  const qid = `q${r}_${i}`;
  const tagColor = q.type==='short' ? 'q-type-tag' : 'q-tag';
  let html = `
    <div class="q-card" id="card${r}_${i}">
      <div class="q-meta">
        <div class="q-num">${i+1}</div>
        <span class="q-tag">${q.src}</span>
        <span class="${tagColor}">${q.tag}</span>
      </div>
      <div class="q-stem">${q.stem}</div>
  `;
  
  if(q.type==='obj') {
    html += `<div class="choices">`;
    q.choices.forEach((c,ci) => {
      html += `<button class="choice-btn" id="${qid}_c${ci}" onclick="selectChoice(${r},${i},${ci})" data-ci="${ci}">
        <span class="choice-num">①②③④⑤`[ci*2]+ `${ci+1}</span><span>${c}</span>
      </button>`;
    });
    html += `</div>
      <div class="feedback" id="fb${r}_${i}"></div>`;
  } else {
    html += `<textarea class="short-input" id="${qid}_sa" placeholder="답을 입력하세요..." rows="3" oninput="saveShortAnswer(${r},${i},this.value)"></textarea>
      <div class="model-answer" id="ma${r}_${i}">
        <strong>📌 모범 답안</strong>
        <p>${q.modelAnswer}</p>
      </div>`;
  }
  
  html += `</div>`;
  return html;
}

// ===================== 인터랙션 =====================
function selectChoice(r, i, ci) {
  if(answers[r][i].submitted) return;
  answers[r][i].selected = ci;
  
  const qs = rounds[r];
  const q = qs[i];
  // 시각 업데이트
  for(let c=0;c<q.choices.length;c++) {
    const btn = document.getElementById(`q${r}_${i}_c${c}`);
    btn.classList.toggle('selected', c===ci);
  }
  updateProgress(r);
}

function saveShortAnswer(r, i, val) {
  answers[r][i].shortAnswer = val;
}

function updateProgress(r) {
  const qs = rounds[r];
  const answered = answers[r].filter((a,i)=> qs[i].type==='obj' ? a.selected>=0 : a.shortAnswer.trim().length>0).length;
  const pct = Math.round(answered/qs.length*100);
  const prog = document.getElementById(`prog${r}`);
  if(prog) prog.style.width = pct+'%';
}

function submitRound(r) {
  const qs = rounds[r];
  let objCorrect=0, objTotal=0;
  
  qs.forEach((q,i) => {
    answers[r][i].submitted = true;
    if(q.type==='obj') {
      objTotal++;
      const sel = answers[r][i].selected;
      const correct = sel === q.answer;
      if(correct) objCorrect++;
      
      // 색상 표시
      const card = document.getElementById(`card${r}_${i}`);
      card.classList.toggle('answered-correct', correct && sel>=0);
      card.classList.toggle('answered-wrong', !correct && sel>=0);
      
      for(let c=0;c<q.choices.length;c++) {
        const btn = document.getElementById(`q${r}_${i}_c${c}`);
        btn.disabled = true;
        if(c===q.answer) btn.classList.add('correct-ans');
        else if(c===sel && sel!==q.answer) btn.classList.add('wrong-ans');
      }
      
      const fb = document.getElementById(`fb${r}_${i}`);
      if(sel>=0) {
        fb.className = 'feedback show '+(correct?'correct':'wrong');
        fb.textContent = correct ? '✅ 정답입니다!' : `❌ 오답입니다. 정답: ${q.answer+1}번`;
      }
    } else {
      // 서답형: 모범답 공개
      const ma = document.getElementById(`ma${r}_${i}`);
      if(ma) ma.classList.add('show');
      const ta = document.getElementById(`q${r}_${i}_sa`);
      if(ta) ta.disabled = true;
    }
  });
  
  scores[r] = {obj:objCorrect, total:objTotal, submitted:true};
  
  const pct = objTotal>0 ? Math.round(objCorrect/objTotal*100) : 0;
  const resultBox = document.getElementById(`result${r}`);
  resultBox.classList.add('show');
  document.getElementById(`resultScore${r}`).textContent = `${objCorrect}/${objTotal}점`;
  document.getElementById(`resultDetail${r}`).textContent = `객관식 정답률 ${pct}% | 서답형 ${qs.length-objTotal}문항은 모범답을 확인하세요.`;
  document.getElementById(`scoreDisp${r}`).textContent = `${objCorrect}/${objTotal}`;
  document.getElementById(`scoreDisp${r}`).style.color = '#f97316';
  
  // Notion 제출
  submitToNotion(r, objCorrect, objTotal, qs);
}

function resetRound(r) {
  if(!confirm(`${r+1}회차를 초기화하시겠습니까?`)) return;
  answers[r] = rounds[r].map(()=>({selected:-1,submitted:false,shortAnswer:''}));
  scores[r] = {obj:0,total:0,submitted:false};
  // 탭 컨텐츠 재생성
  document.getElementById(`tab${r}`).innerHTML = buildRoundHTML(r);
}

// ===================== Notion 제출 =====================
async function submitToNotion(r, correct, total, qs) {
  try {
    const wrongList = [];
    qs.forEach((q,i)=>{
      if(q.type==='obj' && answers[r][i].selected !== q.answer) {
        wrongList.push(`[${i+1}번/${q.src}] 선택:${answers[r][i].selected+1}번 정답:${q.answer+1}번`);
      }
    });
    
    const payload = {
      studentName: userName,
      school: userSchool,
      grade: userGrade,
      workbook: `명호고 기말대비 ${r+1}회차`,
      category: '기말고사 대비',
      submitDate: new Date().toISOString().split('T')[0],
      wrongAnswers: `[점수: ${correct}/${total}점]\n` + (wrongList.length ? wrongList.join('\n') : '모두 정답'),
      score: correct
    };
    
    await fetch('https://dodamenglish.netlify.app/.netlify/functions/notion', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    
    const notice = document.getElementById(`notice${r}`);
    if(notice) {
      notice.className='submit-notice show';
      notice.textContent='✅ 결과가 도담T께 제출되었습니다.';
    }
  } catch(e) {
    console.error('Notion 제출 오류:', e);
  }
}
</script>
</body>
</html>
