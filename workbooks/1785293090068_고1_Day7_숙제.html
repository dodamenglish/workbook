"gbox": "A letter <u>takes&#9312;</u> time, <u>but&#9313;</u> its slowness <u>are&#9314;</u> the point, <u>which&#9315;</u> people <u>value&#9316;</u>.",
"options": [

},

},
{

},
{

},
{

}
],
"answer": 3,
"expl": "&#9314; <b>are &rarr; is</b> : 주어 \"its slowness\"는 단수. (&#9312;단수 takes &#9313;접속사 but &#9315;목적격 which &#9316;복수 value)"
}
]
}
];
  let student = { name:"", school:"", grade:"" }; let graded = false; let TOTAL = 0;
  document.getElementById("startBtn").addEventListener("click", ()=>{
    const name=document.getElementById("inName").value.trim(), school=document.getElementById("inSchool").value.trim(), grade=document.getElementById("inGrade").value;
    if(!name||!school||!grade){ alert("이름·학교·학년을 모두 입력해주세요!"); return; }
    student={name,school,grade}; document.getElementById("who").textContent=`${name} · ${school} · ${grade}`; document.getElementById("who").classList.add("show");
    document.getElementById("screenLogin").classList.remove("active"); document.getElementById("screenQuiz").classList.add("active"); build(); window.scrollTo({top:0});
  });
  const app = document.getElementById("app");
  function build(){
    PANELS.forEach(panel=>{
      if(panel.grammar){ const t=document.createElement("div"); t.className="sec-title"; t.textContent=panel.title; app.appendChild(t); }
      else { const tag=document.createElement("div"); tag.className="p-tag"; tag.innerHTML=panel.tag; app.appendChild(tag); const box=document.createElement("div"); box.className="passage"; box.innerHTML='<p>'+panel.html+'</p>'; app.appendChild(box); }
      panel.questions.forEach(q=>{
        const qid=panel.tabId+"t"+q.idx; const el=document.createElement("section"); el.className="q"; el.dataset.qid=qid; el.dataset.answer=q.answer; el.dataset.label=q.label;
        let h='<span class="qid">'+qid+'</span><div class="qlabel">['+q.label+']</div><div class="stem">'+q.idx+'. '+q.stem+'</div>';
        if(q.gbox) h+='<div class="gbox">'+q.gbox+'</div>';
        q.options.forEach((o,i)=>{ const ko=o.ko?' <span class="ko">('+o.ko+')</span>':''; h+='<label class="opt" data-n="'+(i+1)+'"><span class="cir">'+CIRCLE[i]+'</span><span class="txt"><span class="en">'+o.en+'</span>'+ko+'</span><span class="mark"></span><input type="radio" name="'+qid+'" value="'+(i+1)+'"></label>'; });
        h+='<div class="expl"><b>해설</b> · '+q.expl+'</div>'; el.innerHTML=h; app.appendChild(el); TOTAL++;
      });
    });
    document.getElementById("scoreTot").textContent=TOTAL;
  }
  app.addEventListener("click", e=>{ if(graded) return; const opt=e.target.closest(".opt"); if(!opt) return; const q=opt.closest(".q"); q.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel")); opt.classList.add("sel"); opt.querySelector("input").checked=true; });
  document.getElementById("grade").addEventListener("click", async ()=>{
    if(graded) return; let correct=0; const wrongs=[];
    app.querySelectorAll(".q").forEach(q=>{
      const ans=Number(q.dataset.answer); const sel=q.querySelector("input:checked"); const chosen=sel?Number(sel.value):0; q.classList.add("graded");
      q.querySelectorAll(".opt").forEach(o=>{ const n=Number(o.dataset.n); if(n===ans){o.classList.add("correct");o.querySelector(".mark").textContent="○";} if(n===chosen&&chosen!==ans){o.classList.add("wrong");o.querySelector(".mark").textContent="✕";} });
      q.querySelector(".expl").classList.add("show"); if(chosen===ans) correct++; else wrongs.push({qid:q.dataset.qid,label:q.dataset.label,chosen:chosen?CIRCLE[chosen-1]:"(미선택)",answer:CIRCLE[ans-1]});
    });
    graded=true; const pct=Math.round(correct/TOTAL*100);
    document.getElementById("scoreNum").textContent=correct; document.getElementById("scorePct").textContent=pct; document.getElementById("scorePill").classList.add("show");
    document.getElementById("grade").disabled=true; document.getElementById("retry").style.display="block"; window.scrollTo({top:0,behavior:"smooth"});
    let wt=`[점수: ${correct}/${TOTAL} (${pct}점)]\n`; if(wrongs.length===0) wt+="오답 없음 - 만점!"; else wrongs.forEach((w,i)=>{ wt+=`${i+1}. [${w.label}] ${w.qid} · 답 ${w.chosen}/정답 ${w.answer}\n`; });
    await sendToNotion(pct, wt);
  });
  async function sendToNotion(score, wrongText){
    const el=document.getElementById("notionStatus"); el.className="notion-status sending"; el.textContent="📤 결과를 Notion에 제출 중...";
    const payload={ studentName:student.name, school:student.school, grade:student.grade, workbook:WORKBOOK, category:CATEGORY, submitDate:new Date().toISOString().split("T")[0], wrongAnswers:wrongText.slice(0,2000), score:score };
    try{ const res=await fetch(NOTION_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}); if(res.ok){ el.className="notion-status sent"; el.textContent="✅ Notion에 제출되었습니다."; } else { throw new Error("서버 오류 "+res.status); } }
    catch(e){ el.className="notion-status err"; el.textContent="⚠️ 제출 실패: "+e.message+" (선생님께 알려주세요)"; }
  }
  document.getElementById("retry").addEventListener("click", ()=>{
    graded=false; app.querySelectorAll(".q").forEach(q=>{ q.classList.remove("graded"); q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("sel","correct","wrong");o.querySelector(".mark").textContent="";}); q.querySelectorAll("input").forEach(i=>i.checked=false); q.querySelector(".expl").classList.remove("show"); });
    document.getElementById("scorePill").classList.remove("show"); document.getElementById("notionStatus").textContent=""; document.getElementById("grade").disabled=false; document.getElementById("retry").style.display="none"; window.scrollTo({top:0,behavior:"smooth"});
  });
</script>
