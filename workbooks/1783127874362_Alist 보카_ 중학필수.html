<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A*List VOCA 중학필수 전자워크북</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #1a3a5c;
  --accent: #e8703a;
  --accent2: #2d8c6e;
  --bg: #f8f9fc;
  --card: #ffffff;
  --border: #e2e8f0;
  --text: #1e2a3a;
  --text2: #5a6a7e;
  --correct: #2d8c6e;
  --wrong: #c0392b;
  --wrong-bg: #fff5f5;
  --correct-bg: #f0faf6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ─── LOGIN ─── */
#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #1a3a5c 0%, #0f2440 100%);
}
.login-box {
  background: white;
  border-radius: 20px;
  padding: 48px 40px;
  width: 440px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.25);
}
.login-logo {
  text-align: center;
  margin-bottom: 32px;
}
.login-logo h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--primary);
  line-height: 1.3;
}
.login-logo .sub {
  font-size: 13px;
  color: var(--text2);
  margin-top: 4px;
}
.badge-alist {
  display: inline-block;
  background: var(--accent);
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
  margin-bottom: 10px;
  letter-spacing: 1px;
}
.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--text2);
  margin-bottom: 6px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.form-group input, .form-group select {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.form-group input:focus, .form-group select:focus {
  border-color: var(--primary);
}
.btn-login {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.2s, transform 0.1s;
}
.btn-login:hover { background: #0f2440; }
.btn-login:active { transform: scale(0.99); }

/* ─── APP ─── */
#appScreen { display: none; min-height: 100vh; }
.app-header {
  background: var(--primary);
  color: white;
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.app-header-left h1 {
  font-size: 16px;
  font-weight: 700;
}
.app-header-left .user-info {
  font-size: 12px;
  opacity: 0.75;
  margin-top: 2px;
}
.header-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}

/* ─── MODE TABS ─── */
.mode-tabs {
  display: flex;
  background: white;
  border-bottom: 2px solid var(--border);
  padding: 0 28px;
}
.mode-tab {
  padding: 14px 24px;
  font-size: 14px;
  font-weight: 700;
  color: var(--text2);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  transition: all 0.2s;
  font-family: 'Noto Sans KR', sans-serif;
}
.mode-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.mode-tab:hover:not(.active) { color: var(--primary); }

/* ─── MAIN CONTENT ─── */
.main-content {
  max-width: 960px;
  margin: 0 auto;
  padding: 28px 24px;
}

/* ─── DAY SELECTOR ─── */
.section-card {
  background: white;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  border: 1px solid var(--border);
}
.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 16px;
}
.day-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.day-btn {
  padding: 8px 4px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  border: 2px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  color: var(--text2);
  background: white;
  transition: all 0.15s;
  font-family: 'Noto Sans KR', sans-serif;
  user-select: none;
}
.day-btn:hover { border-color: var(--accent); color: var(--accent); }
.day-btn.selected {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.selector-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.btn-sm {
  padding: 7px 14px;
  font-size: 12px;
  font-weight: 700;
  border-radius: 8px;
  border: 2px solid var(--border);
  background: white;
  color: var(--text2);
  cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.15s;
}
.btn-sm:hover { border-color: var(--primary); color: var(--primary); }
.btn-sm.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}
.btn-sm.primary:hover { background: #0f2440; }
.btn-sm.accent {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.selected-info {
  font-size: 13px;
  color: var(--text2);
  margin-left: auto;
  font-weight: 500;
}

/* ─── QUIZ AREA ─── */
#quizArea { display: none; }
.quiz-header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.quiz-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
}
.quiz-count {
  font-size: 13px;
  color: var(--text2);
  font-weight: 500;
}
.quiz-table-wrap {
  background: white;
  border-radius: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  border: 1px solid var(--border);
  overflow: hidden;
  margin-bottom: 20px;
}
.quiz-table {
  width: 100%;
  border-collapse: collapse;
}
.quiz-table thead th {
  background: var(--primary);
  color: white;
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 700;
  text-align: left;
}
.quiz-table thead th:first-child { width: 56px; text-align: center; }
.quiz-table thead th:nth-child(2) { width: 55%; }
.quiz-table tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
.quiz-table tbody tr:last-child { border-bottom: none; }
.quiz-table tbody tr:hover { background: #f8f9fc; }
.quiz-table tbody tr.day-group-header td {
  background: #eef2f7;
  padding: 7px 16px;
  font-size: 11px;
  font-weight: 700;
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.quiz-table td {
  padding: 10px 16px;
  font-size: 14px;
  vertical-align: middle;
}
.quiz-table td:first-child {
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text2);
}
.answer-input {
  width: 100%;
  padding: 8px 10px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
  background: white;
}
.answer-input:focus { border-color: var(--primary); }
.answer-input.correct { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); }
.answer-input.wrong { border-color: var(--wrong); background: var(--wrong-bg); color: var(--wrong); }

/* ─── SUBMIT AREA ─── */
.submit-area {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 24px;
}
.btn-grade {
  padding: 14px 36px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-grade:hover { background: #c85e2e; }
.btn-reset {
  padding: 14px 24px;
  background: white;
  color: var(--text2);
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-reset:hover { border-color: var(--primary); color: var(--primary); }

/* ─── RESULT ─── */
#resultArea { display: none; }
.result-summary {
  background: var(--primary);
  color: white;
  border-radius: 16px;
  padding: 28px 32px;
  display: flex;
  align-items: center;
  gap: 32px;
  margin-bottom: 24px;
}
.score-big {
  font-size: 52px;
  font-weight: 900;
  line-height: 1;
}
.score-label { font-size: 16px; opacity: 0.8; margin-top: 4px; }
.result-stats { flex: 1; }
.stat-row {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}
.stat-item {
  text-align: center;
  min-width: 80px;
}
.stat-val {
  font-size: 24px;
  font-weight: 800;
}
.stat-val.correct { color: #5eead4; }
.stat-val.wrong { color: #fca5a5; }
.stat-desc { font-size: 12px; opacity: 0.7; margin-top: 2px; }
.result-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 24px;
}

/* ─── WRONG ANSWER LIST ─── */
.wrong-list-header {
  font-size: 15px;
  font-weight: 700;
  color: var(--wrong);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.wrong-list-header::before {
  content: "✗";
  font-size: 16px;
}
.wrong-table-wrap {
  background: white;
  border-radius: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  border: 1px solid var(--border);
  overflow: hidden;
  margin-bottom: 20px;
}
.wrong-table {
  width: 100%;
  border-collapse: collapse;
}
.wrong-table thead th {
  background: #c0392b;
  color: white;
  padding: 11px 16px;
  font-size: 12px;
  font-weight: 700;
  text-align: left;
}
.wrong-table thead th:first-child { width: 60px; text-align: center; }
.wrong-table tbody tr { border-bottom: 1px solid var(--border); }
.wrong-table tbody tr:last-child { border-bottom: none; }
.wrong-table td {
  padding: 10px 16px;
  font-size: 13px;
  vertical-align: middle;
}
.wrong-table td:first-child { text-align: center; color: var(--text2); font-size: 11px; font-weight:700; }
.my-ans { color: var(--wrong); font-weight: 600; }
.correct-ans { color: var(--correct); font-weight: 700; }

/* ─── NOTION SUBMIT ─── */
.notion-section {
  background: white;
  border-radius: 16px;
  padding: 24px;
  border: 1px solid var(--border);
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  text-align: center;
}
.notion-section h3 {
  font-size: 15px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 16px;
}
.btn-notion {
  padding: 13px 32px;
  background: #1a3a5c;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer;
  transition: background 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn-notion:hover { background: #0f2440; }
.notion-status {
  margin-top: 12px;
  font-size: 13px;
  color: var(--text2);
  min-height: 20px;
}
.notion-status.ok { color: var(--correct); font-weight: 600; }
.notion-status.err { color: var(--wrong); }

/* ─── RESPONSIVE ─── */
@media (max-width: 640px) {
  .day-grid { grid-template-columns: repeat(5, 1fr); }
  .result-summary { flex-direction: column; gap: 16px; }
  .app-header { padding: 12px 16px; }
  .main-content { padding: 16px 12px; }
  .quiz-table thead th:nth-child(2) { width: 45%; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <div class="badge-alist">A★LIST</div>
      <h1>VOCA 중학필수<br>전자워크북</h1>
      <div class="sub">DAY 01 – 32 &nbsp;|&nbsp; 한영 / 영한</div>
    </div>
    <div class="form-group">
      <label>이름</label>
      <input type="text" id="inputName" placeholder="이름을 입력하세요">
    </div>
    <div class="form-group">
      <label>학교</label>
      <input type="text" id="inputSchool" placeholder="학교명을 입력하세요">
    </div>

    <button class="btn-login" onclick="doLogin()">시작하기</button>
  </div>
</div>

<!-- APP -->
<div id="appScreen">
  <div class="app-header">
    <div class="app-header-left">
      <div class="user-info">도담한영어교실</div>
      <h1 id="headerTitle">A★List VOCA 중학필수</h1>
    </div>
    <div class="header-actions">
      <span id="headerUser" style="font-size:13px;opacity:0.8;"></span>
    </div>
  </div>

  <!-- MODE TABS -->
  <div class="mode-tabs">
    <div class="mode-tab active" id="tabKE" onclick="switchMode('ke')">한 → 영 (한영)</div>
    <div class="mode-tab" id="tabEK" onclick="switchMode('ek')">영 → 한 (영한)</div>
  </div>

  <div class="main-content">

    <!-- DAY SELECTOR -->
    <div id="selectorSection">
      <div class="section-card">
        <div class="section-title">📚 시험 범위 선택</div>
        <div class="day-grid" id="dayGrid"></div>
        <div class="selector-actions">
          <button class="btn-sm" onclick="selectAll()">전체 선택</button>
          <button class="btn-sm" onclick="selectNone()">전체 해제</button>
          <button class="btn-sm" onclick="selectRange(1,10)">DAY 1–10</button>
          <button class="btn-sm" onclick="selectRange(11,20)">DAY 11–20</button>
          <button class="btn-sm" onclick="selectRange(21,32)">DAY 21–32</button>
          <span class="selected-info" id="selectedInfo">0개 DAY 선택 (0문항)</span>
        </div>
      </div>

      <div style="text-align:center; margin-top: 8px;">
        <button class="btn-sm primary" style="padding:13px 36px;font-size:14px;border-radius:12px;" onclick="startQuiz()">시험 시작 →</button>
      </div>
    </div>

    <!-- QUIZ AREA -->
    <div id="quizArea">
      <div class="quiz-header-bar">
        <div>
          <div class="quiz-title" id="quizTitle"></div>
          <div class="quiz-count" id="quizCount"></div>
        </div>
        <button class="btn-sm" onclick="backToSelector()">← 범위 변경</button>
      </div>

      <div class="quiz-table-wrap">
        <table class="quiz-table">
          <thead>
            <tr>
              <th>No.</th>
              <th id="colMeaning">Meaning (뜻)</th>
              <th>Answer (정답)</th>
            </tr>
          </thead>
          <tbody id="quizTableBody"></tbody>
        </table>
      </div>

      <div class="submit-area">
        <button class="btn-grade" onclick="gradeQuiz()">채점하기</button>
        <button class="btn-reset" onclick="resetInputs()">답안 초기화</button>
      </div>
    </div>

    <!-- RESULT AREA -->
    <div id="resultArea">
      <div class="result-summary">
        <div>
          <div class="score-big" id="scoreBig">-</div>
          <div class="score-label">점</div>
        </div>
        <div class="result-stats">
          <div class="stat-row">
            <div class="stat-item">
              <div class="stat-val" id="totalCount">-</div>
              <div class="stat-desc">총 문항</div>
            </div>
            <div class="stat-item">
              <div class="stat-val correct" id="correctCount">-</div>
              <div class="stat-desc">정답</div>
            </div>
            <div class="stat-item">
              <div class="stat-val wrong" id="wrongCount">-</div>
              <div class="stat-desc">오답</div>
            </div>
          </div>
        </div>
      </div>

      <div class="result-actions">
        <button class="btn-grade" onclick="backToQuiz()">← 다시 보기</button>
        <button class="btn-reset" onclick="backToSelector()">새 시험</button>
      </div>

      <div id="wrongListSection" style="display:none;">
        <div class="wrong-list-header" id="wrongListHeader"></div>
        <div class="wrong-table-wrap">
          <table class="wrong-table">
            <thead>
              <tr>
                <th>No.</th>
                <th id="wrongColQ">문제</th>
                <th>내 답</th>
                <th>정답</th>
              </tr>
            </thead>
            <tbody id="wrongTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="notion-section">
        <h3>📮 도담T에게 결과 제출</h3>
        <button class="btn-notion" onclick="submitToNotion()">
          <span>제출하기</span>
        </button>
        <div class="notion-status" id="notionStatus"></div>
      </div>
    </div>

  </div><!-- /main-content -->
</div><!-- /appScreen -->

<script>
const vocabData = {
  1: [
    {kr:"개인의, 개인적인, 사적인", en:"personal"},
    {kr:"가능성이 있는, 잠재적인; 가능성, 잠재력", en:"potential"},
    {kr:"실제의, 사실의", en:"actual"},
    {kr:"어른스러운, 성숙한, 성인이 된, 다 자란", en:"mature"},
    {kr:"실제로, 정말로, 사실은, 실은", en:"actually"},
    {kr:"성격, 인격, 특성, 개성", en:"personality"},
    {kr:"사생활(을 누리는 상태), 프라이버시", en:"privacy"},
    {kr:"(사람들이) 모이다; 모으다, (정보 등을) 모으다, 수집하다", en:"gather"},
    {kr:"대단한, 굉장한; 특별히, 대단히", en:"super"},
    {kr:"군중, 사람들; 가득 메우다, 붐비다", en:"crowd"},
    {kr:"아마, 어쩌면", en:"perhaps"},
    {kr:"사적인, 개인의, 사립의, 개인 소유의", en:"private"},
    {kr:"(영) 친구, [합성어에서] 짝, (한 쌍의) 짝; 짝짓기를 하다", en:"mate"},
    {kr:"아마(도)", en:"probably"},
    {kr:"신체의, 육체의, 물질의, 물질[물리]적인", en:"physical"},
    {kr:"정신의, 마음의, (건강상의) 정신적인", en:"mental"},
    {kr:"(~에 대해) 책임이 있는, (~을) 책임지고 있는", en:"responsible"},
    {kr:"본인이 직접, 몸소, 실물로", en:"in person"},
    {kr:"사실, 사실은", en:"as a matter of fact"},
    {kr:"솔직히, 솔직히 말하면", en:"frankly"},
  ],
  2: [
    {kr:"간청하다, 애원하다, 구걸하다", en:"beg"},
    {kr:"(사람의) 모습, 형체, (중요한) 인물, 수치, 숫자", en:"figure"},
    {kr:"행동하다, 처신하다, 예의 바르게 행동하다", en:"behave"},
    {kr:"적절한, 제대로 된, (사회적·도덕적으로) 올바른", en:"proper"},
    {kr:"빨리, 급속히", en:"rapidly"},
    {kr:"외모, 겉모습, 등장, 출현", en:"appearance"},

// ─── STATE ───
let currentMode = 'ke'; // 'ke' = 한→영, 'ek' = 영→한
let selectedDays = new Set();
let quizItems = []; // {day, no, q, a}
let userInfo = {};
let graded = false;
let lastWrongItems = [];
let lastStats = {};

// ─── LOGIN ───
function doLogin() {
  const name = document.getElementById('inputName').value.trim();
  const school = document.getElementById('inputSchool').value.trim();

  if (!name) { alert('이름을 입력해주세요.'); return; }
  if (!school) { alert('학교명을 입력해주세요.'); return; }

  userInfo = {name, school, grade: ''};
  document.getElementById('headerUser').textContent = `${school} ${name}`;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  buildDayGrid();
}

// ─── DAY GRID ───
function buildDayGrid() {
  const grid = document.getElementById('dayGrid');
  grid.innerHTML = '';
  for (let d = 1; d <= 32; d++) {
    const btn = document.createElement('div');
    btn.className = 'day-btn';
    btn.textContent = 'DAY ' + d;
    btn.dataset.day = d;
    btn.onclick = () => toggleDay(d, btn);
    grid.appendChild(btn);
  }
}
function toggleDay(d, btn) {
  if (selectedDays.has(d)) { selectedDays.delete(d); btn.classList.remove('selected'); }
  else { selectedDays.add(d); btn.classList.add('selected'); }
  updateSelectedInfo();
}
function selectAll() {
  for (let d = 1; d <= 32; d++) selectedDays.add(d);
  document.querySelectorAll('.day-btn').forEach(b => b.classList.add('selected'));
  updateSelectedInfo();
}
function selectNone() {
  selectedDays.clear();
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('selected'));
  updateSelectedInfo();
}
function selectRange(from, to) {
  for (let d = from; d <= to; d++) selectedDays.add(d);
  document.querySelectorAll('.day-btn').forEach(b => {
    const d = parseInt(b.dataset.day);
    if (d >= from && d <= to) b.classList.add('selected');
  });
  updateSelectedInfo();
}
function updateSelectedInfo() {
  const days = selectedDays.size;
  const items = days * 20;
  document.getElementById('selectedInfo').textContent = `${days}개 DAY 선택 (${items}문항)`;
}

// ─── MODE ───
function switchMode(mode) {
  currentMode = mode;
  document.getElementById('tabKE').classList.toggle('active', mode === 'ke');
  document.getElementById('tabEK').classList.toggle('active', mode === 'ek');
  if (graded) backToSelector();
  updateColHeaders();
}
function updateColHeaders() {
  if (currentMode === 'ke') {
    document.getElementById('colMeaning').textContent = '뜻 (한국어)';
    const wc = document.getElementById('wrongColQ');
    if (wc) wc.textContent = '뜻 (한국어)';
  } else {
    document.getElementById('colMeaning').textContent = 'Word (영어)';
    const wc = document.getElementById('wrongColQ');
    if (wc) wc.textContent = 'Word (영어)';
  }
}

// ─── QUIZ ───
function startQuiz() {
  if (selectedDays.size === 0) { alert('시험 범위를 1개 이상 선택해주세요.'); return; }
  
  const sortedDays = Array.from(selectedDays).sort((a,b) => a-b);
  quizItems = [];
  sortedDays.forEach(d => {
    const items = vocabData[d];
    items.forEach((item, idx) => {
      quizItems.push({
        day: d,
        no: idx + 1,
        q: currentMode === 'ke' ? item.kr : item.en,
        a: currentMode === 'ke' ? item.en : item.kr,
      });
    });
  });

  graded = false;
  document.getElementById('selectorSection').style.display = 'none';
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';

  const modeLabel = currentMode === 'ke' ? '한→영' : '영→한';
  const dayLabel = sortedDays.length === 1 
    ? `DAY ${sortedDays[0]}`
    : `DAY ${sortedDays[0]}–${sortedDays[sortedDays.length-1]}`;
  document.getElementById('quizTitle').textContent = `${modeLabel} 단어 시험`;
  document.getElementById('quizCount').textContent = `${dayLabel} · 총 ${quizItems.length}문항`;

  updateColHeaders();
  renderQuizTable();
}

function renderQuizTable() {
  const tbody = document.getElementById('quizTableBody');
  tbody.innerHTML = '';
  let currentDay = null;
  quizItems.forEach((item, idx) => {
    if (item.day !== currentDay) {
      currentDay = item.day;
      const hdr = document.createElement('tr');
      hdr.className = 'day-group-header';
      hdr.innerHTML = `<td colspan="3">DAY ${item.day}</td>`;
      tbody.appendChild(hdr);
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.no}</td>
      <td style="word-break:keep-all;">${item.q}</td>
      <td><input type="text" class="answer-input" id="ans_${idx}" placeholder="정답 입력" autocomplete="off" spellcheck="false"></td>
    `;
    tbody.appendChild(tr);
  });
  // focus first
  setTimeout(() => {
    const first = document.getElementById('ans_0');
    if (first) first.focus();
  }, 100);
}

function resetInputs() {
  if (!confirm('입력한 답안을 모두 지울까요?')) return;
  quizItems.forEach((_, idx) => {
    const inp = document.getElementById('ans_' + idx);
    if (inp) { inp.value = ''; inp.className = 'answer-input'; inp.disabled = false; }
  });
  graded = false;
}

function backToSelector() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('selectorSection').style.display = 'block';
}
function backToQuiz() {
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
}

// ─── GRADING ───
function normalize(str) {
  return str.trim().toLowerCase().replace(/\s+/g, ' ');
}
function checkAnswer(userAns, correctAns) {
  const u = normalize(userAns);
  const corrects = correctAns.split('/').map(s => normalize(s));
  return corrects.some(c => c === u);
}

function gradeQuiz() {
  let correct = 0, wrong = 0;
  const wrongItems = [];
  quizItems.forEach((item, idx) => {
    const inp = document.getElementById('ans_' + idx);
    const userAns = inp ? inp.value : '';
    const isCorrect = checkAnswer(userAns, item.a);
    if (isCorrect) {
      correct++;
      if (inp) inp.classList.add('correct');
    } else {
      wrong++;
      wrongItems.push({ ...item, userAns });
      if (inp) inp.classList.add('wrong');
    }
    if (inp) inp.disabled = true;
  });

  graded = true;
  lastWrongItems = wrongItems;
  const total = quizItems.length;
  const score = Math.round((correct / total) * 100);
  lastStats = { total, correct, wrong, score };

  // show result
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('scoreBig').textContent = score;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;

  // wrong list
  const wrongSection = document.getElementById('wrongListSection');
  if (wrongItems.length === 0) {
    wrongSection.style.display = 'none';
  } else {
    wrongSection.style.display = 'block';
    document.getElementById('wrongListHeader').textContent = `오답 ${wrongItems.length}개`;
    const wc = document.getElementById('wrongColQ');
    if (wc) wc.textContent = currentMode === 'ke' ? '뜻 (한국어)' : 'Word (영어)';
    const tbody = document.getElementById('wrongTableBody');
    tbody.innerHTML = '';
    wrongItems.forEach((item, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${i+1}</td>
        <td style="word-break:keep-all;">${item.q}</td>
        <td class="my-ans">${item.userAns || '(미입력)'}</td>
        <td class="correct-ans">${item.a}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  document.getElementById('notionStatus').textContent = '';
  document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
}

// ─── NOTION SUBMIT ───
async function submitToNotion() {
  const btn = document.querySelector('.btn-notion');
  const status = document.getElementById('notionStatus');
  btn.disabled = true;
  status.textContent = '제출 중...';
  status.className = 'notion-status';

  const sortedDays = Array.from(selectedDays).sort((a,b)=>a-b);
  const dayRange = sortedDays.length === 1
    ? `DAY ${sortedDays[0]}`
    : `DAY ${sortedDays[0]}–${sortedDays[sortedDays.length-1]}`;
  const modeLabel = currentMode === 'ke' ? '한→영' : '영→한';
  const workbookName = `A★List VOCA 중학필수 (${modeLabel}) ${dayRange}`;

  const wrongLines = lastWrongItems.map((item, i) =>
    `${i+1}. [${item.q}] 내답: ${item.userAns || '(미입력)'} → 정답: ${item.a}`
  ).join('\n');
  const wrongAnswers = `[점수: ${lastStats.score}점 (${lastStats.correct}/${lastStats.total})]
${wrongLines || '오답 없음'}`;

  const payload = {
    studentName: userInfo.name,
    school: userInfo.school,
    grade: userInfo.grade,
    workbook: workbookName,
    category: 'VOCA',
    submitDate: new Date().toISOString().slice(0, 10),
    wrongAnswers: wrongAnswers,
    score: lastStats.score,
  };

  try {
    const res = await fetch('https://dodamenglish.netlify.app/.netlify/functions/notion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (res.ok) {
      status.textContent = '✅ 제출 완료! 선생님께 전달되었습니다.';
      status.className = 'notion-status ok';
    } else {
      throw new Error('서버 오류: ' + res.status);
    }
  } catch (e) {
    status.textContent = '❌ 제출 실패. 다시 시도해주세요. (' + e.message + ')';
    status.className = 'notion-status err';
  } finally {
    btn.disabled = false;
  }
}

// ─── INIT ───
buildDayGrid();
</script>
