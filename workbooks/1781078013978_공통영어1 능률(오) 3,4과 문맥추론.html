<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>능률(오선영) L3+L4 문맥추론 워크북</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a3a5c;
    --accent: #e8703a;
    --bg: #f8f9fb;
    --card: #ffffff;
    --border: #dde3ec;
    --correct: #2e7d32;
    --wrong: #c62828;
    --correct-bg: #e8f5e9;
    --wrong-bg: #ffebee;
    --text: #222;
    --sub: #555;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* LOGIN */
  #loginScreen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1a3a5c 0%, #2d5a8e 100%);
  }
  .login-box {
    background: white; border-radius: 16px; padding: 48px 40px; width: 360px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  }
  .login-box h1 { color: var(--primary); font-size: 1.3rem; margin-bottom: 6px; text-align:center; }
  .login-box .subtitle { color: var(--sub); font-size: 0.85rem; text-align:center; margin-bottom: 28px; }
  .login-box label { display:block; font-size:0.85rem; font-weight:700; color:var(--primary); margin-bottom:6px; }
  .login-box input {
    width:100%; padding:10px 14px; border:1.5px solid var(--border); border-radius:8px;
    font-size:1rem; font-family:inherit; margin-bottom:18px; outline:none; transition:border .2s;
  }
  .login-box input:focus { border-color: var(--primary); }
  .login-box .fixed-info {
    background:#f0f4f8; border-radius:8px; padding:10px 14px; margin-bottom:18px; font-size:0.9rem; color:var(--primary); font-weight:500;
  }
  .btn-login {
    width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:8px;
    font-size:1rem; font-weight:700; cursor:pointer; font-family:inherit; transition:background .2s;
  }
  .btn-login:hover { background:#14304d; }
  .login-err { color:var(--wrong); font-size:0.85rem; text-align:center; margin-top:10px; min-height:20px; }

  /* ROUND SELECT */
  #roundScreen {
    min-height:100vh; display:none; align-items:center; justify-content:center;
    background: linear-gradient(135deg, #1a3a5c 0%, #2d5a8e 100%);
  }
  .round-box {
    background:white; border-radius:16px; padding:48px 40px; width:420px;
    box-shadow:0 8px 32px rgba(0,0,0,0.18); text-align:center;
  }
  .round-box h2 { color:var(--primary); font-size:1.2rem; margin-bottom:8px; }
  .round-box .welcome { color:var(--sub); font-size:0.9rem; margin-bottom:32px; }
  .round-cards { display:flex; gap:16px; justify-content:center; }
  .round-card {
    flex:1; border:2px solid var(--border); border-radius:12px; padding:24px 16px; cursor:pointer;
    transition:all .2s; background:white;
  }
  .round-card:hover { border-color:var(--accent); background:#fff8f5; }
  .round-card .num { font-size:2rem; font-weight:700; color:var(--primary); }
  .round-card .label { font-size:0.85rem; color:var(--sub); margin-top:4px; }
  .round-card .count { font-size:0.8rem; color:var(--accent); margin-top:8px; font-weight:600; }

  /* WORKBOOK */
  #workbookScreen { display:none; }
  .wb-header {
    background:var(--primary); color:white; padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100;
  }
  .wb-header .title { font-size:1rem; font-weight:700; }
  .wb-header .info { font-size:0.8rem; opacity:0.8; }
  .progress-bar { height:4px; background:#e0e0e0; }
  .progress-fill { height:100%; background:var(--accent); transition:width .3s; }

  .rules-card {
    background:#fff8f0; border:1.5px solid #f0c090; border-radius:10px;
    padding:14px 20px; margin:20px 24px 0; font-size:0.85rem; color:#7a4010;
    line-height:1.7;
  }
  .rules-card strong { color:var(--accent); }

  .questions-wrap { padding:20px 24px 120px; max-width:860px; margin:0 auto; }

  .q-card {
    background:var(--card); border:1.5px solid var(--border); border-radius:12px;
    padding:22px 24px; margin-bottom:20px; transition:border .2s;
  }
  .q-card.answered-correct { border-color: var(--correct); background: var(--correct-bg); }
  .q-card.answered-wrong { border-color: var(--wrong); background: var(--wrong-bg); }

  .q-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .q-num {
    background:var(--primary); color:white; border-radius:50%; width:28px; height:28px;
    display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight:700; flex-shrink:0;
  }
  .q-lesson { font-size:0.75rem; color:var(--accent); font-weight:700; background:#fff0e8; padding:2px 8px; border-radius:20px; }
  .q-type { font-size:0.75rem; color:#666; background:#f0f0f0; padding:2px 8px; border-radius:20px; }

  .q-passage {
    background:#f5f7fa; border-left:3px solid var(--primary); border-radius:0 8px 8px 0;
    padding:12px 16px; margin:10px 0; font-size:0.85rem; line-height:1.75; color:#333;
    white-space: pre-line;
  }
  .q-text { font-size:0.95rem; font-weight:600; color:var(--primary); margin:8px 0 12px; line-height:1.6; }

  .options { display:flex; flex-direction:column; gap:8px; }
  .option-btn {
    padding:10px 16px; border:1.5px solid var(--border); border-radius:8px;
    background:white; cursor:pointer; font-size:0.9rem; font-family:inherit;
    text-align:left; transition:all .15s; line-height:1.5;
  }
  .option-btn:hover:not(:disabled) { border-color:var(--primary); background:#f0f4f8; }
  .option-btn.selected { border-color:var(--primary); background:#e8f0f8; font-weight:600; }
  .option-btn.correct { border-color:var(--correct); background:var(--correct-bg); color:var(--correct); font-weight:700; }
  .option-btn.wrong { border-color:var(--wrong); background:var(--wrong-bg); color:var(--wrong); }
  .option-btn:disabled { cursor:default; }

  .text-input-wrap { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .text-input {
    flex:1; min-width:200px; padding:10px 14px; border:1.5px solid var(--border); border-radius:8px;
    font-size:0.9rem; font-family:inherit; outline:none; transition:border .2s;
  }
  .text-input:focus { border-color:var(--primary); }
  .text-input.correct { border-color:var(--correct); background:var(--correct-bg); }
  .text-input.wrong { border-color:var(--wrong); background:var(--wrong-bg); }
  .btn-check {
    padding:10px 18px; background:var(--primary); color:white; border:none; border-radius:8px;
    font-size:0.85rem; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .btn-check:hover { background:#14304d; }
  .btn-check:disabled { background:#aaa; cursor:default; }

  /* 복수 서술형 */
  .multi-text-wrap { display:flex; flex-direction:column; gap:8px; }
  .multi-row { display:flex; gap:8px; align-items:center; }
  .multi-row label { font-size:0.82rem; color:var(--sub); white-space:nowrap; min-width:28px; }

  .feedback {
    margin-top:10px; padding:10px 14px; border-radius:8px; font-size:0.88rem; line-height:1.6;
    display:none;
  }
  .feedback.show { display:block; }
  .feedback.correct { background:var(--correct-bg); color:var(--correct); }
  .feedback.wrong { background:var(--wrong-bg); color:var(--wrong); }

  /* BOTTOM BAR */
  .bottom-bar {
    position:fixed; bottom:0; left:0; right:0; background:white;
    border-top:1.5px solid var(--border); padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; z-index:100;
  }
  .score-display { font-size:1rem; font-weight:700; color:var(--primary); }
  .score-display span { color:var(--accent); }
  .btn-submit {
    padding:12px 28px; background:var(--accent); color:white; border:none; border-radius:8px;
    font-size:0.95rem; font-weight:700; cursor:pointer; font-family:inherit; transition:background .2s;
  }
  .btn-submit:hover { background:#c85a28; }
  .btn-submit:disabled { background:#aaa; cursor:default; }

  /* RESULT */
  #resultScreen {
    display:none; min-height:100vh; background:var(--bg);
    align-items:center; justify-content:center; flex-direction:column; padding:40px 20px;
  }
  .result-box {
    background:white; border-radius:16px; padding:40px 36px; max-width:500px; width:100%;
    box-shadow:0 4px 20px rgba(0,0,0,0.1); text-align:center;
  }
  .result-box h2 { color:var(--primary); font-size:1.4rem; margin-bottom:8px; }
  .result-score { font-size:3.5rem; font-weight:700; color:var(--accent); margin:16px 0; }
  .result-detail { font-size:0.95rem; color:var(--sub); margin-bottom:24px; }
  .result-actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn-again {
    padding:12px 24px; background:var(--primary); color:white; border:none; border-radius:8px;
    font-size:0.95rem; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .btn-round-select {
    padding:12px 24px; background:white; color:var(--primary); border:2px solid var(--primary); border-radius:8px;
    font-size:0.95rem; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .submit-status { margin-top:16px; font-size:0.85rem; color:var(--sub); min-height:20px; }
  .submit-status.success { color:var(--correct); }
  .submit-status.error { color:var(--wrong); }

  @media(max-width:600px){
    .login-box, .round-box { width:95%; padding:32px 20px; }
    .questions-wrap { padding:16px 12px 120px; }
    .q-card { padding:16px 14px; }
    .round-cards { flex-direction:column; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>📚 능률(오선영) 문맥추론</h1>
    <p class="subtitle">Lesson 3 &amp; 4 · 고1 공통영어1</p>
    <div class="fixed-info">🏫 부산남고등학교 &nbsp;|&nbsp; 고1</div>
    <label>이름</label>
    <input type="text" id="inputName" placeholder="이름을 입력하세요" />
    <button class="btn-login" onclick="doLogin()">시작하기</button>
    <p class="login-err" id="loginErr"></p>
  </div>
</div>

<!-- ROUND SELECT -->
<div id="roundScreen" style="display:none; min-height:100vh; align-items:center; justify-content:center; background:linear-gradient(135deg,#1a3a5c 0%,#2d5a8e 100%);">
  <div class="round-box">
    <h2>안녕하세요, <span id="welcomeName"></span>님! 👋</h2>
    <p class="welcome">풀고 싶은 회차를 선택하세요.</p>
    <div class="round-cards">
      <div class="round-card" onclick="startRound(1)">
        <div class="num">1회차</div>
        <div class="label">문맥추론 A</div>
        <div class="count">25문제</div>
      </div>
      <div class="round-card" onclick="startRound(2)">
        <div class="num">2회차</div>
        <div class="label">문맥추론 B</div>
        <div class="count">25문제</div>
      </div>
    </div>
  </div>
</div>

<!-- WORKBOOK -->
<div id="workbookScreen" style="display:none;">
  <div class="wb-header">
    <div>
      <div class="title" id="wbTitle"></div>
      <div class="info" id="wbInfo"></div>
    </div>
    <div style="text-align:right;">
      <div class="info" id="wbStudent"></div>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="rules-card">
    <strong>📌 풀이 규칙</strong><br>
    ① 각 문제를 읽고 정답을 선택하거나 입력하세요.<br>
    ② 객관식은 선택 즉시 채점됩니다. 서술형은 <strong>확인</strong> 버튼을 누르세요.<br>
    ③ 모든 문제를 풀면 하단 <strong>제출</strong> 버튼으로 결과를 저장하세요.
  </div>

  <div class="questions-wrap" id="questionsWrap"></div>

  <div class="bottom-bar">
    <div class="score-display">점수: <span id="scoreDisplay">0</span> / <span id="totalDisplay">0</span></div>
    <button class="btn-submit" id="btnSubmit" onclick="submitWorkbook()" disabled>제출하기</button>
  </div>
</div>

<!-- RESULT -->
<div id="resultScreen" style="display:none; min-height:100vh; background:var(--bg); align-items:center; justify-content:center; padding:40px 20px;">
  <div class="result-box">
    <h2>🎉 채점 완료!</h2>
    <div class="result-score" id="resultScore"></div>
    <div class="result-detail" id="resultDetail"></div>
    <div class="result-actions">
      <button class="btn-again" onclick="retryRound()">다시 풀기</button>
      <button class="btn-round-select" onclick="goRoundSelect()">회차 선택</button>
    </div>
    <div class="submit-status" id="submitStatus"></div>
  </div>
</div>

<script>
// ===== 데이터 =====
const SCHOOL = '부산남고등학교';
const GRADE = '고1';
const WORKBOOK_NAMES = ['능률(오선영) L3+L4 문맥추론 1회차', '능률(오선영) L3+L4 문맥추론 2회차'];
const CATEGORY = '문맥추론';
const NOTION_URL = 'https://dodamenglish.netlify.app/.netlify/functions/notion';

// ===== 문제 데이터 =====
// 객관식: type:'mc', options:[], answer: 번호(1~5)
// 서술형(단답): type:'sa', answer:'정답문자열' or answer:['정답1','정답2'] (복수)
// 서술형(복수항목): type:'multi', items:[{label,answer}]

const ALL_QUESTIONS = {

// ============ ROUND 1 (25문제) ============
round1: [

// [L3] 문장삽입
{
  id:'r1_01', lesson:'Lesson 3', type_label:'문장삽입',
  passage:`The story behind these emails begins with Melbourne's Urban Forest Strategy plan, a response to Australia's millennium drought. This drought lasted from the late 1990s to 2010. By the time it ended, 40 percent of the city's 77,000 trees were in a state of declining health. (①) Furthermore, the overall number of trees was decreasing. (②) The loss of canopy cover is a major threat to urban environments because it raises temperatures. (③) Higher temperatures in cities can be dangerous for residents, as they increase the risk of heat exhaustion. (④) They also lead to a rise in the use of air-conditioning. (⑤) This speeds up climate change by increasing energy consumption and greenhouse gas emissions.`,
  question:`주어진 문장이 들어가기에 가장 알맞은 곳은?\n\n주어진 문장: As a result, the amount of shade provided by trees within the city, also known as canopy cover, decreased.`,
  qtype:'mc',
  options:['①','②','③','④','⑤'],
  answer:2
},

// [L3] 빈칸추론
{
  id:'r1_02', lesson:'Lesson 3', type_label:'빈칸추론',
  passage:`The story behind these emails begins with Melbourne's Urban Forest Strategy plan, a response to Australia's millennium drought. This drought lasted from the late 1990s to 2010. By the time it ended, 40 percent of the city's 77,000 trees were in a state of declining health. Furthermore, the overall number of trees was decreasing. (A)_________, the amount of shade provided by trees within the city, also known as canopy cover, decreased. The loss of canopy cover is a major threat to urban environments because it raises temperatures. Higher temperatures in cities can be dangerous for residents, as they increase the risk of heat exhaustion. They also lead to a rise in the use of air-conditioning. This speeds up climate change by increasing energy consumption and greenhouse gas emissions.`,
  question:`빈칸 (A)에 들어갈 말로 가장 적절한 것은?`,
  qtype:'mc',
  options:['① However','② Moreover','③ In contrast','④ Meanwhile','⑤ Consequently'],
  answer:5
},

// [L3] 빈칸추론
{
  id:'r1_03', lesson:'Lesson 3', type_label:'빈칸추론',
  passage:`A message that was sent all the way from Russia said, "When I read about this wonderful project, I was inspired to write to you, even though I live thousands of miles away. Although we are separated by a great distance, we share the same planet and the same environment. Perhaps one day we will meet. Until then, I hope you can stay healthy and strong." The global popularity of the tree mail phenomenon reminds us that we are all connected to nature, and we are all involved in building a more sustainable world. Without ____________ from people across the globe, we would have little hope of saving our planet for future generations.`,
  question:`빈칸에 들어갈 말로 가장 적절한 것은?`,
  qtype:'mc',
  options:['① despair','② alienation','③ donations','④ indifference','⑤ collaboration'],
  answer:5
},

// [L3] 빈칸추론
{
  id:'r1_04', lesson:'Lesson 3', type_label:'빈칸추론',
  passage:`Locally, the tree mail phenomenon has inspired many Melbourne residents to offer their own ideas about building an environmentally friendly urban environment. Some have even volunteered to measure trees and monitor animals for nature programs in the city. Meanwhile, the Urban Forest Strategy's tree planting project has remained on track, and canopy cover is predicted to increase from 23 percent in 2012 to 40 percent by the year 2040. Melbourne's urban forest strategy will help _______________. It will also allow residents to interact with nature and engage in outdoor activities every day. As a result, residents will be happier and healthier as they move toward a greener future.`,
  question:`빈칸에 들어갈 말로 가장 적절한 것은?`,
  qtype:'mc',
  options:['① cause deforestation','② raise energy consumption','③ increase traffic congestion','④ reduce urban temperatures','⑤ improve climate predictability'],
  answer:4
},

// [L3] 어휘
{
  id:'r1_05', lesson:'Lesson 3', type_label:'어휘',
  passage:`The global popularity of the tree mail ⓐ_______ reminds us that we are all connected to nature, and we are all involved in building a more sustainable world. Locally, the tree mail ⓐ_______ has inspired many Melbourne residents to offer their own ideas about building an environmentally friendly urban environment.`,
  question:`밑줄 친 ⓐ에 공통으로 들어갈 알맞은 것은?`,
  qtype:'mc',
  options:['① project','② program','③ paradigm','④ phenomenon','⑤ framework'],
  answer:4
},

// [L3] 흐름파악 (문맥상 어색한 문장)
{
  id:'r1_06', lesson:'Lesson 3', type_label:'흐름파악',
  passage:`Whenever I pass by, I can't help but smile at the sight of your beautiful leaves. When I stand in front of you and take a deep breath, I feel truly thankful for the oxygen you produce. ① Without you and your fellow trees, humans wouldn't be able to survive. ② I've also noticed that a family of birds has built a nest in your branches. ③ It's wonderful that you've provided them with a place to live. ④ The rain yesterday made the soil wet and soft, which is good for the growth of plants. ⑤ I wish more people would recognize how crucial you and all trees are to the well-being of our planet. Have a nice day!`,
  question:`문맥상 가장 어색한 문장은?`,
  qtype:'mc',
  options:['①','②','③','④','⑤'],
  answer:4
},

// [L3] 순서배열
{
  id:'r1_07', lesson:'Lesson 3', type_label:'순서배열',
  passage:`After the map was posted online, something unexpected happened. The trees started receiving thousands of emails, but many of them were not reports about damage or poor health.

(A) The tree mail phenomenon quickly spread, and people all over the world started sending messages. A message that was sent all the way from Russia said, "When I read about this wonderful project, I was inspired to write to you, even though I live thousands of miles away. Although we are separated by a great distance, we share the same planet and the same environment."

(B) The global popularity of the tree mail phenomenon reminds us that we are all connected to nature, and we are all involved in building a more sustainable world. Without collective action from people across the globe, we would have little hope of saving our planet for future generations.

(C) Instead, they were love letters, poems, greetings, and messages expressing appreciation for the trees. One person wrote, "I love the way the light shines on your leaves and how your branches hang so low. It is almost like you are trying to hug me."`,
  question:`주어진 글 이후 순서가 바르게 연결된 것은?`,
  qtype:'mc',
  options:['① (A)-(C)-(B)','② (A)-(B)-(C)','③ (B)-(C)-(A)','④ (C)-(B)-(A)','⑤ (C)-(A)-(B)'],
  answer:5
},

// [L3] 순서배열 (문장 배열)
{
  id:'r1_08', lesson:'Lesson 3', type_label:'순서배열',
  passage:`(A) This shows the location of every single tree in the city's parks and along its roads. It uses colors and symbols to indicate each tree's age and genus.
(B) At first, its function had a specific purpose. It was designed to allow people to easily inform council workers about trees that were damaged or in poor health.
(C) In 2012, the city government announced its Urban Forest Strategy plan. It set the ambitious goal of planting more than 3,000 trees every year for the next twenty years.
(D) Something had to be done to deal with the loss of Melbourne's trees.
(E) The plan also involved the creation of an online map called the Urban Forest Visual.
(F) Also, users can click on a tree to find out its species and even send it an email.`,
  question:`(A)~(F)를 순서대로 올바르게 배열한 것은?`,
  qtype:'mc',
  options:['① (D)→(C)→(E)→(A)→(F)→(B)','② (C)→(D)→(E)→(A)→(B)→(F)','③ (D)→(E)→(C)→(A)→(B)→(F)','④ (C)→(D)→(A)→(E)→(F)→(B)','⑤ (D)→(A)→(C)→(E)→(B)→(F)'],
  answer:1
},

// [L3] 추론

// ===== 상태 =====
let currentStudent = '';
let currentRound = 0;
let questions = [];
let answered = {}; // {id: {correct:bool, studentAns:string}}
let score = 0;

// ===== 유연한 채점 =====
function normalize(str) {
  return str.trim().toLowerCase().replace(/[.,!?;:]+$/, '').replace(/\s+/g, ' ');
}

function checkAnswer(qdata, studentInput) {
  // 단답형
  if (qdata.qtype === 'sa') {
    const answers = Array.isArray(qdata.answer) ? qdata.answer : [qdata.answer];
    const norm = normalize(studentInput);
    return answers.some(a => normalize(a) === norm);
  }
  // 객관식
  if (qdata.qtype === 'mc') {
    return parseInt(studentInput) === qdata.answer;
  }
  return false;
}

function checkMultiAnswer(item, studentInput) {
  const answers = Array.isArray(item.answer) ? item.answer : [item.answer];
  const norm = normalize(studentInput);
  return answers.some(a => normalize(a) === norm);
}

// ===== 로그인 =====
function doLogin() {
  const name = document.getElementById('inputName').value.trim();
  if (!name) {
    document.getElementById('loginErr').textContent = '이름을 입력하세요.';
    return;
  }
  currentStudent = name;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('welcomeName').textContent = name;
  document.getElementById('roundScreen').style.display = 'flex';
}
document.getElementById('inputName').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

// ===== 회차 선택 =====
function startRound(round) {
  currentRound = round;
  questions = ALL_QUESTIONS['round' + round];
  answered = {};
  score = 0;

  document.getElementById('roundScreen').style.display = 'none';
  document.getElementById('workbookScreen').style.display = 'block';
  document.getElementById('wbTitle').textContent = WORKBOOK_NAMES[round-1];
  document.getElementById('wbInfo').textContent = `${SCHOOL} · ${GRADE} · ${questions.length}문제`;
  document.getElementById('wbStudent').textContent = currentStudent + ' 님';
  document.getElementById('totalDisplay').textContent = questions.length;
  document.getElementById('scoreDisplay').textContent = '0';
  document.getElementById('btnSubmit').disabled = true;

  renderQuestions();
  updateProgress();
}

function goRoundSelect() {
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('workbookScreen').style.display = 'none';
  document.getElementById('roundScreen').style.display = 'flex';
}

function retryRound() {
  document.getElementById('resultScreen').style.display = 'none';
  startRound(currentRound);
  window.scrollTo(0,0);
}

// ===== 렌더링 =====
function renderQuestions() {
  const wrap = document.getElementById('questionsWrap');
  wrap.innerHTML = '';
  questions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card_' + q.id;

    let passageHtml = q.passage ? `<div class="q-passage">${q.passage.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>` : '';
    let inputHtml = '';

    if (q.qtype === 'mc') {
      inputHtml = `<div class="options">` +
        q.options.map((opt, i) => `<button class="option-btn" id="opt_${q.id}_${i+1}" onclick="selectOption('${q.id}',${i+1})">${opt}</button>`).join('') +
        `</div>`;
    } else if (q.qtype === 'sa') {
      inputHtml = `<div class="text-input-wrap">
        <input type="text" class="text-input" id="sa_${q.id}" placeholder="정답을 입력하세요" onkeydown="if(event.key==='Enter')checkSA('${q.id}')"/>
        <button class="btn-check" id="btn_${q.id}" onclick="checkSA('${q.id}')">확인</button>
      </div>`;
    } else if (q.qtype === 'multi') {
      inputHtml = `<div class="multi-text-wrap">` +
        q.items.map((item, i) => `<div class="multi-row">
          <label>${item.label}</label>
          <input type="text" class="text-input" id="multi_${q.id}_${i}" placeholder="입력" onkeydown="if(event.key==='Enter')checkMulti('${q.id}')"/>
        </div>`).join('') +
        `<div style="margin-top:6px"><button class="btn-check" id="btn_${q.id}" onclick="checkMulti('${q.id}')">확인</button></div>
      </div>`;
    }

    card.innerHTML = `
      <div class="q-header">
        <div class="q-num">${idx+1}</div>
        <div class="q-lesson">${q.lesson}</div>
        <div class="q-type">${q.type_label}</div>
      </div>
      ${passageHtml}
      <div class="q-text">${q.question.replace(/\n/g,'<br>')}</div>
      ${inputHtml}
      <div class="feedback" id="fb_${q.id}"></div>
    `;
    wrap.appendChild(card);
  });
}

// ===== 객관식 =====
function selectOption(qid, selected) {
  if (answered[qid]) return;
  const q = questions.find(x => x.id === qid);
  const isCorrect = (selected === q.answer);

  answered[qid] = { correct: isCorrect, studentAns: q.options[selected-1] };
  if (isCorrect) score++;

  // 버튼 스타일
  q.options.forEach((_, i) => {
    const btn = document.getElementById(`opt_${qid}_${i+1}`);
    btn.disabled = true;
    if (i+1 === q.answer) btn.classList.add('correct');
    else if (i+1 === selected && !isCorrect) btn.classList.add('wrong');
  });

  // 카드
  const card = document.getElementById('card_' + qid);
  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  // 피드백
  const fb = document.getElementById('fb_' + qid);
  fb.className = `feedback show ${isCorrect ? 'correct' : 'wrong'}`;
  fb.textContent = isCorrect ? '✅ 정답입니다!' : `❌ 오답입니다. 정답: ${q.options[q.answer-1]}`;

  updateScore();
  checkAllAnswered();
}

// ===== 단답형 =====
function checkSA(qid) {
  if (answered[qid]) return;
  const q = questions.find(x => x.id === qid);
  const input = document.getElementById('sa_' + qid);
  const val = input.value;
  if (!val.trim()) return;

  const isCorrect = checkAnswer(q, val);
  answered[qid] = { correct: isCorrect, studentAns: val };
  if (isCorrect) score++;

  input.disabled = true;
  input.classList.add(isCorrect ? 'correct' : 'wrong');
  document.getElementById('btn_' + qid).disabled = true;

  const card = document.getElementById('card_' + qid);
  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  const fb = document.getElementById('fb_' + qid);
  fb.className = `feedback show ${isCorrect ? 'correct' : 'wrong'}`;
  const correctAns = Array.isArray(q.answer) ? q.answer[0] : q.answer;
  fb.textContent = isCorrect ? '✅ 정답입니다!' : `❌ 오답입니다. 정답: ${correctAns}`;

  updateScore();
  checkAllAnswered();
}

// ===== 복수 서술형 =====
function checkMulti(qid) {
  if (answered[qid]) return;
  const q = questions.find(x => x.id === qid);

  let allFilled = true;
  q.items.forEach((_, i) => {
    const val = document.getElementById(`multi_${qid}_${i}`).value.trim();
    if (!val) allFilled = false;
  });
  if (!allFilled) return;

  let correctCount = 0;
  let studentAnswers = [];
  q.items.forEach((item, i) => {
    const val = document.getElementById(`multi_${qid}_${i}`).value;
    const ok = checkMultiAnswer(item, val);
    if (ok) correctCount++;
    studentAnswers.push(`${item.label}: ${val}`);
    const inp = document.getElementById(`multi_${qid}_${i}`);
    inp.disabled = true;
    inp.classList.add(ok ? 'correct' : 'wrong');
  });

  const isCorrect = (correctCount === q.items.length);
  answered[qid] = { correct: isCorrect, studentAns: studentAnswers.join(' / ') };
  if (isCorrect) score++;

  document.getElementById('btn_' + qid).disabled = true;
  const card = document.getElementById('card_' + qid);
  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  const fb = document.getElementById('fb_' + qid);
  fb.className = `feedback show ${isCorrect ? 'correct' : 'wrong'}`;
  const correctList = q.items.map(item => `${item.label}: ${Array.isArray(item.answer)?item.answer[0]:item.answer}`).join(' / ');
  fb.textContent = isCorrect ? '✅ 모두 정답입니다!' : `❌ 일부 오답. 정답: ${correctList}`;

  updateScore();
  checkAllAnswered();
}

// ===== 점수/진행률 =====
function updateScore() {
  document.getElementById('scoreDisplay').textContent = score;
}

function updateProgress() {
  const pct = (Object.keys(answered).length / questions.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

function checkAllAnswered() {
  updateProgress();
  if (Object.keys(answered).length === questions.length) {
    document.getElementById('btnSubmit').disabled = false;
  }
}

// ===== 제출 =====
async function submitWorkbook() {
  document.getElementById('btnSubmit').disabled = true;

  const wrongList = questions
    .filter(q => answered[q.id] && !answered[q.id].correct)
    .map(q => `[${q.lesson} ${q.type_label}] Q${questions.indexOf(q)+1}: 학생답안="${answered[q.id].studentAns}"`)
    .join('\n');

  const totalQ = questions.length;
  const pct = Math.round((score / totalQ) * 100);
  const wrongAnswers = `[점수: ${pct}점 (${score}/${totalQ})]\n` + (wrongList || '오답 없음');

  const submitDate = new Date().toISOString().slice(0,10);

  const payload = {
    studentName: currentStudent,
    school: SCHOOL,
    grade: GRADE,
    workbook: WORKBOOK_NAMES[currentRound-1],
    category: CATEGORY,
    submitDate,
    wrongAnswers,
    score: pct
  };

  // 결과 화면 표시
  document.getElementById('workbookScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'flex';
  document.getElementById('resultScore').textContent = `${pct}점`;
  document.getElementById('resultDetail').textContent = `${score} / ${totalQ} 문제 정답 · ${currentRound}회차`;
  document.getElementById('submitStatus').textContent = '노션에 저장 중...';

  try {
    const res = await fetch(NOTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      document.getElementById('submitStatus').className = 'submit-status success';
      document.getElementById('submitStatus').textContent = '✅ 노션에 저장되었습니다!';
    } else {
      throw new Error('서버 오류');
    }
  } catch(e) {
    document.getElementById('submitStatus').className = 'submit-status error';
    document.getElementById('submitStatus').textContent = '⚠️ 저장 실패. 선생님께 알려주세요.';
  }
}
</script>
