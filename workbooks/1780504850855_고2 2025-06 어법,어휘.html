<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2025 6월 모의고사 어법·어휘 예상문제</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a3a5c;
    --accent: #e8703a;
    --bg: #f5f3ef;
    --card: #ffffff;
    --text: #1e1e1e;
    --muted: #6b7280;
    --border: #e2ddd8;
    --correct: #16a34a;
    --wrong: #dc2626;
    --highlight: #fef3c7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ──── SCREENS ──── */
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ──── LOGIN SCREEN ──── */
  #loginScreen {
    background: linear-gradient(145deg, #1a3a5c 0%, #0f2340 60%, #1a4a6c 100%);
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .login-box {
    background: white;
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .logo-area {
    text-align: center;
    margin-bottom: 32px;
  }

  .logo-badge {
    display: inline-block;
    background: var(--accent);
    color: white;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  .logo-area h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    color: var(--primary);
    line-height: 1.4;
  }

  .logo-area p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }

  .form-group { margin-bottom: 16px; }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .form-group input, .form-group select {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    background: #fafafa;
  }

  .form-group input:focus, .form-group select:focus {
    border-color: var(--primary);
    background: white;
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }

  .btn-primary:hover { background: #0f2340; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  /* ──── RANGE SCREEN ──── */
  #rangeScreen {
    background: var(--bg);
    padding: 0;
  }

  .range-header {
    background: var(--primary);
    color: white;
    padding: 24px 20px 20px;
    text-align: center;
  }

  .range-header h2 {
    font-family: 'Noto Serif KR', serif;
    font-size: 18px;
    margin-bottom: 4px;
  }

  .range-header p { font-size: 13px; opacity: 0.8; }

  .range-tabs {
    display: flex;
    background: white;
    border-bottom: 2px solid var(--border);
  }

  .range-tab {
    flex: 1;
    padding: 14px;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: var(--muted);
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
  }

  .range-tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }

  .range-content { padding: 20px; }

  .range-all-card {
    background: white;
    border-radius: 14px;
    padding: 24px;
    text-align: center;
    border: 2px solid var(--border);
    margin-bottom: 16px;
  }

  .range-all-card h3 {
    font-size: 16px;
    color: var(--primary);
    margin-bottom: 8px;
  }

  .range-all-card p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

  .passage-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }

  .passage-cb {
    display: none;
  }

  .passage-label {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    background: white;
  }

  .passage-cb:checked + .passage-label {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  .select-count {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 16px;
  }

  .select-count span { color: var(--accent); font-weight: 700; }

  /* ──── QUIZ SCREEN ──── */
  #quizScreen { background: var(--bg); }

  .quiz-topbar {
    background: var(--primary);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-info {
    flex: 1;
  }

  .progress-info .pi-label {
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    margin-bottom: 4px;
  }

  .progress-bar-wrap {
    height: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .quiz-counter {
    font-size: 13px;
    color: rgba(255,255,255,0.9);
    font-weight: 700;
    white-space: nowrap;
  }

  .passage-area {
    background: white;
    margin: 12px;
    border-radius: 14px;
    padding: 18px;
    border: 1px solid var(--border);
    font-size: 14px;
    line-height: 1.85;
    color: #2d2d2d;
    max-height: 200px;
    overflow-y: auto;
  }

  .passage-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .passage-text { font-size: 13.5px; }

  .passage-text .bracket {
    font-weight: 700;
    color: var(--primary);
  }

  .question-area {
    padding: 0 12px 12px;
  }

  .question-card {
    background: white;
    border-radius: 14px;
    padding: 16px;
    border: 1px solid var(--border);
    margin-bottom: 10px;
  }

  .question-type-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 6px;
    margin-bottom: 10px;
  }

  .type-a { background: #dbeafe; color: #1d4ed8; }
  .type-b { background: #fce7f3; color: #9d174d; }

  .question-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.6;
    margin-bottom: 14px;
  }

  .options-list { list-style: none; }

  .option-item {
    margin-bottom: 8px;
  }

  .option-btn {
    width: 100%;
    text-align: left;
    padding: 11px 14px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: #fafafa;
    font-size: 13.5px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
    line-height: 1.5;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background: #f0f4ff;
  }

  .option-num {
    font-weight: 700;
    color: var(--muted);
    min-width: 18px;
  }

  .option-btn.selected { border-color: var(--primary); background: #e8eef8; }
  .option-btn.correct { border-color: var(--correct); background: #dcfce7; }
  .option-btn.wrong { border-color: var(--wrong); background: #fee2e2; }
  .option-btn.show-correct { border-color: var(--correct); background: #dcfce7; }
  .option-btn:disabled { cursor: default; }

  .result-bar {
    display: none;
    padding: 12px 16px;
    margin: 0 12px 10px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    align-items: flex-start;
    gap: 8px;
  }

  .result-bar.correct-bar { background: #dcfce7; color: var(--correct); display: flex; }
  .result-bar.wrong-bar { background: #fee2e2; color: var(--wrong); display: flex; }

  .result-bar .rb-icon { font-size: 18px; flex-shrink: 0; }
  .result-bar .rb-text { font-size: 13px; line-height: 1.5; }

  .nav-btns {
    padding: 8px 12px 20px;
    display: flex;
    gap: 8px;
  }

  .btn-submit {
    flex: 1;
    padding: 14px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-submit:hover { background: #d4612e; }
  .btn-submit:disabled { background: #d1d5db; cursor: default; }

  .btn-next {
    flex: 1;
    padding: 14px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    display: none;
  }

  .btn-next:hover { background: #0f2340; }

  /* ──── RESULT SCREEN ──── */
  #resultScreen {
    background: var(--bg);
    padding: 0;
  }

  .result-header {
    background: linear-gradient(135deg, var(--primary), #0f2340);
    color: white;
    padding: 32px 20px;
    text-align: center;
  }

  .result-header h2 {
    font-family: 'Noto Serif KR', serif;
    font-size: 20px;
    margin-bottom: 20px;
  }

  .score-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 4px solid var(--accent);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }

  .score-num {
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .score-total { font-size: 14px; opacity: 0.8; margin-top: 4px; }

  .score-label { font-size: 14px; opacity: 0.9; }

  .result-stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 16px;
  }

  .stat-item { text-align: center; }
  .stat-item .sv { font-size: 22px; font-weight: 700; }
  .stat-item .sl { font-size: 12px; opacity: 0.75; margin-top: 2px; }

  .result-body { padding: 16px; }

  .wrong-list-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .wrong-card {
    background: white;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 10px;
    border-left: 4px solid var(--wrong);
  }

  .wrong-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .wrong-passage-badge {
    font-size: 11px;
    background: var(--highlight);
    color: #92400e;
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 700;
  }

  .wrong-type-badge {
    font-size: 10px;
    color: var(--muted);
  }

  .wrong-q-text {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.5;
  }

  .wrong-answer-row {
    display: flex;
    gap: 8px;
    font-size: 12px;
  }

  .wa-my { color: var(--wrong); font-weight: 600; }
  .wa-correct { color: var(--correct); font-weight: 600; }

  .notion-status {
    text-align: center;
    padding: 12px;
    font-size: 13px;
    color: var(--muted);
    margin: 8px 16px;
    border-radius: 10px;
    background: white;
  }

  .notion-status.ok { color: var(--correct); }
  .notion-status.err { color: var(--wrong); }

  .result-actions {
    padding: 0 16px 32px;
    display: flex;
    gap: 10px;
  }

  .btn-retry {
    flex: 1;
    padding: 14px;
    border: 2px solid var(--primary);
    color: var(--primary);
    background: white;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-retry:hover { background: #f0f4ff; }

  .btn-restart {
    flex: 1;
    padding: 14px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-restart:hover { background: #0f2340; }

  /* ──── MISC ──── */
  .all-correct-msg {
    text-align: center;
    padding: 32px 20px;
    color: var(--correct);
    font-size: 18px;
    font-weight: 700;
  }

  @media (max-width: 380px) {
    .passage-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     SCREEN 1: 로그인
══════════════════════════════════════ -->
<div id="loginScreen" class="screen active">
  <div class="login-box">
    <div class="logo-area">
      <div class="logo-badge">도담한영어교실</div>
      <h1>2025 6월 모의고사<br>어법·어휘 예상문제</h1>
      <p>고2 · 유형 A + B 전 범위</p>
    </div>

    <div class="form-group">
      <label>이름</label>
      <input type="text" id="inputName" placeholder="홍길동" autocomplete="off">
    </div>
    <div class="form-group">
      <label>학교</label>
      <input type="text" id="inputSchool" placeholder="○○고등학교" autocomplete="off">
    </div>
    <div class="form-group">
      <label>학년</label>
      <select id="inputGrade">
        <option value="">선택</option>
        <option value="고1">고1</option>
        <option value="고2" selected>고2</option>
        <option value="고3">고3</option>
      </select>
    </div>
    <button class="btn-primary" onclick="doLogin()">시작하기 →</button>
  </div>
</div>

<!-- ══════════════════════════════════════
     SCREEN 2: 범위 선택
══════════════════════════════════════ -->
<div id="rangeScreen" class="screen">
  <div class="range-header">
    <h2>시험 범위 설정</h2>
    <p id="rangeUserLabel">환영합니다!</p>
  </div>

  <div class="range-tabs">
    <div class="range-tab active" id="tab-all" onclick="switchTab('all')">전체 범위</div>
    <div class="range-tab" id="tab-select" onclick="switchTab('select')">지문 직접 선택</div>
  </div>

  <div class="range-content">
    <!-- 전체 범위 -->
    <div id="tabAll">
      <div class="range-all-card">
        <h3>📚 전체 범위 (18~45번)</h3>
        <p>18번~45번 지문 전체를 학습합니다.<br>유형 A + 유형 B 문제가 모두 포함됩니다.</p>
        <button class="btn-primary" onclick="startQuiz('all')">전체로 시작하기 →</button>
      </div>
    </div>

    <!-- 지문 직접 선택 -->
    <div id="tabSelect" style="display:none">
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">시험 범위에 해당하는 지문 번호를 선택하세요.</p>
      <div class="passage-grid" id="passageGrid"></div>
      <div class="select-count">선택된 지문: <span id="selectCount">0</span>개</div>
      <button class="btn-primary" id="btnStartSelect" onclick="startQuiz('select')" disabled>선택한 지문으로 시작 →</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     SCREEN 3: 문제 풀기
══════════════════════════════════════ -->
<div id="quizScreen" class="screen">
  <div class="quiz-topbar">
    <div class="progress-info">
      <div class="pi-label" id="quizPassageLabel">지문 18번</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>
    <div class="quiz-counter" id="quizCounter">1 / 1</div>
  </div>

  <div class="passage-area">
    <div class="passage-title" id="passageTitleDisplay"></div>
    <div class="passage-text" id="passageTextDisplay"></div>
  </div>

  <div class="question-area" id="questionArea"></div>

  <div class="result-bar" id="resultBar">
    <div class="rb-icon" id="rbIcon"></div>
    <div class="rb-text" id="rbText"></div>
  </div>

  <div class="nav-btns">
    <button class="btn-submit" id="btnSubmit" onclick="submitAnswer()">채점하기</button>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">다음 →</button>
  </div>
</div>

<!-- ══════════════════════════════════════
     SCREEN 4: 결과
══════════════════════════════════════ -->
<div id="resultScreen" class="screen">
  <div class="result-header">
    <h2>🎯 학습 완료!</h2>
    <div class="score-circle">
      <div class="score-num" id="scoreNum">0</div>
      <div class="score-total" id="scoreTotal">/ 0</div>
    </div>
    <div class="score-label" id="scorePercent"></div>
    <div class="result-stats">
      <div class="stat-item">
        <div class="sv" id="statCorrect">0</div>
        <div class="sl">정답</div>
      </div>
      <div class="stat-item">
        <div class="sv" id="statWrong">0</div>
        <div class="sl">오답</div>
      </div>
      <div class="stat-item">
        <div class="sv" id="statTotal">0</div>
        <div class="sl">총 문제</div>
      </div>
    </div>
  </div>

  <div class="result-body">
    <div class="wrong-list-title">❌ 오답 목록</div>
    <div id="wrongList"></div>
  </div>

  <div class="notion-status" id="notionStatus"></div>

  <div class="result-actions">
    <button class="btn-retry" onclick="retryWrong()">오답만 다시</button>
    <button class="btn-restart" onclick="restartAll()">처음부터</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
//  DATA: 지문 & 문제
// ═══════════════════════════════════════════════════

const PASSAGES = [
  {
    num: 18,
    title: "6월 18번 | Dear Ms. Lopez",
    text: `Dear Ms. Lopez,\n  We want (A)(to express / expressing) our ⓐgratitude for your dedication as a Spanish instructor. With ⓑdeficient teaching skills, you have significantly (B)(improved / been improved) our students' ⓒprogress and confidence in Spanish. As the year is about to end, it is time for us (C)(to reflect / reflecting) on your contributions and consider the ⓓrenewal of your contract. Given your positive impact, we would like to offer an extension of your contract for the next academic year. We believe your ⓔcontinued involvement will further enhance our students' learning experience and academic achievement. We look forward to your response.\nSincerely,\nJames Martin\nPrincipal`,
    questions: [
      {
        type: "A", qnum: 1,
        text: "윗글의 밑줄 친 ⓐ~ⓔ 중, 흐름상 어색한 것은?",
        options: ["ⓐ gratitude", "ⓑ deficient", "ⓒ progress", "ⓓ renewal", "ⓔ continued"],
        answer: 1,
        explanation: "ⓑ deficient(부족한) → exceptional(뛰어난). 문맥상 뛰어난 교수 능력으로 학생들의 발전에 기여했다는 내용이어야 함."
      },
      {
        type: "A", qnum: 2,
        text: "윗글의 괄호 (A), (B), (C)에서 어법상 알맞은 말로 바르게 연결된 것은?",
        options: [
          "(A) to express / (B) been improved / (C) to reflect",
          "(A) expressing / (B) improved / (C) to reflect",
          "(A) to express / (B) improved / (C) reflecting",
          "(A) expressing / (B) been improved / (C) reflecting",
          "(A) to express / (B) improved / (C) to reflect"

// ═══════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════
let student = {};
let selectedPassages = [];
let questionQueue = [];
let currentIdx = 0;
let userAnswers = [];
let wrongItems = [];

// ═══════════════════════════════════════════════════
//  PASSAGE GRID 생성
// ═══════════════════════════════════════════════════
function buildPassageGrid() {
  const grid = document.getElementById('passageGrid');
  PASSAGES.forEach(p => {
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'passage-cb';
    cb.id = `cb${p.num}`;
    cb.value = p.num;
    cb.onchange = updateSelectCount;

    const label = document.createElement('label');
    label.htmlFor = `cb${p.num}`;
    label.className = 'passage-label';
    label.textContent = p.num === 41 ? '41~42' : p.num === 43 ? '43~45' : `${p.num}번`;

    grid.appendChild(cb);
    grid.appendChild(label);
  });
}

function updateSelectCount() {
  const checked = document.querySelectorAll('.passage-cb:checked').length;
  document.getElementById('selectCount').textContent = checked;
  document.getElementById('btnStartSelect').disabled = checked === 0;
}

// ═══════════════════════════════════════════════════
//  LOGIN
// ═══════════════════════════════════════════════════
function doLogin() {
  const name = document.getElementById('inputName').value.trim();
  const school = document.getElementById('inputSchool').value.trim();
  const grade = document.getElementById('inputGrade').value;
  if (!name || !school || !grade) {
    alert('이름, 학교, 학년을 모두 입력해주세요.');
    return;
  }

  student = { name, school, grade };
  document.getElementById('rangeUserLabel').textContent = `${name} (${school} ${grade})`;
  showScreen('rangeScreen');
  buildPassageGrid();
}

// ═══════════════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════════════
function switchTab(tab) {
  document.getElementById('tab-all').classList.toggle('active', tab === 'all');
  document.getElementById('tab-select').classList.toggle('active', tab === 'select');
  document.getElementById('tabAll').style.display = tab === 'all' ? 'block' : 'none';
  document.getElementById('tabSelect').style.display = tab === 'select' ? 'block' : 'none';
}

// ═══════════════════════════════════════════════════
//  START QUIZ
// ═══════════════════════════════════════════════════
function startQuiz(mode) {
  if (mode === 'all') {
    selectedPassages = PASSAGES;
  } else {
    const checked = Array.from(document.querySelectorAll('.passage-cb:checked')).map(el => parseInt(el.value));
    selectedPassages = PASSAGES.filter(p => checked.includes(p.num));
  }

  if (selectedPassages.length === 0) {
    alert('지문을 선택해주세요.');
    return;
  }

  // 문제 큐 생성
  questionQueue = [];
  selectedPassages.forEach(p => {
    p.questions.forEach(q => {
      questionQueue.push({ passage: p, question: q });
    });
  });

  userAnswers = new Array(questionQueue.length).fill(-1);
  wrongItems = [];
  currentIdx = 0;

  showScreen('quizScreen');
  renderQuestion();
}

// ═══════════════════════════════════════════════════
//  RENDER QUESTION
// ═══════════════════════════════════════════════════
function renderQuestion() {
  const { passage, question } = questionQueue[currentIdx];
  const total = questionQueue.length;
  const pct = (currentIdx / total) * 100;

  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('quizCounter').textContent = `${currentIdx + 1} / ${total}`;
  document.getElementById('quizPassageLabel').textContent = `지문 ${passage.num}번`;
  document.getElementById('passageTitleDisplay').textContent = passage.title;
  document.getElementById('passageTextDisplay').textContent = passage.text;

  // 문제 카드
  const area = document.getElementById('questionArea');
  const typeBadge = question.type === 'A'
    ? '<span class="question-type-badge type-a">유형 A</span>'
    : '<span class="question-type-badge type-b">유형 B</span>';

  const numChars = ['①','②','③','④','⑤'];
  let optionsHTML = question.options.map((opt, i) =>
    `<li class="option-item">
      <button class="option-btn" id="opt${i}" onclick="selectOption(${i})">
        <span class="option-num">${numChars[i]}</span>
        <span>${opt}</span>
      </button>
    </li>`
  ).join('');

  area.innerHTML = `
    <div class="question-card">
      ${typeBadge}
      <div class="question-text">${question.qnum}. ${question.text}</div>
      <ul class="options-list">${optionsHTML}</ul>
    </div>
  `;

  // 리셋 버튼
  const resultBar = document.getElementById('resultBar');
  resultBar.className = 'result-bar';
  resultBar.style.display = 'none';
  document.getElementById('btnSubmit').style.display = 'block';
  document.getElementById('btnSubmit').disabled = true;
  document.getElementById('btnNext').style.display = 'none';

  // 이전 선택 복원
  if (userAnswers[currentIdx] !== -1) {
    selectOption(userAnswers[currentIdx], true);
  }
}

// ═══════════════════════════════════════════════════
//  SELECT OPTION
// ═══════════════════════════════════════════════════
function selectOption(idx, restore = false) {
  if (document.getElementById('btnNext').style.display === 'block') return;

  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  const btn = document.getElementById(`opt${idx}`);
  if (btn) btn.classList.add('selected');

  if (!restore) {
    userAnswers[currentIdx] = idx;
    document.getElementById('btnSubmit').disabled = false;
  }
}

// ═══════════════════════════════════════════════════
//  SUBMIT ANSWER
// ═══════════════════════════════════════════════════
function submitAnswer() {
  const { question } = questionQueue[currentIdx];
  const chosen = userAnswers[currentIdx];
  if (chosen === -1) return;

  const correct = question.answer;
  const isCorrect = chosen === correct;

  // 버튼 색상
  document.querySelectorAll('.option-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === correct) b.classList.add('show-correct');
    if (i === chosen && !isCorrect) b.classList.add('wrong');
  });

  // 결과 바
  const rb = document.getElementById('resultBar');
  const optNums = ['①', '②', '③', '④', '⑤'];
  if (isCorrect) {
    rb.className = 'result-bar correct-bar';
    document.getElementById('rbIcon').textContent = '✅';
    document.getElementById('rbText').textContent = '정답입니다!';
  } else {
    rb.className = 'result-bar wrong-bar';
    document.getElementById('rbIcon').textContent = '❌';
    document.getElementById('rbText').innerHTML =
      `오답입니다. 정답: <b>${optNums[correct]}</b><br><span style="font-weight:400;font-size:12px;">${question.explanation}</span>`;

    wrongItems.push({
      passageNum: questionQueue[currentIdx].passage.num,
      passageTitle: questionQueue[currentIdx].passage.title,
      qnum: question.qnum,
      type: question.type,
      qText: question.text,
      chosen: chosen,
      correct: correct,
      optNums,
      options: question.options,
      explanation: question.explanation
    });
  }

  document.getElementById('btnSubmit').style.display = 'none';
  document.getElementById('btnNext').style.display = 'block';
  document.getElementById('btnNext').textContent =
    currentIdx < questionQueue.length - 1 ? '다음 →' : '결과 보기 →';
}

// ═══════════════════════════════════════════════════
//  NEXT QUESTION
// ═══════════════════════════════════════════════════
function nextQuestion() {
  currentIdx++;
  if (currentIdx >= questionQueue.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

// ═══════════════════════════════════════════════════
//  SHOW RESULT
// ═══════════════════════════════════════════════════
function showResult() {
  const total = questionQueue.length;
  const wrongCount = wrongItems.length;
  const correctCount = total - wrongCount;
  const pct = Math.round((correctCount / total) * 100);

  document.getElementById('scoreNum').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = `/ ${total}`;
  document.getElementById('scorePercent').textContent = `정답률 ${pct}%`;
  document.getElementById('statCorrect').textContent = correctCount;
  document.getElementById('statWrong').textContent = wrongCount;
  document.getElementById('statTotal').textContent = total;

  // 오답 목록
  const wrongList = document.getElementById('wrongList');
  if (wrongItems.length === 0) {
    wrongList.innerHTML = '<div class="all-correct-msg">🎉 모든 문제를 맞혔습니다!</div>';
  } else {
    wrongList.innerHTML = wrongItems.map(w => `
      <div class="wrong-card">
        <div class="wrong-card-header">
          <span class="wrong-passage-badge">${w.passageNum}번 지문</span>
          <span class="wrong-type-badge">유형 ${w.type} · ${w.qnum}번</span>
        </div>
        <div class="wrong-q-text">${w.qText}</div>
        <div class="wrong-answer-row">
          <span class="wa-my">내 답: ${w.optNums[w.chosen]}</span>
          <span style="color:#9ca3af">→</span>
          <span class="wa-correct">정답: ${w.optNums[w.correct]}</span>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;">${w.explanation}</div>
      </div>
    `).join('');
  }

  showScreen('resultScreen');
  sendToNotion(correctCount, total, pct);
}

// ═══════════════════════════════════════════════════
//  NOTION 전송
// ═══════════════════════════════════════════════════
async function sendToNotion(correctCount, total, pct) {
  const status = document.getElementById('notionStatus');
  status.textContent = '📡 결과를 저장하는 중...';
  status.className = 'notion-status';

  const scoreText = `${correctCount}/${total} (${pct}%)`;
  const passageNums = selectedPassages.map(p => p.num === 41 ? '41~42' : p.num === 43 ? '43~45' : `${p.num}번`).join(', ');

  const wrongText = wrongItems.length === 0
    ? '오답 없음 (만점)'
    : wrongItems.map(w =>
        `[${w.passageNum}번-${w.type}유형 ${w.qnum}번] 내 답: ${w.optNums[w.chosen]} / 정답: ${w.optNums[w.correct]}`
      ).join('\n');

  const payload = {
    studentName: student.name,
    school: student.school,
    grade: student.grade,
    workbook: '고2 2025년 6월 부산 학력평가 어법·어휘',
    category: '고등_어법어휘',
    submitDate: new Date().toISOString().slice(0, 10),
    wrongAnswers: `[점수: ${scoreText}]\n[범위: ${passageNums}]\n${wrongText}`,
    score: scoreText
  };

  try {
    const res = await fetch('/.netlify/functions/notion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      status.textContent = '✅ 결과가 Notion에 저장됐어요.';
      status.className = 'notion-status ok';
    } else {
      throw new Error(res.status);
    }
  } catch (e) {
    status.textContent = '⚠️ 저장 실패 (네트워크 확인)';
    status.className = 'notion-status err';
  }
}

// ═══════════════════════════════════════════════════
//  RETRY / RESTART
// ═══════════════════════════════════════════════════
function retryWrong() {
  if (wrongItems.length === 0) {
    alert('오답이 없습니다!');
    return;
  }
  // 오답 문제만 큐에 재설정
  const wrongPassageNums = [...new Set(wrongItems.map(w => w.passageNum))];
  const wrongQNums = wrongItems.map(w => w.qnum);

  questionQueue = [];
  selectedPassages.forEach(p => {
    if (wrongPassageNums.includes(p.num)) {
      p.questions.forEach(q => {
        if (wrongQNums.includes(q.qnum)) {
          questionQueue.push({ passage: p, question: q });
        }
      });
    }
  });

  userAnswers = new Array(questionQueue.length).fill(-1);
  wrongItems = [];
  currentIdx = 0;
  showScreen('quizScreen');
  renderQuestion();
}

function restartAll() {
  showScreen('rangeScreen');
}

// ═══════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>
