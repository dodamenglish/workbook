<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동아(윤) 중2 Lesson 3 단어 테스트</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0f0f14;
    --surface: #1a1a24;
    --card: #22222f;
    --border: #2e2e42;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --accent3: #43e97b;
    --text: #e8e8f0;
    --text-muted: #8888aa;
    --correct: #43e97b;
    --wrong: #ff6584;
    --warning: #ffd166;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── 로그인 화면 ── */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(ellipse at 30% 20%, #1a1060 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, #1a0830 0%, transparent 60%),
                var(--bg);
  }

  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .login-logo {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .login-title {
    font-size: 24px;
    font-weight: 900;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .login-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 36px;
  }

  .field-group {
    margin-bottom: 16px;
    text-align: left;
  }

  .field-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .field-group input, .field-group select {
    width: 100%;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }

  .field-group input:focus, .field-group select:focus {
    border-color: var(--accent);
  }

  .field-group select option { background: var(--card); }

  .btn-primary {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 8px;
  }

  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  /* ── 테스트 화면 ── */
  #testScreen { display: none; }

  .test-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(15,15,20,0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header-info {
    flex: 1;
  }

  .header-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }

  .header-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* 타이머 */
  .timer-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .timer {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent3);
    letter-spacing: 2px;
    transition: color 0.3s;
  }

  .timer.warning { color: var(--warning); }
  .timer.danger { color: var(--wrong); animation: pulse 0.5s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  /* 진행바 */
  .progress-wrap {
    padding: 0 20px 12px;
    background: rgba(15,15,20,0.95);
  }

  .progress-bar-bg {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.3s;
    width: 0%;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  /* 문제 컨테이너 */
  .questions-container {
    padding: 20px;
    max-width: 760px;
    margin: 0 auto;
  }

  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 16px;
    transition: border-color 0.2s;
    position: relative;
  }

  .q-card:focus-within { border-color: var(--accent); }

  /* 채점 후 상태 */
  .q-card.correct { border-color: var(--correct); background: rgba(67,233,123,0.05); }
  .q-card.wrong   { border-color: var(--wrong);   background: rgba(255,101,132,0.05); }

  .q-num {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .q-type-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .badge-ko  { background: rgba(108,99,255,0.2); color: var(--accent); }
  .badge-en  { background: rgba(255,101,132,0.2); color: var(--accent2); }
  .badge-def { background: rgba(67,233,123,0.2);  color: var(--accent3); }
  .badge-syn { background: rgba(255,209,102,0.2); color: var(--warning); }

  .q-prompt {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.6;
    margin-bottom: 14px;
    color: var(--text);
  }

  .q-prompt em {
    font-style: normal;
    color: var(--accent3);
    font-weight: 700;
  }

  /* 답 입력 */
  .ans-input {
    width: 100%;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }

  .ans-input:focus { border-color: var(--accent); }
  .ans-input.correct-input { border-color: var(--correct); background: rgba(67,233,123,0.05); }
  .ans-input.wrong-input   { border-color: var(--wrong);   background: rgba(255,101,132,0.05); }
  .ans-input:disabled { opacity: 0.7; cursor: not-allowed; }

  /* 객관식 (유의어/반의어) */
  .choices-wrap { display: flex; flex-direction: column; gap: 8px; }

  .choice-btn {
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, background 0.15s;
  }

  .choice-btn:hover:not(:disabled) { border-color: var(--accent); }
  .choice-btn.selected { border-color: var(--accent); background: rgba(108,99,255,0.15); }
  .choice-btn.correct-choice { border-color: var(--correct); background: rgba(67,233,123,0.15); color: var(--correct); font-weight: 700; }
  .choice-btn.wrong-choice   { border-color: var(--wrong);   background: rgba(255,101,132,0.1);  color: var(--wrong); text-decoration: line-through; }
  .choice-btn:disabled { cursor: not-allowed; }

  /* 채점 후 피드백 */
  .feedback {
    display: none;
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
  }

  .feedback.show { display: block; }
  .feedback.correct-fb { background: rgba(67,233,123,0.1); color: var(--correct); }
  .feedback.wrong-fb   { background: rgba(255,101,132,0.1); color: var(--wrong); }

  /* 제출 버튼 영역 */
  .submit-area {
    padding: 20px;
    max-width: 760px;
    margin: 0 auto 40px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn-submit {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    letter-spacing: 0.5px;
  }

  .btn-submit:hover { opacity: 0.92; transform: translateY(-1px); }
  .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ── 결과 화면 ── */
  #resultScreen { display: none; }

  .result-header {
    padding: 48px 20px 24px;
    text-align: center;
    background: radial-gradient(ellipse at 50% 0%, #1a1060 0%, transparent 70%), var(--bg);
    max-width: 760px;
    margin: 0 auto;
  }

  .result-score-wrap {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    background: var(--card);
    border: 2px solid var(--accent);
    border-radius: 20px;
    padding: 32px 48px;
    margin-bottom: 24px;
  }

  .result-score {
    font-family: 'Space Mono', monospace;
    font-size: 64px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .result-score-label {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  .result-stats {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }

  .stat-chip {
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 700;
  }

  .stat-correct { background: rgba(67,233,123,0.15); color: var(--correct); }
  .stat-wrong   { background: rgba(255,101,132,0.15); color: var(--wrong); }
  .stat-time    { background: rgba(108,99,255,0.15);  color: var(--accent); }

  .result-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 0 20px 40px;
    max-width: 760px;
    margin: 0 auto;
  }

  .btn-action {
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    border: none;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn-action:hover { opacity: 0.88; transform: translateY(-1px); }

  .btn-retry  { background: var(--wrong);   color: #fff; }
  .btn-new    { background: var(--accent);  color: #fff; }
  .btn-notion { background: var(--accent3); color: #111; }
  .btn-notion:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* 오답 리뷰 */
  .wrong-review {
    padding: 20px;
    max-width: 760px;
    margin: 0 auto;
  }

  .review-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  /* Notion 전송 상태 */
  .notion-status {
    text-align: center;
    font-size: 13px;
    padding: 10px;
    border-radius: 8px;
    margin-top: 8px;
    display: none;
  }

  .notion-status.show { display: block; }
  .notion-status.sending { color: var(--text-muted); background: var(--card); }
  .notion-status.ok      { color: var(--correct);    background: rgba(67,233,123,0.1); }
  .notion-status.fail    { color: var(--wrong);       background: rgba(255,101,132,0.1); }

  /* 스크롤바 */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* 모바일 */
  @media (max-width: 480px) {
    .login-box { padding: 32px 24px; }
    .q-card { padding: 18px; }
    .result-score { font-size: 48px; }
    .result-score-wrap { padding: 24px 32px; }
  }
</style>
</head>
<body>

<!-- ══════════════ 로그인 화면 ══════════════ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">도담한영어교실</div>
    <div class="login-title">단어 테스트<br>동아(윤) 중2 Lesson 3</div>
    <div class="login-sub">아래 정보를 입력하고 테스트를 시작하세요</div>

    <div class="field-group">
      <label>이름</label>
      <input type="text" id="inputName" placeholder="이름을 입력하세요" autocomplete="off">
    </div>
    <div class="field-group">
      <label>학교</label>
      <input type="text" id="inputSchool" placeholder="학교명을 입력하세요" autocomplete="off">
    </div>
    <div class="field-group">
      <label>학년</label>
      <select id="inputGrade">
        <option value="">학년 선택</option>
        <option value="중1">중1</option>
        <option value="중2">중2</option>
        <option value="중3">중3</option>
      </select>
    </div>

    <button class="btn-primary" onclick="startTest()">테스트 시작 →</button>
  </div>
</div>

<!-- ══════════════ 테스트 화면 ══════════════ -->
<div id="testScreen">
  <div class="test-header">
    <div class="header-info">
      <div class="header-title" id="headerName">-</div>
      <div class="header-sub">동아(윤) 중2 Lesson 3 · 30문제</div>
    </div>
    <div class="timer-wrap">
      <div class="timer" id="timerDisplay">15:00</div>
    </div>
  </div>

  <div style="background:rgba(15,15,20,0.95); padding: 0 20px 12px; position:sticky; top:62px; z-index:99;">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="progress-label">
      <span id="progressText">0 / 30 입력</span>
      <span id="progressPct">0%</span>
    </div>
  </div>

  <div class="questions-container" id="questionsContainer"></div>

  <div class="submit-area">
    <button class="btn-submit" id="btnSubmit" onclick="submitTest()" disabled>
      전체 제출 및 채점
    </button>
  </div>
</div>

<!-- ══════════════ 결과 화면 ══════════════ -->
<div id="resultScreen">
  <div class="result-header">
    <div class="result-score-wrap">
      <div class="result-score" id="resultScore">0점</div>
      <div class="result-score-label" id="resultScoreLabel">30문제 중 0개 정답</div>
    </div>
    <div class="result-stats">
      <div class="stat-chip stat-correct" id="statCorrect">정답 0개</div>
      <div class="stat-chip stat-wrong"   id="statWrong">오답 0개</div>
      <div class="stat-chip stat-time"    id="statTime">소요 0분</div>
    </div>
  </div>

  <div class="result-actions">
    <button class="btn-action btn-retry"  id="btnRetry"  onclick="retryWrong()" style="display:none">오답 다시풀기</button>
    <button class="btn-action btn-new"    onclick="newTest()">새 테스트</button>
    <button class="btn-action btn-notion" id="btnNotion" onclick="sendToNotion()">오답 노션 전송</button>
  </div>

  <div style="padding: 0 20px; max-width:760px; margin:0 auto;">
    <div class="notion-status" id="notionStatus"></div>
  </div>

  <div class="wrong-review" id="wrongReview"></div>
</div>

<script>
// ══════════════ 단어 데이터 ══════════════
const WORDS = [
  // CONVERSATION

// ══════════════ 상태 변수 ══════════════
let student = {};
let questions = [];
let userAnswers = {};  // index -> string (타이핑) or string (객관식 선택값)
let timerInterval = null;
let timeLeft = 900; // 15분
let startTime = null;
let submitted = false;
let isRetryMode = false;
let wrongIndices = [];

// ══════════════ 유틸 ══════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalize(s) {
  return s.trim().toLowerCase().replace(/[~\-·,\/]/g, ' ').replace(/\s+/g, ' ');
}

function checkAnswer(q, userVal) {
  const u = normalize(userVal);
  if (!u) return false;

  if (q.type === 'syn_ant') {
    // 객관식: 정확히 일치
    return userVal === q.answer;
  }

  const correct = normalize(q.answer);
  if (u === correct) return true;

  // 복수 정답 처리 (슬래시, 콤마로 구분된 경우)
  const parts = correct.split(/[\/,]/).map(p => p.trim());
  if (parts.some(p => u === p)) return true;

  // 부분 허용: 정답이 길 때 핵심 단어 포함
  if (correct.length > 4 && correct.includes(u)) return true;

  return false;
}

// ══════════════ 문제 생성 ══════════════
function generateQuestions(pool) {
  const wordPool = shuffle(pool).slice(0, 30);
  const qs = [];

  // 유의어/반의어 가능한 단어 목록
  const synAntWords = WORDS.filter(w => w.syn || w.ant);

  wordPool.forEach((word, i) => {
    const typeRoll = i % 4;

    if (typeRoll === 0) {
      // 유형1: 한글 뜻 쓰기 (영→한 타이핑)
      qs.push({
        type: 'ko',
        word: word.en,
        prompt: `<b>${word.en}</b>의 우리말 뜻을 쓰세요.`,
        answer: word.ko,
        wordRef: word,
      });
    } else if (typeRoll === 1) {
      // 유형2: 영어 스펠링 쓰기 (한→영 타이핑)
      qs.push({
        type: 'en',
        word: word.en,
        prompt: `<b>${word.ko}</b>에 해당하는 영어 단어(표현)를 쓰세요.`,
        answer: word.en,
        wordRef: word,
      });
    } else if (typeRoll === 2) {
      // 유형3: 영영풀이 보고 단어 타이핑
      qs.push({
        type: 'def',
        word: word.en,
        prompt: `다음 영영풀이에 해당하는 단어를 쓰세요.<br><em>"${word.def}"</em>`,
        answer: word.en,
        wordRef: word,
      });
    } else {
      // 유형4: 유의어/반의어 객관식
      // 가능하면 해당 단어의 syn/ant 사용, 없으면 다른 syn/ant 단어 사용
      let targetWord = word;
      if (!word.syn && !word.ant) {
        const fallback = synAntWords.find(w => w.en !== word.en);
        if (fallback) targetWord = fallback;
      }

      const isSyn = targetWord.syn && (!targetWord.ant || Math.random() > 0.5);
      const correctAns = isSyn ? targetWord.syn.split('/')[0].trim() : targetWord.ant.split('/')[0].trim();
      const label = isSyn ? '유의어' : '반의어';

      // 오답 보기 생성
      const distractors = shuffle(
        WORDS.filter(w => w.en !== targetWord.en)
          .map(w => (isSyn ? (w.syn ? w.syn.split('/')[0].trim() : null) : (w.ant ? w.ant.split('/')[0].trim() : null)))
          .filter(Boolean)
          .filter(v => v !== correctAns)
      ).slice(0, 3);

      if (distractors.length < 3) {
        // 보기 부족 시 영어 단어로 채움
        const extra = shuffle(WORDS.filter(w => w.en !== targetWord.en && w.en !== correctAns)).map(w => w.en);
        while (distractors.length < 3 && extra.length) distractors.push(extra.pop());
      }

      const choices = shuffle([correctAns, ...distractors]);

      qs.push({
        type: 'syn_ant',
        word: targetWord.en,
        prompt: `<b>${targetWord.en}</b> (${targetWord.ko})의 <b>${label}</b>를 고르세요.`,
        answer: correctAns,
        choices,
        label,
        wordRef: targetWord,
      });
    }
  });

  return qs;
}

// ══════════════ 렌더링 ══════════════
function renderQuestions(qs) {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';

  qs.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `qcard-${idx}`;

    const badgeClass = { ko:'badge-ko', en:'badge-en', def:'badge-def', syn_ant:'badge-syn' }[q.type];
    const badgeLabel = { ko:'한글뜻', en:'스펠링', def:'영영풀이', syn_ant:'유의어/반의어' }[q.type];

    let inputHTML = '';
    if (q.type === 'syn_ant') {
      inputHTML = `<div class="choices-wrap" id="choices-${idx}">
        ${q.choices.map((c, ci) => `
          <button class="choice-btn" id="choice-${idx}-${ci}"
            onclick="selectChoice(${idx}, ${ci}, '${c.replace(/'/g,"\\'")}')">
            ${ci+1}. ${c}
          </button>`).join('')}
      </div>`;
    } else {
      const ph = q.type === 'ko' ? '한글로 입력하세요' : '영어로 입력하세요';
      inputHTML = `<input class="ans-input" id="input-${idx}"
        type="text" placeholder="${ph}" autocomplete="off" autocorrect="off"
        oninput="onInput(${idx})"
        onkeydown="if(event.key==='Enter'){document.getElementById('input-${idx+1}')?.focus()}">`;
    }

    card.innerHTML = `
      <div class="q-num">
        <span>Q${idx + 1}</span>
        <span class="q-type-badge ${badgeClass}">${badgeLabel}</span>
      </div>
      <div class="q-prompt">${q.prompt}</div>
      ${inputHTML}
      <div class="feedback" id="fb-${idx}"></div>
    `;

    container.appendChild(card);
  });
}

// ══════════════ 입력 이벤트 ══════════════
function onInput(idx) {
  const val = document.getElementById(`input-${idx}`).value;
  userAnswers[idx] = val;
  updateProgress();
}

function selectChoice(idx, ci, val) {
  // 이전 선택 해제
  questions[idx].choices.forEach((_, i) => {
    document.getElementById(`choice-${idx}-${i}`)?.classList.remove('selected');
  });
  document.getElementById(`choice-${idx}-${ci}`)?.classList.add('selected');
  userAnswers[idx] = val;
  updateProgress();
}

function updateProgress() {
  const total = questions.length;
  let filled = 0;
  questions.forEach((q, i) => {
    const v = userAnswers[i];
    if (v && v.trim()) filled++;
  });

  const pct = Math.round((filled / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${filled} / ${total} 입력`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('btnSubmit').disabled = (filled < total);
}

// ══════════════ 타이머 ══════════════
function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 900;
  updateTimerDisplay();

  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      alert('⏰ 시간이 종료되었습니다! 지금까지 입력한 내용으로 채점합니다.');
      submitTest(true);
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  const el = document.getElementById('timerDisplay');
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.className = 'timer';
  if (timeLeft <= 60)  el.classList.add('danger');
  else if (timeLeft <= 180) el.classList.add('warning');
}

// ══════════════ 테스트 시작 ══════════════
function startTest() {
  const name   = document.getElementById('inputName').value.trim();
  const school = document.getElementById('inputSchool').value.trim();
  const grade  = document.getElementById('inputGrade').value;

  if (!name || !school || !grade) {
    alert('이름, 학교, 학년을 모두 입력해주세요.');
    return;
  }

  student = { name, school, grade };
  document.getElementById('headerName').textContent = `${name} (${school} ${grade})`;

  questions = generateQuestions(WORDS);
  userAnswers = {};
  submitted = false;

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('testScreen').style.display = 'block';
  document.getElementById('resultScreen').style.display = 'none';

  renderQuestions(questions);
  updateProgress();
  startTime = Date.now();
  startTimer();
}

// ══════════════ 제출 & 채점 ══════════════
function submitTest(forced = false) {
  if (submitted) return;
  submitted = true;
  clearInterval(timerInterval);

  // 채점
  let correctCount = 0;
  wrongIndices = [];

  questions.forEach((q, idx) => {
    const userVal = userAnswers[idx] || '';
    const isCorrect = checkAnswer(q, userVal);
    const card = document.getElementById(`qcard-${idx}`);
    const fb = document.getElementById(`fb-${idx}`);

    if (isCorrect) {
      correctCount++;
      card.classList.add('correct');
    } else {
      wrongIndices.push(idx);
      card.classList.add('wrong');
    }

    // 피드백 표시
    fb.classList.add('show');
    if (isCorrect) {
      fb.classList.add('correct-fb');
      fb.textContent = '✓ 정답!';
    } else {
      fb.classList.add('wrong-fb');
      fb.textContent = `✗ 정답: ${q.answer}`;
    }

    // 입력 비활성화
    if (q.type === 'syn_ant') {
      q.choices.forEach((c, ci) => {
        const btn = document.getElementById(`choice-${idx}-${ci}`);
        if (btn) {
          btn.disabled = true;
          if (c === q.answer) btn.classList.add('correct-choice');
          else if (btn.classList.contains('selected')) btn.classList.add('wrong-choice');
        }
      });
    } else {
      const inp = document.getElementById(`input-${idx}`);
      if (inp) {
        inp.disabled = true;
        inp.classList.add(isCorrect ? 'correct-input' : 'wrong-input');
      }
    }
  });

  const elapsed = Math.round((Date.now() - startTime) / 1000);
  const elapsedMin = Math.floor(elapsed / 60);
  const elapsedSec = elapsed % 60;
  const score = Math.round((correctCount / questions.length) * 100);

  // 결과 화면
  document.getElementById('testScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';

  document.getElementById('resultScore').textContent = score + '점';
  document.getElementById('resultScoreLabel').textContent = `${questions.length}문제 중 ${correctCount}개 정답`;
  document.getElementById('statCorrect').textContent = `정답 ${correctCount}개`;
  document.getElementById('statWrong').textContent = `오답 ${wrongIndices.length}개`;
  document.getElementById('statTime').textContent = `${elapsedMin}분 ${elapsedSec}초`;

  if (wrongIndices.length > 0) {
    document.getElementById('btnRetry').style.display = 'inline-block';
    renderWrongReview();
  }

  // 오답 없으면 노션 버튼 숨기기
  if (wrongIndices.length === 0) {
    document.getElementById('btnNotion').disabled = true;
    document.getElementById('btnNotion').textContent = '오답 없음 🎉';
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ══════════════ 오답 리뷰 ══════════════
function renderWrongReview() {
  const wrap = document.getElementById('wrongReview');
  if (wrongIndices.length === 0) { wrap.innerHTML = ''; return; }

  let html = `<div class="review-title">오답 목록 (${wrongIndices.length}개)</div>`;
  wrongIndices.forEach(idx => {
    const q = questions[idx];
    const userVal = userAnswers[idx] || '(미입력)';
    html += `
      <div class="q-card wrong" style="margin-bottom:12px">
        <div class="q-num">Q${idx+1} · ${q.word}</div>
        <div style="font-size:14px; color:var(--text-muted); margin-bottom:6px">${q.prompt.replace(/<[^>]+>/g,'')}</div>
        <div style="font-size:13px; color:var(--wrong); margin-bottom:4px">내 답: ${userVal}</div>
        <div style="font-size:13px; color:var(--correct); font-weight:700">정답: ${q.answer}</div>
        ${q.wordRef.syn ? `<div style="font-size:12px; color:var(--text-muted); margin-top:4px">유의어: ${q.wordRef.syn}</div>` : ''}
        ${q.wordRef.ant ? `<div style="font-size:12px; color:var(--text-muted);">반의어: ${q.wordRef.ant}</div>` : ''}
      </div>`;
  });
  wrap.innerHTML = html;
}

// ══════════════ 오답 다시풀기 ══════════════
function retryWrong() {
  const wrongWords = wrongIndices.map(i => questions[i].wordRef);
  if (!wrongWords.length) return;

  isRetryMode = true;
  questions = generateQuestions(wrongWords.length >= 5 ? wrongWords : WORDS);
  userAnswers = {};
  submitted = false;
  wrongIndices = [];

  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('testScreen').style.display = 'block';
  document.getElementById('wrongReview').innerHTML = '';

  renderQuestions(questions);
  updateProgress();
  startTime = Date.now();
  startTimer();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ══════════════ 새 테스트 ══════════════
function newTest() {
  isRetryMode = false;
  questions = generateQuestions(WORDS);
  userAnswers = {};
  submitted = false;
  wrongIndices = [];

  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('testScreen').style.display = 'block';
  document.getElementById('btnRetry').style.display = 'none';
  document.getElementById('wrongReview').innerHTML = '';
  document.getElementById('btnNotion').disabled = false;
  document.getElementById('btnNotion').textContent = '오답 노션 전송';

  renderQuestions(questions);
  updateProgress();
  startTime = Date.now();
  startTimer();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ══════════════ Notion 전송 ══════════════
async function sendToNotion() {
  if (wrongIndices.length === 0) return;

  const btn = document.getElementById('btnNotion');
  const status = document.getElementById('notionStatus');
  btn.disabled = true;
  btn.textContent = '전송 중...';
  status.className = 'notion-status show sending';
  status.textContent = 'Notion에 오답을 전송하고 있어요...';

  const scoreText = document.getElementById('resultScore').textContent;
  const wrongList = wrongIndices.map(idx => {
    const q = questions[idx];
    const userVal = userAnswers[idx] || '(미입력)';
    return `[${q.word}] 내 답: ${userVal} → 정답: ${q.answer}`;
  }).join('\n');

  const payload = {
    studentName: student.name,
    school: student.school,
    grade: student.grade,
    workbook: '동아(윤) 중2 Lesson 3 단어테스트',
    category: '중등_단어테스트',
    submitDate: new Date().toISOString().split('T')[0],
    wrongAnswers: `[점수: ${scoreText}]\n${wrongList}`,
    score: scoreText,
  };

  try {
    const res = await fetch('https://dodamenglish.netlify.app/.netlify/functions/notion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (res.ok) {
      status.className = 'notion-status show ok';
      status.textContent = '✅ 오답이 노션에 성공적으로 전송됐어요!';
      btn.textContent = '전송 완료 ✓';
    } else {
      throw new Error('서버 오류');
    }
  } catch (e) {
    status.className = 'notion-status show fail';
    status.textContent = '⚠️ 전송 실패 — 선생님께 알려주세요.';
    btn.disabled = false;
    btn.textContent = '다시 전송';
  }
}
