<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3. What a Great Idea (01) | 동아(윤정미) 중2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Nunito:wght@600;700;800&display=swap');

  :root {
    --primary: #2563eb;
    --primary-light: #dbeafe;
    --primary-dark: #1d4ed8;
    --accent: #f59e0b;
    --accent-light: #fef3c7;
    --success: #10b981;
    --success-light: #d1fae5;
    --danger: #ef4444;
    --danger-light: #fee2e2;
    --bg: #f0f6ff;
    --card: #ffffff;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --shadow: 0 4px 24px rgba(37,99,235,0.10);
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── LOGIN ── */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .login-card {
    background: var(--card);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .login-badge {
    display: inline-block;
    background: var(--primary-light);
    color: var(--primary);
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 13px;
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 18px;
    letter-spacing: 0.5px;
  }
  .login-card h1 {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 22px;
    color: var(--primary-dark);
    margin-bottom: 6px;
  }
  .login-card p {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 32px;
  }
  .login-card label {
    display: block;
    text-align: left;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }
  .login-card input, .login-card select {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    background: #f8fafc;
    color: var(--text);
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .login-card input:focus, .login-card select:focus {
    border-color: var(--primary);
    background: #fff;
  }
  .btn-login {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 4px;
  }
  .btn-login:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .error-msg { color: var(--danger); font-size: 13px; margin-top: -8px; margin-bottom: 10px; }

  /* ── QUIZ SCREEN ── */
  #quiz-screen { display: none; min-height: 100vh; flex-direction: column; }

  /* Header */
  .quiz-header {
    background: var(--card);
    border-bottom: 2px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(37,99,235,0.07);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-logo {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 17px;
    color: var(--primary);
  }
  .header-info { font-size: 13px; color: var(--text-muted); }
  .header-right { display: flex; align-items: center; gap: 16px; }

  /* Timer */
  .timer-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--primary-light);
    padding: 8px 16px;
    border-radius: 999px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: var(--primary);
    transition: background 0.3s, color 0.3s;
  }
  .timer-box.warning { background: #fef3c7; color: #d97706; }
  .timer-box.danger { background: #fee2e2; color: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

  /* Progress */
  .progress-wrap { flex: 1; max-width: 300px; padding: 0 8px; }
  .progress-text { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; text-align: right; }
  .progress-bar-bg { background: var(--border); border-radius: 999px; height: 6px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--primary); border-radius: 999px; transition: width 0.4s ease; }

  /* Question Card */
  .quiz-body {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 20px 120px;
  }
  .question-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 780px;
    padding: 36px 40px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .q-num {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 28px;
    color: var(--primary);
    line-height: 1;
  }
  .q-level {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    letter-spacing: 0.5px;
  }
  .level-key { background: #ede9fe; color: #7c3aed; }
  .level-1 { background: var(--success-light); color: #059669; }
  .level-2 { background: var(--accent-light); color: #d97706; }
  .level-3 { background: var(--danger-light); color: #dc2626; }

  .q-text {
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 20px;
    font-weight: 700;
    color: var(--text);
  }
  .q-body { font-size: 14px; line-height: 1.9; color: var(--text); }
  .q-body .dialogue-box {
    background: #f8fafc;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin: 12px 0;
    font-size: 14px;
    line-height: 2;
  }
  .q-body .hint-box {
    background: var(--accent-light);
    border-left: 4px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 10px 14px;
    margin: 10px 0;
    font-size: 13px;
    color: #78350f;
  }
  .q-body .table-wrap {
    overflow-x: auto;
    margin: 10px 0;
  }
  .q-body table {
    border-collapse: collapse;
    font-size: 13px;
    min-width: 300px;
  }
  .q-body table th, .q-body table td {
    border: 1.5px solid var(--border);
    padding: 8px 14px;
    text-align: center;
  }
  .q-body table th { background: var(--primary-light); color: var(--primary-dark); font-weight: 700; }

  /* Answer inputs */
  .answer-section { margin-top: 22px; }
  .answer-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .answer-label span { color: var(--primary); }
  .answer-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .answer-row label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    min-width: 28px;
    flex-shrink: 0;
  }
  .ans-input {
    width: 100%;
    padding: 11px 14px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    background: #f8fafc;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .ans-input:focus { border-color: var(--primary); background: #fff; }
  .ans-input.correct { border-color: var(--success); background: var(--success-light); }
  .ans-input.wrong { border-color: var(--danger); background: var(--danger-light); }
  .ans-input:disabled { opacity: 0.9; }

  /* Result badge under input */
  .input-feedback {
    font-size: 12px;
    margin-top: 2px;
    margin-bottom: 4px;
    padding-left: 4px;
  }
  .input-feedback.correct { color: var(--success); }
  .input-feedback.wrong { color: var(--danger); }

  /* Bottom nav */
  .quiz-footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 2px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    z-index: 100;
    box-shadow: 0 -4px 16px rgba(37,99,235,0.07);
  }
  .btn-nav {
    padding: 11px 28px;
    border-radius: 10px;
    font-size: 14px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-prev { background: var(--border); color: var(--text-muted); }
  .btn-prev:hover { background: #cbd5e1; color: var(--text); }
  .btn-next { background: var(--primary); color: #fff; }
  .btn-next:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .btn-submit { background: var(--accent); color: #fff; }
  .btn-submit:hover { background: #d97706; transform: translateY(-1px); }
  .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

  .page-dots {
    display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; flex: 1;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 999px;
    background: var(--border); transition: all 0.2s; cursor: pointer;
  }
  .dot.active { background: var(--primary); transform: scale(1.3); }
  .dot.answered { background: #93c5fd; }
  .dot.active.answered { background: var(--primary); }

  /* ── RESULT SCREEN ── */
  #result-screen {
    display: none;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: var(--bg);
  }
  .result-card {
    background: var(--card);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 48px 40px;
    width: 100%;
    max-width: 600px;
    text-align: center;
  }
  .result-card h2 {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 26px;
    color: var(--primary);
    margin-bottom: 8px;
  }
  .result-score {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 64px;
    color: var(--primary-dark);
    line-height: 1;
    margin: 16px 0 4px;
  }
  .result-score span { font-size: 28px; color: var(--text-muted); }
  .result-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
  .result-stats {
    display: flex; gap: 16px; justify-content: center; margin-bottom: 28px;
  }
  .stat-box {
    flex: 1; padding: 16px; border-radius: 12px; font-family: 'Nunito', sans-serif;
  }
  .stat-box .num { font-size: 28px; font-weight: 800; }
  .stat-box .lbl { font-size: 12px; font-weight: 600; margin-top: 2px; }
  .stat-correct { background: var(--success-light); color: var(--success); }
  .stat-wrong { background: var(--danger-light); color: var(--danger); }
  .stat-time { background: var(--primary-light); color: var(--primary); }
  .notion-status {
    background: #f8fafc;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }
  .notion-status.sending { color: var(--primary); border-color: var(--primary-light); }
  .notion-status.done { color: var(--success); border-color: var(--success-light); background: var(--success-light); }
  .notion-status.fail { color: var(--danger); border-color: var(--danger-light); background: var(--danger-light); }
  .btn-retry {
    padding: 13px 32px; border-radius: 10px;
    background: var(--primary); color: #fff; border: none;
    font-size: 15px; font-family: 'Nunito', sans-serif; font-weight: 800;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-retry:hover { background: var(--primary-dark); }

  /* Responsive */
  @media (max-width: 600px) {
    .question-card { padding: 24px 18px; }
    .quiz-header { padding: 10px 14px; }
    .header-logo { font-size: 14px; }
    .q-num { font-size: 22px; }
    .progress-wrap { display: none; }
    .quiz-body { padding: 20px 12px 110px; }
  }
</style>
</head>
<body>

<!-- ══════════════════ LOGIN ══════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-badge">📘 도담한영어교실</div>
    <h1>3. What a Great Idea (01)</h1>
    <p>동아(윤정미) 중2 | 서술형 공략 25문제</p>
    <label>이름</label>
    <input type="text" id="inp-name" placeholder="이름을 입력하세요">
    <label>학교</label>
    <input type="text" id="inp-school" placeholder="학교 이름을 입력하세요">
    <label>학년</label>
    <select id="inp-grade">
      <option value="">학년 선택</option>
      <option value="중1">중1</option>
      <option value="중2">중2</option>
      <option value="중3">중3</option>
    </select>
    <div id="login-error" class="error-msg" style="display:none"></div>
    <button class="btn-login" onclick="startQuiz()">시작하기 →</button>
  </div>
</div>

<!-- ══════════════════ QUIZ ══════════════════ -->
<div id="quiz-screen" style="display:none; flex-direction:column; min-height:100vh;">
  <div class="quiz-header">
    <div class="header-left">
      <div class="header-logo">도담한영어교실</div>
      <div class="header-info" id="user-label"></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-text" id="prog-text">1 / 25</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog-fill" style="width:4%"></div></div>
    </div>
    <div class="header-right">
      <div class="timer-box" id="timer-box">
        <span>⏱</span><span id="timer-display">30:00</span>
      </div>
    </div>
  </div>

  <div class="quiz-body">
    <div class="question-card" id="question-card"></div>
  </div>

  <div class="quiz-footer">
    <button class="btn-nav btn-prev" id="btn-prev" onclick="movePage(-1)" disabled>← 이전</button>
    <div class="page-dots" id="page-dots"></div>
    <button class="btn-nav btn-next" id="btn-next" onclick="movePage(1)">다음 →</button>
  </div>
</div>

<!-- ══════════════════ RESULT ══════════════════ -->
<div id="result-screen" style="display:none; align-items:center; justify-content:center; padding:20px;">
  <div class="result-card">
    <h2>🎉 제출 완료!</h2>
    <div class="result-score" id="res-score">0<span>점</span></div>
    <div class="result-sub" id="res-sub"></div>
    <div class="result-stats">
      <div class="stat-box stat-correct"><div class="num" id="res-correct">0</div><div class="lbl">정답</div></div>
      <div class="stat-box stat-wrong"><div class="num" id="res-wrong">0</div><div class="lbl">오답</div></div>
      <div class="stat-box stat-time"><div class="num" id="res-time">-</div><div class="lbl">소요시간</div></div>
    </div>
    <div class="notion-status" id="notion-status">📤 Notion에 결과를 전송 중입니다...</div>
    <button class="btn-retry" onclick="location.reload()">다시 풀기</button>
  </div>
</div>

<script>
// ════════════════════════════════════════
// DATA — 25 questions
// ════════════════════════════════════════
const QUESTIONS = [
  {
    id:1, level:'KEY POINT', levelClass:'level-key',
    text:'다음 대화의 빈칸 ⓐ에 들어갈 표현은?',
    body:`<div class="dialogue-box">
A: Who is the tallest in our class?<br>
B: It's Junho. He's the tallest.<br>
A: <b>_____ⓐ_____</b><br>
B: Well, I'm not sure. Minsu may be taller.
</div>`,
    answers:[{label:'답', key:'a1'}],
    correct:['Are you sure?'],
    check:(inp,cor)=>normalize(inp)===normalize(cor)
  },
  {
    id:2, level:'KEY POINT', levelClass:'level-key',
    text:'다음 대화에서 A가 했을 질문 ⓐ를 B의 대답을 잘 보고 적으시오.',
    body:`<div class="dialogue-box">
A: <b>____ⓐ____ ?</b><br>
B: King Sejong invented Hangeul in 1443.<br>
A: Are you sure?<br>
B: Yes, I'm quite sure.<br>
A: You're right.
</div>`,
    answers:[{label:'답', key:'a1'}],
    correct:['When did King Sejong invent Hangeul?'],
    check:(inp,cor)=>normalize(inp)===normalize(cor)
  },
  {
    id:3, level:'LEVEL 1', levelClass:'level-1',
    text:'다음 각 문장을 능동태면 수동태로, 수동태면 능동태 문장으로 전환하여 빈칸을 채우시오.',
    body:`<div class="dialogue-box">
(1) The Wright brothers invented the airplane.<br>
→ (____) (____) (____) (____) (____) the Wright brothers.<br><br>
(2) The cookies were baked by my sister.<br>
→ (____) (____) (____) the cookies.
</div>`,
    answers:[
      {label:'(1)', key:'a1'},
      {label:'(2)', key:'a2'}
    ],
    correct:['The airplane was invented by','My sister baked'],
    check:(inp,cor)=>normalize(inp)===normalize(cor)
  },
  {
    id:4, level:'LEVEL 1', levelClass:'level-1',
    text:'다음 우리말 문장을 <보기> 단어를 배열하여 영작하시오.',
    body:`<div class="hint-box">많은 나무들이 환경을 위해 심어졌다.<br><br>
<b>&lt;보기&gt;</b> planted, the environment, were, for, trees, many</div>`,
    answers:[{label:'답', key:'a1'}],
    correct:['Many trees were planted for the environment.'],
    check:(inp,cor)=>normalize(inp)===normalize(cor)
  },
  {
    id:5, level:'LEVEL 1', levelClass:'level-1',
    text:'주어진 단어를 보고 다음 한글 문장을 영작하시오.',
    body:`(1) Hanjin은 오늘 그의 숙제를 해야 한다. <span style="color:#6366f1">(has, his homework)</span><br><br>
(2) Mina는 버스를 탈 필요가 없다. <span style="color:#6366f1">(take, doesn't)</span>`,
    answers:[
      {label:'(1)', key:'a1'},
      {label:'(2)', key:'a2'}
    ],
    correct:['Hanjin has to do his homework.','Mina doesn\'t have to take a bus.'],
    check:(inp,cor)=>normalize(inp)===normalize(cor)
  },
  {
    id:6, level:'LEVEL 1', levelClass:'level-1',
    text:'다음 기상예보를 보고 주어진 단어를 활용하여 Yuna가 할 말을 적으시오.',
    body:`<div class="table-wrap"><table>
<tr><th>날짜</th><th>날씨</th></tr>
<tr><td>6/6 Friday (TODAY)</td><td>cloudy</td></tr>
<tr><td>6/7 Saturday</td><td>sunny</td></tr>
<tr><td>6/8 Sunday</td><td>rainy</td></tr>
<tr><td>6/9 Monday</td><td>rainy</td></tr>
</table></div>
<div class="hint-box"><b>활용 단어:</b> have to, my umbrella, take</div>
<div class="dialogue-box">Yuna: On Saturday, <b>____________________________</b>.</div>`,
    answers:[{label:'답', key:'a1'}],
    correct:["I don't have to take my umbrella."],
    check:(inp,cor)=>normalize(inp)===normalize(cor)
  },
  {
    id:7, level:'LEVEL 1', levelClass:'level-1',
    text:'다음 표와 한글 문장을 보고 수동태 문장을 완성하시오.',
    body:`<div class="table-wrap"><table>
<tr><th>Book Title</th><th>The Last Leaf</th></tr>
<tr><td>Writer</td><td>O. Henry</td></tr>
</table></div>
<div style="margin-top:12px;font-weight:600">마지막 잎새는 오 헨리에 의해 쓰였다.</div>`,
    answers:[{label:'답', key:'a1'}],
    correct:['The Last Leaf was written by O. Henry.'],
    check:(inp,cor)=>normalize(inp)===normalize(cor)
  },

// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
let student = {name:'', school:'', grade:''};
let currentPage = 0;
let userAnswers = {}; // {qid_key: value}
let timerInterval = null;
let secondsLeft = 30 * 60;
let startTime = null;

// ════════════════════════════════════════
// UTILS
// ════════════════════════════════════════
function normalize(str) {
  return (str||'').trim().toLowerCase()
    .replace(/\s+/g,' ')
    .replace(/[.!?]$/,'')
    .replace(/'/g,"'").replace(/'/g,"'")
    .replace(/"/g,'"').replace(/"/g,'"');
}

function answerKey(qid, key) { return `${qid}_${key}`; }

function isQuestionAnswered(q) {
  return q.answers.every(a => {
    const v = userAnswers[answerKey(q.id, a.key)];
    return v && v.trim().length > 0;
  });
}

// ════════════════════════════════════════
// LOGIN
// ════════════════════════════════════════
function startQuiz() {
  const name = document.getElementById('inp-name').value.trim();
  const school = document.getElementById('inp-school').value.trim();
  const grade = document.getElementById('inp-grade').value;
  const err = document.getElementById('login-error');

  if (!name || !school || !grade) {
    err.style.display = 'block';
    err.textContent = '이름, 학교, 학년을 모두 입력해 주세요.';
    return;
  }
  err.style.display = 'none';
  student = {name, school, grade};

  document.getElementById('login-screen').style.display = 'none';
  const qs = document.getElementById('quiz-screen');
  qs.style.display = 'flex';
  qs.style.flexDirection = 'column';

  document.getElementById('user-label').textContent = `${name} | ${school} | ${grade}`;

  buildDots();
  renderPage(0);
  startTimer();
  startTime = Date.now();
}

// ════════════════════════════════════════
// TIMER
// ════════════════════════════════════════
function startTimer() {
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    secondsLeft--;
    updateTimerDisplay();
    if (secondsLeft <= 0) { clearInterval(timerInterval); submitQuiz(); }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(secondsLeft / 60).toString().padStart(2,'0');
  const s = (secondsLeft % 60).toString().padStart(2,'0');
  document.getElementById('timer-display').textContent = `${m}:${s}`;
  const box = document.getElementById('timer-box');
  box.className = 'timer-box';
  if (secondsLeft <= 60) box.classList.add('danger');
  else if (secondsLeft <= 300) box.classList.add('warning');
}

// ════════════════════════════════════════
// RENDER PAGE
// ════════════════════════════════════════
function renderPage(idx) {
  currentPage = idx;
  const q = QUESTIONS[idx];

  // Progress
  document.getElementById('prog-text').textContent = `${idx+1} / ${QUESTIONS.length}`;
  document.getElementById('prog-fill').style.width = `${((idx+1)/QUESTIONS.length)*100}%`;

  // Buttons
  document.getElementById('btn-prev').disabled = idx === 0;
  const isLast = idx === QUESTIONS.length - 1;
  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = isLast ? '제출하기 ✓' : '다음 →';
  nextBtn.className = 'btn-nav ' + (isLast ? 'btn-submit' : 'btn-next');
  nextBtn.onclick = isLast ? submitQuiz : ()=>movePage(1);

  // Dots
  document.querySelectorAll('.dot').forEach((d,i) => {
    d.className = 'dot';
    if (i === idx) d.classList.add('active');
    if (isQuestionAnswered(QUESTIONS[i])) d.classList.add('answered');
  });

  // Card
  const card = document.getElementById('question-card');
  card.innerHTML = `
    <div class="q-meta">
      <div class="q-num">${q.id}.</div>
      <div class="q-level ${q.levelClass}">${q.level}</div>
    </div>
    <div class="q-text">${q.text}</div>
    <div class="q-body">${q.body}</div>
    <div class="answer-section">
      <div class="answer-label">✏️ <span>내 답 입력</span></div>
      ${q.answers.map(a => `
        <div class="answer-row">
          <label>${a.label}</label>
          <input class="ans-input" id="inp_${q.id}_${a.key}"
            type="text"
            placeholder="정답을 입력하세요"
            value="${escHtml(userAnswers[answerKey(q.id, a.key)]||'')}"
            oninput="saveAnswer(${q.id},'${a.key}',this.value)"
            onkeydown="if(event.key==='Enter'){event.preventDefault();}"
          >
        </div>
      `).join('')}
    </div>
  `;

  // Scroll top
  window.scrollTo({top:0, behavior:'smooth'});
}

function escHtml(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function saveAnswer(qid, key, value) {
  userAnswers[answerKey(qid, key)] = value;
  // update dot
  const idx = QUESTIONS.findIndex(q=>q.id===qid);
  const dot = document.querySelectorAll('.dot')[idx];
  if (dot) {
    if (isQuestionAnswered(QUESTIONS[idx])) dot.classList.add('answered');
    else dot.classList.remove('answered');
  }
}

function buildDots() {
  const wrap = document.getElementById('page-dots');
  wrap.innerHTML = QUESTIONS.map((q,i) =>
    `<div class="dot" title="${q.id}번" onclick="renderPage(${i})"></div>`
  ).join('');
}

function movePage(dir) {
  const next = currentPage + dir;
  if (next < 0 || next >= QUESTIONS.length) return;
  renderPage(next);
}

// ════════════════════════════════════════
// SUBMIT & GRADE
// ════════════════════════════════════════
function submitQuiz() {
  if (!confirm('제출하시겠습니까? 제출 후에는 수정할 수 없습니다.')) return;
  clearInterval(timerInterval);

  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const em = Math.floor(elapsed/60).toString().padStart(2,'0');
  const es = (elapsed%60).toString().padStart(2,'0');

  // Grade
  let totalParts = 0, correctParts = 0;
  let wrongList = [];

  QUESTIONS.forEach(q => {
    q.answers.forEach((a, idx) => {
      totalParts++;
      const inp = userAnswers[answerKey(q.id, a.key)] || '';
      const cor = q.correct[idx] || '';
      const ok = q.check ? q.check(inp, cor, idx) : normalize(inp)===normalize(cor);
      if (ok) {
        correctParts++;
      } else {
        wrongList.push({
          q: q.id,
          label: a.label,
          myAnswer: inp,
          correct: cor
        });
      }
    });
  });

  const score = Math.round((correctParts / totalParts) * 100);

  // Show result
  document.getElementById('quiz-screen').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'flex';

  document.getElementById('res-score').innerHTML = `${score}<span>점</span>`;
  document.getElementById('res-sub').textContent =
    `${student.name} | ${student.school} | ${student.grade} | 3. What a Great Idea (01)`;
  document.getElementById('res-correct').textContent = correctParts;
  document.getElementById('res-wrong').textContent = totalParts - correctParts;
  document.getElementById('res-time').textContent = `${em}:${es}`;

  sendToNotion(score, wrongList, `${em}:${es}`);
}

// ════════════════════════════════════════
// NOTION
// ════════════════════════════════════════
async function sendToNotion(score, wrongList, timeStr) {
  const statusEl = document.getElementById('notion-status');
  statusEl.className = 'notion-status sending';
  statusEl.textContent = '📤 Notion에 결과를 전송 중입니다...';

  const today = new Date().toISOString().split('T')[0];

  let wrongText = `[점수: ${score}점 | 소요시간: ${timeStr}]\n\n`;
  if (wrongList.length === 0) {
    wrongText += '오답 없음 — 완벽한 답안!';
  } else {
    wrongList.forEach(w => {
      wrongText += `[${w.q}번 ${w.label}]\n내 답: ${w.myAnswer||'(미입력)'}\n정답: ${w.correct}\n\n`;
    });
  }

  const payload = {
    studentName: student.name,
    school: student.school,
    grade: student.grade,
    workbook: '3.What a Great Idea(01)_동아(윤정미)_중2',
    category: '서술형 공략',
    submitDate: today,
    wrongAnswers: wrongText.trim(),
    score: score
  };

  try {
    const res = await fetch('https://dodamenglish.netlify.app/.netlify/functions/notion', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      statusEl.className = 'notion-status done';
      statusEl.textContent = '✅ Notion 전송 완료! 도담T가 확인할 수 있습니다.';
    } else {
      throw new Error('서버 응답 오류');
    }
  } catch(e) {
    statusEl.className = 'notion-status fail';
    statusEl.textContent = '⚠️ Notion 전송 실패. 도담T에게 직접 알려주세요.';
  }
}
