<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부산남고 1학년 영어 실전 모의고사 1회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #1a3a5c;
  --accent: #e8703a;
  --bg: #f8f6f1;
  --card: #ffffff;
  --text: #1c1c1c;
  --sub: #5a6a7a;
  --border: #dde3ea;
  --correct: #2e7d32;
  --wrong: #c62828;
  --highlight: #fff3cd;
  --passage-bg: #f0f4f8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── LOGIN ── */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #1a3a5c 0%, #2d6a9f 100%);
}
.login-box {
  background: white;
  border-radius: 20px;
  padding: 48px 40px;
  width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.login-box .logo {
  text-align: center;
  margin-bottom: 32px;
}
.login-box .logo .badge {
  display: inline-block;
  background: var(--primary);
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 20px;
  letter-spacing: 1px;
  margin-bottom: 12px;
}
.login-box .logo h1 {
  font-size: 22px;
  font-weight: 900;
  color: var(--primary);
  line-height: 1.3;
}
.login-box .logo p {
  font-size: 13px;
  color: var(--sub);
  margin-top: 6px;
}
.login-field {
  margin-bottom: 16px;
}
.login-field label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 6px;
}
.login-field input, .login-field select {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--text);
  background: white;
  transition: border-color 0.2s;
}
.login-field input:focus, .login-field select:focus {
  outline: none;
  border-color: var(--primary);
}
.btn-start {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.2s, transform 0.1s;
}
.btn-start:hover { background: #d4622e; transform: translateY(-1px); }

/* ── EXAM HEADER ── */
#exam-screen { display: none; }
.exam-header {
  background: var(--primary);
  color: white;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.exam-header .title { font-size: 15px; font-weight: 700; }
.exam-header .progress-info { font-size: 13px; opacity: 0.85; }
.exam-header .student-info { font-size: 13px; opacity: 0.8; }

/* ── PROGRESS BAR ── */
.progress-bar-wrap {
  height: 4px;
  background: rgba(255,255,255,0.2);
  position: sticky;
  top: 52px;
  z-index: 99;
}
.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.4s ease;
}

/* ── QUESTION CONTAINER ── */
.question-container {
  max-width: 860px;
  margin: 0 auto;
  padding: 28px 20px 100px;
}

/* ── QUESTION CARD ── */
.q-card {
  display: none;
  animation: fadeIn 0.3s ease;
}
.q-card.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ── PASSAGE ── */
.passage-box {
  background: var(--passage-bg);
  border-left: 4px solid var(--primary);
  border-radius: 10px;
  padding: 20px 24px;
  margin-bottom: 20px;
  font-size: 14px;
  line-height: 1.9;
  color: #2a3a4a;
}
.passage-box .passage-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 10px;
  display: block;
}
.passage-box .para-label {
  font-weight: 700;
  color: var(--primary);
}
.underline { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; }
.circle-letter { 
  display: inline-block;
  background: var(--primary);
  color: white;
  border-radius: 50%;
  width: 20px;
  height: 20px;
  font-size: 11px;
  font-weight: 700;
  text-align: center;
  line-height: 20px;
  margin: 0 1px;
}

/* ── QUESTION BODY ── */
.q-number-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.q-num-badge {
  background: var(--primary);
  color: white;
  font-size: 13px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 20px;
  white-space: nowrap;
}
.q-type-badge {
  background: var(--accent);
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
}
.q-stem {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.7;
  margin-bottom: 16px;
  color: var(--text);
}
.q-stem .bogie-box {
  background: #f0f4f8;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  margin-top: 10px;
  font-size: 13.5px;
  font-weight: 400;
  color: var(--text);
  line-height: 1.8;
}
.bogie-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 6px;
}

/* ── CHOICES ── */
.choices { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.choice-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  background: white;
  font-size: 14px;
  line-height: 1.6;
}
.choice-item:hover { border-color: var(--primary); background: #f0f4f8; }
.choice-item.selected { border-color: var(--primary); background: #e8f0fb; }
.choice-item.correct { border-color: var(--correct); background: #e8f5e9; }
.choice-item.wrong { border-color: var(--wrong); background: #ffebee; }
.choice-num {

  height: 26px;
  border-radius: 50%;
  background: var(--border);
  color: var(--sub);
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.choice-item.selected .choice-num { background: var(--primary); color: white; }
.choice-item.correct .choice-num { background: var(--correct); color: white; }
.choice-item.wrong .choice-num { background: var(--wrong); color: white; }

/* ── SUBJECTIVE ── */
.subj-area {
  margin-top: 8px;
}
.subj-condition {
  background: #fff3e0;
  border: 1px solid #ffcc80;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  line-height: 1.7;
  margin-bottom: 12px;
  color: #5a3a00;
}
.subj-condition .cond-title {
  font-weight: 700;
  color: #e65100;
  margin-bottom: 4px;
}
.subj-textarea {
  width: 100%;
  min-height: 90px;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  line-height: 1.7;
  resize: vertical;
  transition: border-color 0.2s;
}
.subj-textarea:focus { outline: none; border-color: var(--primary); }
.subj-multi { display: flex; flex-direction: column; gap: 8px; }
.subj-row { display: flex; align-items: center; gap: 10px; }
.subj-row label { font-size: 13px; font-weight: 700; color: var(--primary); min-width: 60px; }
.subj-row input {
  flex: 1;
  padding: 10px 14px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  transition: border-color 0.2s;
}
.subj-row input:focus { outline: none; border-color: var(--primary); }

/* ── ANSWER REVEAL ── */
.answer-panel {
  display: none;
  margin-top: 16px;
  background: #f0f7ff;
  border: 2px solid #90caf9;
  border-radius: 10px;
  padding: 16px 20px;
}
.answer-panel.show { display: block; animation: fadeIn 0.3s ease; }
.answer-panel .ans-title {
  font-size: 12px;
  font-weight: 700;
  color: #1565c0;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.answer-panel .ans-content {
  font-size: 14px;
  line-height: 1.8;
  color: var(--text);
}
.answer-panel .ans-explain {
  font-size: 13px;
  color: var(--sub);
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid #90caf9;
  line-height: 1.7;
}

/* ── BUTTONS ── */
.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}
.btn {
  padding: 11px 22px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}
.btn-check { background: var(--primary); color: white; }
.btn-check:hover { background: #15304e; }
.btn-reveal { background: #546e7a; color: white; }
.btn-reveal:hover { background: #37474f; }
.btn-next { background: var(--accent); color: white; margin-left: auto; }
.btn-next:hover { background: #d4622e; }
.btn-prev { background: var(--border); color: var(--sub); }
.btn-prev:hover { background: #c5cdd5; color: var(--text); }
.btn-submit { background: #2e7d32; color: white; margin-left: auto; }
.btn-submit:hover { background: #1b5e20; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  border-top: 2px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
  z-index: 90;
}
.nav-dot {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: white;
  font-size: 12px;
  font-weight: 700;
  color: var(--sub);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  font-family: 'Noto Sans KR', sans-serif;
}
.nav-dot:hover { border-color: var(--primary); color: var(--primary); }
.nav-dot.current { background: var(--primary); border-color: var(--primary); color: white; }
.nav-dot.answered { background: #e8f0fb; border-color: var(--primary); color: var(--primary); }
.nav-dot.subj { border-style: dashed; }
.nav-dot.answered.subj { background: #fff3e0; border-color: var(--accent); color: var(--accent); }

/* ── SECTION DIVIDER ── */
.section-divider {
  text-align: center;
  margin: 8px 0 20px;
}
.section-label {
  display: inline-block;
  background: var(--primary);
  color: white;
  font-size: 12px;
  font-weight: 700;
  padding: 5px 18px;
  border-radius: 20px;
  letter-spacing: 1px;
}

/* ── RESULT SCREEN ── */
#result-screen {
  display: none;
  min-height: 100vh;
  background: var(--bg);
  padding: 40px 20px;
}
.result-box {
  max-width: 680px;
  margin: 0 auto;
  background: white;
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.1);
}
.result-box h2 {
  font-size: 24px;
  font-weight: 900;
  color: var(--primary);
  text-align: center;
  margin-bottom: 8px;
}
.result-box .score-circle {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), #2d6a9f);
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;

  box-shadow: 0 8px 24px rgba(26,58,92,0.3);
}
.result-box .score-circle .score-num { font-size: 36px; font-weight: 900; }
.result-box .score-circle .score-label { font-size: 12px; opacity: 0.8; }
.result-summary {
  display: grid;

}
.summary-card {
  background: var(--bg);

}
.summary-card .s-num { font-size: 24px; font-weight: 900; color: var(--primary); }
.summary-card .s-label { font-size: 12px; color: var(--sub); margin-top: 4px; }
.wrong-list { margin-top: 20px; }
.wrong-list h3 { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
.wrong-item {
  display: flex;
  align-items: flex-start;

  padding: 10px 14px;
  border-radius: 8px;
  background: #ffebee;

  font-size: 13px;
  line-height: 1.6;
}
.wrong-item .w-num { font-weight: 700; color: var(--wrong); min-width: 40px; }
.sending-msg {
  text-align: center;
  padding: 20px;

}
.send-ok {
  text-align: center;
  padding: 12px;
  background: #e8f5e9;
  border-radius: 10px;
  color: #2e7d32;
  font-size: 14px;
  font-weight: 700;
  margin-top: 16px;
}
.send-fail {
  text-align: center;
  padding: 12px;

<script>
// ===== DATA =====
const NOTION_URL = 'https://dodamenglish.netlify.app/.netlify/functions/notion';
let studentName = '', studentSchool = '', studentGrade = '';
let currentQ = 0;
let answers = {}; // qIndex -> answer (string for MC, text for subj)
let checked = {}; // qIndex -> bool (MC checked)
let revealed = {}; // qIndex -> bool

// Passage texts
const P3_AB = `<span class="para-label">(A)</span> The story behind these emails begins with Melbourne's Urban Forest Strategy plan, a response to Australia's millennium drought. This drought lasted from the late 1990s to 2010. By the time it ended, 40 percent of the city's 77,000 trees <span class="circle-letter">ⓐ</span><span class="underline">was</span> in a state of declining health. Furthermore, the overall number of trees was decreasing. As a result, the amount of shade provided by trees within the city, also <span class="circle-letter">ⓑ</span><span class="underline">knew</span> as canopy cover, decreased. The loss of canopy cover is a major threat to urban environments because it raises temperatures. Higher temperatures in cities can be dangerous for residents, as they increase the risk of heat exhaustion. They also lead to a rise in the use of air conditioning. This speeds up climate change by <span class="circle-letter">ⓒ</span><span class="underline">increase</span> energy consumption and greenhouse gas emissions.<br><br><span class="para-label">(B)</span> Something had to be done to deal with the loss of Melbourne's trees. In 2012, the city government announced its Urban Forest Strategy plan. It set the <span class="underline">ambitious</span> goal of planting more than 3,000 trees every year for the next twenty years. The plan also involved the creation of an online map called the Urban Forest Visual. This interactive map shows the location of every single tree in the city's parks and along its roads. It uses colors and symbols to <span class="underline">indicate</span> each tree's age and genus. Also, users can click on a tree to find out its species and even send it an email. At first, the "Email this tree" function had a specific purpose. It was designed to allow people to easily inform council workers about trees that were damaged or in poor health.`;

const P4_AB = `As quickly as a camera captures a scene, an image can grab hold of our emotions. Through speech or written text, it can be difficult to convey a complex message quickly. Yet photographs can change people's hearts and minds in an instant. And when the magic of photography sparks an emotional reaction in a great number of people, it can change history.<br><br>In the 1880s, industry began to grow rapidly along the Cuyahoga River in the city of Cleveland. This industrial growth provided steady jobs to people in the area. Meanwhile, steel mills and factories started <span class="underline">dumping</span> large amounts of waste into the river. Although the river became polluted, most people simply regarded this as a sign of the area's economic success.<br><br>In June 1969, the polluted river caught fire. The likely cause was a burning flare falling from a train, which set fire to oil-soaked waste beneath a bridge. At that time, <span class="underline">few</span> people in Cleveland cared. This was because fires had been recorded on the Cuyahoga more than ten times before, and some of them had been much worse.<br><br>However, it wasn't long before the 1969 fire became famous. This was thanks to an article published in Time magazine that year. The article featured a shocking photograph of flames and smoke rising from the river. But this was not a photograph of the 1969 fire, which was put out so <span class="underline">quickly</span> that nobody took a picture of it. In fact, it was a picture of a much worse fire that had occurred on the river several years earlier. Still, the image had a great <span class="underline">impact</span> on people.<br><br>Around that time, the attitudes of Americans toward environmental problems were starting to change. More and more people were becoming aware of the need to protect the environment, and the shocking image of the burning river <span class="underline">extinguished</span> public anger about water pollution. As a result, the Cuyahoga River fire of 1969 became a symbol of pollution. A national environmental awareness event was held on April 22, 1970, which later became known as the first Earth Day. And in 1972, national water quality standards were established with the passage of the Clean Water Act.`;

const P_CULTURE_A = `Elves have been an important part of Iceland's folk culture and myths for centuries, and most Icelanders like to imagine that elves exist among them. Icelanders' interest in these <span class="underline">imaginary</span> beings gives them an emotional connection to nature. In Icelandic culture, it is important for people to respect and protect rocks and hills because they are homes for elves. Therefore, people think twice about <span class="underline">digging up</span> the country's beautiful natural landscapes. Also, plans for the construction of roads, factories, and bridges are sometimes <span class="underline">maintained</span>. Thanks to the elves of Iceland, nature is being protected!`;

const P_GEN = `[종합 어휘·추론 영역 — Lesson 3 & 4 통합]`;

// ===== QUESTIONS =====
const questions = [
  // ── [1~7] Lesson 3 지문 A,B ──
  {
    id: 1,
    type: 'mc',
    section: 'Lesson 3: Letters to Nature [1~7]',
    passage: P3_AB,
    stem: '윗글의 제목으로 가장 적절한 것은?',
    choices: [
      'Unveiling the Hidden Dangers of Urban Canopy Cover',
      'The Millennium Drought: A Crisis That Destroyed Melbourne',
      'A Creative Strategy to Restore Melbourne\'s Declining Urban Forest',
      'Why Air Conditioning is the Main Cause of Greenhouse Gas',

// ===== HELPERS =====
function startExam() {
  studentName = document.getElementById('inp-name').value.trim();
  studentSchool = document.getElementById('inp-school').value.trim();
  studentGrade = document.getElementById('inp-grade').value;
  if (!studentName) { alert('이름을 입력해주세요.'); return; }
  document.getElementById('student-info-header').textContent = studentName + ' | ' + studentGrade;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('exam-screen').style.display = 'block';
  renderAll();
  goTo(0);
}

function renderAll() {
  const container = document.getElementById('q-container');
  const nav = document.getElementById('bottom-nav');
  container.innerHTML = '';
  nav.innerHTML = '';

  let lastSection = null;
  questions.forEach((q, i) => {
    // Section divider
    if (q.section && q.section !== lastSection) {
      const div = document.createElement('div');
      div.className = 'q-card section-divider-card';
      div.innerHTML = `<div class="section-divider"><span class="section-label">${q.section}</span></div>`;
      div.dataset.sectionFor = i;
      container.appendChild(div);
      lastSection = q.section;
    }

    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'qcard-' + i;

    let html = '';
    // Passage
    if (q.passage) {
      html += `<div class="passage-box"><span class="passage-label">📖 지문</span>${q.passage}</div>`;
    }
    // Q number row
    const typeLabel = q.type === 'mc' ? '선택형' : '서술형';
    html += `<div class="q-number-row">
      <span class="q-num-badge">문항 ${q.id}</span>
      <span class="q-type-badge">${typeLabel}${q.points ? ' · ' + q.points + '점' : ''}</span>
    </div>`;
    html += `<div class="q-stem">${q.stem}</div>`;

    if (q.type === 'mc') {
      html += `<ul class="choices" id="choices-${i}">`;
      q.choices.forEach((c, ci) => {
        html += `<li class="choice-item" id="choice-${i}-${ci}" onclick="selectChoice(${i},${ci})">
          <span class="choice-num">${ci+1}</span>
          <span>${c}</span>
        </li>`;
      });
      html += '</ul>';
      html += `<div class="btn-row">
        <button class="btn btn-prev" onclick="goTo(${i-1})" ${i===0?'style="visibility:hidden"':''}>← 이전</button>
        <button class="btn btn-check" onclick="checkMC(${i})">정답 확인</button>
        ${i < questions.length-1 
          ? `<button class="btn btn-next" onclick="goTo(${i+1})">다음 →</button>`
          : `<button class="btn btn-submit" onclick="submitExam()">제출하기 ✓</button>`
        }
      </div>`;
    } else {
      // Subjective
      if (q.condition) {
        html += `<div class="subj-condition"><div class="cond-title">📌 조건</div>${q.condition.replace(/\n/g,'<br>')}</div>`;
      }
      if (q.subfields) {
        html += `<div class="subj-area"><div class="subj-multi" id="subj-multi-${i}">`;
        q.subfields.forEach((sf, fi) => {
          html += `<div class="subj-row">
            <label>${sf.label}</label>
            <input type="text" id="subj-${i}-${fi}" placeholder="${sf.placeholder}" oninput="saveSubjMulti(${i})">
          </div>`;
        });
        html += `</div></div>`;
      } else {
        html += `<div class="subj-area">
          <textarea class="subj-textarea" id="subj-${i}" placeholder="답안을 작성하세요..." oninput="saveSubj(${i})"></textarea>
        </div>`;
      }
      html += `<div class="btn-row">
        <button class="btn btn-prev" onclick="goTo(${i-1})" ${i===0?'style="visibility:hidden"':''}>← 이전</button>
        <button class="btn btn-reveal" onclick="revealAnswer(${i})">모범답안 확인</button>
        ${i < questions.length-1 
          ? `<button class="btn btn-next" onclick="goTo(${i+1})">다음 →</button>`
          : `<button class="btn btn-submit" onclick="submitExam()">제출하기 ✓</button>`
        }
      </div>`;
    }

    // Answer panel
    html += `<div class="answer-panel" id="ans-panel-${i}">
      <div class="ans-title">✅ 정답 / 모범답안</div>
      <div class="ans-content" id="ans-content-${i}"></div>
      ${q.explain ? `<div class="ans-explain">💡 해설: ${q.explain}</div>` : ''}
    </div>`;

    card.innerHTML = html;
    container.appendChild(card);

    // Nav dot
    const dot = document.createElement('div');
    dot.className = 'nav-dot' + (q.type === 'subj' ? ' subj' : '');
    dot.id = 'navdot-' + i;
    dot.textContent = q.id;
    dot.onclick = () => goTo(i);
    nav.appendChild(dot);
  });
}

function goTo(idx) {
  if (idx < 0 || idx >= questions.length) return;
  // hide all
  document.querySelectorAll('.q-card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-dot').forEach(d => d.classList.remove('current'));
  // show
  document.getElementById('qcard-' + idx).classList.add('active');
  document.getElementById('navdot-' + idx).classList.add('current');
  currentQ = idx;
  // progress
  const pct = Math.round(((idx+1)/questions.length)*100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = (idx+1) + ' / ' + questions.length;
  window.scrollTo(0,0);
}

function selectChoice(qIdx, choiceIdx) {
  if (checked[qIdx]) return;
  answers[qIdx] = choiceIdx + 1;
  document.querySelectorAll(`#choices-${qIdx} .choice-item`).forEach((el,ci) => {
    el.classList.toggle('selected', ci === choiceIdx);
  });
  updateNavDot(qIdx);
}

function checkMC(qIdx) {
  if (answers[qIdx] === undefined) { alert('답을 선택해주세요.'); return; }
  checked[qIdx] = true;
  const q = questions[qIdx];
  const chosen = answers[qIdx] - 1;
  const correct = q.answer - 1;
  document.querySelectorAll(`#choices-${qIdx} .choice-item`).forEach((el,ci) => {
    el.classList.remove('selected');
    if (ci === correct) el.classList.add('correct');
    else if (ci === chosen) el.classList.add('wrong');
    el.style.cursor = 'default';
  });
  // show answer panel
  const panel = document.getElementById('ans-panel-' + qIdx);
  const content = document.getElementById('ans-content-' + qIdx);
  content.innerHTML = `정답: <strong>${q.answer}번</strong>`;
  panel.classList.add('show');
  updateNavDot(qIdx);
}

function revealAnswer(qIdx) {
  const q = questions[qIdx];
  const panel = document.getElementById('ans-panel-' + qIdx);
  const content = document.getElementById('ans-content-' + qIdx);
  content.innerHTML = q.modelAnswer;
  panel.classList.add('show');
  revealed[qIdx] = true;
  updateNavDot(qIdx);
}

function saveSubj(qIdx) {
  const el = document.getElementById('subj-' + qIdx);
  answers[qIdx] = el ? el.value : '';
  updateNavDot(qIdx);
}

function saveSubjMulti(qIdx) {
  const q = questions[qIdx];
  const parts = [];
  q.subfields.forEach((sf, fi) => {
    const el = document.getElementById(`subj-${qIdx}-${fi}`);
    if (el && el.value.trim()) parts.push(`${sf.label}: ${el.value.trim()}`);
  });
  answers[qIdx] = parts.join(' / ');
  updateNavDot(qIdx);
}

function updateNavDot(qIdx) {
  const dot = document.getElementById('navdot-' + qIdx);
  if (!dot) return;
  const q = questions[qIdx];
  if (answers[qIdx] !== undefined && answers[qIdx] !== '') {
    dot.classList.add('answered');
  }
}

function submitExam() {
  const unanswered = questions.filter((q,i) => answers[i] === undefined || answers[i] === '');
  if (unanswered.length > 0) {
    if (!confirm(`아직 ${unanswered.length}문항에 답하지 않았습니다. 그래도 제출하시겠습니까?`)) return;
  }

  // Calculate score (MC only, 20 MC × 3점 = 60점, 서술형 40점 만점 기준)
  let mcCorrect = 0, mcWrong = 0;
  const wrongItems = [];
  const mcQs = questions.filter(q => q.type === 'mc');
  mcQs.forEach((q, i) => {
    const qIdx = questions.indexOf(q);
    if (answers[qIdx] === q.answer) {
      mcCorrect++;
    } else {
      mcWrong++;
      wrongItems.push({ id: q.id, myAns: answers[qIdx] || '미응답', correct: q.answer });
    }
  });

  const subjCount = questions.filter((q,i) => q.type === 'subj' && answers[i] && answers[i] !== '').length;
  const mcScore = mcCorrect * 3; // 20문항 × 3점
  const subjMax = 21; // 서논술 총점 (6+4+4+4+3)
  const estimatedScore = mcScore; // 서술형은 교사 채점

  document.getElementById('exam-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';
  document.getElementById('res-score').textContent = mcScore;
  document.getElementById('res-correct').textContent = mcCorrect;
  document.getElementById('res-wrong').textContent = mcWrong;
  document.getElementById('res-subj').textContent = subjCount;

  const wl = document.getElementById('wrong-list');
  if (wrongItems.length > 0) {
    wl.innerHTML = '<h3>❌ 선택형 오답 문항</h3>';
    wrongItems.forEach(w => {
      wl.innerHTML += `<div class="wrong-item"><span class="w-num">${w.id}번</span><span>내 답: ${w.myAns}번 → 정답: ${w.correct}번</span></div>`;
    });
  } else {
    wl.innerHTML = '<div style="text-align:center;padding:16px;color:#2e7d32;font-weight:700;">🎉 선택형 전부 정답!</div>';
  }

  // Send to Notion
  sendToNotion(mcScore, wrongItems, subjCount);
}

async function sendToNotion(mcScore, wrongItems, subjCount) {
  const statusEl = document.getElementById('send-status');
  
  // Build wrongAnswers string
  let wrongStr = `[선택형 점수: ${mcScore}점]\n`;
  if (wrongItems.length === 0) wrongStr += '선택형 오답 없음\n';
  else wrongItems.forEach(w => { wrongStr += `${w.id}번: 내 답 ${w.myAns}번 → 정답 ${w.correct}번\n`; });

  // Build subjective answers string
  const subjQs = questions.filter(q => q.type === 'subj');
  let subjStr = '';
  subjQs.forEach(q => {
    const qIdx = questions.indexOf(q);
    const ans = answers[qIdx] || '(미작성)';
    subjStr += `[서논술형 ${q.id}번]\n학생 답안: ${ans}\n모범답안: ${q.modelAnswer ? q.modelAnswer.replace(/<[^>]+>/g,'') : ''}\n\n`;
  });

  const payload = {
    studentName: studentName,
    school: studentSchool,
    grade: studentGrade,
    workbook: '부산남고 1학년 NE능률 3·4과 모의고사 1회',
    category: '내신대비',
    submitDate: new Date().toISOString().slice(0,10),
    wrongAnswers: wrongStr,
    score: mcScore,
    clinicNote: subjStr
  };

  try {
    const res = await fetch(NOTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      statusEl.innerHTML = '';
      document.getElementById('result-screen').querySelector('.result-box').insertAdjacentHTML('beforeend',
        '<div class="send-ok">✅ 노션에 결과가 전송되었습니다!</div>');
    } else {
      throw new Error('서버 오류');
    }
  } catch (e) {
    statusEl.innerHTML = '';
    document.getElementById('result-screen').querySelector('.result-box').insertAdjacentHTML('beforeend',
      '<div class="send-fail">⚠️ 노션 전송 실패. 선생님께 직접 제출해 주세요.</div>');
  }
}
