<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도담한영어교실 - 단어 시험</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #4F46E5;
    --primary-light: #818CF8;
    --primary-dark: #3730A3;
    --secondary: #10B981;
    --secondary-light: #6EE7B7;
    --accent: #F59E0B;
    --danger: #EF4444;
    --danger-light: #FCA5A5;
    --bg: #F0F4FF;
    --card: #FFFFFF;
    --text: #1E1B4B;
    --text-light: #6B7280;
    --border: #E0E7FF;
    --correct: #D1FAE5;
    --correct-border: #10B981;
    --wrong: #FEE2E2;
    --wrong-border: #EF4444;
    --shadow: 0 4px 20px rgba(79,70,229,0.12);
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nanum Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }

  /* ===== 상단 헤더 ===== */
  .header {
    text-align: center;
    padding: 24px 0 16px;
    margin-bottom: 24px;
  }
  .header h1 {
    font-family: 'Nunito', sans-serif;
    font-size: 2rem;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: -0.5px;
  }
  .header p {
    color: var(--text-light);
    font-size: 0.95rem;
    margin-top: 4px;
  }

  /* ===== 카드 공통 ===== */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px;
    max-width: 700px;
    margin: 0 auto 24px;
    border: 1px solid var(--border);
  }

  .card-title {
    font-family: 'Nunito', sans-serif;
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--primary);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .icon {
    font-size: 1.4rem;
  }

  /* ===== 입력 ===== */
  input[type="text"] {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 1.1rem;
    font-family: 'Nanum Gothic', sans-serif;
    color: var(--text);
    transition: border-color 0.2s;
    outline: none;
    background: #FAFBFF;
  }
  input[type="text"]:focus {
    border-color: var(--primary);
    background: white;
  }

  /* ===== 버튼 ===== */
  .btn {
    padding: 13px 28px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.18s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary {
    background: var(--primary);
    color: white;
    width: 100%;
    justify-content: center;
    font-size: 1.05rem;
    margin-top: 16px;
  }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .btn-secondary {
    background: var(--secondary);
    color: white;
  }
  .btn-secondary:hover { background: #059669; }
  .btn-outline {
    background: transparent;
    color: var(--primary);
    border: 2px solid var(--primary);
  }
  .btn-outline:hover { background: var(--primary); color: white; }
  .btn-small {
    padding: 8px 16px;
    font-size: 0.85rem;
    border-radius: 8px;
  }
  .btn-danger {
    background: var(--danger);
    color: white;
  }
  .btn-accent {
    background: var(--accent);
    color: white;
  }

  /* ===== Unit 선택 그리드 ===== */
  .unit-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  @media (max-width: 500px) {
    .unit-grid { grid-template-columns: repeat(5, 1fr); }
  }

  .unit-btn {
    padding: 10px 4px;
    text-align: center;
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--text-light);
    background: #FAFBFF;
    transition: all 0.15s;
    user-select: none;
  }
  .unit-btn:hover { border-color: var(--primary-light); color: var(--primary); }
  .unit-btn.selected {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  .unit-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  /* ===== 유형 선택 카드 ===== */
  .type-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  @media (max-width: 500px) {
    .type-grid { grid-template-columns: 1fr; }
  }

  .type-card {
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 22px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.18s;
    background: #FAFBFF;
  }
  .type-card:hover {
    border-color: var(--primary);
    background: #EEF2FF;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(79,70,229,0.15);
  }
  .type-card .type-icon { font-size: 2.2rem; margin-bottom: 10px; }
  .type-card .type-name {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    color: var(--text);
    margin-bottom: 6px;
  }
  .type-card .type-desc {
    font-size: 0.8rem;
    color: var(--text-light);
    line-height: 1.4;
  }

  /* ===== 시험 화면 ===== */
  .test-header {
    background: var(--primary);
    color: white;
    border-radius: var(--radius);
    padding: 18px 24px;
    max-width: 700px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .test-header .info { font-family: 'Nunito', sans-serif; }
  .test-header .test-title { font-size: 1.1rem; font-weight: 800; }
  .test-header .test-sub { font-size: 0.85rem; opacity: 0.85; }
  .test-header .actions { display: flex; gap: 8px; }

  .progress-bar {
    background: var(--border);
    border-radius: 10px;
    height: 6px;
    max-width: 700px;
    margin: 0 auto 20px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    border-radius: 10px;
    transition: width 0.4s ease;
  }

  /* ===== 문제 카드 ===== */
  .question-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
    max-width: 700px;
    margin: 0 auto 14px;
    border: 1px solid var(--border);
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-number {
    font-size: 0.8rem;
    color: var(--text-light);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .q-word {
    font-size: 1.6rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    color: var(--text);
    margin-bottom: 18px;
  }
  .q-word.ko {
    font-family: 'Nanum Gothic', sans-serif;
    font-size: 1.3rem;
    font-weight: 800;
  }

  .answer-input {
    width: 100%;
    padding: 13px 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 1.05rem;
    font-family: 'Nanum Gothic', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    background: #FAFBFF;
  }
  .answer-input:focus { border-color: var(--primary); background: white; }
  .answer-input.correct { border-color: var(--correct-border); background: var(--correct); }
  .answer-input.wrong { border-color: var(--wrong-border); background: var(--wrong); }

  .answer-feedback {
    margin-top: 10px;
    font-size: 0.9rem;
    font-weight: 700;
    display: none;
  }
  .answer-feedback.correct { color: var(--correct-border); display: block; }
  .answer-feedback.wrong { color: var(--wrong-border); display: block; }

  /* ===== 객관식 ===== */
  .mc-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
  }
  @media (max-width: 480px) {
    .mc-options { grid-template-columns: 1fr; }
  }

  .mc-option {
    padding: 13px 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.95rem;
    font-family: 'Nanum Gothic', sans-serif;
    text-align: left;
    background: #FAFBFF;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .mc-option:hover:not(.disabled) { border-color: var(--primary); background: #EEF2FF; }
  .mc-option .opt-label {
    background: var(--primary);
    color: white;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.8rem;
    flex-shrink: 0;
  }
  .mc-option.correct { border-color: var(--correct-border); background: var(--correct); }
  .mc-option.correct .opt-label { background: var(--correct-border); }
  .mc-option.wrong { border-color: var(--wrong-border); background: var(--wrong); }
  .mc-option.wrong .opt-label { background: var(--wrong-border); }
  .mc-option.disabled { cursor: default; }

  .sentence-text {
    font-size: 1rem;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 14px;
    padding: 14px;
    background: #F8FAFF;
    border-radius: 10px;
    border-left: 3px solid var(--primary-light);
  }
  .blank { 
    display: inline-block;
    border-bottom: 2px solid var(--primary);
    min-width: 80px;
    text-align: center;
    font-weight: 800;
    color: var(--primary);
  }

  /* ===== 로딩 ===== */
  .loading-card {
    text-align: center;
    padding: 50px 32px;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== 제출/결과 ===== */
  .submit-area {
    max-width: 700px;
    margin: 0 auto 24px;
    display: flex;
    gap: 10px;
  }
  .submit-area .btn { flex: 1; }

  .result-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 36px;
    max-width: 700px;
    margin: 0 auto 24px;
    text-align: center;
    border: 1px solid var(--border);
  }
  .score-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    color: white;
    font-family: 'Nunito', sans-serif;
  }
  .score-circle .score-num { font-size: 2.4rem; font-weight: 900; line-height: 1; }
  .score-circle .score-label { font-size: 0.8rem; opacity: 0.9; }

  .result-title {
    font-family: 'Nunito', sans-serif;
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--text);
    margin-bottom: 8px;
  }
  .result-sub { color: var(--text-light); font-size: 0.95rem; margin-bottom: 24px; }

  .wrong-list {
    text-align: left;
    border-top: 1px solid var(--border);
    padding-top: 20px;
    margin-top: 4px;
  }
  .wrong-list-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    color: var(--danger);
    margin-bottom: 12px;
    font-size: 1rem;
  }
  .wrong-item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--wrong);
    margin-bottom: 8px;
    font-size: 0.9rem;
  }
  .wrong-item .wi-q { font-weight: 800; color: var(--text); min-width: 100px; }
  .wrong-item .wi-arrow { color: var(--text-light); }
  .wrong-item .wi-correct { color: var(--correct-border); font-weight: 700; }
  .wrong-item .wi-my { color: var(--danger); }

  .notion-status {
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 0.88rem;
    font-weight: 700;
    text-align: center;
  }
  .notion-status.sending { background: #FEF3C7; color: #92400E; }
  .notion-status.success { background: var(--correct); color: #065F46; }
  .notion-status.error { background: var(--wrong); color: #991B1B; }

  /* ===== 유틸 ===== */
  .hidden { display: none !important; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

  .name-display {
    font-size: 0.85rem;
    background: #EEF2FF;
    padding: 6px 14px;
    border-radius: 20px;
    color: var(--primary);
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="header">
  <h1>📚 도담한영어교실</h1>
  <p>단어 시험 — 열심히 해봐요! 💪</p>
</div>

<!-- ===== STEP 1: 이름 입력 ===== -->
<div id="step-name" class="card">
  <div class="card-title"><span class="icon">👤</span> 이름 입력</div>
  <input type="text" id="student-name" placeholder="이름을 입력하세요" maxlength="20" />
  <button class="btn btn-primary" onclick="goToStep2()">다음 →</button>
</div>

<!-- ===== STEP 2: 단원 선택 ===== -->
<div id="step-units" class="card hidden">
  <div class="card-title"><span class="icon">📋</span> 시험 범위 선택</div>
  <div class="unit-controls">
    <button class="btn btn-outline btn-small" onclick="selectAllUnits()">전체 선택</button>
    <button class="btn btn-outline btn-small" onclick="clearAllUnits()">전체 해제</button>
    <span id="selected-count" style="font-size:0.85rem;color:var(--text-light);line-height:2.2;"></span>
  </div>
  <div class="unit-grid" id="unit-grid"></div>
  <button class="btn btn-primary" onclick="goToStep3()">다음 →</button>
</div>

<!-- ===== STEP 3: 유형 선택 ===== -->
<div id="step-type" class="card hidden">
  <div class="card-title"><span class="icon">✏️</span> 시험 유형 선택</div>
  <div class="type-grid">
    <div class="type-card" onclick="startTest('korean')">
      <div class="type-icon">🇰🇷</div>
      <div class="type-name">한글 뜻 쓰기</div>
      <div class="type-desc">영어 단어를 보고<br>한글 뜻을 써요</div>
    </div>
    <div class="type-card" onclick="startTest('english')">
      <div class="type-icon">🔤</div>
      <div class="type-name">영어 스펠링 쓰기</div>
      <div class="type-desc">한글 뜻을 보고<br>영어 단어를 써요</div>
    </div>
    <div class="type-card" onclick="startTest('mcq')">
      <div class="type-icon">📝</div>
      <div class="type-name">예문 TEST</div>
      <div class="type-desc">예문의 빈칸에<br>맞는 단어를 골라요</div>
    </div>
  </div>
</div>

<!-- ===== 시험 화면 ===== -->
<div id="test-area" class="hidden">
  <div class="test-header">
    <div class="info">
      <div class="test-title" id="test-title-display"></div>
      <div class="test-sub" id="test-sub-display"></div>
    </div>
    <div class="actions">
      <span class="name-display" id="name-display"></span>
      <button class="btn btn-small btn-outline" style="color:white;border-color:rgba(255,255,255,0.5)" onclick="shuffleQuestions()">🔀 셔플</button>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

  <!-- 로딩 (예문 생성 중) -->
  <div id="loading-card" class="card loading-card hidden">
    <div class="spinner"></div>
    <div style="font-family:'Nunito',sans-serif;font-weight:700;color:var(--text-light)">예문을 만들고 있어요...</div>
    <div style="font-size:0.85rem;color:var(--text-light);margin-top:6px">잠시만 기다려주세요 ✨</div>
  </div>

  <div id="questions-container"></div>

  <div class="submit-area">
    <button class="btn btn-primary" onclick="submitTest()">✅ 채점하기</button>
    <button class="btn btn-outline btn-small" onclick="resetToStart()">🏠 처음으로</button>
  </div>
</div>

<!-- ===== 결과 화면 ===== -->
<div id="result-area" class="hidden">
  <div class="result-card">
    <div class="score-circle">
      <div class="score-num" id="result-score">0</div>
      <div class="score-label">점</div>
    </div>
    <div class="result-title" id="result-title">잘했어요!</div>
    <div class="result-sub" id="result-sub"></div>
    <div class="wrong-list" id="wrong-list"></div>
    <div class="notion-status hidden" id="notion-status"></div>
    <div style="display:flex;gap:10px;margin-top:24px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="resetToStart()" style="flex:1">🏠 처음으로</button>
      <button class="btn btn-secondary" onclick="retryWrong()" id="retry-btn" style="flex:1">🔄 오답만 다시</button>
    </div>
  </div>
</div>

<script>
// ===== 데이터 =====
const VOCAB_DATA = {
  1: [
    {en:"carnival",ko:"축제"},{en:"recall",ko:"상기하다, 생각해내다"},{en:"yell",ko:"소리지르다, 소리치다"},{en:"rat",ko:"쥐"},{en:"circle",ko:"원"},{en:"dull",ko:"지루한"},{en:"fuel",ko:"연료"},{en:"trade",ko:"무역, 거래, 교환"},{en:"beat",ko:"박자, 이기다, 치다"},{en:"crab",ko:"게"},{en:"scale",ko:"규모"},{en:"squirrel",ko:"다람쥐"},{en:"situation",ko:"상황"},{en:"painful",ko:"고통스러운"},{en:"fence",ko:"울타리"},{en:"talent",ko:"재능"},{en:"real",ko:"진짜의, 현실의"},{en:"bill",ko:"계산서, 청구서, 요금, 법안"},{en:"disease",ko:"질병"},{en:"silk",ko:"비단"},{en:"island",ko:"섬"},{en:"kite",ko:"연"},{en:"purple",ko:"자주색, 보라색"},{en:"flood",ko:"홍수"},{en:"record",ko:"기록하다"},{en:"diet",ko:"식단, 음식"},{en:"complete",ko:"완전한, 완성하다, 끝내다"},
  ],
  2: [
    {en:"ability",ko:"능력"},{en:"pill",ko:"알약"},{en:"shut",ko:"닫다"},{en:"suit",ko:"정장"},{en:"terrific",ko:"아주 멋진, 좋은"},{en:"roll",ko:"굴리다"},{en:"shoot",ko:"쏘다"},{en:"laughter",ko:"웃음"},{en:"deal",ko:"다루다, 거래, 처리하다"},{en:"mosquito",ko:"모기"},{en:"root",ko:"뿌리, 근원, 근본"},{en:"silly",ko:"어리석은"},{en:"ruin",ko:"망치다, 파멸"},{en:"height",ko:"높이, 키"},{en:"shore",ko:"해변, 해안"},{en:"treasure",ko:"보물"},{en:"strength",ko:"힘"},{en:"bet",ko:"틀림없다, 장담하다"},{en:"beg",ko:"간청하다, 구걸하다"},{en:"nut",ko:"견과"},{en:"stage",ko:"무대, 단계"},{en:"store",ko:"가게, 저장하다"},{en:"let",ko:"허락하다, 하게하다"},{en:"signal",ko:"신호"},{en:"similar",ko:"비슷한"},{en:"worse",ko:"더 나쁜"},{en:"dig",ko:"파다"},{en:"drag",ko:"질질 끌다, 끌다"},

// ===== 상태 =====
let studentName = '';
let selectedUnits = [];
let testType = '';
let questions = [];
let wrongAnswers = [];
let mcqData = []; // 예문 생성 결과

// ===== STEP 1: 이름 =====
function goToStep2() {
  const name = document.getElementById('student-name').value.trim();
  if (!name) { alert('이름을 입력해주세요!'); return; }
  studentName = name;
  document.getElementById('step-name').classList.add('hidden');
  buildUnitGrid();
  document.getElementById('step-units').classList.remove('hidden');
}

// ===== STEP 2: 단원 그리드 =====
function buildUnitGrid() {
  const grid = document.getElementById('unit-grid');
  grid.innerHTML = '';
  for (let i = 1; i <= 30; i++) {
    const btn = document.createElement('div');
    btn.className = 'unit-btn';
    btn.textContent = `U${i}`;
    btn.dataset.unit = i;
    btn.onclick = () => toggleUnit(btn, i);
    grid.appendChild(btn);
  }
  updateSelectedCount();
}

function toggleUnit(btn, unit) {
  if (btn.classList.contains('selected')) {
    btn.classList.remove('selected');
    selectedUnits = selectedUnits.filter(u => u !== unit);
  } else {
    btn.classList.add('selected');
    selectedUnits.push(unit);
  }
  updateSelectedCount();
}

function selectAllUnits() {
  selectedUnits = [];
  document.querySelectorAll('.unit-btn').forEach(btn => {
    btn.classList.add('selected');
    selectedUnits.push(parseInt(btn.dataset.unit));
  });
  updateSelectedCount();
}

function clearAllUnits() {
  selectedUnits = [];
  document.querySelectorAll('.unit-btn').forEach(btn => btn.classList.remove('selected'));
  updateSelectedCount();
}

function updateSelectedCount() {
  const el = document.getElementById('selected-count');
  el.textContent = selectedUnits.length > 0 ? `${selectedUnits.length}개 단원 선택됨` : '단원을 선택해주세요';
}

function goToStep3() {
  if (selectedUnits.length === 0) { alert('최소 1개 단원을 선택해주세요!'); return; }
  document.getElementById('step-units').classList.add('hidden');
  document.getElementById('step-type').classList.remove('hidden');
}

// ===== STEP 3 → 시험 시작 =====
async function startTest(type) {
  testType = type;
  document.getElementById('step-type').classList.add('hidden');

  // 문제 데이터 수집
  let allWords = [];
  selectedUnits.sort((a,b)=>a-b).forEach(u => {
    if (VOCAB_DATA[u]) allWords = allWords.concat(VOCAB_DATA[u].map(w => ({...w, unit: u})));
  });

  questions = shuffle([...allWords]);

  document.getElementById('test-area').classList.remove('hidden');
  document.getElementById('name-display').textContent = studentName;

  const typeNames = { korean:'한글 뜻 쓰기', english:'영어 스펠링 쓰기', mcq:'예문 TEST' };
  document.getElementById('test-title-display').textContent = typeNames[type];
  document.getElementById('test-sub-display').textContent = `Unit ${selectedUnits.join(', ')} · ${questions.length}문제`;

  if (type === 'mcq') {
    document.getElementById('loading-card').classList.remove('hidden');
    await generateMCQ(questions);
    document.getElementById('loading-card').classList.add('hidden');
  }

  renderQuestions();
}

// ===== 셔플 =====
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shuffleQuestions() {
  questions = shuffle([...questions]);
  renderQuestions();
}

// ===== MCQ 예문 생성 (Claude API) =====
async function generateMCQ(words) {
  // 배치로 나눠서 요청 (최대 10개씩)
  mcqData = [];
  const batchSize = 10;
  for (let i = 0; i < words.length; i += batchSize) {
    const batch = words.slice(i, i + batchSize);
    const wordList = batch.map(w => `${w.en} (${w.ko})`).join('\n');
    try {
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          messages: [{
            role: 'user',
            content: `다음 영어 단어들 각각에 대해 초등학교 6학년~중학교 2학년 수준의 영어 예문을 만들어줘.
예문에서 해당 단어 부분을 ___로 표시해줘.
오답 보기 3개도 같은 목록에서 골라줘 (정답과 다른 단어).
반드시 아래 JSON 형식으로만 응답해. 다른 말 없이:
[{"word":"단어","sentence":"예문(___ 포함)","answer":"정답","wrong":["오답1","오답2","오답3"]}]

단어 목록:
${wordList}`
          }]
        })
      });
      const data = await resp.json();
      const text = data.content?.[0]?.text || '[]';
      const clean = text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);
      mcqData = mcqData.concat(parsed);
    } catch(e) {
      // 실패 시 기본 예문 사용
      batch.forEach(w => mcqData.push({
        word: w.en,
        sentence: `The word ___ is very important.`,
        answer: w.en,
        wrong: getRandomWrong(w.en, words)
      }));
    }
  }
}

function getRandomWrong(correct, allWords) {
  const others = allWords.filter(w => w.en !== correct).map(w => w.en);
  shuffle(others);
  return others.slice(0, 3);
}

// ===== 문제 렌더링 =====
function renderQuestions() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  updateProgress(0, questions.length);

  questions.forEach((word, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q-${idx}`;

    if (testType === 'korean') {
      card.innerHTML = `
        <div class="q-number">문제 ${idx+1} / ${questions.length}</div>
        <div class="q-word">${word.en}</div>
        <input type="text" class="answer-input" id="ans-${idx}" placeholder="한글 뜻을 입력하세요" data-idx="${idx}" data-correct="${encodeURIComponent(word.ko)}" data-type="korean" oninput="updateProgress()" onkeydown="handleEnter(event,${idx})" autocomplete="off" />
        <div class="answer-feedback" id="fb-${idx}"></div>
      `;
    } else if (testType === 'english') {
      card.innerHTML = `
        <div class="q-number">문제 ${idx+1} / ${questions.length}</div>
        <div class="q-word ko">${word.ko}</div>
        <input type="text" class="answer-input" id="ans-${idx}" placeholder="영어 단어를 입력하세요" data-idx="${idx}" data-correct="${encodeURIComponent(word.en)}" data-type="english" oninput="updateProgress()" onkeydown="handleEnter(event,${idx})" autocomplete="off" spellcheck="false" />
        <div class="answer-feedback" id="fb-${idx}"></div>
      `;
    } else if (testType === 'mcq') {
      const mcq = mcqData.find(m => m.word === word.en) || {
        word: word.en,
        sentence: `The word ___ means "${word.ko}".`,
        answer: word.en,
        wrong: getRandomWrong(word.en, questions)
      };
      const options = shuffle([mcq.answer, ...mcq.wrong.slice(0,3)]);
      const optLabels = ['①','②','③','④'];
      const optionsHTML = options.map((opt, oi) => `
        <div class="mc-option" id="opt-${idx}-${oi}" onclick="selectOption(${idx},${oi},'${encodeURIComponent(opt)}','${encodeURIComponent(mcq.answer)}')" data-selected="false">
          <span class="opt-label">${optLabels[oi]}</span>
          <span>${opt}</span>
        </div>
      `).join('');
      card.innerHTML = `
        <div class="q-number">문제 ${idx+1} / ${questions.length}</div>
        <div class="sentence-text">${mcq.sentence.replace(/___/g, '<span class="blank">___</span>')}</div>
        <div class="mc-options" id="mc-${idx}">${optionsHTML}</div>
        <div class="answer-feedback" id="fb-${idx}"></div>
        <input type="hidden" id="ans-${idx}" data-idx="${idx}" data-correct="${encodeURIComponent(mcq.answer)}" data-type="mcq" data-answered="false" />
      `;
    }
    container.appendChild(card);
  });
}

function handleEnter(e, idx) {
  if (e.key === 'Enter') {
    const next = document.getElementById(`ans-${idx+1}`);
    if (next) next.focus();
  }
}

function selectOption(qIdx, optIdx, selected, correct) {
  const mc = document.getElementById(`mc-${qIdx}`);
  if (mc.dataset.done === 'true') return;
  mc.dataset.done = 'true';

  const sel = decodeURIComponent(selected);
  const cor = decodeURIComponent(correct);

  // 히든 input에 정답 기록
  const hidden = document.getElementById(`ans-${qIdx}`);
  hidden.value = sel;
  hidden.dataset.answered = 'true';

  // 보기 색칠
  mc.querySelectorAll('.mc-option').forEach((el, i) => {
    el.classList.add('disabled');
    const optText = el.querySelector('span:last-child').textContent;
    if (optText === cor) el.classList.add('correct');
    if (i === optIdx && sel !== cor) el.classList.add('wrong');
  });

  updateProgress();
}

function updateProgress() {
  const answered = questions.filter((_, idx) => {
    const inp = document.getElementById(`ans-${idx}`);
    if (!inp) return false;
    if (testType === 'mcq') return inp.dataset.answered === 'true';
    return inp.value.trim() !== '';
  }).length;
  const pct = Math.round((answered / questions.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ===== 채점 =====
function submitTest() {
  wrongAnswers = [];
  let correct = 0;

  questions.forEach((word, idx) => {
    const inp = document.getElementById(`ans-${idx}`);
    const fb = document.getElementById(`fb-${idx}`);
    const correctVal = decodeURIComponent(inp.dataset.correct);
    const userVal = inp.value.trim();
    const type = inp.dataset.type;

    let isCorrect = false;
    if (type === 'english') {
      isCorrect = userVal.toLowerCase() === correctVal.toLowerCase();
    } else if (type === 'korean') {
      isCorrect = gradeKorean(userVal, correctVal);
    } else if (type === 'mcq') {
      isCorrect = userVal === correctVal;
    }

    if (isCorrect) {
      correct++;
      inp.classList.add('correct');
      if (fb) { fb.textContent = '✅ 정답!'; fb.className = 'answer-feedback correct'; }
    } else {
      inp.classList.add('wrong');
      const displayQ = type === 'english' ? word.ko : word.en;
      if (fb) { fb.textContent = `❌ 정답: ${correctVal}`; fb.className = 'answer-feedback wrong'; }
      wrongAnswers.push({ q: word.en, ko: word.ko, myAnswer: userVal || '(무응답)', correct: correctVal });
    }

    // 입력 잠금
    if (type !== 'mcq') inp.readOnly = true;
  });

  const score = Math.round((correct / questions.length) * 100);
  showResult(score, correct);
}

function gradeKorean(userInput, correctVal) {
  if (!userInput) return false;
  const normalize = str => str.replace(/\s/g,'').replace(/[,\/]/g,' ').toLowerCase();
  const u = normalize(userInput);
  const c = normalize(correctVal);
  if (u === c) return true;
  // 정답의 여러 뜻 중 하나라도 포함되면 정답
  const correctParts = correctVal.split(/[,\/]/).map(p => normalize(p.trim())).filter(Boolean);
  return correctParts.some(cp => u.includes(cp) || cp.includes(u));
}

// ===== 결과 =====
function showResult(score, correct) {
  document.getElementById('test-area').classList.add('hidden');
  document.getElementById('result-area').classList.remove('hidden');

  document.getElementById('result-score').textContent = score;
  const msgs = score >= 90 ? '정말 잘했어요! 🎉' : score >= 70 ? '잘했어요! 👍' : score >= 50 ? '더 열심히 해봐요! 💪' : '다시 한 번 도전해봐요! 🔥';
  document.getElementById('result-title').textContent = msgs;
  document.getElementById('result-sub').textContent = `${questions.length}문제 중 ${correct}개 정답 · ${studentName} 학생`;

  const wrongList = document.getElementById('wrong-list');
  if (wrongAnswers.length === 0) {
    wrongList.innerHTML = '<div style="text-align:center;color:var(--secondary);font-weight:800;padding:16px">🎊 오답이 없어요! 완벽해요!</div>';
  } else {
    wrongList.innerHTML = `<div class="wrong-list-title">❌ 틀린 문제 (${wrongAnswers.length}개)</div>` +
      wrongAnswers.map(w => `
        <div class="wrong-item">
          <span class="wi-q">${w.q} (${w.ko})</span>
          <span class="wi-arrow">→</span>
          <span class="wi-correct">정답: ${w.correct}</span>
          <span class="wi-my">내 답: ${w.myAnswer}</span>
        </div>
      `).join('');
  }

  // Notion 전송
  sendToNotion(score, correct);
}

// ===== Notion 전송 =====
async function sendToNotion(score, correct) {
  if (wrongAnswers.length === 0 && score === 100) {
    // 만점도 전송
  }
  const status = document.getElementById('notion-status');
  status.className = 'notion-status sending';
  status.textContent = '📤 결과를 전송 중이에요...';
  status.classList.remove('hidden');

  const typeNames = { korean:'한글뜻쓰기', english:'영어스펠링쓰기', mcq:'예문TEST' };
  const wrongText = wrongAnswers.length === 0 ? '오답 없음 (만점)' :
    `[점수: ${score}점]\n` + wrongAnswers.map(w => `${w.q}(${w.ko}) → 내 답: ${w.myAnswer} / 정답: ${w.correct}`).join('\n');

  const unitRange = selectedUnits.length === 1 ? `Unit ${selectedUnits[0]}` :
    `Unit ${Math.min(...selectedUnits)}~${Math.max(...selectedUnits)}`;

  try {
    const resp = await fetch('https://dodamenglish.netlify.app/.netlify/functions/notion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        studentName: studentName,
        school: '',
        grade: '',
        workbook: '쓰방 중등 기본편',
        category: `단어편 - ${typeNames[testType]} (${unitRange})`,
        submitDate: new Date().toISOString().split('T')[0],
        wrongAnswers: wrongText,
        score: score
      })
    });
    if (resp.ok) {
      status.className = 'notion-status success';
      status.textContent = '✅ 결과가 선생님께 전송됐어요!';
    } else {
      throw new Error('전송 실패');
    }
  } catch(e) {
    status.className = 'notion-status error';
    status.textContent = '⚠️ 전송에 실패했어요. 선생님께 알려주세요.';
  }
}

// ===== 오답 재시험 =====
function retryWrong() {
  if (wrongAnswers.length === 0) return;
  const wrongWords = wrongAnswers.map(w => ({en: w.q, ko: w.ko}));
  questions = shuffle(wrongWords);
  wrongAnswers = [];
  mcqData = [];

  document.getElementById('result-area').classList.add('hidden');
  document.getElementById('test-area').classList.remove('hidden');

  const typeNames = { korean:'한글 뜻 쓰기', english:'영어 스펠링 쓰기', mcq:'예문 TEST' };
  document.getElementById('test-title-display').textContent = `🔄 오답 재시험 - ${typeNames[testType]}`;
  document.getElementById('test-sub-display').textContent = `${questions.length}문제`;

  if (testType === 'mcq') {
    document.getElementById('loading-card').classList.remove('hidden');
    generateMCQ(questions).then(() => {
      document.getElementById('loading-card').classList.add('hidden');
      renderQuestions();
    });
  } else {
    renderQuestions();
  }
}

// ===== 처음으로 =====
function resetToStart() {
  studentName = '';
  selectedUnits = [];
  testType = '';
  questions = [];
  wrongAnswers = [];
  mcqData = [];

  document.getElementById('step-name').classList.remove('hidden');
  document.getElementById('step-units').classList.add('hidden');
  document.getElementById('step-type').classList.add('hidden');
  document.getElementById('test-area').classList.add('hidden');
  document.getElementById('result-area').classList.add('hidden');
  document.getElementById('student-name').value = '';
}
