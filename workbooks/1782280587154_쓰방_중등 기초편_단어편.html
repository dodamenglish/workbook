<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쓰방 중등 기초편 - 단어편</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --green: #2d6a4f;
    --green-light: #52b788;
    --green-pale: #d8f3dc;
    --green-mid: #95d5b2;
    --bg: #f0faf4;
    --white: #ffffff;
    --gray: #6b7280;
    --gray-light: #f3f4f6;
    --dark: #1a2e23;
    --red: #dc2626;
    --red-light: #fee2e2;
    --blue: #2563eb;
    --blue-light: #dbeafe;
    --yellow: #f59e0b;
    --yellow-light: #fef3c7;
    --shadow: 0 4px 20px rgba(45,106,79,0.12);
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--dark);
  }

  .header {
    background: var(--green);
    color: white;
    padding: 16px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }
  .header h1 {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.5px;
  }
  .header p { font-size: 12px; opacity: 0.8; margin-top: 2px; }

  .screen { display: none; }
  .screen.active { display: block; }

  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  .card {
    background: white;
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }

  .step-badge {
    display: inline-block;
    background: var(--green);
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }

  h2 {
    font-size: 22px;
    font-weight: 900;
    color: var(--dark);
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 14px;
    color: var(--gray);
    margin-bottom: 20px;
  }

  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
    transition: border-color 0.2s;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--green-light); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 24px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    text-decoration: none;
  }
  .btn-primary {
    background: var(--green);
    color: white;
    width: 100%;
    font-size: 16px;
    padding: 16px;
  }
  .btn-primary:hover { background: var(--dark); transform: translateY(-1px); }
  .btn-secondary {
    background: var(--gray-light);
    color: var(--dark);
  }
  .btn-secondary:hover { background: #e5e7eb; }
  .btn-sm {
    padding: 8px 16px;
    font-size: 13px;
    border-radius: 8px;
  }
  .btn-outline {
    background: white;
    color: var(--green);
    border: 2px solid var(--green);
  }
  .btn-outline:hover { background: var(--green-pale); }

  /* Unit 선택 */
  .unit-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .unit-btn {
    padding: 10px 4px;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    background: white;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    font-family: inherit;
    color: var(--dark);
  }
  .unit-btn.selected {
    background: var(--green);
    border-color: var(--green);
    color: white;
  }
  .unit-select-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .selected-count {
    font-size: 13px;
    color: var(--gray);
    margin-bottom: 16px;
  }
  .selected-count span { color: var(--green); font-weight: 700; }

  /* 유형 선택 */
  .type-card {
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.2s;
    background: white;
    width: 100%;
    text-align: left;
    font-family: inherit;
  }
  .type-card:hover { border-color: var(--green-light); background: var(--green-pale); }
  .type-card .type-icon { font-size: 24px; margin-bottom: 6px; }
  .type-card .type-title { font-size: 16px; font-weight: 700; color: var(--dark); }
  .type-card .type-desc { font-size: 13px; color: var(--gray); margin-top: 4px; }

  /* 시험 화면 */
  .progress-bar-wrap {
    background: #e5e7eb;
    border-radius: 10px;
    height: 8px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar {
    background: linear-gradient(90deg, var(--green-light), var(--green));
    height: 100%;
    border-radius: 10px;
    transition: width 0.3s;
  }
  .q-counter {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .q-num { font-size: 13px; color: var(--gray); }
  .shuffle-btn {
    background: var(--green-pale);
    color: var(--green);
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .shuffle-btn:hover { background: var(--green-mid); color: white; }

  .question-box {
    background: linear-gradient(135deg, var(--green), var(--dark));
    color: white;
    border-radius: 14px;
    padding: 28px 24px;
    text-align: center;
    margin-bottom: 20px;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .question-word {
    font-size: 32px;
    font-weight: 900;
    font-family: 'Space Mono', monospace;
    letter-spacing: -1px;
  }
  .question-hint {
    font-size: 13px;
    opacity: 0.75;
    margin-top: 8px;
  }

  .answer-input-wrap {
    position: relative;
    margin-bottom: 12px;
  }
  .answer-input {
    width: 100%;
    padding: 16px 50px 16px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-size: 18px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .answer-input:focus { border-color: var(--green-light); }
  .answer-input.correct { border-color: #16a34a; background: #f0fdf4; }
  .answer-input.wrong { border-color: var(--red); background: var(--red-light); }

  .answer-feedback {
    display: none;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .answer-feedback.show { display: block; }
  .answer-feedback.correct { background: #dcfce7; color: #15803d; }
  .answer-feedback.wrong { background: var(--red-light); color: var(--red); }

  /* 객관식 */
  .mc-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .mc-btn {
    padding: 14px 12px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    background: white;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    font-weight: 500;
    line-height: 1.4;
  }
  .mc-btn:hover:not(:disabled) { border-color: var(--green-light); background: var(--green-pale); }
  .mc-btn.correct { background: #dcfce7; border-color: #16a34a; color: #15803d; font-weight: 700; }
  .mc-btn.wrong { background: var(--red-light); border-color: var(--red); color: var(--red); }
  .mc-btn.reveal { background: #dcfce7; border-color: #16a34a; color: #15803d; }
  .mc-btn:disabled { cursor: not-allowed; }

  .nav-btns {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .nav-btns .btn { flex: 1; }

  /* 결과 화면 */
  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--green-light), var(--green));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    color: white;
    box-shadow: 0 8px 30px rgba(45,106,79,0.3);
  }
  .score-circle .score-num { font-size: 42px; font-weight: 900; line-height: 1; }
  .score-circle .score-label { font-size: 12px; opacity: 0.85; margin-top: 4px; }

  .result-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-box {
    background: var(--gray-light);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .stat-box .stat-num { font-size: 24px; font-weight: 900; }
  .stat-box .stat-label { font-size: 11px; color: var(--gray); margin-top: 2px; }
  .stat-box.correct .stat-num { color: #16a34a; }
  .stat-box.wrong .stat-num { color: var(--red); }
  .stat-box.total .stat-num { color: var(--green); }

  .wrong-list { margin-bottom: 20px; }
  .wrong-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: var(--red-light);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .wrong-item .wi-en { font-weight: 700; font-family: 'Space Mono', monospace; color: var(--red); }
  .wrong-item .wi-ko { color: #991b1b; }
  .wrong-item .wi-my { font-size: 12px; color: var(--gray); }

  .notion-status {
    display: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    margin-top: 10px;
  }
  .notion-status.show { display: block; }
  .notion-status.sending { background: var(--yellow-light); color: #92400e; }
  .notion-status.success { background: #dcfce7; color: #15803d; }
  .notion-status.fail { background: var(--red-light); color: var(--red); }

  .result-actions { display: flex; flex-direction: column; gap: 10px; }

  /* 예문 문장 표시 */
  .example-sentence {
    font-size: 16px;
    line-height: 1.7;
    color: var(--dark);
    text-align: center;
    font-weight: 500;
  }
  .example-blank {
    display: inline-block;
    background: var(--green-pale);
    border-bottom: 3px solid var(--green);
    min-width: 80px;
    padding: 0 8px;
    font-weight: 700;
    color: var(--green);
  }

  /* 반응형 */
  @media (max-width: 400px) {
    .unit-grid { grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .unit-btn { font-size: 11px; padding: 8px 2px; }
    .mc-options { grid-template-columns: 1fr; }
    .question-word { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📚 쓰방 중등 기초편 — 단어편</h1>
  <p id="headerSub">도담한영어교실</p>
</div>

<!-- ① 이름 입력 -->
<div id="screen1" class="screen active">
  <div class="container">
    <div class="card">
      <div class="step-badge">STEP 1</div>
      <h2>이름을 입력하세요</h2>
      <p class="subtitle">학생 이름을 정확히 입력해 주세요</p>
      <input type="text" id="nameInput" placeholder="예) 홍길동" maxlength="20">
      <br><br>
      <label style="font-size:14px;color:#6b7280;margin-bottom:8px;display:block;">학교</label>
      <input type="text" id="schoolInput" placeholder="예) 도담중학교" maxlength="30">
      <br><br>
      <label style="font-size:14px;color:#6b7280;margin-bottom:8px;display:block;">학년</label>
      <input type="text" id="gradeInput" placeholder="예) 2학년" maxlength="10">
      <br><br>
      <button class="btn btn-primary" onclick="goStep2()">다음 →</button>
    </div>
  </div>
</div>

<!-- ② Unit 선택 -->
<div id="screen2" class="screen">
  <div class="container">
    <div class="card">
      <div class="step-badge">STEP 2</div>
      <h2>시험 범위 선택</h2>
      <p class="subtitle">공부할 Unit을 선택하세요 (복수 선택 가능)</p>
      <div class="unit-select-actions">
        <button class="btn btn-secondary btn-sm" onclick="selectAllUnits()">전체 선택</button>
        <button class="btn btn-secondary btn-sm" onclick="clearUnits()">전체 해제</button>
      </div>
      <div class="unit-grid" id="unitGrid"></div>
      <p class="selected-count">선택된 Unit: <span id="selectedCount">0</span>개</p>
      <button class="btn btn-primary" onclick="goStep3()">다음 →</button>
    </div>
  </div>
</div>

<!-- ③ 유형 선택 -->
<div id="screen3" class="screen">
  <div class="container">
    <div class="card">
      <div class="step-badge">STEP 3</div>
      <h2>시험 유형 선택</h2>
      <p class="subtitle">원하는 시험 방식을 선택하세요</p>
      <button class="type-card" onclick="startTest('meaning')">
        <div class="type-icon">📝</div>
        <div class="type-title">한글 뜻 쓰기</div>
        <div class="type-desc">영어 단어를 보고 한글 뜻을 직접 입력 · 전체 단어 출제</div>
      </button>
      <button class="type-card" onclick="startTest('spelling')">
        <div class="type-icon">✏️</div>
        <div class="type-title">영어 스펠링 쓰기</div>
        <div class="type-desc">한글 뜻을 보고 영어 단어를 직접 입력 · 전체 단어 출제</div>
      </button>
      <button class="type-card" onclick="startTest('example')">
        <div class="type-icon">🔤</div>
        <div class="type-title">예문 TEST</div>
        <div class="type-desc">예문 빈칸 채우기 + 단어 뜻 고르기 · 랜덤 15개 출제</div>
      </button>
    </div>
  </div>
</div>

<!-- ④ 시험 진행 -->
<div id="screen4" class="screen">
  <div class="container">
    <div class="card">
      <div class="q-counter">
        <span class="q-num" id="qCounter">1 / 30</span>
        <button class="shuffle-btn" id="shuffleBtn" onclick="shuffleQuestions()" style="display:none;">🔀 단어 섞기</button>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progressBar" style="width:0%"></div>
      </div>
      <div class="question-box" id="questionBox">
        <div>
          <div class="question-word" id="questionWord">-</div>
          <div class="question-hint" id="questionHint"></div>
        </div>
      </div>

      <!-- 타이핑 입력 -->
      <div id="typingArea">
        <div class="answer-input-wrap">
          <input type="text" class="answer-input" id="answerInput" placeholder="정답을 입력하세요" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="answer-feedback" id="answerFeedback"></div>
        <div class="nav-btns">
          <button class="btn btn-secondary" id="checkBtn" onclick="checkAnswer()">✓ 확인</button>
          <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">다음 →</button>
        </div>
      </div>

      <!-- 객관식 -->
      <div id="mcArea" style="display:none;">
        <div class="mc-options" id="mcOptions"></div>
        <div class="answer-feedback" id="mcFeedback"></div>
        <div class="nav-btns">
          <button class="btn btn-primary" id="mcNextBtn" onclick="nextQuestion()" style="display:none;">다음 →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ⑤ 결과 -->
<div id="screen5" class="screen">
  <div class="container">
    <div class="card" style="text-align:center;">
      <div class="step-badge">결과</div>
      <h2 id="resultTitle">시험 완료! 🎉</h2>
      <br>
      <div class="score-circle">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-label">점</div>
      </div>
      <div class="result-stats">
        <div class="stat-box total"><div class="stat-num" id="statTotal">0</div><div class="stat-label">전체</div></div>
        <div class="stat-box correct"><div class="stat-num" id="statCorrect">0</div><div class="stat-label">정답</div></div>
        <div class="stat-box wrong"><div class="stat-num" id="statWrong">0</div><div class="stat-label">오답</div></div>
      </div>
    </div>

    <div class="card" id="wrongListCard" style="display:none;">
      <h2 style="font-size:18px;margin-bottom:12px;">❌ 오답 목록</h2>
      <div class="wrong-list" id="wrongList"></div>
    </div>

    <div class="card">
      <div class="result-actions">
        <button class="btn btn-primary" id="notionBtn" onclick="sendToNotion()">📤 오답 Notion 전송</button>
        <div class="notion-status" id="notionStatus"></div>
        <button class="btn btn-outline" onclick="retryWrong()" id="retryBtn">🔄 오답 다시 풀기</button>
        <button class="btn btn-secondary" onclick="goHome()">🏠 처음으로</button>
      </div>
    </div>
  </div>
</div>

<script>
// ──────────────────────────────────────────
// 단어 데이터 (Unit 1~30)
// ──────────────────────────────────────────
const WORD_DATA = {

// ──────────────────────────────────────────
// 전역 상태
// ──────────────────────────────────────────
let studentName = '', studentSchool = '', studentGrade = '';
let selectedUnits = new Set();
let testType = '';
let questions = [];
let currentQ = 0;
let wrongs = [];
let answered = false;
let allWordPool = [];

// ──────────────────────────────────────────
// STEP 1 → 2
// ──────────────────────────────────────────
function goStep2() {
  studentName = document.getElementById('nameInput').value.trim();
  studentSchool = document.getElementById('schoolInput').value.trim();
  studentGrade = document.getElementById('gradeInput').value.trim();
  if (!studentName) { alert('이름을 입력해 주세요.'); return; }
  document.getElementById('headerSub').textContent = `${studentName} · ${studentSchool} ${studentGrade}`;
  buildUnitGrid();
  showScreen('screen2');
}

function buildUnitGrid() {
  const grid = document.getElementById('unitGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= 30; i++) {
    const btn = document.createElement('button');
    btn.className = 'unit-btn';
    btn.textContent = `U${i}`;
    btn.onclick = () => toggleUnit(i, btn);
    grid.appendChild(btn);
  }
}

function toggleUnit(n, btn) {
  if (selectedUnits.has(n)) { selectedUnits.delete(n); btn.classList.remove('selected'); }
  else { selectedUnits.add(n); btn.classList.add('selected'); }
  document.getElementById('selectedCount').textContent = selectedUnits.size;
}

function selectAllUnits() {
  selectedUnits = new Set([...Array(30)].map((_,i)=>i+1));
  document.querySelectorAll('.unit-btn').forEach(b=>b.classList.add('selected'));
  document.getElementById('selectedCount').textContent = 30;
}

function clearUnits() {
  selectedUnits.clear();
  document.querySelectorAll('.unit-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('selectedCount').textContent = 0;
}

function goStep3() {
  if (selectedUnits.size === 0) { alert('Unit을 1개 이상 선택해 주세요.'); return; }
  showScreen('screen3');
}

// ──────────────────────────────────────────
// STEP 3 → 시험 시작
// ──────────────────────────────────────────
function startTest(type) {
  testType = type;
  // 선택된 Unit의 단어 모으기
  allWordPool = [];
  selectedUnits.forEach(u => {
    if (WORD_DATA[u]) allWordPool.push(...WORD_DATA[u]);
  });

  if (type === 'meaning' || type === 'spelling') {
    questions = shuffle([...allWordPool]);
    document.getElementById('shuffleBtn').style.display = 'inline-block';
  } else {
    // 예문: 예문 데이터에 있는 단어만 추출
    const exampleWords = allWordPool.filter(w => EXAMPLE_DATA[w.en]);
    if (exampleWords.length < 4) { alert('선택한 Unit에 예문 데이터가 부족합니다. 더 많은 Unit을 선택해 주세요.'); return; }
    const shuffled = shuffle([...exampleWords]);
    questions = shuffled.slice(0, Math.min(15, shuffled.length));
    document.getElementById('shuffleBtn').style.display = 'none';
  }

  wrongs = [];
  currentQ = 0;
  showScreen('screen4');
  renderQuestion();
}

// ──────────────────────────────────────────
// 문제 렌더링
// ──────────────────────────────────────────
function renderQuestion() {
  if (currentQ >= questions.length) { showResult(); return; }
  answered = false;
  const q = questions[currentQ];
  const total = questions.length;
  document.getElementById('qCounter').textContent = `${currentQ+1} / ${total}`;
  document.getElementById('progressBar').style.width = `${(currentQ/total)*100}%`;

  if (testType === 'meaning') {
    document.getElementById('typingArea').style.display = 'block';
    document.getElementById('mcArea').style.display = 'none';
    document.getElementById('questionWord').textContent = q.en;
    document.getElementById('questionHint').textContent = '한글 뜻을 입력하세요';
    resetTyping();
  } else if (testType === 'spelling') {
    document.getElementById('typingArea').style.display = 'block';
    document.getElementById('mcArea').style.display = 'none';
    document.getElementById('questionWord').textContent = q.ko;
    document.getElementById('questionHint').textContent = '영어 단어를 입력하세요';
    resetTyping();
  } else {
    renderMC(q);
  }
}

function resetTyping() {
  const inp = document.getElementById('answerInput');
  inp.value = '';
  inp.className = 'answer-input';
  inp.disabled = false;
  document.getElementById('answerFeedback').className = 'answer-feedback';
  document.getElementById('answerFeedback').textContent = '';
  document.getElementById('checkBtn').style.display = 'inline-flex';
  document.getElementById('nextBtn').style.display = 'none';
  setTimeout(() => inp.focus(), 100);
  inp.onkeydown = (e) => { if (e.key === 'Enter') { if (!answered) checkAnswer(); else nextQuestion(); }};
}

function checkAnswer() {
  if (answered) return;
  answered = true;
  const q = questions[currentQ];
  const inp = document.getElementById('answerInput');
  const userAns = inp.value.trim();
  const fb = document.getElementById('answerFeedback');
  let isCorrect = false;

  if (testType === 'meaning') {
    // 한글 뜻 - 부분 매칭 허용 (정답에 포함된 단어 하나라도 있으면)
    const correctKo = q.ko;
    const correctParts = correctKo.split(/[,，\s]+/).map(s=>s.trim()).filter(Boolean);
    isCorrect = correctParts.some(p => userAns.includes(p) || p.includes(userAns)) && userAns.length > 0;
    if (!isCorrect && userAns.length > 0) {
      // 완전 일치도 체크
      isCorrect = userAns === correctKo || correctKo.includes(userAns);
    }
  } else {
    isCorrect = userAns.toLowerCase() === q.en.toLowerCase();
  }

  if (isCorrect) {
    inp.className = 'answer-input correct';
    fb.className = 'answer-feedback correct show';
    fb.textContent = '✓ 정답!';
  } else {
    inp.className = 'answer-input wrong';
    fb.className = 'answer-feedback wrong show';
    fb.textContent = `✗ 오답 — 정답: ${testType === 'meaning' ? q.ko : q.en}`;
    wrongs.push({ q, userAns, type: testType });
  }

  document.getElementById('checkBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'inline-flex';
}

function renderMC(q) {
  document.getElementById('typingArea').style.display = 'none';
  document.getElementById('mcArea').style.display = 'block';

  // 반반: 짝수 인덱스 = 빈칸, 홀수 = 뜻 고르기
  const isBlank = currentQ % 2 === 0;
  const exArr = EXAMPLE_DATA[q.en];
  const ex = exArr ? exArr[Math.floor(Math.random()*exArr.length)] : null;

  if (isBlank && ex) {
    // 빈칸 채우기
    const sentDisplay = ex.sent.replace('___', `<span class="example-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`);
    document.getElementById('questionWord').innerHTML = '';
    document.getElementById('questionHint').innerHTML = '';
    document.querySelector('.question-box').innerHTML = `<div><div class="example-sentence" style="color:white;font-size:15px;line-height:1.8;">${sentDisplay}</div><div style="font-size:12px;opacity:0.7;margin-top:10px;">빈칸에 알맞은 단어를 고르세요</div></div>`;
  } else {
    // 뜻 고르기
    document.querySelector('.question-box').innerHTML = `<div><div class="question-word">${q.en}</div><div class="question-hint" style="color:rgba(255,255,255,0.75);">단어의 뜻을 고르세요</div></div>`;
  }

  // 보기 4개 생성
  const wrongOptions = shuffle(allWordPool.filter(w => w.en !== q.en)).slice(0, 3);
  const opts = shuffle([q, ...wrongOptions]);
  const mcOpts = document.getElementById('mcOptions');
  mcOpts.innerHTML = '';
  document.getElementById('mcFeedback').className = 'answer-feedback';
  document.getElementById('mcNextBtn').style.display = 'none';

  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'mc-btn';
    btn.textContent = isBlank ? opt.en : opt.ko;
    btn.onclick = () => selectMC(opt, q, btn, isBlank);
    mcOpts.appendChild(btn);
  });
}

function selectMC(selected, correct, clickedBtn, isBlank) {
  const allBtns = document.querySelectorAll('.mc-btn');
  allBtns.forEach(b => b.disabled = true);
  const isCorrect = selected.en === correct.en;
  const fb = document.getElementById('mcFeedback');

  if (isCorrect) {
    clickedBtn.classList.add('correct');
    fb.className = 'answer-feedback correct show';
    fb.textContent = '✓ 정답!';
  } else {
    clickedBtn.classList.add('wrong');
    // 정답 표시
    allBtns.forEach(b => {
      const txt = b.textContent;
      const matchEn = isBlank ? txt === correct.en : false;
      const matchKo = !isBlank ? txt === correct.ko : false;
      if (matchEn || matchKo) b.classList.add('reveal');
    });
    fb.className = 'answer-feedback wrong show';
    fb.textContent = `✗ 오답 — 정답: ${correct.en} (${correct.ko})`;
    wrongs.push({ q: correct, userAns: selected.en, type: 'example' });
  }
  document.getElementById('mcNextBtn').style.display = 'inline-flex';
}

function nextQuestion() {
  currentQ++;
  renderQuestion();
}

function shuffleQuestions() {
  questions = shuffle([...questions.slice(currentQ), ...questions.slice(0, currentQ)]);
  currentQ = 0;
  wrongs = [];
  renderQuestion();
}

// ──────────────────────────────────────────
// 결과 화면
// ──────────────────────────────────────────
function showResult() {
  const total = questions.length;
  const wrongCount = wrongs.length;
  const correctCount = total - wrongCount;
  const score = Math.round((correctCount / total) * 100);

  document.getElementById('scoreNum').textContent = score;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statCorrect').textContent = correctCount;
  document.getElementById('statWrong').textContent = wrongCount;

  const typeName = {meaning:'한글뜻 쓰기', spelling:'영어 스펠링 쓰기', example:'예문 TEST'}[testType];
  document.getElementById('resultTitle').textContent = `${typeName} 완료! 🎉`;

  const wCard = document.getElementById('wrongListCard');
  const wList = document.getElementById('wrongList');
  if (wrongs.length > 0) {
    wCard.style.display = 'block';
    wList.innerHTML = wrongs.map(w =>
      `<div class="wrong-item">
        <span class="wi-en">${w.q.en}</span>
        <span class="wi-ko">${w.q.ko}</span>
        <span class="wi-my">내 답: ${w.userAns||'(없음)'}</span>
      </div>`
    ).join('');
  } else {
    wCard.style.display = 'none';
  }

  document.getElementById('notionBtn').disabled = false;
  document.getElementById('notionBtn').textContent = '📤 오답 Notion 전송';
  document.getElementById('notionStatus').className = 'notion-status';
  document.getElementById('retryBtn').style.display = wrongs.length > 0 ? 'inline-flex' : 'none';

  showScreen('screen5');
}

async function sendToNotion() {
  const btn = document.getElementById('notionBtn');
  const status = document.getElementById('notionStatus');
  btn.disabled = true;
  status.className = 'notion-status sending show';
  status.textContent = '⏳ 전송 중...';

  const typeName = {meaning:'한글뜻 쓰기', spelling:'영어 스펠링 쓰기', example:'예문 TEST'}[testType];
  const unitList = [...selectedUnits].sort((a,b)=>a-b).map(u=>`Unit${u}`).join(', ');
  const wrongText = wrongs.length > 0
    ? wrongs.map(w => `${w.q.en} (${w.q.ko}) → 내 답: ${w.userAns||'없음'}`).join('\n')
    : '오답 없음 (만점!)';

  const score = Math.round(((questions.length - wrongs.length) / questions.length) * 100);
  const wrongsWithScore = `[점수: ${score}점]\n${wrongText}`;

  try {
    const res = await fetch('https://dodamenglish.netlify.app/.netlify/functions/notion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        studentName,
        school: studentSchool,
        grade: studentGrade,
        workbook: `쓰방 중등 기초편 단어편 (${unitList})`,
        category: typeName,
        submitDate: new Date().toISOString().split('T')[0],
        wrongAnswers: wrongsWithScore
      })
    });
    if (res.ok) {
      status.className = 'notion-status success show';
      status.textContent = '✅ Notion에 전송 완료!';
    } else { throw new Error(); }
  } catch {
    status.className = 'notion-status fail show';
    status.textContent = '⚠️ 전송 실패 — 선생님께 알려주세요';
    btn.disabled = false;
    btn.textContent = '다시 전송';
  }
}

function retryWrong() {
  if (wrongs.length === 0) return;
  questions = shuffle(wrongs.map(w => w.q));
  wrongs = [];
  currentQ = 0;
  showScreen('screen4');
  renderQuestion();
}

function goHome() {
  selectedUnits.clear();
  document.getElementById('selectedCount').textContent = 0;
  showScreen('screen1');
}

// ──────────────────────────────────────────
// 유틸
// ──────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
