<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메타보카 고등편 · 단어 테스트 (DAY 01~50)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2230; --muted:#6b7280; --line:#e6e8ee; --paper:#fbfbfd; --card:#ffffff;
    --k2e:#0d9488; --k2e-soft:#e6f6f4;   /* 한→영 : teal */
    --e2k:#7c3aed; --e2k-soft:#f1ecfe;   /* 영→한 : purple */
    --ok:#16a34a; --ok-soft:#e8f7ee; --no:#e11d48; --no-soft:#fdecef;
    --shadow:0 1px 2px rgba(20,25,40,.04), 0 8px 24px rgba(20,25,40,.06);
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{
    font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;color:var(--ink);
    background:
      radial-gradient(1200px 600px at 100% -10%, #eef2ff 0%, transparent 55%),
      radial-gradient(900px 500px at -10% 0%, #e9fbf7 0%, transparent 50%),
      var(--paper);
    line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px;margin:0 auto;padding:28px 18px 96px}

  /* ---------- header ---------- */
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:0 0 6px}
  h1{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:clamp(26px,6vw,40px);letter-spacing:-.01em;margin:0;line-height:1.1}
  h1 .num{color:var(--k2e)}
  .sub{color:var(--muted);font-size:14px;margin-top:8px}
  .sub b{color:var(--ink)}

  .meta{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:18px;padding:14px 16px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;font-weight:700;color:var(--muted)}
  .field label span{font-weight:400}
  .field input{font:inherit;font-weight:600;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:160px}
  .field input:focus-visible{outline:2px solid var(--k2e);outline-offset:1px}
  .scoreboard{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sbday{font-size:12px;font-weight:700;color:var(--muted);align-self:center;margin-right:2px}
  .pill{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:74px;padding:8px 12px;
    border-radius:12px;border:1px solid var(--line);background:#fff;line-height:1.15}
  .pill b{font-size:20px}.pill span{font-size:11px;color:var(--muted);font-weight:600}
  .pill.k2e b{color:var(--k2e)}.pill.e2k b{color:var(--e2k)}

  /* ---------- day selector (50일 그리드) ---------- */
  .dayhead{display:flex;align-items:baseline;gap:10px;margin:26px 0 8px;flex-wrap:wrap}
  .dayhead h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
  .dayhead .hint{font-size:12px;color:#9aa0ad}
  .dayselect{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;
    background:#eceef3;padding:8px;border-radius:14px;margin:0 0 16px}
  @media (max-width:820px){.dayselect{grid-template-columns:repeat(5,minmax(0,1fr))}}
  .dayselect button{border:1px solid transparent;background:#fff;font:inherit;font-weight:700;font-size:13px;
    padding:9px 0;border-radius:9px;cursor:pointer;color:var(--muted);transition:.12s;position:relative}
  .dayselect button:hover{color:var(--ink)}
  .dayselect button[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:var(--shadow)}
  .dayselect button.done::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:4px;
    width:14px;height:3px;border-radius:2px;background:var(--ok)}
  .dayselect button[aria-selected="true"].done::after{background:#7ee2a8}
  .dayselect button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* ---------- mode tabs ---------- */
  .tabs{display:flex;gap:6px;margin:0 0 -1px;position:relative;z-index:2}
  .tab{appearance:none;border:1px solid var(--line);border-bottom:none;background:#f4f5f8;color:var(--muted);
    font:inherit;font-weight:700;padding:12px 18px;border-radius:12px 12px 0 0;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s}
  .tab .dot{width:9px;height:9px;border-radius:50%}
  .tab[data-mode="k2e"] .dot{background:var(--k2e)} .tab[data-mode="e2k"] .dot{background:var(--e2k)}
  .tab small{font-weight:600;color:#9aa0ad;font-size:12px}
  .tab[aria-selected="true"]{background:#fff;color:var(--ink)}
  .tab[data-mode="k2e"][aria-selected="true"]{box-shadow:inset 0 3px 0 var(--k2e)}
  .tab[data-mode="e2k"][aria-selected="true"]{box-shadow:inset 0 3px 0 var(--e2k)}
  .tab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  @media (max-width:560px){.tab{padding:10px 12px}.tab small{display:none}}

  .panel{background:#fff;border:1px solid var(--line);border-radius:0 14px 14px 14px;box-shadow:var(--shadow);padding:16px 14px;position:relative;z-index:1}
  .panel-hint{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:2px 4px 14px;border-bottom:1px dashed var(--line);margin-bottom:8px;flex-wrap:wrap}
  .panel-hint .tag{font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px;color:#fff}
  .panel.mode-k2e .tag{background:var(--k2e)} .panel.mode-e2k .tag{background:var(--e2k)}

  /* ---------- rows ---------- */
  ol.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
  @media (max-width:700px){ol.list{grid-template-columns:1fr}}
  .panel.mode-k2e ol.list{grid-template-columns:1fr}   /* 뜻이 길어서 1열 */
  .row{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:8px 6px;border-radius:10px}
  .row .no{font-weight:700;color:#aeb4bf;font-size:13px;text-align:right;padding-top:9px}
  .qa{min-width:0}
  .q{font-weight:600;font-size:15px;word-break:keep-all}
  .q .en{font-weight:700;letter-spacing:.01em}
  .pos{font-style:normal;font-size:10.5px;font-weight:700;color:#fff;background:#aeb4bf;border-radius:5px;padding:1px 5px;margin-right:3px;position:relative;top:-1px}
  .ans{margin-top:5px;display:flex;align-items:center;gap:6px}
  .ans input{font:inherit;width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .panel.mode-k2e .ans input{max-width:340px}
  .panel.mode-k2e .ans input:focus-visible{outline:2px solid var(--k2e);outline-offset:1px}
  .panel.mode-e2k .ans input:focus-visible{outline:2px solid var(--e2k);outline-offset:1px}
  .row.correct{background:var(--ok-soft)} .row.wrong{background:var(--no-soft)}
  .row.correct input{border-color:#bfe6cd} .row.wrong input{border-color:#f3c2cc}
  .mark{font-weight:800;font-size:15px;flex:0 0 auto}
  .row.correct .mark{color:var(--ok)} .row.wrong .mark{color:var(--no)}
  .sol{font-size:12.5px;color:var(--muted);margin-top:3px;display:none;word-break:keep-all}
  .row.graded .sol{display:block} .sol b{color:var(--ink);font-weight:700}
  .toggle{font-size:11px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 7px;cursor:pointer;color:var(--muted);white-space:nowrap}
  .toggle:hover{color:var(--ink)} .row:not(.graded) .toggle{display:none}

  /* ---------- bars & buttons ---------- */
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
  button.btn{font:inherit;font-weight:700;border:none;border-radius:11px;padding:11px 18px;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
  .btn.grade{background:var(--ink);color:#fff} .btn.grade:hover{transform:translateY(-1px)}
  .btn.reset{background:#fff;color:var(--muted);border:1px solid var(--line);box-shadow:none}
  .btn.retry{background:#fff;color:var(--no);border:1px solid #f3c2cc;box-shadow:none}
  .btn.submit{background:linear-gradient(135deg,var(--k2e),var(--e2k));color:#fff}
  .btn.submit:hover{transform:translateY(-1px)}
  .bar .spacer{flex:1}.barnote{font-size:12px;color:var(--muted)}

  /* ---------- modal ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(20,25,40,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
  .backdrop.show{display:flex}
  .modal{width:min(560px,100%);background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(20,25,40,.28);overflow:hidden;max-height:90vh;display:flex;flex-direction:column}
  .modal-head{padding:20px 22px 6px}.modal-head h2{margin:0;font-size:20px}.modal-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
  .modal-body{padding:8px 22px 4px;overflow:auto}
  .scoreline{display:flex;gap:10px;margin:12px 0}
  .scoreline .box{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .scoreline .box b{font-size:26px;display:block}
  .scoreline .k2e b{color:var(--k2e)}.scoreline .e2k b{color:var(--e2k)}.scoreline .tot b{color:var(--ink)}
  .scoreline small{font-size:11px;color:var(--muted);font-weight:600}
  .wronglist{font-size:13px;margin:6px 0 14px}.wronglist h4{margin:12px 0 6px;font-size:13px}
  .chip{display:inline-block;background:var(--no-soft);color:var(--no);border:1px solid #f3c2cc;border-radius:999px;padding:2px 9px;margin:2px 4px 2px 0;font-size:12px;font-weight:600}
  .status{font-size:13px;padding:10px 12px;border-radius:10px;margin:4px 0 6px;display:none}
  .status.info{display:block;background:#eef2ff;color:#3730a3}
  .status.good{display:block;background:var(--ok-soft);color:#166534}
  .status.err{display:block;background:var(--no-soft);color:#9f1239}
  .modal-foot{display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px 20px;border-top:1px solid var(--line)}
  .modal-foot .btn{box-shadow:none}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn.primary{background:var(--ink);color:#fff}
  @media print{
    body{background:#fff}
    .dayselect,.dayhead,.bar,.scoreboard,.backdrop,.tabs{display:none!important}
    .panel{box-shadow:none;border-radius:12px;border:none}
    .panel.mode-k2e ol.list{grid-template-columns:1fr 1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">A*List METAVOCA · 고등편</p>
    <h1>메타보카 고등편 <span class="num">단어 테스트</span></h1>
    <p class="sub">DAY 01~50 &nbsp;|&nbsp; 각 40단어 (총 2,000단어) &nbsp;|&nbsp; 아래에서 <b>DAY</b>를 고르고 <b>한 → 영</b> / <b>영 → 한</b> 탭으로 풀어요.</p>

    <div class="meta">
      <div class="field">
        <label for="student">이름</label>
        <input id="student" type="text" placeholder="이름을 입력하세요" autocomplete="off">
      </div>
      <div class="field">
        <label for="clazz">반 / 번호 <span>(선택)</span></label>
        <input id="clazz" type="text" placeholder="예: 고1 A반" autocomplete="off">
      </div>
      <div class="scoreboard">
        <span class="sbday" id="sbDay">DAY 01</span>
        <div class="pill k2e"><b id="sb-k2e">–</b><span>한→영</span></div>
        <div class="pill e2k"><b id="sb-e2k">–</b><span>영→한</span></div>
        <div class="pill"><b id="sb-tot">–</b><span>합계</span></div>
      </div>
    </div>
  </header>

  <div class="dayhead">
    <h2>DAY 선택</h2>
    <span class="hint">채점을 마친 DAY에는 초록 표시가 생겨요</span>
  </div>
  <div class="dayselect" role="tablist" aria-label="DAY 선택" id="daySelect"></div>
  <div id="days"></div>

  <div class="bar" style="border:none;margin-top:20px">
    <button class="btn submit" id="submitBtn">결과 보기 / 저장</button>
    <span class="barnote">현재 보고 있는 <b id="submitDayLabel">DAY 01</b>을 채점한 뒤 눌러 주세요.</span>
  </div>
</div>

<!-- ===== 결과 모달 ===== -->
<div class="backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-head">
      <h2 id="mTitle">테스트 결과</h2>
      <p id="mWho"></p>
    </div>
    <div class="modal-body">
      <div class="scoreline">
        <div class="box k2e"><b id="r-k2e">0/40</b><small>한 → 영</small></div>
        <div class="box e2k"><b id="r-e2k">0/40</b><small>영 → 한</small></div>
        <div class="box tot"><b id="r-tot">0/80</b><small>합계</small></div>
      </div>
      <div class="wronglist" id="wrongWrap"></div>
      <div class="status" id="status"></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="copyBtn">결과 복사</button>
      <button class="btn ghost" id="downloadBtn">JSON 저장</button>
      <span style="flex:1"></span>
      <button class="btn primary" id="closeBtn">닫기</button>
    </div>
  </div>
</div>

<script>
/* ---------------- 단어 데이터 (A*List 메타보카 고등편 · Word Test 한-영 Answer Key 기준) ---------------- */
const DAYS = [
  {id:1, label:"DAY 01", words:[
    ["contemporary","[형] 동시대의; 현대의, 최신의  [명] 같은 시대의 사람, 동기생"],
    ["appreciate","[동] (진가를) 알다, 감상하다; 감사하다"],
    ["promote","[동] 촉진하다, 조장하다, 장려하다; 홍보하다; 승진시키다"],
    ["conduct","[동] 수행하다, 실시하다; 지휘하다; 안내하다  [명] 행동"],
    ["preserve","[동] 보호하다, 지키다, 보존하다"],
    ["submit","[동] 제출하다; ((~ to)) 굴복하다, 복종하다"],
    ["superior","[형] 우수한, 우월한;  상관의, 상급의  [명] 상관, 선배"],
    ["alternative","[형] 대안적인, 대체할 수 있는  [명] 대안"],
    ["evolve","[동] 진화하다, 진화시키다; 발전시키다"],
    ["confront","[동] (문제나 어려움에) 직면하다; 맞서다"],
    ["adopt","[동]  채택하다, 채용하다; 입양하다"],
    ["adjust","[동] 맞추다, 조정하다; ((~ to)) ~에 적응하다"],
    ["evaluate","[동] (가치를) 평가하다"],
    ["feature","[명] 특징; 특집 기사; 생김새  [동] 특징으로 삼다; 특별히 다루다, 선보이다"],
    ["modify","[동] 수정하다, 변경하다"],
    ["abstract","[형] 추상적인, 관념적인  [명] 요약  [동] 발췌하다, 추출하다"],
    ["exceed","[동] (범위, 한도를) 초과하다, 넘다, 능가하다"],
    ["convey","[동] (생각, 감정 등을) 전달하다; 운반하다"],
    ["collapse","[동] 무너지다, 붕괴하다  [명] 붕괴, 폭락"],
    ["contradict","[동] 반박하다, 부정하다;  ~과 모순되다"],
    ["reinforce","[동] 강화하다; 보강하다"],
    ["substitute","[동] ((~ A with B)) A 대신 B로 대체하다, 대신하다  [명] 대용품, 대리인"],
    ["annual","[형] 해마다의, 연간의  [명] 연감, 연보"],
    ["interfere","[동] 간섭하다, 참견하다; ((~ with)) 방해하다"],
    ["adapt","[동] (상황에) 적응하다, 조정하다; 개조하다, 각색하다"],
    ["reserve","[동] 예약하다; 보류하다; (권리, 이익을) 보유하다  [명] 비축(물)"],
    ["compound","[명] 합성물, 화합물; 건물 안, 구내  [동] 악화시키다, 혼합하다"],
    ["reflect","[동] (빛 등을) 비추다, 반사하다; 반영하다, 나타내다; 숙고하다"],
    ["heritage","[명] (국가, 사회의) 유산, 전통"],
    ["perspective","[명] 관점, 시각"],
    ["eliminate","[동] 제거하다, 없애다; 제외하다"],
    ["attribute","[동] ~의 결과로 여기다, ~의 덕[탓]으로 보다  [명] 자질, 특성"],
    ["account","[명] 계좌, 계정; 설명; 이유  [동] ((~ for)) 설명하다; 차지하다"],
    ["assume","[동] 가정하다; 떠맡다; (태도를) 취하다"],
    ["transmit","[동] 보내다, 전송하다; (빛을) 투과시키다"],
    ["pursue","[동] 추구하다, (일, 연구 등을) 추진하다; (뒤)쫓다"],
    ["sufficient","[형] 충분한"],
    ["attain","[동] (노력 끝에) 달성하다; 획득하다; 도달하다"],
    ["perceive","[동] 인식하다, ~으로 여기다; 감지하다"],
    ["contract","[명] 계약(서)  [동] 계약을 맺다; 수축하다; (병에) 걸리다"],
  ]},
  {id:2, label:"DAY 02", words:[
    ["permit","[동] 허가하다, 허용하다  [명] 허가(증)"],
    ["confirm","[동] (사실임을) 확인하다, 입증하다"],
    ["conflict","[명] 갈등, 충돌  [동] 충돌하다"],
    ["justify","[동] 정당화하다"],
    ["inspect","[동] (면밀하게) 검사하다, 점검하다; 시찰하다"],
    ["predict","[동] 예측하다, 예언하다"],
    ["laboratory","[명] 실험실, 연구소  [형] 실험용의"],
    ["inspire","[동] 영감을 주다; 자극하다, 고취시키다"],
    ["demonstrate","[동] 입증하다; 설명하다, (시범으로) 보여주다; 시위하다"],
    ["principle","[명] 원리, 원칙"],
    ["phenomenon","[명] 현상"],
    ["replace","[동] 대체하다, 대신하다; (낡은 것을) 교체하다"],
    ["define","[동] 정의하다, 규정하다; 분명히 드러내다"],
    ["overcome","[동] 극복하다; 압도하다"],
    ["potential","[형] 잠재적인, 가능성이 있는  [명] 잠재력, 가능성"],
    ["conform","[동] ((~ to)) (규칙에) 따르다, 순응하다"],
    ["measure","[동] 측정하다; 평가하다  [명] ((~s)) 대책, 조치; 정도"],
    ["restrict","[동] 제한하다"],
    ["fundamental","[형] 근본적인, 기초의  [명] 기본"],
    ["specific","[형] 특정한; 구체적인"],

/* words -> 객체화 + 채점용 조각 계산 */
const IGNORE = new Set(["하다","되다","이다","것","사람","등을","등","시키다","의","을","를",""]);
function fragments(ko){
  return ko
    .replace(/\(\([^)]*\)\)/g,",")     /* ((~ to)) 같은 어법 표시 -> 구분 */
    .replace(/\[[^\]]{1,4}\]/g,",")    /* [동] [형] 품사 표시 -> 구분 */
    .replace(/[()\[\]]/g,",")
    .replace(/[~·]/g,"")
    .split(/[,;/]/).map(s=>s.replace(/\s+/g,""))
    .filter(s=>s.length>=1 && !IGNORE.has(s));
}
DAYS.forEach(d=> d.words = d.words.map((w,i)=>({no:i+1, en:w[0], ko:w[1], frags:fragments(w[1])})));
const dayById = id => DAYS.find(d=>d.id===id);
const TOTAL = 40;

/* 품사 표시를 배지로 */
function koHTML(ko){ return ko.replace(/\[([가-힣]{1,3})\]/g,'<i class="pos">$1</i>'); }

/* 영→한 : 뜻 하나만 맞아도 정답. 어미 차이(~하다/~의 등)는 허용하되
   "동", "명" 같은 한두 글자 답이 통과하지 않도록 길이 차이를 제한 */
function checkKo(word, raw){
  const ans = (raw||"").replace(/\s+/g,"").replace(/[.,·]/g,"").trim();
  if(!ans) return false;
  return word.frags.some(f=>{
    if(ans===f) return true;
    if(ans.length<2 || f.length<2) return false;
    const [lo,sh] = ans.length>=f.length ? [ans,f] : [f,ans];
    const slack = sh.length>=4 ? 4 : 2;          /* 짧은 뜻일수록 엄격하게 */
    return lo.includes(sh) && (lo.length - sh.length) <= slack;
  });
}
/* 한→영 : 영어 단어 정확일치 (대소문자·공백 무시) */
function checkEn(word, raw){
  const norm = s => (s||"").trim().toLowerCase().replace(/\s+/g," ");
  return norm(raw)!=="" && norm(raw) === norm(word.en);
}

function renderList(dayId, mode, onlyNos){
  const day = dayById(dayId);
  const ol = document.getElementById(`list-${dayId}-${mode}`);
  ol.innerHTML = "";
  const words = onlyNos ? day.words.filter(w=>onlyNos.includes(w.no)) : day.words;
  words.forEach(w=>{
    const li = document.createElement("li");
    li.className = "row"; li.dataset.no = w.no; li.dataset.day = dayId; li.dataset.mode = mode;
    const q = mode==="k2e" ? `<div class="q">${koHTML(w.ko)}</div>` : `<div class="q"><span class="en">${w.en}</span></div>`;
    const ph = mode==="k2e" ? "영어 단어" : "한글 뜻";
    li.innerHTML = `
      <div class="no">${w.no}</div>
      <div class="qa">
        ${q}
        <div class="ans">
          <input type="text" data-input data-day="${dayId}" data-mode="${mode}" data-no="${w.no}"
                 placeholder="${ph}" autocomplete="off" autocapitalize="off" spellcheck="false">
          <span class="mark" aria-hidden="true"></span>
          <button class="toggle" data-toggle data-day="${dayId}" data-mode="${mode}" data-no="${w.no}" title="정답/오답 직접 바꾸기">✓/✗</button>
        </div>
        <div class="sol"></div>
      </div>`;
    ol.appendChild(li);
  });
  const inputs = [...ol.querySelectorAll('input[data-input]')];
  inputs.forEach((inp,i)=> inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"){ e.preventDefault(); (inputs[i+1]||inputs[0]).focus(); }
  }));
}

/* ---------------- 채점 ---------------- */
function grade(dayId, mode){
  const day = dayById(dayId), s = state[dayId][mode];
  day.words.forEach(w=>{
    const inp = document.querySelector(`input[data-input][data-day="${dayId}"][data-mode="${mode}"][data-no="${w.no}"]`);
    if(!inp) return;                       /* '오답만 다시' 로 화면에 없는 문항은 이전 결과 유지 */
    const ok = mode==="k2e" ? checkEn(w,inp.value) : checkKo(w,inp.value);
    s.result[w.no] = ok; paintRow(dayId, mode, w, ok);
  });
  s.graded = true; updateScoreboard(); markDayDone(dayId);
}
function paintRow(dayId, mode, w, ok){
  const row = document.querySelector(`.row[data-day="${dayId}"][data-mode="${mode}"][data-no="${w.no}"]`);
  if(!row) return;
  row.classList.add("graded");
  row.classList.toggle("correct", ok); row.classList.toggle("wrong", !ok);
  row.querySelector(".mark").textContent = ok ? "✓" : "✗";
  row.querySelector(".sol").innerHTML = mode==="k2e" ? `정답: <b>${w.en}</b>` : `정답: <b>${koHTML(w.ko)}</b>`;
}
function toggleRow(dayId, mode, no){
  const s = state[dayId][mode]; if(!s.graded) return;
  s.result[no] = !s.result[no];
  const ok = s.result[no];
  const row = document.querySelector(`.row[data-day="${dayId}"][data-mode="${mode}"][data-no="${no}"]`);
  row.classList.toggle("correct", ok); row.classList.toggle("wrong", !ok);
  row.querySelector(".mark").textContent = ok ? "✓" : "✗";
  updateScoreboard();
}
function scoreOf(dayId, mode){
  const s = state[dayId][mode]; if(!s.graded) return null;
  return dayById(dayId).words.reduce((n,w)=> n + (s.result[w.no]?1:0), 0);
}
function updateScoreboard(){
  const k = scoreOf(activeDay,"k2e"), e = scoreOf(activeDay,"e2k");
  document.getElementById("sbDay").textContent = dayById(activeDay).label;
  document.getElementById("sb-k2e").textContent = k===null? "–" : k;
  document.getElementById("sb-e2k").textContent = e===null? "–" : e;
  document.getElementById("sb-tot").textContent = (k===null&&e===null)? "–" : ((k||0)+(e||0));
}
function markDayDone(dayId){
  const btn = document.querySelector(`#daySelect button[data-day="${dayId}"]`);
  if(btn) btn.classList.toggle("done", state[dayId].k2e.graded || state[dayId].e2k.graded);
}
function reset(dayId, mode){
  state[dayId][mode] = {graded:false, result:{}};
  renderList(dayId, mode); updateScoreboard(); markDayDone(dayId);
}
function retryWrong(dayId, mode){
  const s = state[dayId][mode];
  if(!s.graded){ alert("먼저 채점해 주세요."); return; }
  const wrongNos = dayById(dayId).words.filter(w=>!s.result[w.no]).map(w=>w.no);
  if(!wrongNos.length){ alert("오답이 없어요! 🎉"); return; }
  renderList(dayId, mode, wrongNos);
}

/* ---------------- 탭 / DAY 전환 ---------------- */
function switchMode(dayId, mode){
  state[dayId].mode = mode;
  const wrap = document.querySelector(`.daywrap[data-day="${dayId}"]`);
  wrap.querySelectorAll(".tab").forEach(t=> t.setAttribute("aria-selected", t.dataset.mode===mode));
  wrap.querySelectorAll(".panel").forEach(p=> p.hidden = p.dataset.mode!==mode);
}
function switchDay(dayId){
  activeDay = dayId;
  buildDay(dayId);
  document.querySelectorAll("#daySelect button").forEach(b=> b.setAttribute("aria-selected", +b.dataset.day===dayId));
  document.querySelectorAll(".daywrap").forEach(w=> w.hidden = +w.dataset.day!==dayId);
  document.getElementById("submitDayLabel").textContent = dayById(dayId).label;
  updateScoreboard();
}

/* ---------------- 결과 payload ---------------- */
function buildPayload(){
  const dayId = activeDay, day = dayById(dayId);
  const k = scoreOf(dayId,"k2e"), e = scoreOf(dayId,"e2k");
  const firstKo = ko => ko.replace(/\[[^\]]{1,4}\]/g," ").replace(/\(\([^)]*\)\)/g," ").trim().split(/[,;]/)[0].trim();
  const wrong = (mode)=> day.words
    .filter(w=> state[dayId][mode].graded && !state[dayId][mode].result[w.no])
    .map(w=> mode==="k2e" ? w.en : `${w.en}(${firstKo(w.ko)})`);
  return {
    name: document.getElementById("student").value.trim() || "이름없음",
    clazz: document.getElementById("clazz").value.trim(),
    test: "A*List 메타보카 고등편",
    day: day.label,
    date: new Date().toISOString(),
    kor_to_eng: {score:k, total:TOTAL},
    eng_to_kor: {score:e, total:TOTAL},
    total: {score:(k||0)+(e||0), total:TOTAL*2},
    wrong_kor_to_eng: wrong("k2e"),
    wrong_eng_to_kor: wrong("e2k"),
  };
}
function payloadToText(p){
  const L=(n,v)=>`${n}: ${v}`;
  return [
    L("이름", p.name + (p.clazz?` (${p.clazz})`:"")),
    L("테스트", `${p.test} · ${p.day}`),
    L("날짜", new Date(p.date).toLocaleString("ko-KR")),
    L("한→영", `${p.kor_to_eng.score ?? "-"} / ${p.kor_to_eng.total}`),
    L("영→한", `${p.eng_to_kor.score ?? "-"} / ${p.eng_to_kor.total}`),
    L("합계", `${p.total.score} / ${p.total.total}`),
    L("한→영 오답", p.wrong_kor_to_eng.join(", ") || "없음"),
    L("영→한 오답", p.wrong_eng_to_kor.join(", ") || "없음"),
  ].join("\n");
}

/* ---------------- 모달 ---------------- */
let lastPayload = null;
function openResult(){
  const s = state[activeDay];
  if(!s.k2e.graded && !s.e2k.graded){ alert(`먼저 ${dayById(activeDay).label} 테스트를 채점해 주세요.`); return; }
  const p = buildPayload(); lastPayload = p;
  document.getElementById("mTitle").textContent = `${p.day} 결과`;
  document.getElementById("mWho").textContent =
    `${p.name}${p.clazz? " · "+p.clazz : ""} · ${new Date(p.date).toLocaleString("ko-KR")}`;
  document.getElementById("r-k2e").textContent = `${p.kor_to_eng.score ?? "–"}/${TOTAL}`;
  document.getElementById("r-e2k").textContent = `${p.eng_to_kor.score ?? "–"}/${TOTAL}`;
  document.getElementById("r-tot").textContent = `${p.total.score}/${TOTAL*2}`;
  const wrap = document.getElementById("wrongWrap");
  const chips = arr=> arr.length? arr.map(x=>`<span class="chip">${x}</span>`).join("") : "<span style='color:var(--muted)'>없음 🎉</span>";
  wrap.innerHTML =
    `<h4>한→영 오답 (${p.wrong_kor_to_eng.length})</h4>${chips(p.wrong_kor_to_eng)}
     <h4>영→한 오답 (${p.wrong_eng_to_kor.length})</h4>${chips(p.wrong_eng_to_kor)}`;
  setStatus("");
  document.getElementById("backdrop").classList.add("show");
}
function closeResult(){ document.getElementById("backdrop").classList.remove("show"); }
function setStatus(msg, kind){
  const el = document.getElementById("status");
  el.className = "status" + (kind? " "+kind : ""); el.textContent = msg;
}

/* ---------------- 이벤트 ---------------- */
function wire(){
  document.getElementById("daySelect").addEventListener("click",e=>{
    const b = e.target.closest("button[data-day]"); if(b) switchDay(+b.dataset.day);
  });
  document.getElementById("days").addEventListener("click",e=>{
    const tab = e.target.closest(".tab");
    if(tab){ switchMode(+tab.dataset.day, tab.dataset.mode); return; }
    const g = e.target.closest(".btn.grade");
    if(g){ grade(+g.dataset.day, g.dataset.mode); return; }
    const rt = e.target.closest(".btn.retry");
    if(rt){ retryWrong(+rt.dataset.day, rt.dataset.mode); return; }
    const r = e.target.closest(".btn.reset");
    if(r){ if(confirm("이 테스트의 답을 모두 지울까요?")) reset(+r.dataset.day, r.dataset.mode); return; }
    const tg = e.target.closest("[data-toggle]");
    if(tg){ toggleRow(+tg.dataset.day, tg.dataset.mode, +tg.dataset.no); }
  });
  document.getElementById("submitBtn").addEventListener("click", openResult);
  document.getElementById("closeBtn").addEventListener("click", closeResult);
  document.getElementById("backdrop").addEventListener("click",e=>{ if(e.target.id==="backdrop") closeResult(); });
  document.getElementById("copyBtn").addEventListener("click",()=>{
    if(!lastPayload) return;
    navigator.clipboard.writeText(payloadToText(lastPayload))
      .then(()=>setStatus("결과 텍스트를 복사했어요. 카톡·노션에 붙여넣으세요.","good"))
      .catch(()=>setStatus("복사 실패 · 직접 선택해 복사해 주세요.","err"));
  });
  document.getElementById("downloadBtn").addEventListener("click",()=>{
    if(!lastPayload) return;
    const blob = new Blob([JSON.stringify(lastPayload,null,2)],{type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `${lastPayload.name}_${lastPayload.day}_메타보카고등편.json`; a.click(); URL.revokeObjectURL(a.href);
    setStatus("JSON 파일을 저장했어요.","good");
  });
}

/* init */
buildDaySelect(); switchDay(1); wire(); updateScoreboard();
</script>
</body>
