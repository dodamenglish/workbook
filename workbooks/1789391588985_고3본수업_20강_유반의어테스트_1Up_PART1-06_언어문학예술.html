erimental", "novel", "orthodox", "radical", "original"]}, {"g": 8, "w": "novel", "k": "새로운", "t": "syn", "a": 0, "o": ["unprecedented", "dated", "familiar", "customary", "routine"]}, {"g": 8, "w": "uncertainty", "k": "불확실성", "t": "syn", "a": 1, "o": ["guarantee", "ambiguity", "proof", "certainty", "clarity"]}, {"g": 8, "w": "reflection", "k": "성찰", "t": "syn", "a": 0, "o": ["contemplation", "denial", "reaction", "impulse", "distraction"]}, {"g": 9, "w": "distinction", "k": "차이, 구별", "t": "ant", "a": 3, "o": ["disparity", "divergence", "contrast", "similarity", "difference"]}, {"g": 9, "w": "restricted", "k": "제한된", "t": "ant", "a": 2, "o": ["limited", "bounded", "unlimited", "narrow", "confined"]}, {"g": 9, "w": "distinctive", "k": "뚜렷이 구별되는, 독특한", "t": "syn", "a": 1, "o": ["vague", "distinguishing", "ordinary", "uniform", "common"]}, {"g": 9, "w": "literally", "k": "문자 그대로", "t": "ant", "a": 4, "o": ["word for word", "strictly", "precisely", "exactly", "figuratively"]}, {"g": 9, "w": "superior", "k": "~보다 뛰어난", "t": "syn", "a": 0, "o": ["surpassing", "equal", "ordinary", "lacking", "inferior"]}, {"g": 9, "w": "finite", "k": "한정된, 유한한", "t": "syn", "a": 4, "o": ["infinite", "immeasurable", "endless", "boundless", "bounded"]}, {"g": 9, "w": "distort", "k": "왜곡하다", "t": "syn", "a": 1, "o": ["preserve", "misrepresent", "clarify", "reflect", "confirm"]}, {"g": 9, "w": "utilize", "k": "활용하다", "t": "syn", "a": 3, "o": ["waste", "ignore", "discard", "employ", "store"]}, {"g": 9, "w": "typical", "k": "전형적인", "t": "syn", "a": 3, "o": ["exceptional", "odd", "rare", "representative", "unusual"]}, {"g": 9, "w": "combine", "k": "결합하다", "t": "syn", "a": 2, "o": ["separate", "divide", "merge", "isolate", "scatter"]}, {"g": 10, "w": "classify", "k": "분류하다", "t": "syn", "a": 3, "o": ["ignore", "confuse", "duplicate", "categorize", "scatter"]}, {"g": 10, "w": "arrange", "k": "배열하다, 정리하다", "t": "ant", "a": 4, "o": ["sort", "align", "organize", "order", "scatter"]}, {"g": 10, "w": "ready-made", "k": "기성의, 이미 만들어진", "t": "ant", "a": 1, "o": ["off-the-shelf", "custom-made", "mass-produced", "standard", "prefabricated"]}, {"g": 10, "w": "distinguish", "k": "구별하다", "t": "ant", "a": 0, "o": ["confuse", "discern", "tell apart", "discriminate", "differentiate"]}, {"g": 10, "w": "get the hang of", "k": "~을 터득하다, 익히다", "t": "syn", "a": 2, "o": ["forget", "avoid", "master", "dislike", "doubt"]}, {"g": 10, "w": "core", "k": "핵심, 중심", "t": "syn", "a": 0, "o": ["heart", "periphery", "surface", "edge", "outskirts"]}, {"g": 10, "w": "random", "k": "무작위의", "t": "syn", "a": 1, "o": ["ordered", "haphazard", "systematic", "planned", "deliberate"]}, {"g": 10, "w": "time-consuming", "k": "시간이 많이 걸리는", "t": "syn", "a": 3, "o": ["swift", "efficient", "instant", "lengthy", "brief"]}, {"g": 10, "w": "unorganized", "k": "체계적이지 않은", "t": "syn", "a": 4, "o": ["methodical", "structured", "systematic", "tidy", "disorderly"]}, {"g": 10, "w": "abstract", "k": "추상적인", "t": "syn", "a": 3, "o": ["tangible", "physical", "literal", "conceptual", "concrete"]}];
const TOPICS = {"1": "일기와 근대적 자아", "2": "악보를 벗어나는 표현성", "3": "거리 예술과 도시", "4": "제목이 작품을 바꾼다", "5": "형식주의 문학 비평", "6": "기록보관소의 미술품", "7": "사진 편집과 행위유발성", "8": "구상과 추상, 미적 경험", "9": "언어의 한정성과 무한성", "10": "분류와 언어 습득"};
const NUM = ['①','②','③','④','⑤'];

let scope='all', order='seq', picks=[], list=[], idx=0, log=[], answered=false;

/* ── 설정 화면 ─────────────────────────────── */
const pc = document.getElementById('pchips');
for(let g=1; g<=10; g++){
  const s=document.createElement('span'); s.className='chip'; s.dataset.pg=g;
  s.innerHTML = g+'번<small>'+DATA.filter(q=>q.g===g).length+'</small>'; pc.appendChild(s);
}
document.querySelectorAll('[data-sc]').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('[data-sc]').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); scope=c.dataset.sc;
  document.querySelectorAll('[data-pg]').forEach(x=>x.classList.remove('on'));
});
document.querySelectorAll('[data-pg]').forEach(c=>c.onclick=()=>{
  c.classList.toggle('on');
  const any=document.querySelector('[data-pg].on');
  document.querySelectorAll('[data-sc]').forEach(x=>x.classList.remove('on'));
  if(!any){ document.querySelector('[data-sc="all"]').classList.add('on'); scope='all'; }
  else scope='pg';
});
document.querySelectorAll('[data-od]').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('[data-od]').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); order=c.dataset.od;
});

function build(){
  let ls = DATA.slice();
  if(scope==='p1') ls = ls.filter(q=>q.g<=5);
  else if(scope==='p2') ls = ls.filter(q=>q.g>=6);
  else if(scope==='syn') ls = ls.filter(q=>q.t==='syn');
  else if(scope==='ant') ls = ls.filter(q=>q.t==='ant');
  else if(scope==='pg'){
    const gs=[...document.querySelectorAll('[data-pg].on')].map(x=>+x.dataset.pg);
    ls = ls.filter(q=>gs.includes(q.g));
  }
  if(order==='rnd'){ for(let i=ls.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ls[i],ls[j]]=[ls[j],ls[i]];} }
  return ls;
}
document.getElementById('start').onclick=()=>{
  list = build();
  if(!list.length){ alert('선택한 범위에 문항이 없습니다.'); return; }
  idx=0; log=[];
  document.getElementById('setup').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('quiz').style.display='';
  render(); window.scrollTo(0,0);
};

/* ── 문항 ──────────────────────────────────── */
function render(){
  const q=list[idx]; answered=false;
  const kind = q.t==='syn' ? '유의어' : '반의어';
  const ask  = q.t==='syn' ? '이 단어와 <u>뜻이 가장 비슷한</u> 것은?'
                           : '이 단어와 <u>뜻이 가장 반대인</u> 것은?';
  let h = '<div class="qtop"><span class="badge '+q.t+'">'+kind+' 찾기</span>'
        + '<span class="src">지문 '+q.g+' · '+TOPICS[q.g]+'</span></div>'
        + '<div class="word">'+q.w+'</div><div class="ko">'+q.k+'</div>'
        + '<div class="ask">'+ask+'</div><div class="opts">';
  q.o.forEach((t,i)=>{
    h += '<button class="opt" data-i="'+i+'"><span class="n">'+NUM[i]+'</span>'
       + '<span class="tx">'+t+'</span><span class="mk"></span></button>';
  });
  h += '</div><div class="fb" id="fb"></div><div class="nav" id="nav"></div>';
  document.getElementById('qbox').innerHTML=h;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  const done=log.length, cor=log.filter(x=>x.ok).length;
  document.getElementById('pnum').innerHTML='<b>'+(idx+1)+'</b> / '+list.length;
  document.getElementById('pscore').innerHTML='맞은 개수 <b>'+cor+'</b> / '+done;
  document.getElementById('pbar').style.width=(idx/list.length*100)+'%';
}

function pick(i){
  if(answered) return; answered=true;
  const q=list[idx], ok=(i===q.a);
  log.push({q:q, pick:i, ok:ok});
  document.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled=true;
    if(j===q.a){ b.classList.add('ok'); b.querySelector('.mk').textContent='○'; }
    else if(j===i){ b.classList.add('ng'); b.querySelector('.mk').textContent='✕'; }
  });
  const fb=document.getElementById('fb');
  fb.style.display='block'; fb.className='fb '+(ok?'ok':'ng');
  const rel = q.t==='syn' ? '=' : '↔';
  fb.innerHTML = (ok?'○ 정답입니다. ':'✕ 정답은 '+NUM[q.a]+'번. ')
    + '<b>'+q.w+'</b> ('+q.k+') <b>'+rel+'</b> <b>'+q.o[q.a]+'</b>';
  const cor=log.filter(x=>x.ok).length;
  document.getElementById('pscore').innerHTML='맞은 개수 <b>'+cor+'</b> / '+log.length;
  document.getElementById('pbar').style.width=((idx+1)/list.length*100)+'%';
  if(ok){ setTimeout(next,600); }
  else{
    document.getElementById('nav').innerHTML =
      '<button class="btn" id="nx">'+(idx+1<list.length?'다음 ▶':'결과 보기')+'</button>';
    document.getElementById('nx').onclick=next;
    document.getElementById('nx').focus();
  }
}
function next(){
  if(idx+1<list.length){ idx++; render(); window.scrollTo(0,0); }
  else finish();
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('quiz').style.display==='none') return;
  if(!answered && e.key>='1' && e.key<='5'){ const i=+e.key-1; if(i<list[idx].o.length) pick(i); }
  else if(answered && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); next(); }
});

/* ── 결과 ──────────────────────────────────── */
function finish(){
  document.getElementById('quiz').style.display='none';
  const R=document.getElementById('result'); R.style.display='';
  const tot=log.length, cor=log.filter(x=>x.ok).length;
  const rate=Math.round(cor/tot*100);
  const sy=log.filter(x=>x.q.t==='syn'), an=log.filter(x=>x.q.t==='ant');
  const syc=sy.filter(x=>x.ok).length, anc=an.filter(x=>x.ok).length;
  const name=(document.getElementById('sname').value||'').trim();

  let h='<div class="res"><div class="s">'+cor+'<small> / '+tot+'</small></div>'
      + '<div style="font-size:15px;font-weight:700;color:var(--navy)">정답률 '+rate+'%'
      + (name?' · '+name:'')+'</div>'
      + (sy.length?'<span class="b">유의어 '+syc+'/'+sy.length+'</span>':'')
      + (an.length?'<span class="b">반의어 '+anc+'/'+an.length+'</span>':'')
      + '</div>';

  // 지문별
  const gs=[...new Set(log.map(x=>x.q.g))].sort((a,b)=>a-b);
  h+='<div class="card"><h3>지문별 결과</h3><table><tr><th>지문</th><th>소재</th><th class="c">맞은 개수</th></tr>';
  gs.forEach(g=>{
    const it=log.filter(x=>x.q.g===g), c=it.filter(x=>x.ok).length;
    h+='<tr><td>'+g+'번</td><td>'+TOPICS[g]+'</td><td class="c">'
      +(c===it.length?'<b style="color:var(--ok)">':'<b>')+c+'</b> / '+it.length+'</td></tr>';
  });
  h+='</table></div>';

  // 오답 목록
  const wrong=log.filter(x=>!x.ok);
  if(wrong.length){
    h+='<div class="card"><h3>틀린 단어 '+wrong.length+'개 — 다시 외울 것</h3><div class="wl">';
    wrong.forEach(x=>{
      h+='<div class="it"><span class="tag '+x.q.t+'">'+(x.q.t==='syn'?'유의':'반의')+'</span>'
        +'<span class="w">'+x.q.w+'</span><span class="k">'+x.q.k+'</span>'
        +'<span class="a"><span class="x">'+x.q.o[x.pick]+'</span>'
        +(x.q.t==='syn'?'= ':'↔ ')+x.q.o[x.q.a]+'</span></div>';
    });
    h+='</div></div>';
  } else {
    h+='<div class="card" style="text-align:center;color:var(--ok);font-weight:700">전부 맞혔습니다. 완벽합니다!</div>';
  }

  h+='<div class="nav" style="justify-content:center;flex-wrap:wrap">'
   + (wrong.length?'<button class="btn" id="again">틀린 것만 다시 풀기 ('+wrong.length+')</button>':'')
   + '<button class="btn sec" id="retry">같은 범위 다시</button>'
   + '<button class="btn gh" id="home">범위 다시 고르기</button></div>';
  R.innerHTML=h; window.scrollTo(0,0);

  if(wrong.length) document.getElementById('again').onclick=()=>{
    list=wrong.map(x=>x.q); idx=0; log=[];
    R.style.display='none'; document.getElementById('quiz').style.display='';
    render(); window.scrollTo(0,0);
  };
  document.getElementById('retry').onclick=()=>{
    list=build(); idx=0; log=[];
    R.style.display='none'; document.getElementById('quiz').style.display='';
    render(); window.scrollTo(0,0);
  };
  document.getElementById('home').onclick=()=>{
    R.style.display='none'; document.getElementById('setup').style.display='';
    window.scrollTo(0,0);
  };
}
</script></body></html>
