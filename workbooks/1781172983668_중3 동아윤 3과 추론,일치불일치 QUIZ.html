<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중3 동아(윤정미) 3과 어원 이야기 모의고사 30문항</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Bebas+Neue&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2eb;
    --card: #ffffff;
    --accent: #1a3a5c;
    --accent2: #c8401a;
    --gold: #e8a020;
    --correct: #1a7a45;
    --wrong: #c8401a;
    --text: #1c1c2e;
    --muted: #6b6b80;
    --border: #d8d4c8;
    --progress-bg: #ddd8cc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* PRINT STYLES */
  @media print {
    body { background: white; }
    .quiz-wrapper, .header-bar, .progress-section, .nav-btns { display: none !important; }
    .print-sheet { display: block !important; }
    .print-page-break { page-break-after: always; }
    .print-answer-box { border: 1.5px solid #333; display: inline-block; min-width: 80px; height: 22px; }
    .print-blank { border-bottom: 1.5px solid #333; display: inline-block; min-width: 60px; height: 18px; vertical-align: bottom; margin: 0 2px; }
    .print-sheet h1 { font-size: 18pt; margin-bottom: 10pt; }
    .print-sheet h2 { font-size: 12pt; margin: 12pt 0 6pt; border-bottom: 1px solid #333; padding-bottom: 3pt; }
    .print-item { margin-bottom: 14pt; font-size: 10pt; line-height: 1.7; }
    .print-item .q-num { font-weight: 700; }
    .print-tip { background: #f8f8f8; border-left: 3px solid #333; padding: 4pt 8pt; margin-top: 4pt; font-size: 9pt; }
  }

  .print-sheet { display: none; }

  /* HEADER */
  .header-bar {
    background: var(--accent);
    color: white;
    padding: 14px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(26,58,92,0.3);
  }
  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: #fff;
  }
  .header-sub {
    font-size: 11px;
    opacity: 0.7;
    letter-spacing: 1px;
    margin-top: 2px;
  }
  .header-counter {
    font-family: 'DM Mono', monospace;
    font-size: 28px;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: 1px;
  }
  .print-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.2s;
  }
  .print-btn:hover { background: rgba(255,255,255,0.25); }

  /* PROGRESS */
  .progress-section {
    background: var(--accent);
    padding: 0 40px 18px;
  }
  .progress-bar-wrap {
    height: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 10px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .progress-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    margin-top: 6px;
  }

  /* QUIZ WRAPPER */
  .quiz-wrapper {
    max-width: 820px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }

  /* QUESTION CARD */
  .question-card {
    background: var(--card);
    border-radius: 16px;
    padding: 36px 40px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.08);
    border: 1.5px solid var(--border);
    animation: slideIn 0.35s cubic-bezier(.4,0,.2,1);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .q-tag-num {
    background: var(--accent);
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
  }
  .q-tag-type {
    background: #fff3e0;
    color: var(--gold);
    border: 1.5px solid var(--gold);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
  }
  .q-tag-type.confirm {
    background: #e8f4fd;
    color: var(--accent);
    border-color: var(--accent);
  }

  .question-text {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--border);
  }

  /* OPTIONS */
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 20px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: #fafaf8;
    cursor: pointer;
    text-align: left;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    line-height: 1.55;
    color: var(--text);
    transition: all 0.18s;
    width: 100%;
    position: relative;
    overflow: hidden;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: #eef3fa;
    transform: translateX(4px);
  }
  .option-btn:disabled { cursor: default; transform: none; }

  .option-num {
    min-width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--border);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    flex-shrink: 0;
    transition: all 0.18s;
  }

  .option-btn.correct {
    border-color: var(--correct);
    background: #e8f7ee;
  }
  .option-btn.correct .option-num {
    background: var(--correct);
    color: white;
  }
  .option-btn.wrong {
    border-color: var(--wrong);
    background: #fdecea;
  }
  .option-btn.wrong .option-num {
    background: var(--wrong);
    color: white;
  }
  .option-btn.dimmed {
    opacity: 0.45;
  }

  /* RESULT BADGE */
  .result-badge {
    display: none;
    margin-top: 22px;
    padding: 14px 20px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
    align-items: center;
    gap: 10px;
    animation: popIn 0.3s cubic-bezier(.4,0,.2,1);
  }
  .result-badge.show { display: flex; }
  .result-badge.correct-badge {
    background: #e8f7ee;
    color: var(--correct);
    border: 2px solid #9ad4b4;
  }
  .result-badge.wrong-badge {
    background: #fdecea;
    color: var(--wrong);
    border: 2px solid #f5a99f;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }

  /* NAV */
  .nav-btns {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    gap: 12px;
  }
  .nav-btn {
    padding: 14px 32px;
    border-radius: 10px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.18s;
  }
  .nav-prev {
    background: white;
    border-color: var(--border);
    color: var(--muted);
  }
  .nav-prev:hover { border-color: var(--accent); color: var(--accent); }
  .nav-next {
    background: var(--accent);
    color: white;
    flex: 1;
    max-width: 260px;
  }
  .nav-next:hover { background: #0f2540; }
  .nav-next:disabled { background: var(--border); color: var(--muted); cursor: default; }

  .score-chip {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    background: #fff;
    border: 2px solid var(--border);
    padding: 6px 16px;
    border-radius: 20px;
    color: var(--muted);
  }
  .score-chip span { color: var(--correct); font-weight: 700; }

  /* FINISH SCREEN */
  .finish-screen {
    display: none;
    text-align: center;
    padding: 60px 40px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.08);
  }
  .finish-screen.show { display: block; }
  .finish-icon { font-size: 64px; margin-bottom: 20px; }
  .finish-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 40px;
    color: var(--accent);
    letter-spacing: 3px;
    margin-bottom: 10px;
  }
  .finish-sub { color: var(--muted); font-size: 16px; }
  .restart-btn {
    margin-top: 30px;
    background: var(--accent);
    color: white;
    border: none;
    padding: 16px 40px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
  }

  /* ===== PRINT SHEET STYLES ===== */
  .print-sheet {
    font-family: 'Noto Sans KR', sans-serif;
    padding: 20px 30px;
    color: #111;
    line-height: 1.8;
  }
  .ps-title {
    text-align: center;
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 6px;
    border-bottom: 3px double #333;
    padding-bottom: 10px;
  }
  .ps-sub {
    text-align: center;
    font-size: 12px;
    color: #555;
    margin-bottom: 24px;
  }
  .ps-section-title {
    font-size: 14px;
    font-weight: 700;
    margin: 20px 0 8px;
    padding: 4px 10px;
    background: #1a3a5c;
    color: white;
    border-radius: 4px;
  }
  .ps-item {
    margin-bottom: 16px;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fafafa;
  }
  .ps-qnum {
    font-weight: 700;
    font-size: 13px;
    color: #1a3a5c;
    margin-bottom: 4px;
  }
  .ps-answer {
    font-size: 12px;
    margin-bottom: 4px;
  }
  .ps-answer strong { color: #c8401a; }
  .ps-explanation {
    font-size: 12px;
    line-height: 1.7;
    color: #333;
  }
  .blank {
    display: inline-block;
    border-bottom: 1.5px solid #333;
    min-width: 55px;
    height: 16px;
    vertical-align: bottom;
    margin: 0 2px;
  }
  .name-school-bar {
    display: flex;
    gap: 30px;
    margin-bottom: 20px;
    font-size: 13px;
  }
  .nsbx {
    border-bottom: 1.5px solid #333;
    min-width: 120px;
    display: inline-block;
    height: 20px;
  }
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header-bar">
  <div>
    <div class="header-title">도담한 영어교실 · 중3 동아(윤정미) 3과</div>
    <div class="header-sub">WORD ORIGINS — 어원 이야기 모의고사 30문항</div>
  </div>
  <div class="header-counter" id="counterDisplay">1 / 30</div>
  <button class="print-btn" onclick="printSheet()">🖨️ 해설지 출력</button>
</div>

<!-- PROGRESS -->
<div class="progress-section">
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:3.33%"></div>
  </div>
  <div class="progress-labels">
    <span id="progressLeft">0문제 완료</span>
    <span id="progressRight">30문제 남음</span>
  </div>
</div>

<!-- ===== QUIZ WRAPPER ===== -->
<div class="quiz-wrapper">
  <div class="question-card" id="questionCard">
    <div class="q-tag">
      <span class="q-tag-num" id="qNum">Q 01</span>
      <span class="q-tag-type" id="qType">내용 확인</span>
    </div>
    <div class="question-text" id="questionText"></div>
    <div class="options-list" id="optionsList"></div>
    <div class="result-badge" id="resultBadge"></div>
  </div>

  <div class="finish-screen" id="finishScreen">
    <div class="finish-icon">🎉</div>
    <div class="finish-title">ALL DONE!</div>
    <div class="finish-sub">30문제를 모두 풀었어요!<br>오른쪽 상단 <strong>해설지 출력</strong> 버튼으로 복습지를 출력하세요.</div>
    <button class="restart-btn" onclick="restart()">↩ 처음부터 다시 풀기</button>
  </div>

  <div class="nav-btns" id="navBtns">
    <button class="nav-btn nav-prev" onclick="goPrev()">← 이전</button>
    <div class="score-chip">정답 <span id="scoreCount">0</span> / <span id="scoreTotal">0</span></div>
    <button class="nav-btn nav-next" id="nextBtn" onclick="goNext()" disabled>다음 문제 →</button>
  </div>
</div>

<!-- ===== PRINT SHEET (hidden, shows on print) ===== -->
<div class="print-sheet" id="printSheet">
  <div class="ps-title">중3 동아(윤정미) 3과 — 어원 이야기 모의고사 30문항 해설 복습지</div>
  <div class="ps-sub">도담한 영어교실 · 빈칸을 채우며 복습해 보세요!</div>
  <div class="name-school-bar">
    이름: <span class="nsbx"></span> &nbsp;&nbsp; 학교: <span class="nsbx"></span> &nbsp;&nbsp; 학년/반: <span class="nsbx"></span>
  </div>
  <div id="printContent"></div>
</div>

<script>

// QUIZ DATA

  {

  {

    options: [

  {

  {

// ===========================
// STATE
// ===========================
let current = 0;
let answered = new Array(30).fill(null); // null = not answered, index = chosen
let score = 0;

// ===========================
// RENDER
// ===========================
function render() {
  const q = questions[current];
  const isAnswered = answered[current] !== null;

  // counter
  document.getElementById('counterDisplay').textContent = `${current+1} / 30`;

  // progress bar
  const pct = ((current + 1) / 30 * 100).toFixed(2);
  document.getElementById('progressBar').style.width = pct + '%';
  const done = answered.filter(a => a !== null).length;
  document.getElementById('progressLeft').textContent = `${done}문제 완료`;
  document.getElementById('progressRight').textContent = `${30-done}문제 남음`;

  // q tag
  document.getElementById('qNum').textContent = `Q ${String(current+1).padStart(2,'0')}`;
  const typeEl = document.getElementById('qType');
  typeEl.textContent = q.type;
  typeEl.className = 'q-tag-type ' + (q.type === '추론형' ? '' : 'confirm');

  // question text
  document.getElementById('questionText').textContent = q.text;

  // options
  const list = document.getElementById('optionsList');
  list.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-num">${['①','②','③','④','⑤'][i]}</span><span>${opt}</span>`;
    if (isAnswered) {
      btn.disabled = true;
      if (i === q.answer) btn.classList.add('correct');
      else if (i === answered[current]) btn.classList.add('wrong');
      else btn.classList.add('dimmed');
    } else {
      btn.onclick = () => selectAnswer(i);
    }
    list.appendChild(btn);
  });

  // result badge
  const badge = document.getElementById('resultBadge');
  badge.className = 'result-badge';
  if (isAnswered) {
    const correct = answered[current] === q.answer;
    badge.className = 'result-badge show ' + (correct ? 'correct-badge' : 'wrong-badge');
    badge.innerHTML = correct
      ? `<span>✅</span> <span>정답입니다! 훌륭해요.</span>`
      : `<span>❌</span> <span>오답이에요. 정답은 <strong>${['①','②','③','④','⑤'][q.answer]}</strong>번입니다.</span>`;
  }

  // next btn
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = !isAnswered;
  nextBtn.textContent = current === 29 ? '완료 🎉' : '다음 문제 →';

  // score
  const cnt = answered.filter((a,i) => a !== null && a === questions[i].answer).length;
  document.getElementById('scoreCount').textContent = cnt;
  document.getElementById('scoreTotal').textContent = answered.filter(a=>a!==null).length;
}

function selectAnswer(i) {
  if (answered[current] !== null) return;
  answered[current] = i;
  if (i === questions[current].answer) score++;
  render();
}

function goNext() {
  if (current < 29) {
    current++;
    render();
  } else {
    // show finish
    document.getElementById('questionCard').style.display = 'none';
    document.getElementById('navBtns').style.display = 'none';
    document.getElementById('finishScreen').classList.add('show');
  }
}

function goPrev() {
  if (current > 0) { current--; render(); }
}

function restart() {
  current = 0;
  answered = new Array(30).fill(null);
  score = 0;
  document.getElementById('finishScreen').classList.remove('show');
  document.getElementById('questionCard').style.display = '';
  document.getElementById('navBtns').style.display = '';
  render();
}

// ===========================
// PRINT SHEET BUILDER
// ===========================
function buildPrintSheet() {
  const sections = [
    { title: '📘 shampoo 어원 (1~13번)', range: [0,12] },
    { title: '🤖 robot 어원 (3~4, 14~16번)', range: [2,15] },
    { title: '🌀 hurricane 어원 (5~6, 17~19번)', range: [4,18] },
    { title: '🍔 hamburger 어원 (7~8, 21~25번)', range: [6,24] },
    { title: '📝 종합 (9~10, 26~30번)', range: [8,29] }
  ];

  let html = '';
  // Build all 30 items in order
  questions.forEach((q, i) => {
    html += `
    <div class="ps-item">
      <div class="ps-qnum">${i+1}번 | ${q.type}</div>
      <div class="ps-answer">정답: <strong>${['①','②','③','④','⑤'][q.answer]}</strong> — ${q.options[q.answer]}</div>
      <div class="ps-explanation">💡 해설: ${q.explanation}</div>
    </div>`;
    if ((i+1) % 10 === 0 && i < 29) html += '<div class="print-page-break"></div>';
  });
  document.getElementById('printContent').innerHTML = html;
}

function printSheet() {
  buildPrintSheet();
  window.print();
}
